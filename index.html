q":"이러한 경우가 이차방정식의 판별식과 어떤 관계가 있는지 설명하시오.","a":"그래프가 x축과 만나지 않는다는 것은 이차방정식이 실근을 가지지 않는다는 것과 같은 의미이므로, 이때는 판별식 b제곱-4ac의 값이 음수가 됩니다.","kw":[{"l":"실근이 없음과 같은 의미","a":["실근이 없"]},{"l":"판별식이 음수","a":["판별식","음수"]}]}},{"main":{"id":"lk_FU_M42","cat":"수학","grade":"중2","q":"서로 다른 두 점이 주어지면 그 두 점을 지나는 일차함수의 식이 오직 하나로 정해지는 까닭을 설명하시오.","a":"일차함수의 그래프는 직선인데, 서로 다른 두 점을 지나는 직선은 기하학적으로 오직 하나만 그을 수 있습니다. 두 점의 좌표를 이용하면 기울기를 하나로 정할 수 있고, 그 기울기와 한 점의 좌표를 이용하면 y절편도 하나로 정해지므로, 결국 일차함수의 식 y=ax+b에서 a와 b가 각각 하나의 값으로 정해집니다.","kw":[{"l":"두 점을 지나는 직선은 하나뿐","a":["직선은 하나","두 점"]},{"l":"기울기와 y절편이 각각 하나로 정해짐","a":["기울기","y절편"]}]},"follow":{"id":"lk_FU_M42F","cat":"수학","grade":"중2","q":"그렇다면 한 점만 주어졌을 때는 그 점을 지나는 일차함수의 식이 하나로 정해지지 않는 까닭을 설명하시오.","a":"한 점만으로는 기울기를 계산할 수 없으므로, 그 점을 지나면서 기울기가 서로 다른 직선을 무수히 많이 그을 수 있어 일차함수의 식이 하나로 정해지지 않습니다.","kw":[{"l":"기울기를 계산할 수 없음","a":["기울기를 계산할 수 없"]},{"l":"기울기가 다른 직선이 무수히 많음","a":["무수히 많"]}]}},{"main":{"id":"lk_FU_M43","cat":"수학","grade":"중3","q":"피보나치 수열 1, 1, 2, 3, 5, 8, 13, …에서 이웃한 두 항의 비(뒤의 항÷앞의 항)가 어떤 값에 가까워지는지 확인하는 방법을 중학교 수학으로 설명하시오.","a":"이웃한 두 항의 비를 r(n)=a(n+1)÷a(n)이라 하면 a(n+2)=a(n+1)+a(n)의 양변을 a(n+1)로 나누어 r(n+1)=1+1/r(n)이 됩니다. n이 커질 때 비가 어떤 일정한 값 r에 가까워진다면 r(n)과 r(n+1)이 모두 r에 가까워지므로 r=1+1/r이 되고, 양변에 r을 곱해 정리하면 r²−r−1=0입니다. 근의 공식으로 r=(1±√5)/2인데 비는 양수이므로 r=(1+√5)/2≈1.618, 즉 황금비입니다. 실제로 8/5=1.6, 13/8=1.625, 21/13≈1.615로 1.618 근처에서 오르내리며 가까워집니다.","kw":[{"l":"r(n+1)=1+1/r(n) 관계식 유도","a":["1+1/","1+1÷","점화식","a(n+2)"]},{"l":"극한값 r이 r=1+1/r 만족 → r²−r−1=0","a":["r²−r−1","x²−x−1","이차방정식"]},{"l":"양수 근 (1+√5)/2 = 황금비 ≈1.618","a":["1+√5","1.618","황금비"]}]},"follow":{"id":"lk_FU_M43F","cat":"수학","grade":"중3","q":"위 풀이는 비가 어떤 값에 가까워진다고 \"가정\"하고 그 값을 구한 것입니다. 비가 실제로 황금비에 가까워진다는 것을 오차가 줄어드는 방식으로 확인해 보시오.","a":"황금비를 φ라 하면 φ=1+1/φ이고 r(n+1)=1+1/r(n)이므로 두 식을 빼면 r(n+1)−φ=1/r(n)−1/φ=(φ−r(n))/(r(n)·φ)입니다. 피보나치 수열은 a(n+1)≥a(n)이므로 r(n)≥1이고 φ>1.6이므로 r(n)·φ>1.6, 즉 오차의 절댓값은 한 번 진행할 때마다 1/1.6=0.625배 이하로 줄어듭니다. 오차가 계속 0.625배 이하로 줄어들면 0에 한없이 가까워지므로 비는 φ에 가까워집니다.","kw":[{"l":"φ=1+1/φ와 r(n+1)=1+1/r(n)을 빼서 오차식","a":["빼","오차","φ−r"]},{"l":"r(n)≥1 → 분모 r(n)φ>1 이므로 오차가 줄어듦","a":["1보다 크","1.6","줄어"]},{"l":"오차가 매번 일정 배수 이하로 감소 → 0에 수렴","a":["0.6","0에","수렴","가까워"]}]}},{"main":{"id":"lk_FU_M44","cat":"수학","grade":"중3","q":"φ=(1+√5)/2일 때 φ²=φ+1임을 보이고, 이를 이용해 φ³, φ⁴, φ⁵, φ⁶을 차례로 aφ+b 꼴로 나타내시오. 이때 나타나는 계수의 규칙은 무엇입니까?","a":"φ²=(1+2√5+5)/4=(3+√5)/2이고 φ+1=(3+√5)/2이므로 φ²=φ+1입니다. φ³=φ·φ²=φ²+φ=2φ+1, φ⁴=φ·(2φ+1)=2φ²+φ=3φ+2, φ⁵=3φ²+2φ=5φ+3, φ⁶=5φ²+3φ=8φ+5입니다. 계수가 (1,0),(1,1),(2,1),(3,2),(5,3),(8,5)로 1,1,2,3,5,8 즉 피보나치 수열이 나타나며 φⁿ=F(n)φ+F(n−1)입니다. 실제로 φ⁶=8φ+5=9+4√5입니다.","kw":[{"l":"φ²=φ+1 확인","a":["φ+1","(3+√5)/2"]},{"l":"φ³=2φ+1, φ⁴=3φ+2, φ⁵=5φ+3, φ⁶=8φ+5","a":["2φ+1","3φ+2","5φ+3","8φ+5"]},{"l":"계수가 피보나치 수열","a":["피보나치","1, 1, 2, 3","1,1,2,3"]}]},"follow":{"id":"lk_FU_M44F","cat":"수학","grade":"중3","q":"φ−1/φ=1임을 이용해 φ²+1/φ²과 φ⁴+1/φ⁴의 값을 구하시오.","a":"1/φ=2/(1+√5)=(√5−1)/2=φ−1이므로 φ−1/φ=1입니다. 양변을 제곱하면 φ²−2+1/φ²=1이므로 φ²+1/φ²=3입니다. 다시 양변을 제곱하면 φ⁴+2+1/φ⁴=9이므로 φ⁴+1/φ⁴=7입니다.","kw":[{"l":"φ−1/φ=1 (1/φ=φ−1)","a":["φ−1/φ=1","φ−1","√5−1"]},{"l":"제곱하여 φ²+1/φ²=3","a":["=3","3입니다","3이"]},{"l":"다시 제곱하여 φ⁴+1/φ⁴=7","a":["=7","7입니다","7이"]}]}},{"main":{"id":"lk_FU_M45","cat":"수학","grade":"중3","q":"한 변의 길이가 1인 정오각형의 대각선의 길이를 닮음을 이용해 구하시오.","a":"정오각형 ABCDE의 한 내각은 108°이고 삼각형 ABC는 AB=BC=1인 이등변삼각형이므로 ∠BAC=∠BCA=36°입니다. 대각선 AC=BD=x이고 두 대각선의 교점을 P라 하면 ∠PBC=∠PCB=36°이어서 삼각형 PBC도 PB=PC인 이등변삼각형이고 ∠BPC=108°입니다. 삼각형 ABC와 삼각형 PBC는 모두 각이 36°, 36°, 108°이므로 닮음이고 ∠ABP=72°, ∠APB=72°에서 AP=AB=1이므로 PC=x−1입니다. 닮음비로 AC:BC=BC:PC이므로 x:1=1:(x−1)이고 x²−x−1=0입니다. 근의 공식으로 x=(1+√5)/2≈1.618이며 이는 황금비입니다.","kw":[{"l":"내각 108°, 이등변삼각형의 밑각 36°","a":["108","36"]},{"l":"△ABC ∽ △PBC, AP=AB=1","a":["닮음","AP=1","AP=AB"]},{"l":"x²−x−1=0, x=(1+√5)/2","a":["x²−x−1","1+√5","황금비"]}]},"follow":{"id":"lk_FU_M45F","cat":"수학","grade":"중3","q":"정오각형의 두 대각선의 교점 P가 대각선 AC를 어떤 비로 나누는지 구하고, 이 비가 피보나치 수열과 어떤 관계가 있는지 설명하시오.","a":"AP=1, PC=x−1=(√5−1)/2이므로 AP:PC=1:((√5−1)/2)=(1+√5)/2:1이고 이는 황금비입니다. 즉 대각선은 교점에 의해 황금비로 나뉘며 대각선 전체와 긴 쪽의 비 x:1도 같은 황금비입니다. 피보나치 수열에서 이웃한 항의 비 F(n+1)/F(n)이 가까워지는 값이 바로 이 (1+√5)/2이므로 정오각형의 대각선과 변의 비와 같은 수입니다.","kw":[{"l":"AP:PC가 황금비","a":["황금비"]},{"l":"(1+√5)/2 ≈ 1.618","a":["1+√5","1.618"]},{"l":"피보나치 이웃 항의 비와 같은 값","a":["피보나치"]}]}},{"main":{"id":"lk_FU_M46","cat":"수학","grade":"중3","q":"포물선 y=x²과 직선 y=2x+k가 한 점에서만 만나도록 하는 k의 값과 그때의 접점의 좌표를 구하고, k의 값에 따라 교점의 개수가 어떻게 달라지는지 설명하시오.","a":"x²=2x+k에서 x²−2x−k=0이고 한 점에서만 만나려면 중근을 가져야 합니다. (x−1)²=1+k이므로 1+k=0, 즉 k=−1이고 접점은 x=1, y=1인 (1, 1)입니다. k>−1이면 (x−1)²=1+k>0이므로 서로 다른 두 점에서 만나고, k\u003c−1이면 (x−1)²가 음수가 되어 만나지 않습니다.","kw":[{"l":"중근 조건으로 k=−1","a":["k=−1","중근"]},{"l":"접점 (1,1)","a":["(1, 1)","(1,1)"]},{"l":"k>−1 두 점, k\u003c−1 만나지 않음","a":["두 점","만나지 않"]}]},"follow":{"id":"lk_FU_M46F","cat":"수학","grade":"중3","q":"직선 y=2x+k의 기울기는 그대로 두고 k를 변화시키는 것을 직선을 평행이동시키는 것으로 해석하여, 위 결과를 그래프에서 어떻게 설명할 수 있습니까?","a":"기울기가 2인 직선들은 모두 평행하며 k는 y절편이므로 k를 줄이면 직선이 아래로 평행이동합니다. 직선이 포물선과 두 점에서 만나다가 아래로 내려가 접하는 순간이 k=−1이고 그보다 더 내려가면 포물선과 만나지 않습니다. 접점은 직선 아래쪽에서 직선이 포물선과 처음 닿는 점입니다.","kw":[{"l":"k는 y절편, 평행이동","a":["y절편","평행이동"]},{"l":"접하는 순간이 k=−1","a":["접하는","−1"]}]}},{"main":{"id":"lk_FU_M47","cat":"수학","grade":"중3","q":"한 변의 길이가 a인 정삼각형의 외접원의 반지름 R과 내접원의 반지름 r을 구하고 R=2r임을 보이시오.","a":"정삼각형에서는 외심, 내심, 무게중심이 모두 같은 점입니다. 높이는 (√3/2)a이고 무게중심은 중선을 꼭짓점으로부터 2:1로 나누므로 R=(2/3)×(√3/2)a=√3a/3, r=(1/3)×(√3/2)a=√3a/6입니다. 따라서 R=2r입니다.","kw":[{"l":"외심=내심=무게중심","a":["무게중심","같은 점"]},{"l":"높이 (√3/2)a, 2:1 분할","a":["2:1","(√3/2)a"]},{"l":"R=√3a/3, r=√3a/6, R=2r","a":["√3a/3","√3a/6","R=2r"]}]},"follow":{"id":"lk_FU_M47F","cat":"수학","grade":"중3","q":"한 변이 6인 정삼각형의 외접원과 내접원의 반지름, 두 원의 넓이를 구하고 넓이의 비를 구하시오.","a":"R=√3×6/3=2√3, r=√3×6/6=√3입니다. 외접원의 넓이는 π(2√3)²=12π, 내접원의 넓이는 π(√3)²=3π이므로 넓이의 비는 4:1입니다. 반지름의 비 2:1을 제곱한 값입니다.","kw":[{"l":"R=2√3, r=√3","a":["2√3","√3"]},{"l":"12π, 3π, 4:1","a":["12π","3π","4:1"]}]}},{"main":{"id":"lk_FU_M48","cat":"수학","grade":"중3","q":"x에 대한 이차방정식 x²−ax+12=0의 두 근이 모두 정수일 때 가능한 a의 값을 모두 구하시오.","a":"두 근을 p, q라 하면 x²−ax+12=(x−p)(x−q)=x²−(p+q)x+pq이므로 pq=12, a=p+q입니다. 곱이 12인 정수의 쌍은 (1, 12), (2, 6), (3, 4)와 각각의 부호를 모두 바꾼 쌍이므로 a=13, 8, 7 또는 −13, −8, −7입니다.","kw":[{"l":"(x−p)(x−q)로 인수분해, pq=12","a":["pq=12","(x−p)(x−q)"]},{"l":"곱이 12인 쌍 (1,12),(2,6),(3,4)","a":["(1, 12)","(2, 6)","(3, 4)"]},{"l":"a=±7, ±8, ±13","a":["13","8","7"]}]},"follow":{"id":"lk_FU_M48F","cat":"수학","grade":"중3","q":"두 근이 연속한 정수가 되도록 하는 a의 값을 구하시오.","a":"두 근이 p, p+1이면 p(p+1)=12이므로 p=3 또는 p=−4입니다. 근이 3, 4이면 a=7이고 근이 −4, −3이면 a=−7입니다.","kw":[{"l":"p(p+1)=12","a":["p(p+1)"]},{"l":"a=±7","a":["7","−7"]}]}},{"main":{"id":"lk_FU_M49","cat":"수학","grade":"중3","q":"x에 대한 이차방정식 x²+ax+b=0 (a, b는 유리수)의 한 근이 1+√2일 때 a, b의 값을 구하고 다른 한 근을 구하시오.","a":"x=1+√2를 대입하면 (1+√2)²+a(1+√2)+b=0이고 전개하면 (3+a+b)+(2+a)√2=0입니다. a, b가 유리수이고 √2는 무리수이므로 3+a+b=0이고 2+a=0이어야 하며, a=−2, b=−1입니다. 이때 방정식은 x²−2x−1=0이고 근의 공식으로 x=1±√2이므로 다른 한 근은 1−√2입니다.","kw":[{"l":"대입해 (3+a+b)+(2+a)√2=0","a":["(2+a)√2","3+a+b"]},{"l":"유리수 부분과 무리수 부분이 각각 0","a":["무리수","유리수"]},{"l":"a=−2, b=−1, 다른 근 1−√2","a":["a=−2","b=−1","1−√2"]}]},"follow":{"id":"lk_FU_M49F","cat":"수학","grade":"중3","q":"계수가 유리수인 이차방정식에서 한 근이 p+q√2이면 p−q√2도 근이 되는 이유를 근의 공식으로 설명하시오.","a":"계수가 유리수인 이차방정식 ax²+bx+c=0의 근은 근의 공식 x=(−b±√(b²−4ac))/2a입니다. 두 근은 유리수 부분 −b/2a는 같고 루트 부분만 부호가 ±로 다릅니다. 따라서 한 근이 p+q√2(q≠0)이면 루트 부분의 부호만 바뀐 p−q√2가 나머지 한 근입니다.","kw":[{"l":"근의 공식의 ± 구조","a":["±","근의 공식"]},{"l":"유리수 부분 같고 루트 부분만 부호 반대","a":["부호","루트 부분","무리수 부분"]}]}},{"main":{"id":"lk_FU_M50","cat":"수학","grade":"중3","q":"방정식 x⁴−13x²+36=0을 푸시오. 또 x⁴+x²+1을 인수분해하시오.","a":"x²=t로 놓으면 t²−13t+36=(t−4)(t−9)=0이므로 x²=4 또는 x²=9이고 x=±2, ±3입니다. x⁴+x²+1=(x⁴+2x²+1)−x²=(x²+1)²−x²=(x²+x+1)(x²−x+1)입니다.","kw":[{"l":"치환 후 (t−4)(t−9)","a":["(t−4)(t−9)","치환"]},{"l":"x=±2, ±3","a":["±2","±3","2, 3"]},{"l":"(x²+x+1)(x²−x+1)","a":["x²+x+1","x²−x+1"]}]},"follow":{"id":"lk_FU_M50F","cat":"수학","grade":"중3","q":"위의 인수분해를 이용해 2⁴+2²+1=21을 소인수분해하고, 같은 방법으로 3⁴+3²+1을 소인수분해하시오.","a":"x=2이면 x²+x+1=7, x²−x+1=3이므로 21=3×7입니다. x=3이면 x²+x+1=13, x²−x+1=7이므로 3⁴+3²+1=81+9+1=91=7×13입니다.","kw":[{"l":"21=3×7","a":["3×7"]},{"l":"91=7×13","a":["7×13","91"]}]}},{"main":{"id":"lk_FU_M51","cat":"수학","grade":"중3","q":"∠A=90°인 직각삼각형 ABC의 점 A에서 빗변 BC에 내린 수선의 발을 H라 할 때 닮음을 이용해 AB²=BH×BC, AC²=CH×CB를 보이고 이로부터 피타고라스 정리를 유도하시오.","a":"삼각형 ABC와 삼각형 HBA는 ∠B가 공통이고 ∠BAC=∠BHA=90°이므로 닮음이며 BA:BH=BC:BA에서 AB²=BH×BC입니다. 마찬가지로 삼각형 ABC와 삼각형 HAC는 ∠C가 공통이고 직각이 하나씩 있어 닮음이며 AC²=CH×CB입니다. 두 식을 변끼리 더하면 AB²+AC²=BC×(BH+CH)=BC×BC=BC²이므로 피타고라스 정리가 성립합니다.","kw":[{"l":"△ABC ∽ △HBA","a":["△HBA","HBA","닮음"]},{"l":"AB²=BH×BC, AC²=CH×CB","a":["BH×BC","BH·BC","CH×CB"]},{"l":"합하면 BC² (BH+CH=BC)","a":["BH+CH","BC²"]}]},"follow":{"id":"lk_FU_M51F","cat":"수학","grade":"중3","q":"같은 그림에서 AH²=BH×HC임을 보이고, 이를 이용해 길이 2와 3의 선분이 주어질 때 길이 √6인 선분을 작도하는 방법을 설명하시오.","a":"삼각형 HBA와 삼각형 HAC는 모두 삼각형 ABC와 닮음이므로 서로 닮음이고 BH:AH=AH:HC에서 AH²=BH×HC입니다. 한 직선 위에 BH=2, HC=3이 되게 점 B, H, C를 잡고 BC를 지름으로 하는 반원을 그린 뒤 H에서 BC에 수직인 선분을 그어 반원과 만나는 점을 A라 하면 ∠BAC=90°이고 AH=√(2×3)=√6입니다.","kw":[{"l":"AH²=BH×HC","a":["AH²","BH×HC"]},{"l":"지름 BC인 반원 + H에서 수선","a":["반원","지름","수선"]},{"l":"AH=√6","a":["√6"]}]}},{"main":{"id":"lk_FU_M52","cat":"수학","grade":"중3","q":"삼각형 ABC에서 ∠A의 이등분선이 변 BC와 만나는 점을 D라 할 때 BD:DC=AB:AC임을 증명하시오.","a":"점 C를 지나 AD에 평행한 직선을 긋고 변 BA의 연장선과 만나는 점을 E라 합니다. 평행선의 성질에서 ∠BAD=∠AEC(동위각), ∠DAC=∠ACE(엇각)인데 ∠BAD=∠DAC이므로 ∠AEC=∠ACE이고 삼각형 ACE는 이등변삼각형이어서 AE=AC입니다. 또 삼각형 BAD와 삼각형 BEC는 AD∥EC이므로 닮음이고 BD:DC=BA:AE입니다. AE=AC이므로 BD:DC=AB:AC입니다.","kw":[{"l":"C를 지나 AD에 평행한 직선, 연장선과 E","a":["평행","연장"]},{"l":"AE=AC (이등변삼각형)","a":["AE=AC","이등변"]},{"l":"평행선과 비례 / 닮음 → BD:DC=AB:AC","a":["닮음","비례","BD:DC"]}]},"follow":{"id":"lk_FU_M52F","cat":"수학","grade":"중3","q":"AB=6, AC=4, BC=5일 때 BD, DC의 길이와 삼각형 ABD와 삼각형 ADC의 넓이의 비를 구하고, 넓이의 비가 그렇게 되는 이유를 설명하시오.","a":"BD:DC=6:4=3:2이고 BC=5이므로 BD=3, DC=2입니다. 두 삼각형 ABD와 ADC는 꼭짓점 A에서 BC에 내린 높이가 같으므로 넓이의 비는 밑변의 길이의 비 BD:DC=3:2입니다.","kw":[{"l":"BD=3, DC=2","a":["BD=3","DC=2","3, 2"]},{"l":"높이가 같으므로 넓이의 비=밑변의 비 3:2","a":["높이가 같","밑변","3:2"]}]}},{"main":{"id":"lk_FU_M53","cat":"수학","grade":"중2","q":"삼각형의 세 중선이 한 점에서 만나고 그 점이 각 중선을 꼭짓점으로부터 2:1로 나눔을 증명하시오.","a":"삼각형 ABC에서 AB, AC의 중점을 F, E라 하고 중선 BE, CF의 교점을 G라 합니다. 중점연결정리에 의해 EF∥BC이고 EF=BC/2이므로 삼각형 GEF와 삼각형 GBC는 닮음비 1:2입니다. 따라서 GE:GB=1:2, GF:GC=1:2입니다. 같은 방법으로 중선 AD와 BE의 교점 G′도 BG′:G′E=2:1이므로 G′=G이고 세 중선이 한 점에서 만납니다.","kw":[{"l":"중점연결정리 EF∥BC, EF=BC/2","a":["중점연결","EF∥BC","EF="]},{"l":"△GEF ∽ △GBC (1:2)","a":["닮음","1:2"]},{"l":"세 번째 중선도 같은 점 (G′=G)","a":["G′","세 중선","한 점"]}]},"follow":{"id":"lk_FU_M53F","cat":"수학","grade":"중2","q":"무게중심 G와 세 꼭짓점을 이으면 삼각형이 3개로 나뉩니다. 세 중선이 나누는 6개의 작은 삼각형의 넓이가 모두 같은 이유를 설명하시오.","a":"중선 AD는 BD=DC이므로 삼각형 ABD와 ADC의 넓이를 같게 하고, G가 AD를 2:1로 나누므로 삼각형 GBD와 GDC도 넓이가 같습니다(밑변 같고 높이 같음). 삼각형 ABG와 BGD는 높이가 같고 밑변이 AG:GD=2:1이므로 ABG=2×BGD입니다. 같은 방식으로 삼각형 ABG를 중선 CF가 둘로 나누어 AFG=BFG=BGD가 되므로 6개의 삼각형의 넓이가 모두 같습니다.","kw":[{"l":"중점으로 나뉜 두 삼각형의 넓이 같음","a":["넓이가 같","같습니다"]},{"l":"높이 같고 밑변 비 2:1 → 넓이 2:1","a":["2:1","높이가 같","높이"]},{"l":"6개 모두 같음","a":["6개"]}]}},{"main":{"id":"lk_FU_M54","cat":"수학","grade":"중3","q":"이차함수 y=x²−4x+1의 그래프를 x축, y축, 원점에 대하여 각각 대칭이동한 그래프의 식을 구하시오.","a":"x축 대칭은 y 대신 −y를 대입하여 y=−x²+4x−1, y축 대칭은 x 대신 −x를 대입하여 y=x²+4x+1, 원점 대칭은 x, y 모두 부호를 바꾸어 y=−x²−4x−1입니다.","kw":[{"l":"x축 대칭 y=−x²+4x−1","a":["−x²+4x−1"]},{"l":"y축 대칭 y=x²+4x+1","a":["x²+4x+1"]},{"l":"원점 대칭 y=−x²−4x−1","a":["−x²−4x−1"]}]},"follow":{"id":"lk_FU_M54F","cat":"수학","grade":"중3","q":"원래 포물선과 y축 대칭 포물선의 교점과 두 꼭짓점으로 이루어진 삼각형의 넓이를 구하시오.","a":"두 식 x²−4x+1=x²+4x+1에서 x=0이므로 교점은 (0, 1)입니다. 꼭짓점은 y=(x−2)²−3에서 (2, −3)이고 y축 대칭은 (−2, −3)입니다. 밑변은 y=−3 위의 길이 4, 높이는 1−(−3)=4이므로 넓이는 (1/2)×4×4=8입니다.","kw":[{"l":"교점 (0,1)","a":["(0, 1)","(0,1)"]},{"l":"꼭짓점 (±2, −3)","a":["(2, −3)","(−2, −3)"]},{"l":"넓이 8","a":["8"]}]}},{"main":{"id":"lk_FU_M55","cat":"수학","grade":"중3","q":"x축과 두 점 (−1, 0), (2, 0)에서 만나고 점 (0, −4)를 지나는 이차함수의 식과 최솟값을 구하시오.","a":"x축과 만나는 점이 −1, 2이므로 y=a(x+1)(x−2)로 놓습니다. (0, −4)를 대입하면 −4=a×1×(−2)이므로 a=2이고 y=2(x+1)(x−2)=2x²−2x−4입니다. y=2(x−1/2)²−9/2이므로 최솟값은 x=1/2일 때 −9/2입니다.","kw":[{"l":"y=a(x+1)(x−2)","a":["a(x+1)(x−2)"]},{"l":"a=2, y=2x²−2x−4","a":["a=2","2x²−2x−4"]},{"l":"최솟값 −9/2","a":["−9/2","−4.5"]}]},"follow":{"id":"lk_FU_M55F","cat":"수학","grade":"중3","q":"이 그래프를 y축 방향으로 얼마만큼 평행이동하면 x축에 접합니까? 평행이동한 식을 구하시오.","a":"꼭짓점의 y좌표가 −9/2이므로 위로 9/2만큼 평행이동하면 꼭짓점이 x축 위에 놓입니다. 이때 식은 y=2(x−1/2)²이고 x축에 (1/2, 0)에서 접합니다.","kw":[{"l":"위로 9/2 이동","a":["9/2"]},{"l":"y=2(x−1/2)²","a":["2(x−1/2)²"]}]}},{"main":{"id":"lk_FU_M56","cat":"수학","grade":"중3","q":"x+1/x=3일 때 x²+1/x²과 x³+1/x³의 값을 구하시오.","a":"(x+1/x)²=x²+2+1/x²이므로 9=x²+2+1/x²에서 x²+1/x²=7입니다. (x+1/x)³=x³+1/x³+3(x+1/x)이므로 27=x³+1/x³+9에서 x³+1/x³=18입니다.","kw":[{"l":"x²+1/x²=7","a":["7"]},{"l":"(x+1/x)³ 전개 이용","a":["(x+1/x)³","3(x+1/x)","세제곱"]},{"l":"x³+1/x³=18","a":["18"]}]},"follow":{"id":"lk_FU_M56F","cat":"수학","grade":"중3","q":"x⁴+1/x⁴의 값을 구하고, 조건 x+1/x=3을 만족하는 x의 값을 구하시오.","a":"(x²+1/x²)²=x⁴+2+1/x⁴이므로 49=x⁴+2+1/x⁴에서 x⁴+1/x⁴=47입니다. x+1/x=3의 양변에 x를 곱해 x²−3x+1=0이고 근의 공식으로 x=(3±√5)/2입니다. 이 값은 황금비 (1+√5)/2의 제곱이기도 합니다.","kw":[{"l":"x⁴+1/x⁴=47","a":["47"]},{"l":"x²−3x+1=0","a":["x²−3x+1"]},{"l":"x=(3±√5)/2","a":["3±√5","3+√5","3−√5"]}]}},{"main":{"id":"lk_FU_S6","cat":"과학","grade":"중3","q":"금속 토막을 용수철저울에 매달았더니 공기 중에서 2.7 N이었고, 물에 완전히 잠기게 했더니 1.7 N이었습니다. (1) 이 금속에 작용하는 부력은 얼마인가요? (2) 금속의 부피, 질량, 밀도를 구하세요. (3) 더 깊이 넣으면 저울 눈금이 어떻게 되나요? (4) 부력의 방향과 크기가 정해지는 원리를 말하세요. (g = 10 m/s², 물의 밀도 1000 kg/m³)","a":"(1) 부력은 공기 중 무게에서 물속 무게를 뺀 값이므로 2.7 − 1.7 = 1.0 N입니다. (2) 부력은 밀어낸 물의 무게이므로 1.0 N = 1000 × V × 10에서 V = 1.0 × 10⁻⁴ m³ = 100 cm³입니다. 질량은 무게 2.7 N ÷ 10 = 0.27 kg = 270 g이고 밀도는 270 g ÷ 100 cm³ = 2.7 g/cm³입니다(알루미늄과 비슷합니다). (3) 완전히 잠긴 뒤에는 밀어낸 물의 부피가 일정하므로 부력이 그대로이고 눈금은 1.7 N으로 변하지 않습니다. 부력은 물체가 잠긴 부피에 따라 정해지고 깊이와는 관계가 없습니다. (4) 부력은 위쪽으로 작용하고 크기는 물체가 밀어낸 유체의 무게와 같습니다(아르키메데스의 원리). 물속에서는 아래쪽 면이 받는 압력이 위쪽 면보다 커서 위로 향하는 힘이 생깁니다.","kw":[{"l":"부력 = W − W′ = 1.0 N","a":["부력","W′"]},{"l":"V = F/ρg = 100 cm³","a":["100","cm³","ρg"]},{"l":"밀도 2.7 g/cm³","a":["cm³","밀도"]},{"l":"깊이와 무관","a":["깊이와 무관","깊이와","무관"]}]},"follow":{"id":"lk_FU_S6F","cat":"과학","grade":"중3","q":"용수철저울로 부피를 재는 방법 말고, 눈금 실린더로 부피를 재는 방법도 말해 보세요.","a":"눈금 실린더에 물을 넣어 눈금을 읽고 금속을 완전히 잠기게 한 뒤 다시 읽습니다. 올라간 눈금의 차가 금속의 부피입니다. 물이 튀거나 기포가 붙지 않도록 조심하고, 눈높이에서 수면의 아랫부분을 읽어야 합니다.","kw":[{"l":"눈금 실린더에 물을 넣어 눈금을 읽고 금속을 완전히 잠기게 한 뒤 다…","a":["실린더에","읽습니다"]},{"l":"올라간 눈금의 차가 금속의 부피입니다","a":["부피입니다","올라간"]},{"l":"물이 튀거나 기포가 붙지 않도록 조심하고, 눈높이에서 수면의 아랫부분…","a":["눈높이에서","아랫부분을"]}]}},{"main":{"id":"lk_FU_S19","cat":"과학","grade":"중1","q":"무거운 바위를 지레를 이용해 들어 올리려고 합니다. 받침점을 바위에 최대한 가깝게 두는 것과 멀리 두는 것 중 어느 쪽이 힘이 적게 드는지 설명하시오.","a":"받침점을 힘을 주는 곳보다 바위 쪽에 가깝게 둘수록, 힘점에서 받침점까지의 거리가 멀어져 작은 힘으로도 무거운 물체를 들어 올릴 수 있습니다.","kw":[{"l":"받침점을 물체에 가깝게","a":["가깝","가까이"]},{"l":"힘점까지 거리가 멀수록 유리","a":["거리","멀"]}]},"follow":{"id":"lk_FU_S19F","cat":"과학","grade":"중1","q":"그렇다면 손톱깎이나 가위처럼 우리 주변에서 지레의 원리를 이용한 도구를 한 가지 들고, 어느 부분이 받침점·힘점·작용점에 해당하는지 설명하시오.","a":"손톱깎이를 예로 들면, 위아래 지렛대가 만나는 부분이 받침점, 손가락으로 누르는 부분이 힘점, 실제 손톱을 자르는 날 부분이 작용점입니다.","kw":[{"l":"받침점·힘점·작용점 구분","a":["받침점","힘점","작용점"]}]}},{"main":{"id":"lk_FU_S20","cat":"과학","grade":"중1","q":"무거운 물건을 옮길 때 도르래를 사용하면 편리합니다. 천장에 고정해서 사용하는 고정 도르래는 힘의 방향과 크기 면에서 어떤 특징이 있나요?","a":"고정 도르래는 줄을 당기는 방향과 물체가 올라가는 방향을 다르게 바꿔 줄 수 있어 힘의 방향을 편리하게 바꿀 수 있지만, 필요한 힘의 크기는 줄어들지 않습니다.","kw":[{"l":"힘의 방향을 바꿈","a":["방향"]},{"l":"힘의 크기는 그대로","a":["크기","줄어들지"]}]},"follow":{"id":"lk_FU_S20F","cat":"과학","grade":"중1","q":"그렇다면 물체에 매달아 함께 움직이는 움직 도르래를 사용하면 필요한 힘의 크기는 어떻게 달라지나요?","a":"움직 도르래를 사용하면 물체의 무게를 두 줄이 나누어 지탱하기 때문에, 물체를 직접 들어 올릴 때보다 절반의 힘으로 들어 올릴 수 있습니다.","kw":[{"l":"힘의 크기가 절반으로 줄어듦","a":["절반","줄어"]}]}},{"main":{"id":"lk_FU_S21","cat":"과학","grade":"중1","q":"물을 가득 채운 컵의 입구를 마분지 조각으로 막고 조심스럽게 거꾸로 뒤집으면, 마분지가 떨어지지 않고 물이 쏟아지지 않습니다. 이런 현상이 나타나는 까닭을 설명하시오.","a":"마분지의 아래쪽(바깥쪽)에서 대기가 마분지를 떠받치는 힘인 대기압이 작용하는데, 이 대기압의 크기가 컵 속 물의 무게보다 크기 때문에 마분지가 떨어지지 않습니다.","kw":[{"l":"대기압","a":["대기압"]},{"l":"물의 무게보다 큼","a":["무게보다","더 큼"]}]},"follow":{"id":"lk_FU_S21F","cat":"과학","grade":"중1","q":"만약 이 실험을 대기가 없는 우주 공간에서 한다면 마분지는 어떻게 될까요?","a":"우주 공간에는 대기가 없어 대기압이 작용하지 않으므로, 마분지를 떠받치는 힘이 사라져 물이 쏟아지고 마분지도 함께 떨어질 것입니다.","kw":[{"l":"대기압이 없음","a":["대기압이 없","대기가 없"]},{"l":"물이 쏟아짐","a":["쏟아"]}]}},{"main":{"id":"lk_FU_S22","cat":"과학","grade":"중1","q":"줄다리기에서 양쪽 팀이 똑같은 힘으로 당기면 줄이 움직이지 않습니다. 이렇게 두 힘이 겉으로 아무 효과가 나타나지 않도록 균형을 이루는 상태를 무엇이라고 하며, 그 조건은 무엇인가요?","a":"힘의 평형이라고 합니다. 두 힘의 크기가 같고, 방향이 반대이며, 같은 작용선(일직선) 위에 있을 때 힘의 평형이 이루어집니다.","kw":[{"l":"힘의 평형","a":["평형"]},{"l":"크기가 같고 방향이 반대","a":["크기가 같","방향이 반대"]}]},"follow":{"id":"lk_FU_S22F","cat":"과학","grade":"중1","q":"만약 한쪽 팀이 아주 약간이라도 더 큰 힘으로 당기기 시작하면 줄과 힘의 평형은 어떻게 될까요?","a":"두 힘의 크기가 더 이상 같지 않으므로 힘의 평형이 깨지고, 더 큰 힘을 준 쪽으로 줄이 서서히 끌려가게 됩니다.","kw":[{"l":"평형이 깨짐","a":["깨"]},{"l":"큰 힘 쪽으로 끌려감","a":["끌려","이동"]}]}},{"main":{"id":"lk_FU_S23","cat":"과학","grade":"중2","q":"막대자석 위에 종이를 놓고 철가루를 뿌리면 자석의 극 주위로 특정한 무늬가 나타납니다. 이 무늬를 통해 자석 주위의 자기장에 대해 알 수 있는 것은 무엇인가요?","a":"철가루가 만드는 무늬(자기력선)를 통해 자기장의 방향과 세기를 알 수 있습니다. 무늬가 촘촘할수록 자기장이 세고, 자석의 극에 가까울수록 무늬가 촘촘합니다.","kw":[{"l":"자기장의 방향","a":["방향"]},{"l":"무늬가 촘촘할수록 자기장이 셈","a":["촘촘","세"]}]},"follow":{"id":"lk_FU_S23F","cat":"과학","grade":"중2","q":"막대자석을 반으로 자르면 어떻게 될까요?","a":"자석을 반으로 잘라도 한쪽은 N극만, 다른 쪽은 S극만 남는 것이 아니라, 잘린 두 조각 모두 각각 N극과 S극을 가진 새로운 자석이 됩니다.","kw":[{"l":"각각 N극과 S극을 가진 자석이 됨","a":["N극","S극"]}]}},{"main":{"id":"lk_FU_S24","cat":"과학","grade":"중1","q":"상자에 작은 구멍을 뚫고 반대쪽 면에 기름종이(스크린)를 붙인 바늘구멍 사진기로 촛불을 비추면, 스크린에 상하좌우가 바뀐 촛불의 모습이 나타납니다. 이런 상이 생기는 까닭을 설명하시오.","a":"빛은 곧게 나아가는 직진 성질이 있어서, 촛불의 윗부분에서 나온 빛은 구멍을 지나 스크린의 아랫부분에, 아랫부분에서 나온 빛은 스크린의 윗부분에 도달하기 때문에 상하좌우가 뒤바뀐 상이 생깁니다.","kw":[{"l":"빛의 직진","a":["직진"]},{"l":"상하좌우가 바뀜","a":["상하","좌우","바뀐"]}]},"follow":{"id":"lk_FU_S24F","cat":"과학","grade":"중1","q":"바늘구멍을 원래보다 훨씬 크게 뚫으면 스크린에 나타나는 상은 어떻게 달라질까요?","a":"구멍이 커지면 여러 방향에서 온 빛이 한꺼번에 겹쳐서 통과하기 때문에, 상이 또렷하지 않고 흐릿하게 겹쳐 보입니다.","kw":[{"l":"상이 흐릿해짐","a":["흐릿","겹쳐"]}]}},{"main":{"id":"lk_FU_S25","cat":"과학","grade":"중1","q":"보온병에 뜨거운 물을 담아 두면 시간이 지나도 온도가 잘 떨어지지 않습니다. 보온병이 열의 이동을 막아 온도를 유지하는 구조를 설명하시오.","a":"보온병은 안쪽과 바깥쪽 벽 사이를 진공(또는 이중벽 구조)으로 만들어 전도와 대류에 의한 열 이동을 막고, 안쪽 벽을 은빛으로 처리해 복사에 의한 열도 반사시켜 잘 빠져나가지 않도록 합니다.","kw":[{"l":"전도와 대류를 막음","a":["전도","대류"]},{"l":"복사(열 반사)","a":["복사","반사"]}]},"follow":{"id":"lk_FU_S25F","cat":"과학","grade":"중1","q":"보온병 뚜껑을 자주 열었다 닫았다 하면 보온 효과가 떨어지는 까닭은 무엇인가요?","a":"뚜껑을 열 때마다 보온병 속의 따뜻한 공기가 밖으로 빠져나가고 찬 공기가 들어오는 대류가 일어나 열에너지를 잃기 때문에 보온 효과가 떨어집니다.","kw":[{"l":"대류로 열을 잃음","a":["대류"]},{"l":"따뜻한 공기가 빠져나감","a":["빠져나"]}]}},{"main":{"id":"lk_FU_S26","cat":"과학","grade":"중1","q":"그네의 줄 길이가 같으면 몸무게가 다른 두 사람이 타도 한 번 왕복하는 데 걸리는 시간(주기)이 거의 비슷합니다. 그네와 같은 진자의 주기에 가장 큰 영향을 주는 요인은 무엇인가요?","a":"진자의 주기는 줄(진자)의 길이에 의해 결정되며, 매달린 물체의 무게와는 거의 관계가 없습니다. 줄이 길수록 주기가 길어집니다.","kw":[{"l":"줄의 길이","a":["길이"]},{"l":"무게와 관계없음","a":["무게","관계없"]}]},"follow":{"id":"lk_FU_S26F","cat":"과학","grade":"중1","q":"그네 줄의 길이를 원래보다 길게 늘리면 한 번 왕복하는 데 걸리는 시간은 어떻게 달라질까요?","a":"줄의 길이가 길어지면 주기도 길어지므로, 한 번 왕복하는 데 걸리는 시간이 더 늘어납니다.","kw":[{"l":"주기가 길어짐","a":["길어"]}]}},{"main":{"id":"lk_FU_S27","cat":"과학","grade":"중2","q":"동굴이나 넓은 산속에서 소리를 지르면 잠시 후 같은 소리가 다시 들려오는 메아리 현상이 나타납니다. 메아리가 생기는 까닭을 소리의 성질과 관련지어 설명하시오.","a":"소리도 빛처럼 물체에 부딪히면 반사되는 성질이 있습니다. 소리가 멀리 있는 벽이나 산에 부딪혀 반사되어 돌아오는 데 시간이 걸리기 때문에, 원래 소리를 들은 후 잠시 뒤에 반사된 소리가 다시 들리는 메아리가 생깁니다.","kw":[{"l":"소리의 반사","a":["반사"]},{"l":"되돌아오는 데 시간이 걸림","a":["시간"]}]},"follow":{"id":"lk_FU_S27F","cat":"과학","grade":"중2","q":"박쥐는 어두운 동굴 속에서도 장애물에 부딪히지 않고 날아다닐 수 있습니다. 박쥐는 어떤 원리로 주변의 장애물을 파악하나요?","a":"박쥐는 사람이 들을 수 없는 높은 진동수의 초음파를 내보내고, 그 소리가 장애물에 부딪혀 반사되어 돌아오는 것을 듣고 장애물까지의 거리와 위치를 파악합니다.","kw":[{"l":"초음파","a":["초음파"]},{"l":"반사되어 돌아오는 소리","a":["반사"]}]}},{"main":{"id":"lk_FU_S28","cat":"과학","grade":"중3","q":"바닷가에서 파도를 보면 물결이 계속 해안으로 밀려오지만, 물 위에 뜬 튜브는 앞으로 나아가지 않고 제자리에서 위아래로 오르내리기만 합니다. 이런 모습으로 알 수 있는 파동의 특징은 무엇인가요?","a":"파도(파동)가 진행할 때 파동을 전달하는 물(매질) 자체는 함께 이동하지 않고 제자리에서 진동만 하며, 에너지만 진행 방향으로 전달된다는 것을 알 수 있습니다.","kw":[{"l":"매질은 이동하지 않고 제자리에서 진동","a":["제자리","이동하지 않"]},{"l":"에너지가 전달됨","a":["에너지"]}]},"follow":{"id":"lk_FU_S28F","cat":"과학","grade":"중3","q":"파도는 태풍이 부는 먼바다에서 세게 칠 때가 많습니다. 파도(물결)를 일으키는 주요 원인은 무엇인가요?","a":"파도는 주로 바람이 수면을 스치며 마찰을 일으켜 생기며, 이 밖에도 지진이나 달과 태양의 인력(밀물과 썰물)도 물결을 일으키는 원인이 됩니다.","kw":[{"l":"바람","a":["바람"]}]}},{"main":{"id":"lk_FU_S29","cat":"과학","grade":"중2","q":"생선회를 먹을 때 레몬즙을 뿌려 먹으면 비린내가 줄어들고, 벌에 쏘였을 때는 암모니아수를 발라 통증을 줄이기도 합니다. 이 두 가지 방법에 공통으로 숨어 있는 원리는 무엇일까요?","a":"생선 비린내를 내는 물질이나 벌독처럼 성질이 강한 물질을, 그와 반대되는 성질을 가진 물질(레몬즙, 암모니아수)로 서로 성질을 약하게 만들어 상쇄시키는 원리가 숨어 있습니다.","kw":[{"l":"서로 반대되는 성질을 상쇄","a":["반대","상쇄","약하게"]},{"l":"중화","a":["중화"]}]},"follow":{"id":"lk_FU_S29F","cat":"과학","grade":"중2","q":"속이 쓰릴 때 먹는 제산제도 이와 비슷한 원리로 설명할 수 있습니다. 위산이 지나치게 많이 분비되어 속이 쓰릴 때, 제산제가 증상을 줄여 주는 원리를 설명하시오.","a":"제산제는 위산과 성질이 반대인 물질로, 위산의 성질을 약하게 만들어 위벽을 자극하는 정도를 줄여 주기 때문에 속쓰림 증상이 줄어듭니다.","kw":[{"l":"위산과 반대되는 성질","a":["반대"]},{"l":"위산의 성질을 약하게 함","a":["약하게","줄"]}]}},{"main":{"id":"lk_FU_S30","cat":"과학","grade":"중2","q":"못을 식초에 며칠 담가 두면 기포가 보글보글 올라오면서 못 표면이 변합니다. 반면 같은 식초에 은수저를 담가 두면 별다른 변화가 없습니다. 이런 차이가 나타나는 까닭은 무엇일까요?","a":"철은 산성 물질과 활발하게 반응하여 기체를 발생시키며 성질이 변하지만, 은은 철보다 다른 물질과 반응하는 정도가 훨씬 약해서 식초와 잘 반응하지 않기 때문에 별다른 변화가 없습니다.","kw":[{"l":"금속마다 반응하는 정도가 다름","a":["반응"]},{"l":"기체 발생","a":["기체"]}]},"follow":{"id":"lk_FU_S30F","cat":"과학","grade":"중2","q":"오래된 구리로 만든 지붕이나 동상이 시간이 지나면서 초록색으로 변하는 것을 본 적이 있을 것입니다. 이런 색 변화가 나타나는 까닭은 무엇인가요?","a":"구리가 공기 중의 산소, 수분 등과 오랜 시간 서서히 반응하여 표면에 초록색을 띠는 새로운 물질(녹)이 만들어지기 때문입니다.","kw":[{"l":"공기 중 물질과 반응","a":["반응"]},{"l":"녹(새로운 물질)이 생김","a":["녹","새로운 물질"]}]}},{"main":{"id":"lk_FU_S31","cat":"과학","grade":"중2","q":"촛불이 타다가 촛불에 유리컵을 씌우면 잠시 후 불이 꺼집니다. 이렇게 물질이 타기(연소하기) 위해서는 탈 물질, 산소, 발화점 이상의 온도라는 세 가지 조건이 모두 필요한데, 유리컵을 씌웠을 때는 이 중 무엇이 사라져서 불이 꺼지는 것인가요?","a":"유리컵으로 덮으면 컵 안의 산소가 연소에 다 쓰이고 새로운 산소가 공급되지 않아, 연소에 필요한 세 가지 조건 중 산소가 사라지기 때문에 촛불이 꺼집니다.","kw":[{"l":"산소 부족(공급 차단)","a":["산소"]},{"l":"연소의 조건","a":["조건"]}]},"follow":{"id":"lk_FU_S31F","cat":"과학","grade":"중2","q":"기름에 불이 붙었을 때는 물을 부으면 오히려 위험하고, 젖은 담요를 덮어 꺼야 합니다. 젖은 담요로 불을 끄는 것은 연소의 세 가지 조건 중 무엇을 없애는 방법인가요?","a":"젖은 담요로 불을 덮으면 불꽃과 공기(산소)의 접촉을 차단하여 산소 공급을 막기 때문에 불이 꺼집니다.","kw":[{"l":"산소 차단","a":["산소"]},{"l":"공기와의 접촉을 막음","a":["차단","막"]}]}},{"main":{"id":"lk_FU_S32","cat":"과학","grade":"중2","q":"과산화수소수(오래된 상처 소독약)에 감자 조각이나 이산화 망가니즈를 넣으 ":"A형 B형 O형 AB형 모두 가능","a":["AB형"]}]}},{"main":{"id":"lk_FU_S42","cat":"과학","grade":"중2","q":"지구에서 촛불을 켜면 불꽃이 위로 길쭉하게 솟아오르는 모양이 됩니다. 그런데 우주정거장처럼 무중력에 가까운 환경에서 촛불을 켜면 불꽃이 위로 솟지 않고 동그란 공 모양으로 약하게 타오릅니다. 지구에서 불꽃이 위쪽으로 길게 솟아오르는 까닭은 무엇인가요?","a":"촛불 주변의 뜨거워진 공기는 밀도가 작아져 위로 올라가고 차가운 공기가 아래에서 채워지는 대류가 일어나는데, 이 대류 때문에 불꽃이 위쪽으로 길게 늘어난 모양이 됩니다.","kw":[{"l":"대류","a":["대류"]},{"l":"뜨거운 공기가 위로 올라감","a":["위로","올라"]}]},"follow":{"id":"lk_FU_S42F","cat":"과학","grade":"중2","q":"무중력 환경에서는 대류가 잘 일어나지 않아 촛불이 둥근 모양이 되는데, 이런 환경에서 촛불은 지구에서보다 더 오래 탈까요, 더 빨리 꺼질까요? 그 까닭과 함께 설명하시오.","a":"무중력 환경에서는 대류가 일어나지 않아 새로운 산소가 불꽃 주변으로 잘 공급되지 못하기 때문에, 촛불은 지구에서보다 훨씬 빨리 산소가 부족해져서 더 빨리 꺼지게 됩니다.","kw":[{"l":"대류가 일어나지 않음","a":["대류가 일어나지","대류가 없"]},{"l":"산소 공급이 잘 안 됨","a":["산소"]}]}},{"main":{"id":"lk_FU_S43","cat":"과학","grade":"중2","q":"우주정거장에서 물을 공중에 살짝 띄우면 지구에서와 달리 동그란 구슬 모양으로 둥둥 떠 있습니다. 이런 모양이 되는 까닭은 무엇인가요?","a":"지구에서는 중력 때문에 물이 아래로 처지지만, 무중력 상태에서는 중력의 영향이 거의 없어 물의 표면적을 최소로 만들려는 표면 장력만 작용하기 때문에, 표면적이 가장 작은 모양인 구형이 됩니다.","kw":[{"l":"표면 장력","a":["표면 장력"]},{"l":"중력의 영향이 거의 없음","a":["중력"]}]},"follow":{"id":"lk_FU_S43F","cat":"과학","grade":"중2","q":"지구에서도 나뭇잎 위의 작은 이슬방울은 둥글게 맺힙니다. 하지만 빗방울처럼 물방울이 아주 커지면 완전한 구형을 유지하기 어려워집니다. 그 까닭은 무엇일까요?","a":"물방울이 커질수록 물의 양(무게)이 늘어나 중력이 표면 장력보다 상대적으로 크게 작용하게 되므로, 아래로 처지는 힘을 받아 완전한 구형을 유지하기 어렵고 아래쪽이 눌린 찌그러진 모양이 되기 쉽습니다.","kw":[{"l":"물방울이 클수록 중력의 영향이 커짐","a":["중력"]},{"l":"찌그러진 모양이 됨","a":["찌그러"]}]}},{"main":{"id":"lk_FU_S44","cat":"과학","grade":"중3","q":"어떤 행성에 착륙한 우주 탐사 로봇이 스톱워치와 줄자만을 이용해서 그 행성의 중력의 세기를 대략적으로 알아보려고 합니다. 어떤 실험을 설계할 수 있을지 방법을 설명하시오.","a":"일정한 높이에서 물체를 가만히 떨어뜨리면서 바닥에 닿을 때까지 걸리는 시간을 스톱워치로 재고, 떨어뜨린 높이를 줄자로 측정합니다. 여러 번 반복해서 얻은 높이와 걸린 시간의 관계를 살펴보면, 그 행성에서 물체가 얼마나 빠르게 떨어지는지(중력의 세기)를 짐작할 수 있습니다.","kw":[{"l":"자유 낙하시켜 시간을 측정","a":["시간","스톱워치"]},{"l":"떨어뜨린 높이를 측정","a":["높이"]}]},"follow":{"id":"lk_FU_S44F","cat":"과학","grade":"중3","q":"만약 이 실험을 중력이 지구보다 훨씬 약한 행성에서 한다면, 같은 높이에서 물체를 떨어뜨렸을 때 바닥에 닿기까지 걸리는 시간은 지구에서보다 더 길까요, 짧을까요? 그 까닭과 함께 설명하시오.","a":"중력이 약할수록 물체를 끌어당기는 힘이 작아 떨어지는 속력이 천천히 증가하므로, 같은 높이에서 떨어뜨려도 바닥에 닿기까지 걸리는 시간은 지구에서보다 더 길어집니다.","kw":[{"l":"중력이 약할수록 천천히 떨어짐","a":["천천히","느리"]},{"l":"시간이 더 길어짐","a":["길어"]}]}},{"main":{"id":"lk_FU_S45","cat":"과학","grade":"중2","q":"우주 비행사가 우주복 없이 진공인 우주 공간에 그대로 노출되면 매우 위험합니다. 특히 몸속의 물이 순식간에 끓어오르듯 기화될 수 있다고 하는데, 체온이 높지 않은데도 이런 일이 일어날 수 있는 까닭은 무엇인가요?","a":"액체의 끓는점은 주변 압력이 낮을수록 낮아지는데, 진공 상태인 우주 공간은 압력이 거의 0에 가까워서 몸의 온도가 높지 않아도 몸속의 물이 매우 낮은 온도에서 끓어(기화되어) 버릴 수 있기 때문입니다.","kw":[{"l":"압력이 낮을수록 끓는점이 낮아짐","a":["압력","끓는점"]},{"l":"진공(압력이 거의 없음)","a":["진공"]}]},"follow":{"id":"lk_FU_S45F","cat":"과학","grade":"중2","q":"반대로 압력밥솥은 밥을 지을 때 뚜껑을 꽉 닫아 내부 압력을 높입니다. 압력밥솥으로 밥을 지으면 일반 냄비보다 밥이 더 빨리 되는 까닭은 무엇인가요?","a":"압력이 높아지면 물의 끓는점이 100℃보다 더 높이 올라가서, 물이 더 높은 온도에서 끓게 되고, 그만큼 더 높은 온도에서 밥을 지을 수 있어 밥이 더 빨리 익습니다.","kw":[{"l":"압력이 높아지면 끓는점이 높아짐","a":["끓는점이 높"]},{"l":"더 높은 온도에서 조리","a":["높은 온도"]}]}},{"main":{"id":"lk_FU_S46","cat":"과학","grade":"중3","q":"방 안의 불을 껐다 켜면 순간적으로 어두워집니다. 스위치를 끄기 직전까지 전구에서 나오고 있던 빛은 갑자기 사라지는 걸까요, 아니면 어딘가로 계속 나아가는 걸까요? 빛의 성질과 관련지어 설명하시오.","a":"빛은 갑자기 사라지지 않고 초속 약 30만 km라는 매우 빠른 속도로 계속 나아갑니다. 방 안에서는 빛이 벽이나 물체에 부딪혀 흡수되기까지 아주 짧은 시간(수십억 분의 1초)밖에 걸리지 않기 때문에, 우리 눈에는 스위치를 끄자마자 즉시 어두워지는 것처럼 느껴지는 것뿐입니다.","kw":[{"l":"빛은 사라지지 않고 계속 나아감","a":["사라지지","계속"]},{"l":"물체에 부딪혀 흡수됨","a":["흡수"]},{"l":"매우 빠른 속도","a":["속도","빠른"]}]},"follow":{"id":"lk_FU_S46F","cat":"과학","grade":"중3","q":"그렇다면 밤하늘에는 수많은 별이 있는데도 왜 하늘 전체가 밝지 않고 어둡게 보일까요? 별빛이 우주 공간에서 어떻게 되는지와 관련지어 설명하시오.","a":"우주 공간에는 빛을 흡수할 물체가 거의 없어서, 별빛은 무언가에 부딪히지 않는 한 계속 뻗어 나가기만 합니다. 하지만 우주가 생겨난 지는 약 138억 년으로 한정된 시간밖에 지나지 않았기 때문에, 아주 멀리 있는 별에서 나온 빛 중에는 아직 지구까지 도달하지 못한 것도 많습니다. 그래서 하늘의 모든 방향에서 별빛이 우리 눈에 도달하는 것은 아니므로 밤하늘이 어둡게 보입니다.","kw":[{"l":"별빛은 계속 나아감","a":["계속","나아"]},{"l":"우주의 나이가 한정되어 있음","a":["138억","한정"]},{"l":"아직 도달하지 못한 빛이 있음","a":["도달하지 못"]}]}},{"main":{"id":"lk_FU_S47","cat":"과학","grade":"중3","q":"자석을 코일 근처에서 빠르게 움직이면, 코일이 전지에 연결되어 있지 않은데도 순간적으로 전류가 흐릅니다. 이렇게 자석의 움직임으로 코일에 전류가 만들어지는 현상을 무엇이라고 하며, 전류가 흐르려면 어떤 조건이 필요한가요?","a":"이런 현상을 전자기 유도라고 하고, 이때 흐르는 전류를 유도 전류라고 합니다. 코일을 통과하는 자기장이 변할 때(자석이 움직이거나 자석과 코일 사이의 거리가 달라질 때) 유도 전류가 흐르며, 자석이 멈춰 있으면 자기장이 변하지 않아 전류가 흐르지 않습니다.","kw":[{"l":"전자기 유도","a":["전자기 유도"]},{"l":"유도 전류","a":["유도 전류"]},{"l":"자기장이 변할 때","a":["자기장이 변"]}]},"follow":{"id":"lk_FU_S47F","cat":"과학","grade":"중3","q":"지하철 교통카드를 개찰구에 가까이 대기만 해도 인식이 되고, 스마트폰도 선 없이 충전판 위에 올려두면 충전이 됩니다. 카드나 스마트폰에는 전지를 직접 연결한 전선이 없는데도 이렇게 작동할 수 있는 것도 전자기 유도와 관련이 있습니다. 두 기기에 공통으로 들어 있는 부품은 무엇이며 어떤 역할을 하나요?","a":"교통카드와 무선 충전판, 그리고 그것을 받는 스마트폰 속에는 모두 작은 코일이 들어 있습니다. 한쪽 코일에 전류가 흐르면 자기장이 만들어지고, 이 변화하는 자기장이 다른 쪽 코일에 유도 전류를 발생시키기 때문에, 전선으로 직접 연결하지 않고도 정보를 전달하거나 전기를 충전할 수 있습니다.","kw":[{"l":"코일","a":["코일"]},{"l":"유도 전류","a":["유도 전류"]},{"l":"전선 없이 전달(무선)","a":["전선","무선"]}]}},{"main":{"id":"lk_FU_S48","cat":"과학","grade":"중1","q":"생물체는 모두 세포로 이루어져 있습니다. 동물 세포와 식물 세포에 공통으로 있는 세포막과 핵은 각각 어떤 역할을 하나요?","a":"세포막은 세포를 둘러싸 세포의 형태를 유지하고 물질이 세포 안팎으로 드나드는 것을 조절하는 역할을 하며, 핵은 세포의 생명 활동을 조절하는 유전 정보를 담고 있어 세포의 중심 역할을 합니다.","kw":[{"l":"세포막-물질 출입 조절","a":["세포막"]},{"l":"핵-유전 정보","a":["핵","유전 정보"]}]},"follow":{"id":"lk_FU_S48F","cat":"과학","grade":"중1","q":"동물 세포에는 없고 식물 세포에만 있는 구조로 세포벽과 엽록체가 있습니다. 이 두 구조는 각각 어떤 역할을 하나요?","a":"세포벽은 세포막 바깥을 둘러싸 세포를 튼튼하게 지지하고 보호하는 역할을 하고, 엽록체는 빛에너지를 이용해 광합성을 하여 양분을 만드는 역할을 합니다.","kw":[{"l":"세포벽-지지와 보호","a":["세포벽"]},{"l":"엽록체-광합성","a":["엽록체","광합성"]}]}},{"main":{"id":"lk_FU_S49","cat":"과학","grade":"중3","q":"선풍기는 전기 에너지를 이용해 날개를 돌려 시원한 바람(운동 에너지)을 만들어 냅니다. 그런데 선풍기를 오래 켜 두면 몸체가 조금씩 따뜻해지는 것을 느낄 수 있습니다. 이 현상은 에너지가 어떻게 되는 것을 보여주나요?","a":"선풍기에 공급된 전기 에너지의 일부는 날개를 돌리는 운동 에너지로 전환되지만, 나머지 일부는 모터의 마찰 등에 의해 열에너지로 전환되어 몸체가 따뜻해지는 것입니다. 이렇게 에너지는 새로 생기거나 사라지지 않고 다른 형태로 전환될 뿐이며, 전환 전후 에너지의 총량은 일정하게 보존됩니다.","kw":[{"l":"에너지 보존","a":["보존"]},{"l":"다른 형태로 전환됨(열에너지 등)","a":["전환","열에너지"]}]},"follow":{"id":"lk_FU_S49F","cat":"과학","grade":"중3","q":"이처럼 에너지가 형태를 바꿀 때마다 일부가 열에너지로 빠져나가 손실되는 것처럼 보이는데도, 왜 과학자들은 \"에너지가 보존된다\"고 말할까요?","a":"열에너지로 빠져나간 에너지도 사라진 것이 아니라 주변 공기나 물체를 데우는 데 사용되어 다른 곳으로 전달된 것일 뿐이므로, 원래 쓰려던 형태(운동 에너지 등)로서의 효율은 줄어들어도, 전체로 보면 에너지의 총량은 변하지 않고 그대로 보존되기 때문입니다.","kw":[{"l":"열에너지도 사라진 게 아니라 전달됨","a":["전달"]},{"l":"전체 에너지 총량은 불변","a":["총량"]}]}},{"main":{"id":"lk_FU_S50","cat":"과학","grade":"중3","q":"로켓은 아무것도 없는 진공의 우주 공간에서도 앞으로 나아갈 수 있습니다. 주변에 밀어낼 공기도 없는데 로켓이 앞으로 나아갈 수 있는 까닭은 무엇인가요?","a":"로켓은 연료를 태워 만든 가스를 뒤쪽으로 강하게 분출하는데, 이때 가스가 로켓을 미는 힘과 로켓이 가스를 미는 힘이 서로 반대 방향으로 작용하는 작용·반작용의 원리로 나아갑니다. 이 원리는 주변에 공기가 없어도 성립하기 때문에 진공인 우주에서도 로켓이 나아갈 수 있습니다.","kw":[{"l":"작용·반작용","a":["작용","반작용"]},{"l":"가스를 뒤로 분출","a":["분출","가스"]}]},"follow":{"id":"lk_FU_S50F","cat":"과학","grade":"중3","q":"풍선에서 바람이 빠지면서 반대 방향으로 날아가는 것도 같은 원리로 설명할 수 있나요?","a":"네, 같은 원리입니다. 풍선 속 공기가 한쪽으로 빠르게 빠져나가면서 풍선을 반대 방향으로 미는 반작용이 일어나기 때문에 풍선이 날아갑니다.","kw":[{"l":"같은 원리(작용·반작용)","a":["작용","반작용","같은 원리"]}]}},{"main":{"id":"lk_FU_S51","cat":"과학","grade":"중3","q":"인공위성은 지구의 중력에 끊임없이 끌리고 있는데도 왜 지표면에 떨어지지 않고 계속 지구 주위를 도는 걸까요?","a":"인공위성은 지구 중력에 의해 계속 지구 쪽으로 끌려가고 있지만, 동시에 매우 빠른 속도로 옆으로 움직이고 있습니다. 떨어지는 동안 지구 표면도 둥글게 휘어져 멀어지기 때문에, 계속 떨어지면서도 지표면에 닿지 않고 일정한 높이를 유지하며 지구 주위를 돌게 됩니다.","kw":[{"l":"중력에 끌리면서 동시에 빠르게 옆으로 이동","a":["옆으로","속도"]},{"l":"지구 표면이 둥글게 휘어짐","a":["휘어"]}]},"follow":{"id":"lk_FU_S51F","cat":"과학","grade":"중3","q":"만약 인공위성의 속력이 갑자기 느려진다면 어떻게 될까요?","a":"옆으로 움직이는 속력이 느려지면 중력에 끌려가는 정도를 따라잡지 못해 점점 지구 쪽으로 가까워지다가, 결국 대기권으로 떨어지게 됩니다.","kw":[{"l":"점점 지구에 가까워짐","a":["가까워"]},{"l":"대기권으로 떨어짐","a":["떨어"]}]}},{"main":{"id":"lk_FU_S52","cat":"과학","grade":"중2","q":"흔들지 않았는데도 봉지를 뜯으면 저절로 따뜻해지는 손난로가 있습니다. 이 손난로 안에서는 어떤 반응이 일어나고 있는 걸까요?","a":"손난로 안에는 철가루가 들어 있는데, 봉지를 뜯어 공기 중의 산소와 닿으면 철가루가 산소와 반응하여 산화되면서 열을 내는 발열 반응이 일어나기 때문에 저절로 따뜻해집니다.","kw":[{"l":"철가루와 산소의 반응(산화)","a":["철가루","산소","산화"]},{"l":"발열 반응","a":["발열"]}]},"follow":{"id":"lk_FU_S52F","cat":"과학","grade":"중2","q":"한번 다 식은 손난로는 다시 흔들거나 주물러도 왜 따뜻해지지 않을까요?","a":"철가루가 이미 산소와 반응해 다른 물질(산화철)로 완전히 바뀌어 버려서, 더 이상 반응할 철가루가 남아 있지 않기 때문에 다시 열이 나지 않습니다.","kw":[{"l":"철가루가 이미 다른 물질로 바뀜","a":["이미","바뀌"]},{"l":"남은 철가루가 없음","a":["없"]}]}},{"main":{"id":"lk_FU_S53","cat":"과학","grade":"중2","q":"나침반 바늘은 어디에 있든 항상 북쪽을 가리킵니다. 그 까닭은 무엇인가요?","a":"지구 자체가 하나의 거대한 자석과 같은 성   if(loginConfigCache) return loginConfigCache;
  let password = DEFAULT_STUDENT_PW, loginEnabled = true;
  try{
    const cp = localStorage.getItem('login_pw_'+APP_KEY); if(cp) password = cp;

  }catch(e){}
}

async function fetchServerResumeSnapshots(name){
  const empty = {normal: null, wrong: null};
  if(!SHEET_WEBHOOK_URL || !name) return empty;
  try{
    const rows = await fetchStudentFromSheet(name);
    if(!rows || !rows.length) return empty;
    // 일반 모드와 오답 모드 이어풀기 스냅샷 분리
    const normalRows = rows.filter(r=>!(r.modeLabel||'').includes('오답'));
    const wrongRows = rows.filter(r=>(r.modeLabel||'').includes('오답'));
    const normalSnap = buildServerResumeFromRows(normalRows) || buildApproxResumeFromRows(normalRows);
    const wrongSnap = buildServerResumeFromRows(wrongRows) || buildApproxResumeFromRows(wrongRows);
    return {normal: normalSnap, wrong: wrongSnap};
  }catch(e){ return empty; }
}

// 두 문자열 간 편집거리(레벤슈타인 거리) 계산 - 음성인식 오인식 허용 매칭에 사용
function editDistance(a, b){
  const m=a.length, n=b.length;
  if(m===0) return n; if(n===0) return m;
  const dp=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++)
    dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  return dp[m][n];
}
// 키워드가 텍스트 안에 "충분히 비슷하게" 포함되어 있는지 확인
// 음절 수의 30% 이내 오차(삽입/삭제/대체)이면 인정
function fuzzyIncludes(text, keyword){
  if(!keyword || keyword.length===0) return false;
  if(text.includes(keyword)) return true;
  if(keyword.length < 2) return text.includes(keyword);
  const maxDist = Math.max(1, Math.floor(keyword.length * 0.3));
  // 키워드 길이 윈도우로 슬라이딩하며 편집거리 검사
  for(let i=0;i<=text.length-keyword.length+maxDist;i++){
    const window = text.slice(Math.max(0,i), Math.min(text.length, i+keyword.length+maxDist));
    if(editDistance(window, keyword) <= maxDist) return true;
  }
  return false;
}
function fixSoundErrors(text){
  let t = text || '';
  SOUND_FIXES.forEach(([pat, rep])=>{ t = t.replace(pat, rep); });
  return t;
}

// 조사/어미 제거 후 어간만 남기는 가벼운 정규화
function normDeep(s){
  return (s||'')
    .replace(/[^\uAC00-\uD7A3a-zA-Z0-9]/g,' ') // 특수문자→공백
    .replace(/\s+/g,'')
    .toLowerCase();
}

function scoreAnswer(q, text){
  if(!text || text.trim().length < 2){
    return {matched:[], missed:q.kw, score:0, aiGraded:false};
  }
  // 음성인식 오류 교정 후 정규화
  const fixed = fixSoundErrors(text);
  const n = normDeep(fixed);
  const nOrig = norm(text); // 원본도 함께 체크

  const matched=[], missed=[];
  q.kw.forEach(k=>{
    const hit = k.a.some(alt=>{
      const na = normDeep(fixSoundErrors(alt));
      const na2 = norm(alt);
      // 1. 완전 포함
      if(n.includes(na) || nOrig.includes(na2)) return true;
      // 2. 퍼지 매칭: 편집거리 기반으로 비슷하면 인정 (음성인식 오인식 대응)
      if(na.length >= 2 && fuzzyIncludes(n, na)) return true;
      // 3. 부분 매칭: alt 글자의 80% 이상 순서대로 포함되면 인정
      if(na.length >= 2){
        let pos=0, matched2=0;
        for(let ch of na){ const idx=n.indexOf(ch,pos); if(idx>=0){matched2++;pos=idx+1;} }
        if(matched2/na.length >= 0.8) return true;
      }
      return false;
    });
    if(hit) matched.push(k); else missed.push(k);
  });

  const total = q.kw.length || 1;
  const ratio = matched.length / total;

  // 기본 점수 50점 + 키워드 비율로 50점 추가 (답변이 있는 경우)
  // 키워드 1개만 맞아도 의미 있는 점수, 전체 맞으면 100점 가능
  let score;
  const hasAnswer = text.trim().length >= 4;
  if(!hasAnswer){
    score = 0;
  } else if(total === 0){
    score = 70; // 키워드 없는 문항은 답변 있으면 기본
  } else {
    // 기본 50 + 키워드 비율 * 50
    score = Math.round(50 + ratio * 50);
    // 키워드 전부 맞으면 100점
    if(ratio >= 1) score = 100;
    // 키워드 절반 이상이면 최소 75점 보장
    if(ratio >= 0.5 && score < 75) score = 75;
    // 키워드 1개 이상 맞으면 최소 60점 보장
    if(matched.length >= 1 && score < 60) score = 60;
  }
  score = Math.max(0, Math.min(100, score));
  return {matched, missed, score, aiGraded:false};
}
/* 최종 점수를 한 번 더 후하게 보정. 80점 정도 받은 답변은 100점에 가깝게,
   낮은 점수는 상대적으로 덜 보정되어 변별력은 유지되도록 함. */
function boostScore(raw){
  const boosted = Math.round(raw * 1.25);
  return Math.max(0, Math.min(100, boosted));
}
/* AI(Claude)로 의미 기반 채점을 시도. 실패하면 null을 반환해 키워드 채점으로 대체함.
   음성인식 결과는 표현이 모범답안과 달라도 의미가 같으면 인정해야 하므로,
   단순 문자열 포함 여부가 아니라 모델이 각 핵심 개념의 '의미상 포함 여부'를 판단하게 함.
   중학생 구술면접 상황이므로 채점은 관대하게: 핵심 과학 개념이 맞으면 부수적인 세부 표현
   (예: 위치, 정확한 수치, 부연 설명 등)을 빠뜨려도 감점하지 않음. */
async function aiGradeAnswer(q, text){
  if(!text || norm(text).length < 4) return null;
  const labels = q.kw.map(k=>k.l);
  const sys = `너는 중학교 과학 구술면접을 채점하는 친절하고 관대한 채점관이야. 학생의 음성인식 답변(오타나 띄어쓰기 오류가 있을 수 있음)을 모범답안과 비교해서 채점해.

채점 원칙 (중요, 반드시 지킬 것):
1. 표현이 달라도 의미가 같거나 같은 내용을 자기 말로 풀어서 설명했으면 해당 핵심 개념을 "포함됨"으로 인정해. 단어가 똑같이 나왔는지가 아니라 과학적으로 핵심 의미가 맞는지로 판단해.
2. 중학생 수준의 구술 답변임을 감안해서 관대하게 채점해. 핵심 개념 라벨이 "OO는 XX이다"처럼 여러 요소를 담고 있어도, 학생이 그 개념의 핵심 아이디어만 정확히 말했다면 부수적인 수식어, 위치 표현(예: "지하 깊은 곳", "표면 부근" 같은 세부 조건), 정확한 수치나 예시를 굳이 언급하지 않아도 그 개념은 포함된 것으로 인정해.
3. 학생 답변에 과학적으로 명백히 틀린 내용이 없다면, 사소한 설명 누락만으로 감점하지 마. 오직 핵심 개념 자체를 언급하지 않았거나, 과학적으로 틀리게 설명한 경우에만 그 개념을 "포함되지 않음"으로 처리해.
4. 오타, 띄어쓰기 오류, 음성인식 과정에서 생긴 비슷한 발음의 단어 오변환(예: "광합성"이 "광압성"으로 잘못 인식된 경우 등)은 절대 감점 사유로 삼지 마. 문맥상 학생이 어떤 단어나 개념을 말하려 한 것인지 명확히 유추할 수 있다면, 정확한 표기가 아니어도 원래 의도한 단어를 말한 것으로 인정하고 채점해.
5. 점수는 후하게 매겨. 핵심 개념을 대부분(예: 전체의 80% 이상) 의미상 정확히 짚었다면 90~100점을 줘. 몇 가지 핵심 개념만 빠졌다면 70~89점, 절반 정도만 맞았다면 45~69점, 핵심을 거의 말하지 못했거나 답변이 없으면 그 이하로 줘. 완벽하게 토씨 하나까지 똑같아야만 100점을 주는 방식이 아니라, 과학적으로 충분히 이해하고 설명했다고 판단되면 100점도 흔쾌히 줘.

반드시 아래 JSON 형식으로만 답해. 다른 텍스트나 코드블록 표시(백틱) 없이 순수 JSON만 출력해.
{"matched":["핵심개념 라벨 중 학생이 의미상 포함한 것들"],"missed":["포함하지 않은 것들"],"score":0~100 사이 정수,"feedback":"학생을 격려하는 한두 문장의 한국어 피드백"}
matched와 missed의 문자열은 반드시 주어진 핵심개념 라벨 목록의 것을 그대로 사용해야 하고, 모든 라벨이 둘 중 하나에 정확히 한 번씩만 들어가야 해.`;
  const userMsg = `[질문]\n${q.q}\n\n[모범답안]\n${q.a}\n\n[핵심개념 라벨 목록]\n${JSON.stringify(labels)}\n\n[학생 답변]\n${text}`;
  try{
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model:'claude-sonnet-4-6',
        max_tokens:1000,
        system: sys,
        messages:[{role:'user', content:userMsg}]
      })
    });
    if(!res.ok) return null;
    const data = await res.json();
    const outText = (data.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('');
    const clean = outText.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(clean);
    if(!parsed || typeof parsed.score!=='number') return null;
    const matchedLabels = Array.isArray(parsed.matched)? parsed.matched : [];
    const missedLabelsRaw = Array.isArray(parsed.missed)? parsed.missed : [];
    const matched = q.kw.filter(k=>matchedLabels.includes(k.l));
    const missed = q.kw.filter(k=>!matchedLabels.includes(k.l));
    let score = Math.round(parsed.score);
    if(score<0) score=0; if(score>100) score=100;
    return {matched, missed, score, feedback: typeof parsed.feedback==='string'? parsed.feedback : null, aiGraded:true};
  }catch(e){
    return null;
  }
}

async function generateFollowUpComment(followUpQ, followUpAnswer){
  const sys = `너는 중학교 과학 구술면접관이야. 방금 던진 꼬리질문에 학생이 답했어. 짧고 격려하는 한두 문장으로 코멘트해줘 (정답 여부를 단정짓기보다는, 잘한 점을 짚어주고 부족하면 살짝 보완해주는 톤으로). 다른 설명 없이 코멘트 문장만 출력해.`;
  const userMsg = `[꼬리질문]\n${followUpQ}\n\n[학생 답변]\n${followUpAnswer}`;
  try{
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ model:'claude-sonnet-4-6', max_tokens:200, system: sys, messages:[{role:'user', content:userMsg}] })
    });
    if(!res.ok) return '';
    const data = await res.json();
    return (data.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('').trim();
  }catch(e){ return ''; }
}
function tierOf(score){
  if(score>=90) return {cls:'tier-perfect', label:'완벽해요! 핵심 개념을 정확히 설명했어요.'};
  if(score>=70) return {cls:'tier-good', label:'우수해요! 핵심은 잘 짚었어요. 몇 가지만 보완해봐요.'};
  if(score>=45) return {cls:'tier-mid', label:'조금 더 다듬어볼까요? 절반 정도의 핵심 개념이 빠졌어요.'};
  return {cls:'tier-low', label:'개념을 다시 학습해보는 게 좋겠어요. 모범답안을 참고해서 다시 연습해봐요.'};
}
function ringStyle(score){
  const color = score>=90?'#c9a227':score>=70?'#2f7d5b':score>=45?'#e0862b':'#b3432b';
  return `background:conic-gradient(${color} ${score*3.6}deg, #e9e4d5 0deg); `;
}
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDT(ts){ const d=new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function fmtDate(ts){ const d=new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

async function testMic(){
  const el=document.getElementById('micTestResult');
  if(el) el.textContent='테스트 중...';
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    if(el) el.textContent='❌ 이 브라우저/화면에서는 마이크 접근 기능을 사용할 수 없어요.';
    return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    stream.getTracks().forEach(t=>t.stop());
    if(el) el.textContent='✅ 마이크 권한이 정상적으로 허용되어 있어요! 문제 화면에서 음성 인식을 사용할 수 있어요.';
  }catch(e){
    let msg='❌ 마이크를 사용할 수 없어요 ('+e.name+').';
    if(e.name==='NotAllowedError'||e.name==='PermissionDeniedError') msg+='\n브라우저 주소창의 자물쇠(또는 정보) 아이콘 → 사이트 설정에서 마이크를 "허용"으로 바꾼 뒤 새로고침해주세요.';
    else if(e.name==='NotFoundError') msg+='\n연결된 마이크 장치를 찾을 수 없어요.';
    else msg+='\n이 화면이 대화창 안 "미리보기(샌드박스)"일 가능성이 커요. 이 아티팩트를 게시/공유한 뒤 그 링크를 새 브라우저 탭에서 열거나, HTML 파일을 다운로드해 직접 열어서 다시 시도해주세요.';
    if(el){ el.textContent=msg; }
  }
}

/* ===================== 음성 인식 ===================== */
function setupRecognition(){
  if(!SR) return;
  recognition = new SR();
  recognition.lang='ko-KR';
  // continuous=false: 한 번 누르면 말이 끝날 때(또는 침묵)까지 쭉 듣고 자동으로 멈춤.
  // (continuous=true는 모바일에서 내부적으로 재시작되며 텍스트가 중복 누적되는 문제가 있었고,
  //  자동 재시작 방식은 재시작 자체가 실패해 아예 인식이 안 되는 문제가 있어 가장 단순하고 안정적인 방식으로 되돌림)
  recognition.continuous=false;
  recognition.interimResults=true;
  recognition.onresult=(e)=>{
    let sessionFinal='';
    let interim='';
    for(let i=0;i<e.results.length;i++){
      const t=e.results[i][0].transcript;
      if(e.results[i].isFinal) sessionFinal += t;
      else interim += t;
    }
    lastBurstFinal = sessionFinal;
    state.answerText = (recFinalBase + sessionFinal + interim).trim();
    updateAnswerBoxLive();
  };
  recognition.onerror=(e)=>{
    let msg='음성 인식 중 오류가 발생했어요.';
    let fatal=false;
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){
      msg='마이크 권한이 필요해요.\n① 브라우저 주소창의 자물쇠 아이콘에서 마이크 허용 여부를 확인하세요.\n② 그래도 안 되면 이 화면이 대화창 안 미리보기일 수 있어요 — 아티팩트를 게시/공유한 링크를 새 탭에서 열거나 HTML을 다운로드해 직접 열어보세요.';
      fatal=true;
    } else if(e.error==='no-speech'){
      msg='음성이 감지되지 않았어요. 계속 듣고 있어요.';
    } else if(e.error==='network'){
      msg='네트워크 오류로 음성 인식에 실패했어요. 인터넷 연결을 확인해주세요.';
      fatal=true;
    } else if(e.error==='aborted'){
      return; // 사용자가 직접 멈춰서 발생하는 정상적인 중단
    }
    if(fatal) micWanted=false;
    const st=document.getElementById('recStatus'); if(st){st.textContent=msg; st.classList.remove('on'); st.classList.add('err');}
  };
  recognition.onend=()=>{
    if(lastBurstFinal){
      recFinalBase = (recFinalBase + lastBurstFinal + ' ').replace(/\s+/g,' ');
      state.answerText = recFinalBase.trim();
      updateAnswerBoxLive();
    }
    lastBurstFinal='';
    if(micWanted){
      // 사용자가 아직 마이크를 끄지 않았으면, 짧은 텀을 두고 자동으로 다시 듣기 시작
      // (재시작을 너무 빨리 하면 브라우저가 오류를 내는 경우가 있어 약간의 지연을 둠)
      isRecording=true;
      renderQuizControls();
      if(recRestartTimer) clearTimeout(recRestartTimer);
      recRestartTimer = setTimeout(()=>{
        if(!micWanted) return;
        try{ recognition.start(); }
        catch(err){ isRecording=false; micWanted=false; renderQuizControls(); }
      }, 350);
    } else {
      isRecording=false;
      renderQuizControls();
    }
  };
}
function toggleRecording(){
  if(!SR) return;
  if(!recognition) setupRecognition();
  if(isRecording || micWanted){
    micWanted=false;
    if(recRestartTimer){ clearTimeout(recRestartTimer); recRestartTimer=null; }
    try{ recognition.stop(); }catch(e){}
    isRecording=false;
  } else {
    stopAnswerTimer();
    recFinalBase = state.answerText ? state.answerText+' ' : '';
    lastBurstFinal='';
    micWanted=true;
    try{ recognition.start(); isRecording=true; }catch(e){ micWanted=false; }
  }
  renderQuizControls();
}
function updateAnswerBoxLive(){
  const box=document.getElementById('answerBox');
  if(box) box.value = state.answerText;
  const cc=document.getElementById('charCount');
  if(cc) cc.textContent = state.answerText.length+'자';
}
function renderQuizControls(){
  const micBtn=document.getElementById('micBtn');

    status.classList.remove('on');
    wave.classList.add('hidden');
  }
}

/* ===================== 답변 시작 제한시간 (60초) ===================== */
const ANSWER_START_LIMIT = 60;
let answerTimerId = null;
let answerTimeLeft = ANSWER_START_LIMIT;
let answerTimerStopped = true;
function startAnswerTimer(){
  if(answerTimerId){ clearInterval(answerTimerId); answerTimerId=null; }
  answerTimeLeft = ANSWER_START_LIMIT;
  answerTimerStopped = false;
  updateAnswerTimerDisplay();
  answerTimerId = setInterval(()=>{
    if(answerTimerStopped){ clearInterval(answerTimerId); answerTimerId=null; return; }
    answerTimeLeft -= 1;
    updateAnswerTimerDisplay();
    if(answerTimeLeft<=0){
      clearInterval(answerTimerId); answerTimerId=null; answerTimerStopped=true;
      onAnswerTimeout();
    }
  },1000);
}
function stopAnswerTimer(){
  answerTimerStopped = true;
  if(answerTimerId){ clearInterval(answerTimerId); answerTimerId=null; }
  const el=document.getElementById('answerTimer');
  if(el) el.classList.add('hidden');
}
function updateAnswerTimerDisplay(){
  const el=document.getElementById('answerTimer');
  if(!el) return;
  el.textContent = `⏱ 답변 시작까지 ${answerTimeLeft}초`;
  el.classList.toggle('urgent', answerTimeLeft<=10);
}
function onAnswerTimeout(){
  if(isRecording && recognition){ recognition.stop(); isRecording=false; }

/* ===================== 질문 음성(TTS) + 답변 준비 카운트다운 ===================== */
let lastTTSQuestionId = null;
let prepTimerId = null;
let ttsVoicesCache = null;
function pickKoreanVoice(){
  if(!window.speechSynthesis) return null;
  const voices = window.speechSynthesis.getVoices();
  if(!voices || !voices.length) return null;
  ttsVoicesCache = voices;
  const koVoices = voices.filter(v=>v.lang && v.lang.toLowerCase().startsWith('ko'));
  if(!koVoices.length) return null;
  // 남성으로 추정되는 이름 패턴 우선 탐색 (플랫폼마다 표기가 달라 폭넓게 매칭)
  const maleNamePattern = /male|man|injoon|인준|민수|minsu|준호|junho|철수|형준|승우|성진/i;
  const femaleNamePattern = /female|woman|heami|해ami|유나|yuna|sunhi|선희|지민|jimin/i;
  let pick = koVoices.find(v=>maleNamePattern.test(v.name));
  if(!pick) pick = koVoices.find(v=>!femaleNamePattern.test(v.name) && koVoices.length>1) || null;
  return pick || koVoices[0];
}
function isIOSDevice(){
  return /iPhone|iPad|iPod/i.test(navigator.userAgent);
}
function toSpeech(t){
  let x=String(t||'');
  x=x.replace(/\((\d)\)/g,'$1번. ').replace(/(\d+)\s*\/\s*(\d+)/g,'$2분의 $1').replace(/([가-힣])>(?=[가-힣])/g,'$1 다음 ')
   .replace(/²/g,' 제곱').replace(/³/g,' 세제곱').replace(/√/g,'루트 ').replace(/×/g,' 곱하기 ').replace(/÷/g,' 나누기 ').replace(/−/g,' 마이너스 ')
   .replace(/≥/g,' 크거나 같다 ').replace(/≤/g,' 작거나 같다 ').replace(/°/g,'도').replace(/π/g,'파이').replace(/∠/g,'각 ').replace(/△/g,'삼각형 ')
   .replace(/≠/g,' 같지 않다 ').replace(/≈/g,' 약 ').replace(/→/g,' ').replace(/=/g,' 는 ').replace(/\+/g,' 더하기 ').replace(/\bg\/cm/g,'그램 퍼 세제곱센티미터');
  return x;
}
function speakQuestion(text){
  text = toSpeech(text);
  const ttsTargetId = lastTTSQuestionId; // 이 발화가 어떤 문제를 위한 것인지 기억해둠
  if(!window.speechSynthesis){ startPrepCountdown(); return; } // TTS 미지원이면 바로 카운트다운으로
  try{
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'ko-KR';
    // 아이폰(iOS) 음성 엔진은 피치를 조금만 낮춰도 소리가 심하게 왜곡되는 경우가 많아
    // 아예 기본 피치(자연스러운 목소리)를 그대로 사용
    if(isIOSDevice()){
      utter.pitch = 1.0;
      utter.rate = 0.95;
    } else {
      utter.pitch = 0.68; // 낮은 피치로 딱딱하고 무게감 있는 남성 아나운서 톤
      utter.rate = 0.92;
    }
    utter.volume = 1;
    const voice = pickKoreanVoice();
    if(voice) utter.voice = voice;
    utter.onstart = ()=>{ const el=document.getElementById('qtext'); if(el) el.classList.add('reading'); };
    const finish = ()=>{
      const el=document.getElementById('qtext'); if(el) el.classList.remove('reading');
      // 이 음성 재생이 끝나기 전에 이미 다음 문제로 넘어갔거나 면접이 끝났다면
      // (=lastTTSQuestionId가 바뀌었거나 더 이상 quiz 화면이 아니라면) 뒤늦게 도착한
      // 이 종료 이벤트로 불필요한 새 카운트다운(비프음)을 시작하지 않음
      if(lastTTSQuestionId !== ttsTargetId || screen !== 'quiz') return;
      startPrepCountdown();
    };
    utter.onend = finish;
    utter.onerror = finish;
    window.speechSynthesis.speak(utter);
  }catch(e){ startPrepCountdown(); }
}
function playTone(freq, duration, vol){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type='sine'; osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(vol, ctx.currentTime+0.015);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+duration);
    osc.start(); osc.stop(ctx.currentTime+duration+0.05);
  }catch(e){}
}
function playTick(){ playTone(1100, 0.09, 0.14); } // 카운트다운 매 초마다 나는 짧은 비프음
function playBeep(){ playTone(880, 0.35, 0.28); } // 카운트다운 종료(0초) 시 울리는 신호음
function startPrepCountdown(){
  if(prepTimerId){ clearInterval(prepTimerId); prepTimerId=null; }
  state._prepActive = true;
  state._prepTimeLeft = 10;
  render();
  prepTimerId = setInterval(()=>{
    state._prepTimeLeft -= 1;
    const el = document.getElementById('prepCountdownNum');
    if(el) el.textContent = state._prepTimeLeft+'초';
    if(state._prepTimeLeft<=0){
      clearInterval(prepTimerId); prepTimerId=null;
      finishPrepCountdown(true);
    } else {
      playTick();
    }
  },1000);
}
function finishPrepCountdown(autoStart){
  state._prepActive = false;
  if(prepTimerId){ clearInterval(prepTimerId); prepTimerId=null; }
  render();
  if(autoStart){
    playBeep();
    if(SR && !isRecording){ try{ toggleRecording(); }catch(e){} }
  }
}
function cancelQuestionAudio(){
  if(window.speechSynthesis) try{ window.speechSynthesis.cancel(); }catch(e){}
  if(prepTimerId){ clearInterval(prepTimerId); prepTimerId=null; }
  state._prepActive = false;
}


/* ===== D-day (학생별 면접일 · 기기 간 동기화) ===== */
const DDAY_URL='https://script.google.com/macros/s/AKfycbz13PbCOXl3A-RcF-sPaFb1YTMpbqYALuBH5_0ITR3yUtbPJauXjQnnrCkZKUyvLmvv4w/exec';
function ddayKey(n){ return 'dday_'+(n||'').trim(); }
function getDday(n){ try{ return localStorage.getItem(ddayKey(n))||''; }catch(e){ return ''; } }
function setDdayLocal(n,v){ try{ if(v) localStorage.setItem(ddayKey(n),v); else localStorage.removeItem(ddayKey(n)); }catch(e){} }
function ddayDiff(v){
  const p=v.split('-').map(Number); if(p.length!==3||p.some(isNaN)) return null;
  const t=new Date(); const a=new Date(t.getFullYear(),t.getMonth(),t.getDate()); const b=new Date(p[0],p[1]-1,p[2]);
  return Math.round((b-a)/86400000);
}
function ddayText(d){ return d===0?'D-DAY':(d>0?'D-'+d:'D+'+(-d)); }
let ddayEditing=false, ddaySynced='', ddaySupported=null, ddayNote='';
async function ddayFetchServer(name){
  try{
    const ctrl=new AbortController(); const tm=setTimeout(()=>ctrl.abort(),7000);
    const r=await fetch(DDAY_URL+'?action=getDday&name='+encodeURIComponent(name.trim()),{signal:ctrl.signal}); clearTimeout(tm);
    const j=await r.json();
    if(j && j.supported===true){ ddaySupported=true; return String(j.date||''); }
  }catch(e){}
  ddaySupported=false; return null;
}
async function ddayPushServer(name,date){
  if(ddaySupported!==true) return false;
  try{
    await fetch(DDAY_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'setDday',name:name.trim(),date:date})});
    return true;
  }catch(e){ return false; }
}
function ddaySyncOnce(){
  const name=(state.name||'').trim(); if(!name||ddaySynced===name) return; ddaySynced=name;
  ddayFetchServer(name).then(async sd=>{
    if(sd===null){ ddayNote='이 기기에만 저장돼요'; updateDday(); return; }
    ddayNote='';
    const ld=getDday(name);
    if(sd){ if(sd!==ld) setDdayLocal(name,sd); }
    else if(ld){ await ddayPushServer(name,ld); }
    updateDday();
  });
}
function updateDday(){
  const old=document.getElementById('ddayBox'); if(old) old.remove();
  if(!['setup','quiz','feedback','result','mystats'].includes(screen)) return;
  if(!state.name) return;
  if(typeof hasStudentBank==='function' && !hasStudentBank(state.name)) return;
  ddaySyncOnce();
  const app=document.getElementById('app'); const v=getDday(state.name); const d=v?ddayDiff(v):null;
  const box=document.createElement('div'); box.id='ddayBox';
  if(d===null||ddayEditing){
    if(screen!=='setup' && d===null) return;

document.addEventListener('click',async function(e){
  const t=e.target; if(!t||!t.id) return;
  if(t.id==='ddayEdit'){ ddayEditing=true; updateDday(); }
  else if(t.id==='ddayCancel'){ ddayEditing=false; updateDday(); }
  else if(t.id==='ddaySave'){
    const v=(document.getElementById('ddayInput')||{}).value||''; if(!v){ alert('날짜를 선택해 주세요.'); return; }
    setDdayLocal(state.name,v); ddayEditing=false; updateDday();
    if(ddaySupported===null){ await ddayFetchServer(state.name); }
    await ddayPushServer(state.name,v);
    ddayNote=(ddaySupported===true)?'':'이 기기에만 저장돼요'; updateDday();
  }
});

async function attemptLogin(){
  const nameEl = document.getElementById('loginNameInput');
  const pwEl = document.getElementById('loginPwInput');
  const nm = (nameEl ? nameEl.value : '').trim();
  if(!nm){ await showAlert('이름을 입력해 주세요!'); return; }
  const cfg = await getLoginConfig();
  if(cfg.loginEnabled !== false){
    const pw = (pwEl ? pwEl.value : '').trim();
    if(!pw){ await showAlert('비밀번호를 입력해 주세요!'); return; }
    if(pw !== cfg.password){ await showAlert('비밀번호가 틀렸어요. 선생님께 다시 확인해 주세요!'); return; }
  }
  if(!hasStudentBank(nm)){ await showAlert('등록된 학생 이름이 아니에요. 선생님께 이름을 확인해 주세요!'); return; }
  applyBank(nm);
  state.name = nm;
  saveLastUsedName(nm);
  showLoadingModal('이전 기록을 확인하고 있어요...');
  serverResumeCache = await fetchServerResumeSnapshots(nm);
  hideLoadingModal();
  screen = 'setup';
  render();
}

/* ===================== PDF 오답노트 (소화/순환 퀴즈앱과 동일하게 검증된 방식) ===================== */
/* 모바일 대응(중요): pdf.save()의 자동(프로그램) 다운로드는 삼성 인터넷 등 일부
   모바일 브라우저에서 조용히 실패하는 경우가 있어요. 그래서 PDF가 준비되면
   학생/강사가 '직접 손가락으로 누르는' 진짜 링크 버튼을 보여주는 방식으로 처리해요.
   또한 캡처 대상은 화면 밖(-9999px)에 고정 너비(760px)로 별도로 만들어,
   모바일 좁은 화면 너비 때문에 글자가 과하게 커지는 문제를 피해요. */
let lastPdfBlobUrl=null;
let lastPdfFilename=null;
function showLoadingModal(msg){
  const ov=document.getElementById('modalOverlay');
  document.getElementById('modalMsg').innerHTML=msg;
  document.getElementById('modalBtns').innerHTML='';
  ov.classList.remove('hidden');
}
function hideLoadingModal(){
  document.getElementById('modalOverlay').classList.add('hidden');
}
function printWrongNote(name, wrongList){
  if(!wrongList.length){ showAlert('오답노트가 비어 있어요.'); return; }
  const itemsHtml = wrongList.map((w,i)=>{
    const q=QMAP[w.id];
    if(!q) return '';
    return `<div class="print-item">
      <div style="font-size:12.5px;font-weight:700;margin-bottom:4px;line-height:1.45;color:#0F5257;">${i+1}. [${q.cat}] ${q.q}</div>
      <div style="font-size:11px;color:#b3432b;">내 답변: ${escapeHtml(w.lastAnswer)||'(답변 없음)'} (${w.lastScore}점)</div>
      <div style="font-size:11px;color:#2f7d5b;font-weight:700;margin-top:3px;">모범 답안: ${q.a}</div>
    </div>`;
  }).join('');
  const area = document.getElementById('printArea');
  area.innerHTML = `
    <h1 style="font-size:18px;color:#0F5257;margin:0 0 4px;">${escapeHtml(name)}님의 오답노트</h1>
    <p style="font-size:11px;color:#6b7280;margin:0 0 14px;">학생별 모의면접 마스터 · GMS학원 이은정 강사 · ${new Date().toLocaleDateString('ko-KR')}</p>
    ${itemsHtml}
  `;
  area.classList.remove('hidden');
  const prevTitle = document.title;
  document.title = `${name}님의 오답노트`; // 인쇄 대화상자에서 "PDF로 저장" 시 이 이름이 파일명으로 제안됨
  // 모바일 브라우저는 클릭 이벤트 직후 동기적으로 호출해야 인쇄가 정상적으로 열림 (지연 호출 시 막히는 경우가 있음)
  window.print();
  document.title = prevTitle;
  area.classList.add('hidden');
  area.innerHTML='';
}
async function downloadWrongNotePDF(name, wrongList){
  if(!wrongList.length){ await showAlert('오답노트가 비어 있어요.'); return; }
  if(!window.html2canvas || !(window.jspdf && window.jspdf.jsPDF)){
    await showAlert('PDF 기능을 불러오는 중이에요. 인터넷 연결을 확인한 뒤 잠시 후 다시 시도해주세요.');
    return;
  }
  showLoadingModal('📄 PDF를 만들고 있어요...');
  const helper = document.createElement('div');

function buildWrongListFromSheetRows(rows){
  // 스킬 방식: 시간순(오래된→최신)으로 재생하면서
  // 틀리면 추가, 나중에 맞히면 제거 → "현재 시점 오답"만 남김
  const sorted = rows.slice().sort((a,b)=>{
    const ta = a.date ? new Date(a.date).getTime() : 0;
    const tb = b.date ? new Date(b.date).getTime() : 0;
    return ta - tb; // 오래된 것 먼저
  });
  const wrongMap = {};
  sorted.forEach(row=>{
    let records = [];
    try{ records = JSON.parse(row.records || '[]'); }catch(e){ records=[]; }
    records.forEach(r=>{
      if(!QMAP[r.id]) return;
      if(r.score < WRONG_THRESHOLD){
        wrongMap[r.id] = {id:r.id, lastAnswer:r.answer, lastScore:r.score};
      } else {
        // 나중에 맞혔으면 오답에서 제거 (스킬의 answers[qid]===true 처리와 동일)
        delete wrongMap[r.id];
      }
    });
  });
  return Object.values(wrongMap);
}
function buildWrongListForRowDate(rows, dateISO){
  // 제출 건별 기록의 특정 한 줄(세션)만 콕 집어서 그 세션의 오답만 모음
  const row = rows.find(r=>r.date===dateISO);
  if(!row) return [];
  let records = [];
  try{ records = JSON.parse(row.records || '[]'); }catch(e){ records=[]; }
  return records.filter(r=>r.score < WRONG_THRESHOLD && QMAP[r.id]).map(r=>({id:r.id, lastAnswer:r.answer, lastScore:r.score}));
}
function buildWrongListForDate(rows, dateKey){
  // 특정 날짜에 "완료된" 세션들에서만 오답을 모음 (그 날 제출한 것 기준)
  const map = {};
  rows.forEach(row=>{
    const dt = parseSheetDateTime(row.date);
    if(!dt || dt.toLocaleDateString('ko-KR')!==dateKey) return;
    if((row.modeLabel||'').includes('진행중')) return; // 완료된 저장만
    let records = [];
    try{ records = JSON.parse(row.records || '[]'); }catch(e){ records=[]; }
    records.forEach(r=>{
      if(r.score < WRONG_THRESHOLD && QMAP[r.id]){
        map[r.id] = {id:r.id, lastAnswer:r.answer, lastScore:r.score};
      }
    });
  });
  return Object.values(map);
}

// 스킬 방식: 시트에서 가져온 rows 중 "진행중"인 가장 최근 세션의 이어풀기 스냅샷 반환
function buildServerResumeFromRows(rows){
  // "진행중" 라벨을 신뢰하지 않고 판단함 — 라벨이 "완료"로 바뀐 채로도 실제로는
  // queueIds(원래 풀기로 한 문제 목록)보다 records(실제 답한 것)가 적어서 아직
  // 안 끝난 세션이 있었던 버그가 있었기 때문에, 라벨 대신 이 개수 비교로 이어풀기
  // 가능 여부를 판단함.
  const candidates = rows.filter(r=>{
    if(!r.queueIds || !r.queueIds.length) return false;
    let records = [];
    try{ records = JSON.parse(r.records || '[]'); }catch(e){ records=[]; }
    return records.length < r.queueIds.length;
  });
  if(!candidates.length) return null;
  // 가장 최근 것
  const sorted = candidates.slice().sort((a,b)=>{
    const ta = a.date ? new Date(a.date).getTime() : 0;
    const tb = b.date ? new Date(b.date).getTime() : 0;
    return tb - ta; // 최신 먼저
  });
  const latest = sorted[0];
  let records = [];
  try{ records = JSON.parse(latest.records || '[]'); }catch(e){ records=[]; }
  return {
    queueIds: latest.queueIds,
    records,
    modeLabel: (latest.modeLabel||'').replace(' (진행중)',''),
    savedAt: latest.date || '',
    ts: latest.date ? new Date(latest.date).getTime() : 0,
    sessionId: latest.sessionId || ''
  };
}
function buildApproxResumeFromRows(rows){
  // queueIds가 없는 옛날 기록(정확한 이어풀기가 불가능한 경우)이라도, records만 있으면
  // "어떤 카테고리를 풀고 있었는지 + 이미 푼 문제 id"는 알 수 있음 -> 이걸로
  // "비슷하게 이어가기"용 근사 스냅샷을 만듦. 정확한 이어풀기가 가능한 세션이 있으면 그게
  // 우선이므로, 이 함수는 buildServerResumeFromRows가 null을 반환했을 때만 호출됨.
  const candidates = rows.filter(r=>{
    if(r.queueIds && r.queueIds.length) return false;
    if(!(r.modeLabel||'').includes('진행중')) return false;
    let records = [];
    try{ records = JSON.parse(r.records || '[]'); }catch(e){ records=[]; }
    return records.length > 0;
  });
  if(!candidates.length) return null;
  const sorted = candidates.slice().sort((a,b)=>{
    const ta = a.date ? new Date(a.date).getTime() : 0;
    const tb = b.date ? new Date(b.date).getTime() : 0;
    return tb - ta;
  });
  const latest = sorted[0];
  let records = [];
  try{ records = JSON.parse(latest.records || '[]'); }catch(e){ records=[]; }
  const answeredIds = records.map(r=>r.id).filter(Boolean);
  const cats = [...new Set(records.map(r=>r.cat).filter(Boolean))];
  if(!cats.length) return null;
  return {
    approx: true,
    answeredIds,
    cats,
    modeLabel: (latest.modeLabel||'').replace(' (진행중)',''),
    savedAt: latest.date || '',
    ts: latest.date ? new Date(latest.date).getTime() : 0
  };
}
let sheetStudentsCache = null;
function parseSheetDateTime(v){
  // Code.gs가 날짜를 ISO 문자열, 타임스탬프(ms), 또는 구글시트 기본 표시형식
  // ("2026. 9. 4 오후 8:42:01") 중 무엇으로 주더라도 안전하게 Date로 변환
  if(v==null || v==='') return null;
  if(v instanceof Date) return isNaN(v.getTime())?null:v;
  if(typeof v==='number'){ const d=new Date(v); return isNaN(d.getTime())?null:d; }
  const s=String(v).trim();
  let d=new Date(s);
  if(!isNaN(d.getTime())) return d;
  const m=s.match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})\D*(오전|오후)?\D*(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if(m){
    let [,y,mo,da,ap,h,mi,se]=m;
    y=+y; mo=+mo-1; da=+da; h=+h; mi=+mi; se=se?+se:0;
    if(ap==='오후' && h<12) h+=12;
    if(ap==='오전' && h===12) h=0;
    d=new Date(y,mo,da,h,mi,se);
    if(!isNaN(d.getTime())) return d;
  }
  return null;
}

const TDASH_CHECKPOINT_KEY = 'tdash_checkpoint_'+APP_KEY;
function getTDashCheckpoint(){

function groupSessionsFromRows(rows){
  // Code.gs와 완전히 동일한 로직: 이름+모드별로 나눠서, 문항수가 실제로 줄어들 때만
  // 새 세션으로 봄 (라벨의 "진행중" 표시는 신뢰하지 않음 - 실제 데이터에 라벨이
  // 붙은 채로도 계속 이어지는 세션이 있었기 때문). 대시보드 목록과 학생 상세보기가
  // 항상 같은 숫자를 보여주도록, 두 화면 모두 이 함수 하나만 사용함.
  const byMode = {};
  rows.forEach(r=>{
    const baseMode = (r.modeLabel||'').replace(' (진행중)','').trim();
    if(!byMode[baseMode]) byMode[baseMode] = [];
    byMode[baseMode].push(r);
  });
  const sessions = [];
  Object.keys(byMode).forEach(mode=>{
    const entries = byMode[mode].slice().sort((a,b)=>{
      const ta = a.date ? new Date(a.date).getTime() : 0;
      const tb = b.date ? new Date(b.date).getTime() : 0;
      return ta - tb;
    });
    let prevTotalCount = -1, curGroup = null, curGroupDates = [];
    for(let e=0; e<=entries.length; e++){
      const row = e<entries.length ? entries[e] : null;
      const tc = row ? Number(row.totalCount||0) : 0;
      const isBoundary = (row===null) || (curGroup===null) || (tc < prevTotalCount);
      if(isBoundary && curGroup!==null){
        const dt = parseSheetDateTime(curGroup.date);
        sessions.push({
          date: curGroup.date, dt, ts: dt?dt.getTime():0,
          totalCount: Number(curGroup.totalCount||0),
          score: Number(curGroup.score||0),
          modeLabel: curGroup.modeLabel||'',
          isCompleted: (curGroup.modeLabel||'').indexOf('진행중')===-1,
          rowDates: curGroupDates
        });
        curGroupDates = [];
      }
      if(row===null) break;
      curGroup = row;
      curGroupDates.push(row.date);
      prevTotalCount = tc;
    }
  });
  return sessions.sort((a,b)=>b.ts-a.ts);
}
function buildDailyStatsFromSheetRows(rows){
  const sessions = groupSessionsFromRows(rows).filter(s=>s.isCompleted);
  const byDate = {};
  sessions.forEach(s=>{
    const key = s.dt ? s.dt.toLocaleDateString('ko-KR') : '날짜 미상';
    if(!byDate[key]) byDate[key] = {date:key, ts:s.ts, count:0, questionCount:0, weightedScoreSum:0};
    byDate[key].count++;
    byDate[key].questionCount += s.totalCount;
    byDate[key].weightedScoreSum += s.score * s.totalCount; // 문항 수로 가중 평균 (세션별 평균을 그냥 평균내면 안 됨)
  });
  return Object.values(byDate)
    .map(d=>({date:d.date, count:d.count, questionCount:d.questionCount, avg: d.questionCount ? Math.round(d.weightedScoreSum/d.questionCount) : 0}))
    .sort((a,b)=> (byDate[b.date]?byDate[b.date].ts:0) - (byDate[a.date]?byDate[a.date].ts:0));
}
function buildSessionLogFromSheetRows(rows){
  // 날짜별 집계가 아니라, 실제 세션 하나하나를 시간까지 그대로 보여주기 위한 목록.
  // 완료된 세션뿐 아니라 "진행중"(아직 안 끝난) 세션도 함께 보여줘야, 대시보드 목록의
  // "최근 제출일"에는 최신 날짜가 뜨는데 여기서는 아무 기록도 안 보이는 혼란이 없음.
  return groupSessionsFromRows(rows)
    .map(s=>({date:s.date, dt:s.dt, ts:s.ts, count:s.totalCount, score:s.score, modeLabel:s.modeLabel, rowDates:s.rowDates, isCompleted:s.isCompleted}));
}

        showSheetStudentDetail(nm, resultEl);

      const ok1 = await showConfirm(`'${nm}' 학생의 구글 시트 기록 ${rows.length}건을 정말 삭제할까요?\n이 작업은 되돌릴 수 없어요.`);

    resultEl.innerHTML = `<p class="small-note">⚠️ 검색에 실패했어요. 인터넷 연결을 확인해주세요.</p>`;

function bindEvents(){
  if(screen==='login'){
    document.getElementById('loginBtn').onclick=()=>attemptLogin();

    if(loginNameInput) loginNameInput.onkeydown=(e)=>{ if(e.key==='Enter') attemptLogin(); };
    const loginPwInput=document.getElementById('loginPwInput');
    if(loginPwInput) loginPwInput.onkeydown=(e)=>{ if(e.key==='Enter') attemptLogin(); };
  }
  else if(screen==='setup'){
    const nameEl=document.getElementById('nameInput'); // 로그인 후엔 없음(읽기 전용)
    if(nameEl){
      nameEl.oninput=(e)=>{ state.name=e.target.value; };
      nameEl.onblur=()=>{ saveLastUsedName(state.name.trim()); render(); };
    }
    document.querySelectorAll('.chip').forEach(c=>{
      c.onclick=()=>{
        if(c.dataset.cat){
          const cat=c.dataset.cat;
          if(state.cats.includes(cat)){
            if(state.cats.length>1) state.cats=state.cats.filter(x=>x!==cat);
          } else state.cats.push(cat);
        } else if(c.dataset.grade){
          const g=c.dataset.grade;
          if(state.grades.includes(g)){
            if(state.grades.length>1) state.grades=state.grades.filter(x=>x!==g);
          } else state.grades.push(g);
        }
        render();
      };
    });
    document.querySelectorAll('.opt-chip').forEach(c=>{
      c.onclick=()=>{ state.count=parseInt(c.dataset.count); render(); };
    });
    document.querySelectorAll('.mode-card').forEach(m=>{
      m.onclick=()=>{
        if(m.dataset.mode==='wrong' && !state.name.trim()){ return; }
        if(m.dataset.mode==='cumwrong' && !state.name.trim()){ return; }
        state.mode=m.dataset.mode; render();
      };
    });
    document.getElementById('shuffleChk').onchange=(e)=>{ state.shuffle=e.target.checked; };
    document.getElementById('startBtn').onclick=async()=>{
      if(nameEl) state.name=nameEl.value.trim(); // 로그인 후에는 nameInput이 없으므로 기존 state.name(로그인 시 입력한 이름)을 그대로 사용
      if(!state.name){ await showAlert('이름을 먼저 입력해주세요!'); return; }
      saveLastUsedName(state.name);
      const startBtn=document.getElementById('startBtn');
      if(state.mode==='wrong'||state.mode==='cumwrong'){ startBtn.disabled=true; startBtn.textContent='🔍 다른 기기 기록도 확인하는 중...'; }
      await startInterview();
      if(startBtn){ startBtn.disabled=false; startBtn.textContent='🎓 면접 시작하기'; }
    };
    document.getElementById('micTestBtn').onclick=()=>testMic();
    document.getElementById('myStatsBtn').onclick=()=>{ screen='mystats'; render(); };
    document.getElementById('teacherBtn').onclick=()=>{ screen='tlogin'; render(); };

          ? pickNewerSnapshot(getStudent(state.name).inProgressWrong||null, serverResumeCache&&serverResumeCache.wrong)
          : pickNewerSnapshot(getStudent(state.name).inProgress||null, serverResumeCache&&serverResumeCache.normal);

      };
    });
    document.querySelectorAll('.discardResumeBtn').forEach(btn=>{
      btn.onclick=async()=>{
        const group = btn.dataset.group;

async function startInterview(){
  let pool;
  let modeLabel='부분 학습';
  if(state.mode==='wrong'){
    showLoadingModal('오답 기록을 불러오고 있어요...');
    const {ok, sessions} = await fetchStudentSessions(state.name);
    hideLoadingModal();
    let wrongIds = new Set(Object.keys((getStudent(state.name).wrong)||{}));
    if(ok && sessions && sessions.length > 0){
      // 스킬 방식: 시간순으로 재생해서 "마지막 기록이 오답인 것만" 추출 (다기기 정확 처리)
      const byTimeAsc = sessions.slice().sort((a,b)=>(a.ts||0)-(b.ts||0));
      const wrongMap = {};
      byTimeAsc.forEach(s=>{
        // records 배열에서 점수 기반으로 추출
        if(s.records){ try{
          const recs = typeof s.records==='string' ? JSON.parse(s.records) : s.records;
          recs.forEach(r=>{ if(r.score < WRONG_THRESHOLD && QMAP[r.id]) wrongMap[r.id]=r.id; else if(r.score >= WRONG_THRESHOLD) delete wrongMap[r.id]; });
        }catch(e){} }
        // wrongIds 배열에서도 추출
        const wrongArr = s.wrongIds ? (typeof s.wrongIds==='string' ? s.wrongIds.split(',').map(x=>x.trim()) : s.wrongIds) : [];
        wrongArr.forEach(id=>{ if(id && QMAP[id]) wrongMap[id]=id; });
      });
      wrongIds = new Set(Object.keys(wrongMap));
    }
    pool = QUESTIONS.filter(q=>wrongIds.has(q.id));
    if(!pool.length){
      await showAlert('풀 수 있는 오답 문제가 없어요.\n다른 기기에서도 아직 오답 기록이 없거나, 인터넷 연결을 확인해주세요.');
      return;
    }
    modeLabel='오답 모드';
  } else if(state.mode==='cumwrong'){
    showLoadingModal('누적 오답 기록을 불러오고 있어요...');
    const {ok, sessions} = await fetchStudentSessions(state.name);
    hideLoadingModal();
    let everWrongIds = new Set(Object.keys((getStudent(state.name).everWrong)||{}));
    if(ok && sessions && sessions.length > 0){
      // 누적: 한 번이라도 틀렸으면 계속 포함
      sessions.forEach(s=>{
        if(s.records){ try{
          const recs = typeof s.records==='string' ? JSON.parse(s.records) : s.records;
          recs.forEach(r=>{ if(r.score < WRONG_THRESHOLD && QMAP[r.id]) everWrongIds.add(r.id); });
        }catch(e){} }
        const wrongArr = s.wrongIds ? (typeof s.wrongIds==='string' ? s.wrongIds.split(',').map(x=>x.trim()) : s.wrongIds) : [];
        wrongArr.forEach(id=>{ if(id && QMAP[id]) everWrongIds.add(id); });
      });
    }
    pool = QUESTIONS.filter(q=>everWrongIds.has(q.id));
    if(!pool.length){
      await showAlert('누적 오답 문제가 없어요.\n아직 오답 기록이 없거나, 인터넷 연결을 확인해주세요.');
      return;
    }
    modeLabel='누적 오답 모드';
  } else if(state.mode==='all'){
    pool = BASIC_QUESTIONS.slice();
    modeLabel='전체 모드';
  } else if(state.mode==='advanced'){
    pool = ADV_POOL.filter(q=>state.cats.includes(q.cat) && state.grades.includes(q.grade));
    modeLabel='응용 모드(상)';
  } else if(state.mode==='random'){
    pool = QUESTIONS.filter(q=>state.cats.includes(q.cat) && state.grades.includes(q.grade));
    modeLabel='랜덤 모드';
  } else if(state.mode==='top'){
    // 최상위문제: 본문제+꼬리질문 "쌍" 단위로만 다루고, 쌍은 절대 떨어지지 않게 함
    // (셔플을 켜도 쌍의 순서 안(본문제→꼬리질문)은 항상 유지되도록 여기서 쌍째로 섞음)
    const pairsForPool = state.shuffle ? shuffleArr(TOP_PAIRS.slice()) : TOP_PAIRS.slice();
    pool = pairsForPool.flatMap(p=>[p.main, p.follow]);
    modeLabel='최상위문제';
  } else if(state.mode==='extra'){
    // 추가문제: 최상위문제와 동일한 방식(쌍 단위 유지)으로 다루되, 별도 풀(EXTRA_PAIRS)에서 출제
    const pairsForPool = state.shuffle ? shuffleArr(EXTRA_PAIRS.slice()) : EXTRA_PAIRS.slice();
    pool = pairsForPool.flatMap(p=>[p.main, p.follow]);
    modeLabel='추가문제';
  } else {
    pool = BASIC_QUESTIONS.filter(q=>state.cats.includes(q.cat) && state.grades.includes(q.grade));
  }
  if(state.shuffle && state.mode!=='top' && state.mode!=='extra') pool = shuffleArr(pool); // top/extra는 위에서 쌍 단위로 이미 섞었으므로 여기서 또 섞지 않음(개별 섞으면 쌍이 떨어짐)
  if((state.mode==='category'||state.mode==='advanced'||state.mode==='random') && state.count!==999) pool = pool.slice(0, Math.min(state.count, pool.length));
  if(!pool.length){ await showAlert('풀 수 있는 문제가 없어요.'); return; }
  state.queue = pool;
  state.idx = 0;
  state.records = [];
  state.answerText='';
  state._modeLabel = modeLabel;
  state.sessionId = genSessionId(); // 이 세션 전용 id - 서버에 저장할 때 매번 새 줄이 아니라 이 id의 줄 하나만 계속 갱신
  recFinalBase='';
  screen='quiz';
  render();
}

async function submitAnswer(){
  const q = state.queue[state.idx];
  const rawText = state.answerText;

  // AI 채점 중 로딩 상태 표시
  const submitBtn=document.getElementById('submitBtn');
  const clearBtn=document.getElementById('clearBtn');
  const skipBtn=document.getElementById('skipBtn');
  if(submitBtn){ submitBtn.disabled=true; submitBtn.textContent='🤖 AI가 의미를 파악해서 채점하고 있어요...'; }
  if(clearBtn) clearBtn.disabled=true;
  if(skipBtn) skipBtn.style.pointerEvents='none';

  let fb = await aiGradeAnswer(q, rawText);
  if(!fb){
    fb = scoreAnswer(q, rawText);
    // 키워드 채점은 이미 기본 50점이 깔려 있어서 boostScore 미적용
  } else {
    fb.score = boostScore(fb.score); // AI 채점 결과만 boostScore 적용
  }
  if(state._timedOut){ fb.timedOut=true; state._timedOut=false; }

  // 점수 구간별 트랙 분기 (꼬리질문)
  const isAdvancedQ = q.level==='advanced';
  fb.followUpQuestion = null;
  fb.passMsg = null;
  if(fb.score>=100){
    fb.passMsg = isAdvancedQ
      ? '🎉 완벽해요! 이 응용 문제까지 확실히 이해했어요.'
      : '🎉 완벽해요! 심화 질문으로 넘어갈 준비가 되었구나!';
  } else if(fb.score>=50){
    if(submitBtn) submitBtn.textContent='🤖 꼬리질문을 준비하고 있어요...';
    const trackType = isAdvancedQ ? 'advanced-probe' : 'basic-fill';
    fb.followUpQuestion = await generateFollowUp(q, rawText, fb.score, trackType);
  }
  // score<50인 경우: 꼬리질문 없이 바로 오답 처리 (모범답안·놓친 개념은 기존 피드백 화면에 이미 표시됨)

  state._followUpAnswerText='';
  state._followUpAnswered=false;
  state._followUpComment=null;

  state.feedback = fb;
  state.records.push({id:q.id, q:q.q, cat:q.cat, score:fb.score, answer:rawText});

  // 학생별 오답노트 업데이트
  const s = getStudent(state.name);
  if(fb.score < WRONG_THRESHOLD){
    s.wrong[q.id] = {lastScore:fb.score, lastAnswer:rawText, date:fmtDT(Date.now())};
    s.everWrong[q.id] = {lastScore:fb.score, lastAnswer:rawText, date:fmtDT(Date.now())}; // 누적 오답: 나중에 맞혀도 삭제하지 않음
  } else {
    if(s.wrong[q.id]) delete s.wrong[q.id];
  }
  // 진행 상황 자동 저장: 스킬 방식 - 일반/오답 모드를 별도 슬롯에 저장
  const isWrongMode = state.mode==='wrong'||state.mode==='cumwrong';
  const snapSlot = isWrongMode ? 'inProgressWrong' : 'inProgress';
  if(state.records.length < state.queue.length){
    const snap = {
      queueIds: state.queue.map(x=>x.id),
      records: state.records.slice(),
      modeLabel: state._modeLabel || '',
      savedAt: fmtDT(Date.now()),
      ts: Date.now(),
      sessionId: state.sessionId
    };
    s[snapSlot] = snap;
    // 서버 캐시도 업데이트 (같은 기기의 다른 탭에서 바로 반영)
    if(serverResumeCache) serverResumeCache[isWrongMode?'wrong':'normal'] = snap;
  } else {
    delete s[snapSlot];
    if(serverResumeCache) serverResumeCache[isWrongMode?'wrong':'normal'] = null;
  }
  setStudent(state.name, s);

  // 문제 하나 풀 때마다 바로 구글 시트에 누적 전송 (중간에 그만둬도 지금까지 기록은 남도록)
  const wrongIdsSoFar = state.records.filter(r=>r.score<WRONG_THRESHOLD).map(r=>r.id);
  const avgSoFar = Math.round(state.records.reduce((sum,r)=>sum+r.score,0)/state.records.length);
  const isInProgress = state.records.length < state.queue.length;
  submitToSheet({
    name: state.name,
    modeLabel: (state._modeLabel||'') + (isInProgress? ' (진행중)':''),
    score: avgSoFar,
    totalCount: state.records.length,
    wrongIds: wrongIdsSoFar,
    records: state.records,
    // 이어풀기를 위해 전체 문제 목록과 현재 진행 인덱스도 함께 저장
    queueIds: isInProgress ? state.queue.map(x=>x.id) : [],
    resumeIdx: isInProgress ? state.records.length : -1,
    sessionId: state.sessionId
  });

  screen='feedback';
  render();
}

function getInProgress(name){
  if(!name || !name.trim()) return null;
  // 로컬 스냅샷
  const s = getStudent(name);
  const localSnap = (()=>{
    const ip = s.inProgress;
    if(!ip || !ip.queueIds || !ip.queueIds.length) return null;
    if((ip.records||[]).length >= ip.queueIds.length) return null;
    return ip;
  })();
  // 서버 스냅샷 (로그인 시 캐싱된 것)
  const serverSnap = serverResumeCache && serverResumeCache.normal;
  // 스킬 방식: 더 최신 것을 선택
  return pickNewerSnapshot(localSnap, serverSnap);
}
function resumeInterview(snap){
  // snap이 없으면 getInProgress로 가져옴
  const ip = snap || getInProgress(state.name);
  if(!ip || !ip.queueIds || !ip.queueIds.length){ showAlert('이어서 풀 수 있는 면접이 없어요.'); return; }
  // 위치(인덱스)가 아니라 문제 id를 기준으로 재구성해요.
  // 앞으로 이 html 파일을 수정/재배포하더라도(질문이 추가되거나 순서가 바뀌어도)
  // 기존 문제 id만 그대로 유지되면 "이미 푼 문제"와 "안 푼 문제"를 정확히 구분해서
  // 이어풀기를 계속할 수 있어요. (기존 id를 삭제·변경하면 그 문제만 이어풀기에서 빠져요.)
  const answeredIds = new Set((ip.records||[]).map(r=>r.id));
  const origQueue = ip.queueIds.map(id=>QMAP[id]).filter(Boolean);
  if(!origQueue.length){ showAlert('이어서 풀 수 있는 면접이 없어요. 문제 목록이 바뀐 것 같아요.'); return; }
  const answeredQuestions = origQueue.filter(q=>answeredIds.has(q.id));
  const remainingQuestions = origQueue.filter(q=>!answeredIds.has(q.id));
  if(!remainingQuestions.length){ showAlert('이어서 풀 수 있는 면접이 없어요. 이미 다 푼 것 같아요.'); return; }
  state.queue = answeredQuestions.concat(remainingQuestions);
  state.records = (ip.records||[]).filter(r=>QMAP[r.id]); // 사라진 문제의 기록은 제외
  state.idx = Math.min(state.records.length, state.queue.length-1);
  state.answerText='';
  state._modeLabel = (ip.modeLabel||'이어서 풀기');
  // 기존 세션과 같은 sessionId를 이어서 써야, 앞으로 저장할 때 새 줄이 아니라
  // 그 세션의 줄 하나만 계속 갱신돼요. (옛날 기록처럼 sessionId가 없으면 새로 발급)
  state.sessionId = ip.sessionId || genSessionId();
  recFinalBase='';
  lastTTSQuestionId = null;
  screen='quiz';
  render();
}
function resumeApprox(snap){
  // 정확한 이어풀기가 불가능한 옛날 기록용 근사 버전:
  // 이미 풀었던 문제 id는 빼고, 같은 카테고리에서 새 문제들로 이어감(정확한 위치 복원은 아님)
  if(!snap || !snap.cats || !snap.cats.length){ showAlert('비슷하게 이어갈 수 있는 기록이 없어요.'); return; }
  const excludeIds = new Set(snap.answeredIds||[]);
  const pool = QUESTIONS.filter(q => snap.cats.includes(q.cat) && !excludeIds.has(q.id));
  if(!pool.length){ showAlert('이 카테고리에서 아직 안 푼 새 문제가 없어요.'); return; }
  const shuffled = pool.slice().sort(()=>Math.random()-0.5);
  const count = Math.min(shuffled.length, 10); // 원래 몇 문제였는지는 알 수 없어서 기본 10문제로 시작
  state.queue = shuffled.slice(0, count);
  state.idx = 0;
  state.records = [];
  state.answerText='';
  state._modeLabel = (snap.modeLabel||'부분 학습') + ' (비슷하게 이어감)';
  state.sessionId = genSessionId();
  recFinalBase='';
  lastTTSQuestionId = null;
  screen='quiz';
  render();
}
function discardProgress(name){
  const s = getStudent(name);
  delete s.inProgress;
  setStudent(name, s);
  // 서버 캐시도 초기화
  if(serverResumeCache) serverResumeCache.normal = null;
}

function buildAllQHTML(){
  const cats = ["과학","수학","자소서","독서·인성"];
  const grade_order = ['중1','중2','중3'];
  let html = '';
  grade_order.forEach(grade=>{
    cats.forEach(cat=>{
      const qs = QUESTIONS.filter(q=>q.grade===grade && q.cat===cat);
      if(!qs.length) return;
      html += `<div style="font-size:13px;font-weight:800;color:#0F5257;margin:14px 0 6px;border-bottom:1px solid #ccc;padding-bottom:3px;">${grade} · ${cat}</div>`;
      qs.forEach((q,i)=>{
        const isAdv = q.level==='advanced';
        html += `<div style="border:1px solid #ddd;border-radius:5px;padding:8px 10px;margin-bottom:6px;${isAdv?'background:#fffbe6;':''}break-inside:avoid;page-break-inside:avoid;">
          <div style="font-size:11.5px;font-weight:700;color:#0F5257;margin-bottom:3px;">${isAdv?'⭐ ':''}${q.q}</div>
          <div style="font-size:10.5px;color:#2f7d5b;"><b>모범답안:</b> ${q.a}</div>
        </div>`;
      });
    });
  });
  if(TOP_PAIRS.length){

}

async function downloadAllQuestionsPDF(){
  if(!window.html2canvas || !(window.jspdf && window.jspdf.jsPDF)){

    let imgH = canvas.height*usableW/canvas.width;
    pdf.addImage(canvas.toDataURL('image/jpeg',0.9),'JPEG',margin,y,usableW,imgH);
    y += imgH+4;
    // 문항별
    const cats = ["과학","수학","자소서","독서·인성"];
    const grade_order = ['중1','중2','중3'];
    let qNum = 0;
    for(const grade of grade_order){
      for(const cat of cats){
        const qs = QUESTIONS.filter(q=>q.grade===grade && q.cat===cat);
        if(!qs.length) continue;
        // 섹션 헤더
        helper.innerHTML=`<div style="font-size:12px;font-weight:800;color:#0F5257;border-bottom:1px solid #ccc;padding-bottom:2px;">${grade} · ${cat}</div>`;
        canvas = await html2canvas(helper,{scale:2,backgroundColor:'#fff',windowWidth:700});
        imgH = canvas.height*usableW/canvas.width;
        if(y+imgH > pageH-margin){ pdf.addPage(); y=margin; }
        pdf.addImage(canvas.toDataURL('image/jpeg',0.9),'JPEG',margin,y,usableW,imgH);
        y+=imgH+2;
        for(const q of qs){
          qNum++;
          const isAdv = q.level==='advanced';
          helper.innerHTML=`<div style="border:1px solid #ddd;border-radius:5px;padding:7px 9px;background:${isAdv?'#fffbe6':'#fff'};">
            <div style="font-size:11px;font-weight:700;color:#0F5257;margin-bottom:2px;">${isAdv?'⭐ ':''}${q.q}</div>
            <div style="font-size:10px;color:#2f7d5b;"><b>모범답안:</b> ${q.a}</div>
          </div>`;

          imgH = canvas.height*usableW/canvas.width;
          if(y+imgH > pageH-margin){ pdf.addPage(); y=margin; }

          y+=imgH+3;

      }
    }
    // 최상위문제(꼬리 질문 포함) 섹션 — 본문제와 꼬리질문을 쌍으로 붙여서 표시

      y+=imgH+2;
      for(const pair of TOP_PAIRS){

          qNum++;
          const isFollow = q.id.endsWith('F');
          helper.innerHTML=`<div style="border:1px solid #e6c869;border-radius:5px;padding:7px 9px;background:${isFollow?'#fffdf0':'#fff'};">
            <div style="font-size:11px;font-weight:700;color:#0F5257;margin-bottom:2px;">${isFollow?'↳ (꼬리질문) ':''}${q.q}</div>
            <div style="font-size:10px;color:#2f7d5b;"><b>모범답안:</b> ${q.a}</div>
          </div>`;

          if(y+imgH > pageH-margin){ pdf.addPage(); y=margin; }
