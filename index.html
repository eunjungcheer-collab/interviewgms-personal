 작으면 뜸","a":["물보다","작으면"]},{"l":"온도↑ 부피↑ 밀도↓","a":["온도↑","부피↑","밀도↓"]}]},{"id":"kj_S7","cat":"과학","grade":"중3","q":"멘델의 유전 법칙에 대해 답하세요. (1) 멘델의 유전 법칙 세 가지를 설명하세요. (2) 우열의 원리를 완두의 형질을 예로 들어 설명하세요. (3) 분리의 법칙이 무엇인지 설명하세요. (4) 독립의 법칙을 설명하고, 모든 유전자에 독립의 법칙이 적용되는지 말하세요.","a":"(1) 우열의 원리, 분리의 법칙, 독립의 법칙입니다. (2) 대립 형질이 다른 순종끼리 교배하면 잡종 1대에는 한 가지 형질(우성)만 나타납니다. 예를 들어 둥근 완두(RR)와 주름진 완두(rr)를 교배하면 1대는 모두 둥근 완두(Rr)이고, 나타나지 않는 주름진 형질이 열성입니다. (3) 생식세포가 만들어질 때 쌍으로 있던 대립 유전자가 분리되어 서로 다른 생식세포로 들어가는 것입니다. Rr은 R와 r를 가진 생식세포가 1:1로 만들어지고, 잡종 2대에서 둥근 것 : 주름진 것이 약 3 : 1로 나옵니다. (4) 두 쌍 이상의 대립 형질이 함께 유전될 때 각 형질이 서로 영향을 주지 않고 독립적으로 유전되는 것입니다. 둥글고 노란 완두(RRYY)와 주름지고 초록인 완두(rryy)를 교배한 2대에서 둥글고 노란 것 : 둥글고 초록 : 주름지고 노란 것 : 주름지고 초록 = 9 : 3 : 3 : 1입니다. 모든 유전자에 적용되지는 않습니다. 같은 염색체 위에 가까이 있는 유전자는 함께 유전되는 경우가 있어서 독립의 법칙을 따르지 않고, 서로 다른 염색체에 있는 유전자에서 성립합니다.","kw":[{"l":"우열·분리·독립","a":["우열·분리·독립","우열","분리","독립"]},{"l":"RR×rr → Rr","a":["RR×rr","Rr"]},{"l":"3:1","a":["3:1"]},{"l":"9:3:3:1","a":["9:3:3:1"]},{"l":"같은 염색체의 유전자는 독립 아님","a":["염색체의","유전자는","같은"]}]},{"id":"kj_S8","cat":"과학","grade":"중3","q":"지구형 행성과 목성형 행성을 비교하세요. (1) 지구형 행성에 해당하는 행성을 모두 쓰세요. (2) 목성형 행성에 해당하는 행성을 모두 쓰세요. (3) 크기, 질량, 평균 밀도, 주요 구성 물질, 위성 수, 고리의 존재, 태양과의 거리 측면에서 두 행성군을 비교하세요. (4) 평균 밀도에 차이가 나타나는 이유를 설명하세요.","a":"(1) 수성, 금성, 지구, 화성입니다. (2) 목성, 토성, 천왕성, 해왕성입니다. (3) 크기와 질량은 지구형이 작고 목성형이 큽니다(목성의 지름은 지구의 약 11배, 질량은 약 318배). 평균 밀도는 지구형이 약 3.9~5.5 g/cm³로 크고 목성형이 약 0.7~1.6 g/cm³로 작습니다. 주요 구성 물질은 지구형은 암석과 금속(철 등), 목성형은 수소와 헬륨 같은 기체이고, 천왕성과 해왕성은 얼음 성분의 비중이 큽니다. 위성 수는 지구형이 적거나 없고(수성·금성 0개, 지구 1개, 화성 2개) 목성형은 많습니다. 고리는 지구형에는 없고 목성형에는 모두 있습니다(토성이 가장 뚜렷). 태양과의 거리는 지구형이 가깝고 목성형이 멉니다. (4) 지구형은 단단한 암석과 금속으로 이루어져 밀도가 크고, 목성형은 부피가 크지만 가벼운 수소와 헬륨이 대부분이라 밀도가 작기 때문입니다.","kw":[{"l":"수금지화 / 목토천해","a":["수금지화","목토천해"]},{"l":"지구형: 작고 밀도 큼, 암석·금속, 위성 적음, 고리 없음","a":["지구형","작고","밀도"]},{"l":"목성형: 크고 밀도 작음, 기체, 위성 많음, 고리 있음","a":["목성형","크고","밀도"]}]},{"id":"kj_S9","cat":"과학","grade":"중3","q":"산화와 환원에 대해 답하세요. (1) 산화 반응과 환원 반응을 설명하세요. (2) 전자의 이동을 기준으로 산화와 환원을 설명하세요. (3) 산소의 이동을 기준으로, 구리와 산소의 반응, 산화 구리와 탄소의 반응에서 산화되는 물질과 환원되는 물질을 말하세요.","a":"(1) 어떤 물질이 산소를 얻는 반응이 산화이고 산소를 잃는 반응이 환원입니다. 산화와 환원은 항상 동시에 일어납니다. (2) 전자를 잃는 반응이 산화, 전자를 얻는 반응이 환원입니다. 예를 들어 Zn → Zn²⁺ + 2e⁻는 산화이고 Cu²⁺ + 2e⁻ → Cu는 환원입니다. (3) 구리를 가열하면 2Cu + O₂ → 2CuO로 구리가 산소를 얻어 산화됩니다. 산화 구리와 탄소를 가열하면 2CuO + C → 2Cu + CO₂로 산화 구리는 산소를 잃어 환원되고 탄소는 산소를 얻어 산화됩니다. 이때 산화되는 물질은 다른 물질을 환원시키는 환원제, 환원되는 물질은 산화제 역할을 합니다.","kw":[{"l":"산소 얻음=산화","a":["산소 얻음=산화","산소","얻음","산화"]},{"l":"산소 잃음=환원","a":["산소 잃음=환원","산소","잃음","환원"]},{"l":"전자 잃음=산화","a":["전자 잃음=산화","전자","잃음","산화"]},{"l":"동시에 일어남","a":["동시에 일어남","동시에","일어남"]},{"l":"2CuO + C → 2Cu + CO₂","a":["2CuO","2Cu","CO₂"]}]},{"id":"kj_S10","cat":"과학","grade":"중3","q":"소화와 배설에 대해 답하세요. (1) 소화계를 구성하는 기관을 순서대로 쓰세요. (2) 배설계를 구성하는 기관과 오줌이 만들어져 나가는 경로를 설명하세요. (3) 소화 효소가 잘 작용하는 조건을 말하세요.","a":"(1) 소화관은 입 → 식도 → 위 → 소장 → 대장 → 항문이고, 소화액을 만드는 소화샘으로 침샘, 간, 쓸개, 이자가 있습니다. 소장에서 영양소가 가장 많이 흡수되며 융털이 표면적을 넓힙니다. (2) 콩팥에서 혈액을 걸러 오줌을 만들고(여과, 재흡수, 분비), 오줌관을 지나 방광에 모였다가 요도로 나갑니다. 노폐물 중 이산화 탄소는 호흡계로, 물·요소·무기염류는 오줌과 땀으로 나갑니다. (3) 소화 효소는 온도와 pH의 영향을 받습니다. 체온 정도(약 37℃)에서 가장 활발하고 온도가 너무 높으면 효소가 변성되어 작용하지 못합니다. 효소마다 잘 작용하는 최적 pH가 달라서 침 속 아밀레이스는 중성, 위의 펩신은 강한 산성, 이자액의 효소는 약한 알칼리성에서 잘 작용합니다. 기질의 농도와 효소의 양도 반응 속도에 영향을 줍니다.","kw":[{"l":"입-식도-위-소장-대장-항문","a":["입-식도-위-소장-대장-항문"]},{"l":"간·쓸개·이자·침샘","a":["쓸개","이자","침샘"]},{"l":"콩팥-오줌관-방광-요도","a":["콩팥-오줌관-방광-요도"]},{"l":"효소 조건: 온도(37℃), pH(효소마다 다름), 기질 농도","a":["효소마다","37℃","효소"]}]},{"id":"kj_S11","cat":"과학","grade":"중3","q":"식물의 광합성과 호흡에 대해 답하세요. (1) 광합성의 재료, 장소, 생성물을 말하세요. (2) 호흡과 비교하면 어떤 차이가 있나요? (3) 광합성량에 영향을 주는 요인을 말하세요. (4) 증산 작용이 무엇이고 기공은 어떤 구조인가요?","a":"(1) 광합성은 이산화 탄소와 물을 재료로 빛에너지를 이용해 엽록체에서 포도당(양분)과 산소를 만드는 과정입니다(6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂). (2) 호흡은 세포에서 포도당을 산소로 분해해 이산화 탄소와 물을 내놓으며 에너지를 얻는 과정입니다. 광합성은 빛이 있을 때(주로 낮) 일어나고, 호흡은 낮과 밤 모두 일어납니다. (3) 빛의 세기, 이산화 탄소의 농도, 온도입니다. 빛이 세어질수록 증가하다가 어느 정도부터 더 늘지 않습니다. (4) 증산 작용은 잎의 기공을 통해 물이 수증기로 나가는 것입니다. 기공은 두 개의 공변세포가 둘러싼 틈으로 기체 교환과 증산이 일어납니다. 증산은 물을 위로 끌어올리는 힘이 되고 잎의 온도를 낮춥니다.","kw":[{"l":"CO₂+H₂O → 포도당+O₂ (엽록체, 빛)","a":["CO₂","H₂O","포도당"]},{"l":"호흡: 낮밤 모두","a":["호흡","낮밤","모두"]},{"l":"빛·CO₂·온도","a":["빛·CO₂·온도","CO₂","온도"]},{"l":"기공(공변세포)·증산","a":["공변세포","기공","증산"]}]},{"id":"kj_S12","cat":"과학","grade":"중3","q":"기체에 대해 답하세요. (1) 기체의 압력이 생기는 까닭을 입자 운동으로 설명하세요. (2) 보일 법칙을 말하고, 2기압에서 3 L인 기체의 압력이 3기압이 되면 부피가 얼마가 되는지 구하세요. (3) 샤를 법칙을 설명하세요.","a":"(1) 기체 입자는 끊임없이 움직이며 용기 벽에 충돌하고, 이 충돌이 벽에 가하는 힘이 압력입니다. 입자 수가 많거나 온도가 높으면 충돌이 잦고 세져서 압력이 커집니다. (2) 보일 법칙은 온도가 일정할 때 기체의 부피는 압력에 반비례한다는 법칙으로 압력 × 부피가 일정합니다. 2 × 3 = 3 × V에서 V = 2 L입니다. (3) 샤를 법칙은 압력이 일정할 때 기체의 부피가 절대 온도에 비례한다는 법칙입니다. 온도가 올라가면 입자가 빨라져 같은 압력을 유지하려고 부피가 커집니다. 절대 온도(K)는 섭씨 온도에 273을 더한 값입니다.","kw":[{"l":"압력 = 입자 충돌","a":["압력","입자","충돌"]},{"l":"보일: PV 일정 → 2L","a":["보일","PV","일정"]},{"l":"샤를: V ∝ T(K)","a":["샤를"]},{"l":"K = ℃ + 273","a":["273"]}]},{"id":"kj_S13","cat":"과학","grade":"중3","q":"물질의 상태 변화에 대해 답하세요. (1) 고체, 액체, 기체의 입자 배열과 운동을 비교하세요. (2) 얼음을 가열할 때 온도가 일정한 구간이 있는 이유를 설명하세요. (3) 융해, 응고, 기화, 액화, 승화가 무엇인지 말하고 열의 출입을 구분하세요.","a":"(1) 고체는 입자가 규칙적으로 배열되어 제자리에서 진동하고, 액체는 입자가 비교적 가까이 있지만 자리를 바꾸며 움직이고, 기체는 입자 사이가 매우 멀고 자유롭게 움직입니다. (2) 얼음이 녹는 동안(0℃)과 물이 끓는 동안(100℃)에는 가해 준 열이 온도를 올리는 데 쓰이지 않고 입자 사이의 거리를 변화시키는 상태 변화에 쓰이므로 온도가 일정합니다. (3) 고체가 액체로 변하는 것이 융해, 액체가 고체로 변하는 것이 응고, 액체가 기체로 변하는 것이 기화, 기체가 액체로 변하는 것이 액화이고, 고체가 기체로(또는 반대로) 곧바로 변하는 것이 승화입니다. 융해, 기화, 승화(고체 → 기체)는 열을 흡수하고, 응고, 액화는 열을 방출합니다. 상태가 변해도 질량은 변하지 않고 입자 수는 같으며, 부피는 변할 수 있습니다.","kw":[{"l":"고체 규칙·진동 / 액체 자리 바꿈 / 기체 자유","a":["고체","규칙","진동"]},{"l":"상태 변화 중 온도 일정","a":["상태","변화","온도"]},{"l":"융해·기화 흡열, 응고·액화 방열","a":["융해","기화","흡열"]},{"l":"질량 불변","a":["질량 불변","질량","불변"]}]},{"id":"kj_S14","cat":"과학","grade":"중3","q":"화학 반응의 법칙에 대해 답하세요. (1) 질량 보존 법칙을 설명하고 밀폐된 용기에서만 성립하는 것처럼 보이는 이유를 말하세요. (2) 일정 성분비 법칙을 물을 예로 설명하세요. (3) 수소 4 g이 산소와 완전히 반응하면 물이 몇 g 생기며 산소는 몇 g 필요한가요?","a":"(1) 화학 반응 전후에 원자의 종류와 수가 변하지 않으므로 물질의 전체 질량은 같습니다. 열린 용기에서 기체가 빠져나가거나 들어오면 질량이 변한 것처럼 보이지만, 기체까지 포함하면 질량은 보존됩니다. (2) 한 화합물을 이루는 성분 원소의 질량비는 항상 일정합니다. 물은 수소와 산소의 질량비가 1 : 8이고, 수소 1 g에는 산소 8 g이 반응합니다. (3) 수소 4 g에 반응하는 산소는 4 × 8 = 32 g이고 생성되는 물은 4 + 32 = 36 g입니다. 기체 반응 법칙에 따르면 같은 온도와 압력에서 반응하는 기체의 부피비도 간단한 정수비(2H₂ + O₂ → 2H₂O에서 2 : 1 : 2)입니다.","kw":[{"l":"반응 전후 원자 종류·수 같음","a":["반응","전후","원자"]},{"l":"질량 보존","a":["질량 보존","질량","보존"]},{"l":"물 H:O = 1:8","a":["물 H:O = 1:8"]},{"l":"수소 4g + 산소 32g → 물 36g","a":["32g","36g","수소"]},{"l":"부피비 2:1:2","a":["부피비"]}]},{"id":"kj_S15","cat":"과학","grade":"중3","q":"날씨와 대기에 대해 답하세요. (1) 고기압과 저기압에서 날씨가 다른 이유를 설명하세요. (2) 한랭 전선과 온난 전선의 차이를 말하세요. (3) 구름은 어떻게 만들어지나요?","a":"(1) 기압은 공기의 무게에 의한 압력입니다. 고기압에서는 공기가 중심에서 하강하여 구름이 사라지고 맑은 날씨가 되며, 저기압에서는 공기가 상승하여 구름이 생기고 비가 오기 쉽습니다. (2) 한랭 전선은 찬 공기가 따뜻한 공기 아래로 파고들며 빠르게 이동해서 적운형 구름이 생기고 좁은 지역에 소나기가 내립니다. 온난 전선은 따뜻한 공기가 찬 공기 위로 천천히 올라가며 층운형 구름이 생기고 넓은 지역에 오래 약한 비가 내립니다. (3) 공기가 상승하면 주변 기압이 낮아져 단열 팽창하고 온도가 내려갑니다. 온도가 이슬점 이하가 되면 수증기가 응결하여 작은 물방울이나 얼음 알갱이가 되고, 이것이 모인 것이 구름입니다.","kw":[{"l":"고기압: 하강, 맑음 / 저기압: 상승, 구름·비","a":["고기압","저기압","하강"]},{"l":"한랭: 소나기 / 온난: 지속적 비","a":["소나기","지속적","한랭"]},{"l":"상승 → 팽창 → 냉각 → 응결","a":["상승","팽창","냉각"]}]},{"id":"kj_S16","cat":"과학","grade":"중3","q":"빛에 대해 답하세요. (1) 빛의 반사 법칙을 설명하세요. (2) 빛이 공기에서 물로 들어갈 때 굴절하는 방향과 이유를 말하세요. (3) 볼록 렌즈로 만들어지는 상을 물체의 위치에 따라 설명하세요.","a":"(1) 입사각과 반사각의 크기가 같고 입사 광선, 반사 광선, 법선은 같은 평면에 있습니다. 거친 면에서는 난반사가 일어나 여러 방향에서 물체가 보입니다. (2) 빛은 매질에 따라 속력이 달라서 경계면에서 꺾이는데, 공기에서 물로 들어가면 속력이 느려져 법선 쪽으로 꺾입니다. 그래서 물속의 물체는 실제보다 얕게 보입니다. (3) 볼록 렌즈는 빛을 모읍니다. 물체가 초점 밖에 있으면 거꾸로 선 실상(스크린에 맺힘)이 생기고, 초점 안쪽에 있으면 바로 선 확대된 허상이 보이므로 돋보기로 쓰입니다. 물체가 초점에 있으면 상이 생기지 않습니다. 빛이 물이나 유리에서 공기로 나갈 때 입사각이 임계각보다 크면 전반사가 일어나며, 광섬유가 이를 이용합니다.","kw":[{"l":"입사각 = 반사각","a":["입사각","반사각"]},{"l":"공기→물: 법선 쪽으로 꺾임","a":["쪽으로","공기","법선"]},{"l":"초점 밖: 도립 실상 / 초점 안: 정립 허상","a":["초점","도립","실상"]},{"l":"전반사: 광섬유","a":["전반사: 광섬유","전반사","광섬유"]}]},{"id":"kj_S17","cat":"과학","grade":"중3","q":"순환계와 호흡계에 대해 답하세요. (1) 심장의 구조를 설명하세요. (2) 폐순환과 온몸 순환의 경로를 말하세요. (3) 동맥, 정맥, 모세 혈관의 차이를 말하세요. (4) 혈액의 구성 성분과 기능을 말하세요.","a":"(1) 심장은 2개의 심방과 2개의 심실로 이루어져 있고, 혈액이 거꾸로 흐르지 않게 판막이 있습니다. (2) 폐순환은 우심실 → 폐동맥 → 폐(기체 교환) → 폐정맥 → 좌심방이고, 온몸 순환은 좌심실 → 대동맥 → 온몸의 모세 혈관 → 대정맥 → 우심방입니다. (3) 동맥은 혈압이 높아서 벽이 두껍고 탄력이 있으며, 정맥은 벽이 얇고 혈액이 거꾸로 흐르지 않게 판막이 있고, 모세 혈관은 벽이 한 겹의 세포로 되어 있어서 물질 교환이 일어납니다. (4) 적혈구는 헤모글로빈으로 산소를 운반하고, 백혈구는 세균을 잡아먹고 면역에 관여하며, 혈소판은 혈액을 응고시키고, 혈장은 영양소와 노폐물을 운반하고 체온을 조절합니다. 폐포에서는 농도 차이에 의한 확산으로 산소가 혈액에 들어가고 이산화 탄소가 나옵니다.","kw":[{"l":"2심방 2심실","a":["2심방 2심실","2심방","2심실"]},{"l":"폐순환: 우심실→폐→좌심방","a":["폐순환","우심실","좌심방"]},{"l":"온몸: 좌심실→온몸→우심방","a":["좌심실","우심방","온몸"]},{"l":"적혈구·백혈구·혈소판·혈장","a":["적혈구","백혈구","혈소판"]}]},{"id":"kj_S18","cat":"과학","grade":"중1","q":"무거운 바위를 지레를 이용해 들어 올리려고 합니다. 받침점을 바위에 최대한 가깝게 두는 것과 멀리 두는 것 중 어느 쪽이 힘이 적게 드는지 설명하시오.","a":"받침점을 힘을 주는 곳보다 바위 쪽에 가깝게 둘수록, 힘점에서 받침점까지의 거리가 멀어져 작은 힘으로도 무거운 물체를 들어 올릴 수 있습니다.","kw":[{"l":"받침점을 물체에 가깝게","a":["가깝","가까이"]},{"l":"힘점까지 거리가 멀수록 유리","a":["거리","멀"]}]},{"id":"kj_S19","cat":"과학","grade":"중1","q":"무거운 물건을 옮길 때 도르래를 사용하면 편리합니다. 천장에 고정해서 사용하는 고정 도르래는 힘의 방향과 크기 면에서 어떤 특징이 있나요?","a":"고정 도르래는 줄을 당기는 방향과 물체가 올라가는 방향을 다르게 바꿔 줄 수 있어 힘의 방향을 편리하게 바꿀 수 있지만, 필요한 힘의 크기는 줄어들지 않습니다.","kw":[{"l":"힘의 방향을 바꿈","a":["방향"]},{"l":"힘의 크기는 그대로","a":["크기","줄어들지"]}]},{"id":"kj_S20","cat":"과학","grade":"중1","q":"물을 가득 채운 컵의 입구를 마분지 조각으로 막고 조심스럽게 거꾸로 뒤집으면, 마분지가 떨어지지 않고 물이 쏟아지지 않습니다. 이런 현상이 나타나는 까닭을 설명하시오.","a":"마분지의 아래쪽(바깥쪽)에서 대기가 마분지를 떠받치는 힘인 대기압이 작용하는데, 이 대기압의 크기가 컵 속 물의 무게보다 크기 때문에 마분지가 떨어지지 않습니다.","kw":[{"l":"대기압","a":["대기압"]},{"l":"물의 무게보다 큼","a":["무게보다","더 큼"]}]},{"id":"kj_S21","cat":"과학","grade":"중1","q":"줄다리기에서 양쪽 팀이 똑같은 힘으로 당기면 줄이 움직이지 않습니다. 이렇게 두 힘이 겉으로 아무 효과가 나타나지 않도록 균형을 이루는 상태를 무엇이라고 하며, 그 조건은 무엇인가요?","a":"힘의 평형이라고 합니다. 두 힘의 크기가 같고, 방향이 반대이며, 같은 작용선(일직선) 위에 있을 때 힘의 평형이 이루어집니다.","kw":[{"l":"힘의 평형","a":["평형"]},{"l":"크기가 같고 방향이 반대","a":["크기가 같","방향이 반대"]}]},{"id":"kj_S22","cat":"과학","grade":"중2","q":"막대자석 위에 종이를 놓고 철가루를 뿌리면 자석의 극 주위로 특정한 무늬가 나타납니다. 이 무늬를 통해 자석 주위의 자기장에 대해 알 수 있는 것은 무엇인가요?","a":"철가루가 만드는 무늬(자기력선)를 통해 자기장의 방향과 세기를 알 수 있습니다. 무늬가 촘촘할수록 자기장이 세고, 자석의 극에 가까울수록 무늬가 촘촘합니다.","kw":[{"l":"자기장의 방향","a":["방향"]},{"l":"무늬가 촘촘할수록 자기장이 셈","a":["촘촘","세"]}]},{"id":"kj_S23","cat":"과학","grade":"중1","q":"상자에 작은 구멍을 뚫고 반대쪽 면에 기름종이(스크린)를 붙인 바늘구멍 사진기로 촛불을 비추면, 스크린에 상하좌우가 바뀐 촛불의 모습이 나타납니다. 이런 상이 생기는 까닭을 설명하시오.","a":"빛은 곧게 나아가는 직진 성질이 있어서, 촛불의 윗부분에서 나온 빛은 구멍을 지나 스크린의 아랫부분에, 아랫부분에서 나온 빛은 스크린의 윗부분에 도달하기 때문에 상하좌우가 뒤바뀐 상이 생깁니다.","kw":[{"l":"빛의 직진","a":["직진"]},{"l":"상하좌우가 바뀜","a":["상하","좌우","바뀐"]}]},{"id":"kj_S24","cat":"과학","grade":"중1","q":"보온병에 뜨거운 물을 담아 두면 시간이 지나도 온도가 잘 떨어지지 않습니다. 보온병이 열의 이동을 막아 온도를 유지하는 구조를 설명하시오.","a":"보온병은 안쪽과 바깥쪽 벽 사이를 진공(또는 이중벽 구조)으로 만들어 전도와 대류에 의한 열 이동을 막고, 안쪽 벽을 은빛으로 처리해 복사에 의한 열도 반사시켜 잘 빠져나가지 않도록 합니다.","kw":[{"l":"전도와 대류를 막음","a":["전도","대류"]},{"l":"복사(열 반사)","a":["복사","반사"]}]},{"id":"kj_S25","cat":"과학","grade":"중1","q":"그네의 줄 길이가 같으면 몸무게가 다른 두 사람이 타도 한 번 왕복하는 데 걸리는 시간(주기)이 거의 비슷합니다. 그네와 같은 진자의 주기에 가장 큰 영향을 주는 요인은 무엇인가요?","a":"진자의 주기는 줄(진자)의 길이에 의해 결정되며, 매달린 물체의 무게와는 거의 관계가 없습니다. 줄이 길수록 주기가 길어집니다.","kw":[{"l":"줄의 길이","a":["길이"]},{"l":"무게와 관계없음","a":["무게","관계없"]}]},{"id":"kj_S26","cat":"과학","grade":"중2","q":"동굴이나 넓은 산속에서 소리를 지르면 잠시 후 같은 소리가 다시 들려오는 메아리 현상이 나타납니다. 메아리가 생기는 까닭을 소리의 성질과 관련지어 설명하시오.","a":"소리도 빛처럼 물체에 부딪히면 반사되는 성질이 있습니다. 소리가 멀리 있는 벽이나 산에 부딪혀 반사되어 돌아오는 데 시간이 걸리기 때문에, 원래 소리를 들은 후 잠시 뒤에 반사된 소리가 다시 들리는 메아리가 생깁니다.","kw":[{"l":"소리의 반사","a":["반사"]},{"l":"되돌아오는 데 시간이 걸림","a":["시간"]}]},{"id":"kj_S27","cat":"과학","grade":"중3","q":"바닷가에서 파도를 보면 물결이 계속 해안으로 밀려오지만, 물 위에 뜬 튜브는 앞으로 나아가지 않고 제자리에서 위아래로 오르내리기만 합니다. 이런 모습으로 알 수 있는 파동의 특징은 무엇인가요?","a":"파도(파동)가 진행할 때 파동을 전달하는 물(매질) 자체는 함께 이동하지 않고 제자리에서 진동만 하며, 에너지만 진행 방향으로 전달된다는 것을 알 수 있습니다.","kw":[{"l":"매질은 이동하지 않고 제자리에서 진동","a":["제자리","이동하지 않"]},{"l":"에너지가 전달됨","a":["에너지"]}]},{"id":"kj_S28","cat":"과학","grade":"중2","q":"생선회를 먹을 때 레몬즙을 뿌려 먹으면 비린내가 줄어들고, 벌에 쏘였을 때는 암모니아수를 발라 통증을 줄이기도 합니다. 이 두 가지 방법에 공통으로 숨어 있는 원리는 무엇일까요?","a":"생선 비린내를 내는 물질이나 벌독처럼 성질이 강한 물질을, 그와 반대되는 성질을 가진 물질(레몬즙, 암모니아수)로 서로 성질을 약하게 만들어 상쇄시키는 원리가 숨어 있습니다.","kw":[{"l":"서로 반대되는 성질을 상쇄","a":["반대","상쇄","약하게"]},{"l":"중화","a":["중화"]}]},{"id":"kj_S29","cat":"과학","grade":"중2","q":"못을 식초에 며칠 담가 두면 기포가 보글보글 올라오면서 못 표면이 변합니다. 반면 같은 식초에 은수저를 담가 두면 별다른 변화가 없습니다. 이런 차이가 나타나는 까닭은 무엇일까요?","a":"철은 산성 물질과 활발하게 반응하여 기체를 발생시키며 성질이 변하지만, 은은 철보다 다른 물질과 반응하는 정도가 훨씬 약해서 식초와 잘 반응하지 않기 때문에 별다른 변화가 없습니다.","kw":[{"l":"금속마다 반응하는 정도가 다름","a":["반응"]},{"l":"기체 발생","a":["기체"]}]},{"id":"kj_S30","cat":"과학","grade":"중2","q":"촛불이 타다가 촛불에 유리컵을 씌우면 잠시 후 불이 꺼집니다. 이렇게 물질이 타기(연소하기) 위해서는 탈 물질, 산소, 발화점 이상의 온도라는 세 가지 조건이 모두 필요한데, 유리컵을 씌웠을 때는 이 중 무엇이 사라져서 불이 꺼지는 것인가요?","a":"유리컵으로 덮으면 컵 안의 산소가 연소에 다 쓰이고 새로운 산소가 공급되지 않아, 연소에 필요한 세 가지 조건 중 산소가 사라지기 때문에 촛불이 꺼집니다.","kw":[{"l":"산소 부족(공급 차단)","a":["산소"]},{"l":"연소의 조건","a":["조건"]}]},{"id":"kj_S31","cat":"과학","grade":"중2","q":"과산화수소수(오래된 상처 소독약)에 감자 조각이나 이산화 망가니즈를 넣으면 기포가 활발하게 발생합니다. 이때 발생하는 기체가 무엇인지 확인할 수 있는 간단한 방법은 무엇인가요?","a":"꺼져가는 향불을 기체 가까이 가져갔을 때 향불이 다시 살아나 밝게 타오르면, 그 기체는 다른 물질이 타는 것을 돕는 산소라는 것을 확인할 수 있습니다.","kw":[{"l":"꺼져가는 향불이 다시 타오름","a":["향불","다시 타"]},{"l":"산소 확인","a":["산소"]}]},{"id":"kj_S32","cat":"과학","grade":"중1","q":"물 100g에 설탕 25g을 녹인 설탕물의 진하기를 숫자로 나타내려고 합니다. 이렇게 용액의 진하기를 나타내는 퍼센트 농도는 어떻게 구하나요?","a":"퍼센트 농도는 용액 전체의 양에 대한 용질의 양의 비율을 백분율로 나타낸 것으로, (용질의 양 ÷ 용액 전체의 양) × 100으로 구합니다.","kw":[{"l":"용질/용액×100","a":["용질","용액"]},{"l":"백분율","a":["백분율","퍼센트"]}]},{"id":"kj_S33","cat":"과학","grade":"중1","q":"지진이 발생하면 뉴스에서 \"규모 5.0의 지진\"과 같은 표현과 함께 지역별로 \"진도 4\" 같은 표현을 함께 씁니다. 규모와 진도는 각각 무엇을 나타내는 개념인가요?","a":"규모는 지진이 발생할 때 방출된 에너지의 크기를 나타내는 값으로 지진마다 하나의 값만 가지지만, 진도는 어떤 지역에서 사람이 느끼거나 건물이 흔들린 정도를 나타내는 값으로 진앙에서의 거리에 따라 지역마다 다르게 나타납니다.","kw":[{"l":"규모는 에너지 크기(하나의 값)","a":["에너지"]},{"l":"진도는 흔들린 정도(지역마다 다름)","a":["흔들린","지역"]}]},{"id":"kj_S34","cat":"과학","grade":"중2","q":"태양계는 거대한 성운이 중력에 의해 서서히 수축하면서 만들어졌다고 알려져 있습니다. 이 과정에서 태양은 어떻게 만들어졌나요?","a":"성운이 중력에 의해 수축하면서 중심부에 물질이 모여들어 온도와 밀도가 매우 높아지고, 그 중심부에서 수소 핵융합 반응이 시작되면서 스스로 빛을 내는 태양이 만들어졌습니다.","kw":[{"l":"중심부에 물질이 모임","a":["중심"]},{"l":"온도와 밀도가 높아짐","a":["온도","밀도"]}]},{"id":"kj_S35","cat":"과학","grade":"중2","q":"비가 그친 뒤 하늘에 무지개가 나타나는 것을 볼 수 있습니다. 무지개가 생기는 원리를 빛의 성질과 관련지어 설명하시오.","a":"공기 중에 떠 있는 물방울이 작은 렌즈와 같은 역할을 하여, 물방울 속을 통과하는 햇빛이 굴절되고 여러 색의 빛으로 나뉘어 흩어지면서(분산) 무지개가 나타납니다.","kw":[{"l":"물방울에 의한 굴절","a":["굴절"]},{"l":"빛의 분산(여러 색으로 나뉨)","a":["분산","나뉘"]}]},{"id":"kj_S36","cat":"과학","grade":"중1","q":"버스가 갑자기 출발하면 서 있던 사람은 뒤로 쏠리고, 갑자기 멈추면 앞으로 쏠립니다. 이런 현상이 나타나는 까닭을 설명하시오.","a":"물체는 원래의 운동 상태를 계속 유지하려는 관성을 가지고 있어서, 버스가 갑자기 움직이면 사람의 몸은 정지 상태를 유지하려 해 뒤로 쏠리고, 버스가 갑자기 멈추면 몸은 움직이던 상태를 유지하려 해 앞으로 쏠립니다.","kw":[{"l":"관성","a":["관성"]},{"l":"원래 운동 상태를 유지하려 함","a":["유지"]}]},{"id":"kj_S37","cat":"과학","grade":"중2","q":"추운 겨울 밖에 있다가 따뜻한 실내에 들어오면 안경알에 뿌옇게 김이 서립니다. 이런 현상이 나타나는 까닭을 설명하시오.","a":"차가운 안경알 표면에 실내의 따뜻하고 습한 공기가 닿으면, 공기 중의 수증기가 급격히 냉각되어 작은 물방울로 응결되기 때문에 뿌옇게 김이 서립니다.","kw":[{"l":"수증기가 응결(액화)","a":["응결","액화"]},{"l":"차가운 표면에 닿음","a":["차가운"]}]},{"id":"kj_S38","cat":"과학","grade":"중1","q":"공사장에서는 안전모를 쓰고, 택배 상자에는 뽁뽁이(에어캡)를 넣어 물건을 보호합니다. 이런 물건들이 충격으로부터 머리나 내용물을 보호하는 공통적인 원리를 설명하시오.","a":"충격이 전달되는 시간을 늘려 충격이 한 순간에 집중되지 않고 서서히 전달되게 함으로써, 순간적으로 받는 힘의 크기를 줄여 주기 때문에 머리나 내용물을 보호할 수 있습니다.","kw":[{"l":"충격이 전달되는 시간을 늘림","a":["시간"]},{"l":"순간적인 힘을 줄임","a":["힘을 줄"]}]},{"id":"kj_S39","cat":"과학","grade":"중1","q":"탄산음료의 뚜껑을 열면 \"치익\" 소리와 함께 거품이 솟아오릅니다. 이런 현상이 나타나는 까닭을 기체의 성질과 관련지어 설명하시오.","a":"병 속은 압력이 높게 유지되어 이산화 탄소 기체가 많이 녹아 있는데, 뚜껑을 열어 압력이 낮아지면 기체가 녹아 있을 수 있는 양이 줄어들어, 녹아 있던 이산화 탄소가 기포가 되어 빠르게 빠져나오기 때문에 거품이 솟아오릅니다.","kw":[{"l":"압력이 낮아짐","a":["압력"]},{"l":"녹아 있던 기체가 빠져나옴","a":["빠져나"]}]},{"id":"kj_S40","cat":"과학","grade":"중1","q":"뜨거운 기름에 물이 조금이라도 떨어지면 기름이 사방으로 튀어 매우 위험합니다. 이런 현상이 나타나는 까닭을 물과 기름의 특성 차이와 관련지어 설명하시오.","a":"물은 기름보다 끓는점이 훨씬 낮아 뜨거운 기름 속에서 순간적으로 기체(수증기)로 변하면서 부피가 급격히 커지는데, 이때 주변의 기름을 밀어내며 사방으로 튀게 됩니다.","kw":[{"l":"물이 급격히 기체로 변함","a":["기체","끓"]},{"l":"부피가 급격히 커짐","a":["부피"]}]},{"id":"kj_S41","cat":"과학","grade":"중2","q":"보름달은 주로 해가 지는 저녁 무렵에 동쪽 하늘에서 떠오릅니다. 보름달이 해가 질 때쯤 뜨는 까닭은 무엇일까요?","a":"보름달은 태양-지구-달의 순서로 놓여 지구를 사이에 두고 태양과 반대쪽에 위치하기 때문에, 태양이 서쪽으로 질 때 반대쪽인 동쪽에서 달이 떠오르게 됩니다.","kw":[{"l":"태양과 반대쪽에 위치","a":["반대쪽","반대"]},{"l":"지구를 사이에 둠","a":["지구"]}]},{"id":"kj_S42","cat":"과학","grade":"중2","q":"달을 매일 같은 시각에 관찰하면 위치가 조금씩 동쪽으로 옮겨 간 것처럼 보이고, 달이 뜨는 시각도 매일 약 50분씩 늦어집니다. 그 까닭은 무엇인가요?","a":"달은 지구 주위를 서에서 동으로 공전하고 있어서, 지구가 하루 자전하는 동안 달도 자신의 공전 궤도를 따라 조금씩 이동하기 때문에, 같은 위치에서 달을 다시 보려면 지구가 조금 더 자전해야 하고, 그만큼 달이 뜨는 시각도 매일 조금씩 늦어집니다.","kw":[{"l":"달의 공전","a":["공전"]},{"l":"뜨는 시각이 매일 늦어짐","a":["늦어"]}]},{"id":"kj_S43","cat":"과학","grade":"중3","q":"폐동맥은 이름에 \"동맥\"이 들어가지만, 이 혈관 속을 흐르는 피는 동맥혈일까요, 정맥혈일까요? 그 까닭과 함께 설명하시오.","a":"폐동맥에는 정맥혈이 흐릅니다. 동맥과 정맥은 심장에서 나가는 혈관인지 심장으로 들어오는 혈관인지(방향)에 따라 구분하는 이름이고, 동맥혈과 정맥혈은 혈액 속 산소의 양에 따라 구분하는 이름이라 서로 다른 기준입니다. 폐동맥은 심장에서 나가는 혈관이라 \"동맥\"이지만, 아직 폐에서 산소를 공급받기 전이라 이산화 탄소를 많이 포함한 정맥혈이 흐릅니다.","kw":[{"l":"폐동맥엔 정맥혈이 흐름","a":["정맥혈"]},{"l":"동맥/정맥은 방향 기준, 동맥혈/정맥혈은 산소량 기준","a":["방향","산소"]}]},{"id":"kj_S44","cat":"과학","grade":"중1","q":"식물을 투명한 유리병에 넣고 빛은 충분히 비춰 주지만 병 속의 이산화 탄소를 모두 제거한 상태로 두면 광합성이 일어날까요? 그 까닭과 함께 설명하시오.","a":"광합성이 일어나지 않습니다. 광합성은 빛에너지뿐 아니라 원료가 되는 이산화 탄소와 물이 반드시 함께 필요한 반응이기 때문에, 이산화 탄소가 없으면 빛이 충분해도 포도당을 만들 수 없습니다.","kw":[{"l":"이산화 탄소가 원료로 반드시 필요","a":["이산화 탄소"]},{"l":"광합성이 일어나지 않음","a":["일어나지 않"]}]},{"id":"kj_S45","cat":"과학","grade":"중2","q":"운동을 하지 않고 가만히 잠을 잘 때도 우리 몸속 세포들은 산소를 소비할까요? 그 까닭과 함께 설명하시오.","a":"네, 소비합니다. 세포 호흡은 살아있는 모든 세포에서 생명 활동에 필요한 에너지를 얻기 위해 끊임없이 일어나는 과정이므로, 잠을 자거나 가만히 있을 때도 세포들은 계속 산소를 이용해 호흡하며 에너지를 만들어 냅니다.","kw":[{"l":"세포 호흡은 항상 일어남","a":["항상","끊임없이"]},{"l":"에너지를 만듦","a":["에너지"]}]},{"id":"kj_S46","cat":"과학","grade":"중3","q":"교감 신경은 심장 박동을 빠르게 하고, 부교감 신경은 느리게 합니다. 이렇게 서로 반대 작용을 하는 두 신경이 함께 우리 몸에 분포하는 것이 어떤 점에서 유리한가요?","a":"상황에 따라 몸의 기능을 정교하게 조절할 수 있어 유리합니다. 위급한 상황에서는 교감 신경이 우세해져 몸이 신속하게 대응하도록 하고, 평상시에는 부교감 신경이 우세해져 몸이 안정과 휴식을 취하도록 하여, 상황에 맞게 몸 상태를 조절할 수 있습니다.","kw":[{"l":"상황에 따라 몸 상태를 조절","a":["상황"]},{"l":"서로 반대 작용으로 균형","a":["반대"]}]},{"id":"kj_S47","cat":"과학","grade":"중3","q":"부모의 혈액형이 각각 A형과 B형인데, 자녀의 혈액형이 O형으로 나오는 경우가 있습니다. 이런 일이 어떻게 가능한지 유전자형의 관점에서 설명하시오.","a":"A형인 부모가 유전자형 AO를, B형인 부모가 유전자형 BO를 가지고 있다면, 두 부모 모두 자녀에게 O 유전자를 물려줄 수 있어, 자녀가 O 유전자만 두 개(OO) 물려받으면 O형이 될 수 있습니다.","kw":[{"l":"부모가 AO, BO 유전자형을 가짐","a":["AO","BO"]},{"l":"O 유전자를 물려받음","a":["O 유전자"]}]},{"id":"kj_S48","cat":"과학","grade":"중3","q":"건강한 사람의 오줌에는 사구체에서 여과된 포도당이 전혀 들어있지 않습니다. 포도당은 분명 사구체에서 여과되었는데도 오줌으로 나오지 않는 까닭은 무엇인가요?","a":"사구체에서 여과된 포도당은 세뇨관을 지나는 동안 몸에 필요한 영양소이므로 모세 혈관으로 100% 재흡수되기 때문에, 정상적인 상태에서는 오줌 속에 포도당이 남아있지 않습니다.","kw":[{"l":"세뇨관에서 재흡수됨","a":["재흡수"]},{"l":"전부(100%) 재흡수됨","a":["전부","100"]}]},{"id":"kj_S49","cat":"과학","grade":"중3","q":"다리의 정맥에는 군데군데 판막이라는 구조가 있어 혈액이 거꾸로 흐르지 않게 막아 줍니다. 그런데 동맥에는 이런 판막이 거의 없습니다. 그 까닭은 무엇일까요?","a":"동맥은 심장이 강하게 뿜어내는 힘(혈압)으로 혈액이 힘차게 흐르기 때문에 거꾸로 흐를 걱정이 적지만, 정맥은 심장에서 멀어질수록 혈압이 크게 낮아져 혈액이 거꾸로 흐르기 쉬우므로, 이를 막기 위해 판막이 발달했습니다.","kw":[{"l":"정맥은 혈압이 낮음","a":["혈압"]},{"l":"혈액의 역류를 막음","a":["역류"]}]},{"id":"kj_S50","cat":"과학","grade":"중2","q":"지구에서 촛불을 켜면 불꽃이 위로 길쭉하게 솟아오르는 모양이 됩니다. 그런데 우주정거장처럼 무중력에 가까운 환경에서 촛불을 켜면 불꽃이 위로 솟지 않고 동그란 공 모양으로 약하게 타오릅니다. 지구에서 불꽃이 위쪽으로 길게 솟아오르는 까닭은 무엇인가요?","a":"촛불 주변의 뜨거워진 공기는 밀도가 작아져 위로 올라가고 차가운 공기가 아래에서 채워지는 대류가 일어나는데, 이 대류 때문에 불꽃이 위쪽으로 길게 늘어난 모양이 됩니다.","kw":[{"l":"대류","a":["대류"]},{"l":"뜨거운 공기가 위로 올라감","a":["위로","올라"]}]},{"id":"kj_S51","cat":"과학","grade":"중2","q":"우주정거장에서 물을 공중에 살짝 띄우면 지구에서와 달리 동그란 구슬 모양으로 둥둥 떠 있습니다. 이런 모양이 되는 까닭은 무엇인가요?","a":"지구에서는 중력 때문에 물이 아래로 처지지만, 무중력 상태에서는 중력의 영향이 거의 없어 물의 표면적을 최소로 만들려는 표면 장력만 작용하기 때문에, 표면적이 가장 작은 모양인 구형이 됩니다.","kw":[{"l":"표면 장력","a":["표면 장력"]},{"l":"중력의 영향이 거의 없음","a":["중력"]}]},{"id":"kj_S52","cat":"과학","grade":"중3","q":"어떤 행성에 착륙한 우주 탐사 로봇이 스톱워치와 줄자만을 이용해서 그 행성의 중력의 세기를 대략적으로 알아보려고 합니다. 어떤 실험을 설계할 수 있을지 방법을 설명하시오.","a":"일정한 높이에서 물체를 가만히 떨어뜨리면서 바닥에 닿을 때까지 걸리는 시간을 스톱워치로 재고, 떨어뜨린 높이를 줄자로 측정합니다. 여러 번 반복해서 얻은 높이와 걸린 시간의 관계를 살펴보면, 그 행성에서 물체가 얼마나 빠르게 떨어지는지(중력의 세기)를 짐작할 수 있습니다.","kw":[{"l":"자유 낙하시켜 시간을 측정","a":["시간","스톱워치"]},{"l":"떨어뜨린 높이를 측정","a":["높이"]}]},{"id":"kj_S53","cat":"과학","grade":"중2","q":"우주 비행사가 우주복 없이 진공인 우주 공간에 그대로 노출되면 매우 위험합니다. 특히 몸속의 물이 순식간에 끓어오르듯 기화될 수 있다고 하는데, 체온이 높지 않은데도 이런 일이 일어날 수 있는 까닭은 무엇인가요?","a":"액체의 끓는점은 주변 압력이 낮을수록 낮아지는데, 진공 상태인 우주 공간은 압력이 거의 0에 가까워서 몸의 온도가 높지 않아도 몸속의 물이 매우 낮은 온도에서 끓어(기화되어) 버릴 수 있기 때문입니다.","kw":[{"l":"압력이 낮을수록 끓는점이 낮아짐","a":["압력","끓는점"]},{"l":"진공(압력이 거의 없음)","a":["진공"]}]},{"id":"kj_S54","cat":"과학","grade":"중2","q":"달은 지구 주위를 공전하면서 스스로도 자전을 하는데, 우리는 지구에서 항상 달의 같은 면만 보게 됩니다. 달의 뒷면은 지구에서 전혀 볼 수 없는 까닭은 무엇인가요?","a":"달의 자전 주기와 지구를 도는 공전 주기가 정확히 같기 때문입니다. 달이 자전하는 속도와 지구 주위를 공전하는 속도가 일치하여, 지구를 향하는 달의 면이 항상 같은 쪽을 향하게 되므로 우리는 늘 달의 같은 면만 보게 됩니다.","kw":[{"l":"자전 주기와 공전 주기가 같음","a":["자전 주기","공전 주기"]},{"l":"같은 면이 지구를 향함","a":["같은 면"]}]},{"id":"kj_S55","cat":"과학","grade":"중1","q":"종이에 작은 구멍을 뚫고 눈으로 그 구멍을 통해 보름달을 보면, 구멍이 달을 딱 가릴 만큼 작게 보입니다. 눈과 구멍 사이의 거리, 구멍의 지름, 그리고 지구에서 달까지의 거리를 알고 있다면, 이를 이용해 달의 실제 지름을 어떻게 구할 수 있을까요?","a":"구멍의 지름과 눈-구멍 사이 거리의 비율이, 달의 지름과 지구-달 사이 거리의 비율과 같다는 비례식(구멍의 지름 : 눈-구멍 거리 = 달의 지름 : 지구-달 거리)을 세우면, 달의 실제 지름을 구할 수 있습니다.","kw":[{"l":"비례식을 이용","a":["비례식","비율"]},{"l":"구멍의 지름과 거리의 관계","a":["구멍"]}]},{"id":"kj_S56","cat":"과학","grade":"중2","q":"달은 매달 지구 주위를 한 바퀴씩 공전하는데, 일식이나 월식은 매달 일어나지 않고 가끔씩만 일어납니다. 그 까닭은 무엇인가요?","a":"달이 지구를 도는 공전 궤도면이 지구가 태양을 도는 공전 궤도면(황도면)과 정확히 일치하지 않고 약간 기울어져 있기 때문에, 태양-지구-달이 완전히 일직선이 되는 경우는 흔치 않아 일식과 월식이 매달 일어나지는 않습니다.","kw":[{"l":"달의 공전 궤도면이 기울어져 있음","a":["기울어"]},{"l":"일직선이 되기 어려움","a":["일직선"]}]},{"id":"kj_S57","cat":"과학","grade":"중3","q":"우리 몸은 체온이 올라가면 땀을 흘리고, 체온이 내려가면 몸을 떨어 체온을 일정하게 유지하려고 합니다. 이렇게 체온을 비롯한 몸속 환경을 일정하게 유지하도록 조절하는 중추는 뇌의 어느 부분에 있나요?","a":"대뇌와 중간뇌 사이에 있는 간뇌(특히 시상하부)가 체온 조절을 비롯해 몸속 환경을 일정하게 유지하는 항상성 조절의 중추 역할을 합니다.","kw":[{"l":"간뇌(시상하부)","a":["간뇌","시상하부"]},{"l":"항상성 조절","a":["항상성"]}]},{"id":"kj_S58","cat":"과학","grade":"중3","q":"위급하거나 긴장되는 상황에서 우리 몸은 심장 박동이 빨라지고 순간적으로 힘이 세지는 것을 느끼기도 합니다. 이런 반응이 나타나도록 부신에서 분비되어 교감 신경과 함께 작용하는 호르몬은 무엇인가요?","a":"아드레날린입니다. 아드레날린은 위급한 상황에서 부신에서 분비되어 심장 박동과 호흡을 빠르게 하고 근육에 혈액을 더 많이 공급하는 등, 몸이 긴급 상황에 신속하게 대응할 수 있도록 돕습니다.","kw":[{"l":"아드레날린","a":["아드레날린"]},{"l":"부신에서 분비","a":["부신"]}]},{"id":"kj_S59","cat":"과학","grade":"중3","q":"땀을 많이 흘려 몸속 수분이 부족해지면 오줌의 양이 줄어들고 색이 진해집니다. 이렇게 몸속 수분량에 따라 오줌량을 조절하는 데 관여하는 호르몬은 무엇이며, 어디에서 분비되나요?","a":"항이뇨 호르몬(ADH)이며, 뇌하수체에서 분비됩니다. 몸속 수분이 부족해지면 항이뇨 호르몬의 분비가 늘어나 콩팥의 세뇨관에서 물의 재흡수를 촉진시켜, 오줌으로 빠져나가는 수분량을 줄여 몸속 수분을 보존합니다.","kw":[{"l":"항이뇨 호르몬(ADH)","a":["항이뇨"]},{"l":"뇌하수체에서 분비","a":["뇌하수체"]},{"l":"물의 재흡수를 촉진","a":["재흡수"]}]},{"id":"kj_S60","cat":"과학","grade":"중3","q":"방 안의 불을 껐다 켜면 순간적으로 어두워집니다. 스위치를 끄기 직전까지 전구에서 나오고 있던 빛은 갑자기 사라지는 걸까요, 아니면 어딘가로 계속 나아가는 걸까요? 빛의 성질과 관련지어 설명하시오.","a":"빛은 갑자기 사라지지 않고 초속 약 30만 km라는 매우 빠른 속도로 계속 나아갑니다. 방 안에서는 빛이 벽이나 물체에 부딪혀 흡수되기까지 아주 짧은 시간(수십억 분의 1초)밖에 걸리지 않기 때문에, 우리 눈에는 스위치를 끄자마자 즉시 어두워지는 것처럼 느껴지는 것뿐입니다.","kw":[{"l":"빛은 사라지지 않고 계속 나아감","a":["사라지지","계속"]},{"l":"물체에 부딪혀 흡수됨","a":["흡수"]},{"l":"매우 빠른 속도","a":["속도","빠른"]}]},{"id":"kj_S61","cat":"과학","grade":"중3","q":"자석을 코일 근처에서 빠르게 움직이면, 코일이 전지에 연결되어 있지 않은데도 순간적으로 전류가 흐릅니다. 이렇게 자석의 움직임으로 코일에 전류가 만들어지는 현상을 무엇이라고 하며, 전류가 흐르려면 어떤 조건이 필요한가요?","a":"이런 현상을 전자기 유도라고 하고, 이때 흐르는 전류를 유도 전류라고 합니다. 코일을 통과하는 자기장이 변할 때(자석이 움직이거나 자석과 코일 사이의 거리가 달라질 때) 유도 전류가 흐르며, 자석이 멈춰 있으면 자기장이 변하지 않아 전류가 흐르지 않습니다.","kw":[{"l":"전자기 유도","a":["전자기 유도"]},{"l":"유도 전류","a":["유도 전류"]},{"l":"자기장이 변할 때","a":["자기장이 변"]}]},{"id":"kj_S62","cat":"과학","grade":"중1","q":"생물체는 모두 세포로 이루어져 있습니다. 동물 세포와 식물 세포에 공통으로 있는 세포막과 핵은 각각 어떤 역할을 하나요?","a":"세포막은 세포를 둘러싸 세포의 형태를 유지하고 물질이 세포 안팎으로 드나드는 것을 조절하는 역할을 하며, 핵은 세포의 생명 활동을 조절하는 유전 정보를 담고 있어 세포의 중심 역할을 합니다.","kw":[{"l":"세포막-물질 출입 조절","a":["세포막"]},{"l":"핵-유전 정보","a":["핵","유전 정보"]}]},{"id":"kj_S63","cat":"과학","grade":"중2","q":"뿌리에서 흡수한 물은 줄기를 거쳐 잎까지 이동하고, 잎에서 광합성으로 만든 양분은 줄기를 거쳐 뿌리나 열매로 이동합니다. 물이 이동하는 통로와 양분이 이동하는 통로는 각각 무엇이라고 하나요?","a":"물이 이동하는 통로는 물관이라 하고, 광합성으로 만든 양분이 이동하는 통로는 체관이라고 합니다.","kw":[{"l":"물관(물의 이동)","a":["물관"]},{"l":"체관(양분의 이동)","a":["체관"]}]},{"id":"kj_S64","cat":"과학","grade":"중3","q":"선풍기는 전기 에너지를 이용해 날개를 돌려 시원한 바람(운동 에너지)을 만들어 냅니다. 그런데 선풍기를 오래 켜 두면 몸체가 조금씩 따뜻해지는 것을 느낄 수 있습니다. 이 현상은 에너지가 어떻게 되는 것을 보여주나요?","a":"선풍기에 공급된 전기 에너지의 일부는 날개를 돌리는 운동 에너지로 전환되지만, 나머지 일부는 모터의 마찰 등에 의해 열에너지로 전환되어 몸체가 따뜻해지는 것입니다. 이렇게 에너지는 새로 생기거나 사라지지 않고 다른 형태로 전환될 뿐이며, 전환 전후 에너지의 총량은 일정하게 보존됩니다.","kw":[{"l":"에너지 보존","a":["보존"]},{"l":"다른 형태로 전환됨(열에너지 등)","a":["전환","열에너지"]}]},{"id":"kj_S65","cat":"과학","grade":"중3","q":"로켓은 아무것도 없는 진공의 우주 공간에서도 앞으로 나아갈 수 있습니다. 주변에 밀어낼 공기도 없는데 로켓이 앞으로 나아갈 수 있는 까닭은 무엇인가요?","a":"로켓은 연료를 태워 만든 가스를 뒤쪽으로 강하게 분출하는데, 이때 가스가 로켓을 미는 힘과 로켓이 가스를 미는 힘이 서로 반대 방향으로 작용하는 작용·반작용의 원리로 나아갑니다. 이 원리는 주변에 공기가 없어도 성립하기 때문에 진공인 우주에서도 로켓이 나아갈 수 있습니다.","kw":[{"l":"작용·반작용","a":["작용","반작용"]},{"l":"가스를 뒤로 분출","a":["분출","가스"]}]},{"id":"kj_S66","cat":"과학","grade":"중3","q":"인공위성은 지구의 중력에 끊임없이 끌리고 있는데도 왜 지표면에 떨어지지 않고 계속 지구 주위를 도는 걸까요?","a":"인공위성은 지구 중력에 의해 계속 지구 쪽으로 끌려가고 있지만, 동시에 매우 빠른 속도로 옆으로 움직이고 있습니다. 떨어지는 동안 지구 표면도 둥글게 휘어져 멀어지기 때문에, 계속 떨어지면서도 지표면에 닿지 않고 일정한 높이를 유지하며 지구 주위를 돌게 됩니다.","kw":[{"l":"중력에 끌리면서 동시에 빠르게 옆으로 이동","a":["옆으로","속도"]},{"l":"지구 표면이 둥글게 휘어짐","a":["휘어"]}]},{"id":"kj_S67","cat":"과학","grade":"중2","q":"흔들지 않았는데도 봉지를 뜯으면 저절로 따뜻해지는 손난로가 있습니다. 이 손난로 안에서는 어떤 반응이 일어나고 있는 걸까요?","a":"손난로 안에는 철가루가 들어 있는데, 봉지를 뜯어 공기 중의 산소와 닿으면 철가루가 산소와 반응하여 산화되면서 열을 내는 발열 반응이 일어나기 때문에 저절로 따뜻해집니다.","kw":[{"l":"철가루와 산소의 반응(산화)","a":["철가루","산소","산화"]},{"l":"발열 반응","a":["발열"]}]},{"id":"kj_S68","cat":"과학","grade":"중2","q":"나침반 바늘은 어디에 있든 항상 북쪽을 가리킵니다. 그 까닭은 무엇인가요?","a":"지구 자체가 하나의 거대한 자석과 같은 성질을 가지고 있어서 지구 전체에 자기장이 형성되어 있는데, 나침반 바늘도 작은 자석이기 때문에 이 지구 자기장의 영향을 받아 N극이 북쪽 방향을 가리키게 됩니다.","kw":[{"l":"지구 자체가 거대한 자석","a":["지구","자석"]},{"l":"지구 자기장의 영향","a":["자기장"]}]},{"id":"kj_S69","cat":"과학","grade":"중1","q":"부력의 크기가 무게보다 클 때와 작을 때 물체는 각각 어떻게 되나요?","a":"부력이 무게보다 크면 물체가 위로 떠오르고, 부력이 무게보다 작으면 물체가 가라앉습니다.","kw":[{"l":"부력이 무게보다 크면 뜸","a":["크면","떠오"]},{"l":"부력이 무게보다 작으면 가라앉음","a":["작으면","가라앉"]}]},{"id":"kj_S70","cat":"과학","grade":"중1","q":"마찰력이 작용하는 방향을 설명하시오.","a":"마찰력은 두 물체의 접촉면에서 물체의 운동을 방해하는 방향, 즉 물체가 미끄러지는 방향과 반대 방향으로 작용합니다.","kw":[{"l":"접촉면","a":["접촉면"]},{"l":"운동을 방해","a":["방해"]},{"l":"반대 방향","a":["반대 방향","반대방향"]}]},{"id":"kj_S71","cat":"과학","grade":"중1","q":"탄성력의 방향과 크기를 설명하시오.","a":"탄성력은 변형된 물체가 원래 모양으로 되돌아가려는 힘으로, 물체에 작용한 힘과 반대 방향으로 작용하며 크기는 변형이 클수록 커집니다.","kw":[{"l":"원래 모양으로 되돌아가려는 힘","a":["원래 모양","되돌아"]},{"l":"작용한 힘과 반대 방향","a":["반대 방향","반대방향"]},{"l":"변형이 클수록 커짐","a":["변형","클수록"]}]},{"id":"kj_S72","cat":"과학","grade":"중3","q":"자유 낙하 운동에서 속력은 시간에 따라 어떻게 변하나요?","a":"자유 낙하 운동을 하는 물체는 중력만 받아 속력이 1초마다 9.8m/s씩 일정하게 증가하며, 속력은 9.8과 걸린 시간을 곱한 값입니다.","kw":[{"l":"중력만 작용","a":["중력만"]},{"l":"속력이 시간에 비례하여 증가","a":["비례","증가"]},{"l":"9.8","a":["9.8"]}]},{"id":"kj_S73","cat":"과학","grade":"중3","q":"중력에 의한 위치 에너지와 운동 에너지는 각각 무엇에 비례하나요?","a":"중력에 의한 위치 에너지는 물체의 질량과 높이에 각각 비례하고, 운동 에너지는 물체의 질량에 비례하며 속력의 제곱에 비례합니다.","kw":[{"l":"위치 에너지: 질량과 높이에 비례","a":["위치 에너지"]},{"l":"운동 에너지: 질량과 속력의 제곱에 비례","a":["운동 에너지","제곱"]}]},{"id":"kj_S74","cat":"과학","grade":"중1","q":"마찰력을 크게 하거나 작게 하는 예를 각각 들어보세요.","a":"미끄럼을 방지하기 위해 신발 밑창을 거칠게 만드는 것은 마찰력을 크게 하는 예이고, 스키나 스노보드처럼 표면을 매끄럽게 하여 잘 미끄러지게 하는 것은 마찰력을 작게 하는 예입니다.","kw":[{"l":"마찰력을 크게 하는 예","a":["크게"]},{"l":"마찰력을 작게 하는 예","a":["작게"]}]},{"id":"kj_S75","cat":"과학","grade":"중3","q":"체온이 낮아졌을 때 몸에서 일어나는 항상성 조절 과정을 설명하시오.","a":"추울 때는 피부 근처 혈관이 수축해 열 발산량이 줄고, 근육이 떨리며 티록신 분비량이 증가해 세포 호흡을 촉진함으로써 열 발생량을 늘려 체온을 일정하게 유지합니다.","kw":[{"l":"혈관이 수축함","a":["혈관"]},{"l":"근육이 떨림","a":["근육"]},{"l":"티록신 분비 증가로 열 발생 증가","a":["티록신"]}]},{"id":"kj_S76","cat":"과학","grade":"중2","q":"호흡 운동이 일어나는 원리를 설명하시오.","a":"갈비뼈가 올라가고 횡격막이 내려가면 흉강의 부피가 커지면서 압력이 낮아져 공기가 폐 안으로 들어오고, 반대로 흉강 부피가 작아지면 압력이 높아져 공기가 밖으로 나갑니다.","kw":[{"l":"갈비뼈·횡격막의 움직임","a":["갈비뼈","횡격막"]},{"l":"흉강 부피 변화","a":["흉강"]},{"l":"압력 변화","a":["압력"]},{"l":"공기 이동","a":["공기"]}]},{"id":"kj_S77","cat":"과학","grade":"중3","q":"과학에서 말하는 \"일\"의 정의와 일의 양을 구하는 방법을 설명하시오.","a":"과학에서 일은 물체에 힘이 작용하여 힘의 방향으로 물체가 이동했을 때 성립하며, 일의 양은 힘의 크기와 힘의 방향으로 이동한 거리를 곱하여 구합니다.","kw":[{"l":"힘의 방향으로 이동","a":["힘의 방향"]},{"l":"일 = 힘 × 이동 거리","a":["이동 거리","곱"]}]},{"id":"kj_S78","cat":"과학","grade":"중2","q":"과학에서 힘이 물체에 일을 하지 않은 것으로 보는 경우 세 가지를 설명하시오.","a":"물체에 작용한 힘이 0일 때, 힘을 작용해도 물체가 이동하지 않았을 때, 힘의 방향과 물체의 이동 방향이 서로 수직일 때는 힘이 물체에 한 일이 0입니다.","kw":[{"l":"힘이 0일 때","a":["힘이"]},{"l":"이동하지 않았을 때","a":["이동하지 않"]},{"l":"힘과 이동 방향이 수직일 때","a":["수직"]}]},{"id":"kj_S79","cat":"과학","grade":"중2","q":"동맥, 정맥, 모세 혈관에서 혈압, 혈관 총 단면적, 혈류 속도를 비교하시오.","a":"혈압은 동맥에서 가장 크고 모세 혈관, 정맥 순으로 낮아지며, 혈관의 총 단면적은 모세 혈관이 가장 크고, 혈류 속도는 총 단면적에 반비례하여 모세 혈관에서 가장 느립니다.","kw":[{"l":"혈압: 동맥이 가장 큼","a":["혈압"]},{"l":"총 단면적: 모세 혈관이 가장 큼","a":["단면적"]},{"l":"혈류 속도: 모세 혈관이 가장 느림","a":["혈류 속도","느림"]}]},{"id":"kj_S80","cat":"과학","grade":"중1","q":"열의 이동 방법인 전도, 대류, 복사를 설명하시오.","a":"전도는 입자가 이웃한 입자에 열을 차례로 전달하는 방법이고, 대류는 액체나 기체 입자가 직접 이동해 열을 전달하는 방법이며, 복사는 물질의 도움 없이 열이 직접 이동하는 방법입니다.","kw":[{"l":"전도: 입자가 차례로 전달","a":["전도"]},{"l":"대류: 입자가 직접 이동","a":["대류"]},{"l":"복사: 물질의 도움 없이 이동","a":["복사"]}]}],"TOP":[{"main":{"id":"kj_FU_A1","cat":"자소서","grade":"중3","q":"스포츠과학에 관심을 갖게 된 계기는 무엇이고, \"부상을 줄이고 운동수행능력을 높이는 요인\"에 대해 무엇을 알게 되었나요?","a":"어릴 적 축구선수로 뛰다가 부상을 겪으면서 \"같은 훈련을 해도 왜 어떤 선수는 다치고 어떤 선수는 기록이 오를까?\"라는 질문이 생겼습니다. 감으로 하는 훈련이 아니라 수치로 요인을 찾으면 부상은 줄이고 성적은 올릴 수 있겠다고 생각해서 스포츠과학에 관심을 갖게 되었습니다. 그 질문을 따라 찾아본 요인 중에서 가장 구체적으로 알게 된 것이 수면입니다. (부상의 종류와 그때 느낀 점은 「본인이 겪은 대로」 짧게 말하세요. 부상 이야기를 길게 하기보다 거기서 어떤 질문이 생겼는지가 핵심입니다.)","kw":[{"l":"축구선수","a":["축구선수"]},{"l":"부상","a":["부상"]},{"l":"\"왜 어떤 선수는 다치나\"","a":["선수는","다치나","어떤"]},{"l":"수치로 요인 찾기","a":["수치로","요인","찾기"]},{"l":"수면","a":["수면"]}]},"follow":{"id":"kj_FU_A1F","cat":"자소서","grade":"중3","q":"그 질문에 대한 답은 지금 어디까지 찾았나요?","a":"아직 일부만 찾았습니다. 직접 찾아본 것은 수면이고, 그 밖에 훈련량과 회복의 균형, 준비운동, 영양 같은 요인이 있다는 것은 자료로 아는 수준입니다. 그래서 입학 후에는 이런 요인들을 수학과 물리로 정량화해 보고 싶습니다. (「본인이 조사한 것」과 「자료로만 아는 것」을 구분해서 말하세요.)\n\n[추가 꼬리질문]\n1) 축구선수였던 경험이 과학 공부에 어떤 도움이 되었나요?\n   답: 몸으로 겪은 문제에서 질문이 시작되었다는 점입니다. 프리킥의 휘어짐이 궁금해서 마그누스 효과를 실험했고, 부상이 궁금해서 수면을 탐구했습니다. 그래서 교과서 속 개념이 제가 겪은 현상과 연결될 때 가장 오래 기억에 남고 재미있었습니다.","kw":[{"l":"아직 일부만 찾았습니다","a":["찾았습니다","일부만"]},{"l":"직접 찾아본 것은 수면이고, 그 밖에 훈련량과 회복의 균형, 준비운동…","a":["수준입니다","수면이고"]},{"l":"그래서 입학 후에는 이런 요인들을 수학과 물리로 정량화해 보고 싶습니…","a":["요인들을","정량화해"]}]}},{"main":{"id":"kj_FU_A2","cat":"자소서","grade":"중3","q":"수면과 운동수행능력의 관계를 어떻게 알아보았나요? 직접 측정했나요, 자료를 조사했나요?","a":"(「본인이 한 방식」을 정확히 말하세요. 직접 측정하지 않고 자료를 조사한 것이라면 그대로 말하는 것이 낫습니다.) 저는 수면 시간과 수면의 질이 피로 회복, 근육 회복, 신체 기능 유지에 어떤 역할을 하는지 조사했습니다. 충분히 자면 운동 중에 손상된 근육이 회복되고 신체 기능이 유지된다는 점을 알게 되었고, 그래서 스포츠에서 수면 같은 변인도 숫자로 분석해야 한다고 느꼈습니다.","kw":[{"l":"수면 시간","a":["수면 시간","수면","시간"]},{"l":"피로 회복","a":["피로 회복","피로","회복"]},{"l":"근육 회복","a":["근육 회복","근육","회복"]},{"l":"신체 기능 유지","a":["신체 기능 유지","신체","기능","유지"]},{"l":"변인을 정량적으로","a":["정량적으로","변인을"]}]},"follow":{"id":"kj_FU_A2F","cat":"자소서","grade":"중3","q":"\"7~8시간\"은 어디에서 나온 수치인가요? 중학생에게도 맞는 시간인가요?","a":"(「본인이 본 자료의 출처」를 말하세요.) 다만 청소년은 성인보다 더 긴 8~10시간이 권장된다고 알려져 있어서, 7~8시간은 성인 기준에 가까울 수 있습니다. 제가 본 자료가 어떤 대상이었는지 더 확인해 보겠습니다.\n\n[추가 꼬리질문]\n1) 잘 자서 운동을 잘하게 된 것인가요, 운동을 잘하는 선수가 잘 자는 것인가요?\n   답: 두 방향 모두 가능해서, 상관이 있다는 것만으로는 인과를 말할 수 없습니다. 나이, 훈련량, 컨디션 같은 다른 변인이 둘 다에 영향을 줄 수도 있습니다. 인과를 확인하려면 같은 선수가 수면 시간만 바꿔서 기록이 달라지는지 비교하는 실험이 필요합니다.","kw":[{"l":"(「본인이 본 자료의 출처」를 말하세요.) 다만 청소년은 성인보다 더…","a":["10시간이","권장된다고"]},{"l":"제가 본 자료가 어떤 대상이었는지 더 확인해 보겠습니다","a":["대상이었는지","보겠습니다"]}]}},{"main":{"id":"kj_FU_A3","cat":"자소서","grade":"중3","q":"피타고라스 승률이 무엇인가요? 왜 \"피타고라스\"라는 이름이 붙었나요?","a":"팀의 득점 RS와 실점 RA로 승률을 추정하는 식입니다. 승률 ≈ RS²/(RS²+RA²)입니다. 예를 들어 한 시즌에 700점을 내고 600점을 잃었다면 700²/(700²+600²)=490000/850000으로 약 0.576, 즉 승률 약 57.6%가 예상됩니다. 이름은 식이 직각삼각형의 a²+b²=c² 꼴과 비슷해서 붙었을 뿐, 피타고라스 정리와 수학적 관계가 있는 것은 아닙니다. 야구 통계학자 빌 제임스가 제안했습니다.","kw":[{"l":"RS²/(RS²+RA²)","a":["RS²","RA²"]},{"l":"득점·실점","a":["득점·실점","득점","실점"]},{"l":"700:600 → 약 57.6%","a":["700","600","57"]},{"l":"이름은 꼴이 비슷해서","a":["비슷해서","이름은","꼴이"]},{"l":"빌 제임스","a":["빌 제임스","제임스"]}]},"follow":{"id":"kj_FU_A3F","cat":"자소서","grade":"중3","q":"이 식은 야구에만 맞나요? 축구에도 쓸 수 있나요?","a":"야구에서 지수 2가 잘 맞는다고 알려져 있고 더 정밀한 지수로는 1.83 정도가 쓰입니다. 축구는 득점이 적어서 맞는 지수가 다르게 추정된다고 알려져 있는데, 값은 연구마다 다릅니다. (「본인이 직접 해본 종목과 결과」가 있으면 그것을 말하세요.) 중요한 것은 지수를 정해 놓고 쓰기보다 데이터에서 직접 구할 수 있다는 점입니다.\n\n[추가 꼬리질문]\n1) 예상 승률과 실제 승률이 다르면 왜 그런가요?\n   답: 한 점 차 경기의 승패 같은 운, 부상, 시즌 중 전력 변화가 원인이 될 수 있습니다. 같은 득실점이어도 점수가 몰려서 나오면 이기는 경기 수가 달라지기 때문입니다. 그래서 이 식은 팀의 진짜 실력을 추정하는 용도로 쓰이기도 합니다.","kw":[{"l":"야구에서 지수 2가 잘 맞는다고 알려져 있고 더 정밀한 지수로는 1.…","a":["야구에서","맞는다고"]},{"l":"축구는 득점이 적어서 맞는 지수가 다르게 추정된다고 알려져 있는데, …","a":["추정된다고","연구마다"]},{"l":"(「본인이 직접 해본 종목과 결과」가 있으면 그것을 말하세요.) 중요…","a":["데이터에서","「본인이"]}]}},{"main":{"id":"kj_FU_A4","cat":"자소서","grade":"중3","q":"타율을 수학적으로 어떻게 분석했나요? 타율만으로 타자의 능력을 판단할 수 있을까요?","a":"타율은 안타 수를 타수로 나눈 값입니다. (「본인이 분석한 방법」을 말하세요. 예: 선수 몇 명의 시즌 기록을 비교한 것.) 하지만 타율만으로는 부족합니다. 볼넷은 타수에 들어가지 않아서 출루 능력이 반영되지 않고, 단타와 홈런이 똑같이 안타 1개로 계산됩니다. 그래서 출루율과 장타율을 더한 OPS 같은 지표를 함께 봅니다.","kw":[{"l":"타율 = 안타 ÷ 타수","a":["타율","안타","타수"]},{"l":"볼넷 제외","a":["볼넷 제외","볼넷","제외"]},{"l":"단타와 홈런 같은 1","a":["단타와","홈런","같은"]},{"l":"출루율, 장타율, OPS","a":["출루율","장타율","OPS"]}]},"follow":{"id":"kj_FU_A4F","cat":"자소서","grade":"중3","q":"10타수 3안타와 300타수 90안타는 둘 다 3할인데 같은 능력인가요?","a":"같다고 보기 어렵습니다. 10타수는 표본이 작아서 우연의 영향이 크고, 300타수에서의 3할은 꾸준한 능력일 가능성이 더 큽니다. 표본이 클수록 평균이 안정적으로 수렴한다는 점이 통계에서 중요합니다.","kw":[{"l":"같다고 보기 어렵습니다","a":["어렵습니다","같다고"]},{"l":"10타수는 표본이 작아서 우연의 영향이 크고, 300타수에서의 3할은…","a":["300타수에서의","10타수는"]},{"l":"표본이 클수록 평균이 안정적으로 수렴한다는 점이 통계에서 중요합니다","a":["안정적으로","수렴한다는"]}]}},{"main":{"id":"kj_FU_A5","cat":"자소서","grade":"중3","q":"세종과학고에서 심화수학과 심화물리를 배워 스포츠과학에 어떻게 활용하고 싶은가요?","a":"수학에서는 확률과 통계로 부상 위험 요인을 분석하거나 승률 모델의 지수를 데이터로 추정해 보고 싶습니다. 물리에서는 운동량, 회전운동, 유체 속에서 받는 힘을 배워서 공의 움직임을 분석하고 싶습니다. 특히 자소서 2번의 마그누스 효과 탐구를 이어서, 프리킥 영상에서 공의 회전수와 휘어지는 정도의 관계를 분석해 보고 싶습니다. (학교의 정확한 프로그램 이름과 내용은 「본인이 조사한 것」으로 바꿔 말하세요.)","kw":[{"l":"확률·통계 → 부상 요인, 승률 모델","a":["확률","통계","부상"]},{"l":"물리 → 회전운동, 유체","a":["회전운동","물리","유체"]},{"l":"마그누스 탐구 연결","a":["마그누스","탐구","연결"]}]},"follow":{"id":"kj_FU_A5F","cat":"자소서","grade":"중3","q":"구체적인 연구 주제를 하나 제안해 보세요.","a":"\"프리킥에서 공의 회전수가 커질수록 옆으로 휘는 거리가 얼마나 늘어나는가\"를 슬로모션 영상으로 분석하는 것입니다. 공의 회전수와 휘어진 거리를 여러 번 측정해서 그래프로 그리고 관계식을 찾아볼 수 있습니다. 한계로는 영상으로 회전수를 세는 오차와 바람의 영향을 말하겠습니다.","kw":[{"l":"\"프리킥에서 공의 회전수가 커질수록 옆으로 휘는 거리가 얼마나 늘어나…","a":["프리킥에서","늘어나는가"]},{"l":"공의 회전수와 휘어진 거리를 여러 번 측정해서 그래프로 그리고 관계식…","a":["회전수와","측정해서"]},{"l":"한계로는 영상으로 회전수를 세는 오차와 바람의 영향을 말하겠습니다","a":["말하겠습니다","한계로는"]}]}},{"main":{"id":"kj_FU_A6","cat":"자소서","grade":"중3","q":"마그누스 효과 탐구를 처음부터 끝까지 설명해 주세요.","a":"축구의 프리킥과 야구의 변화구가 휘는 원리가 궁금해서 마그누스 효과를 직접 확인해 보려고 했습니다. 투명한 수조에 물을 채우고 물감을 떨어뜨려 흐름이 보이게 한 뒤, 회전이 없는 탁구공과 회전시킨 탁구공을 움직여서 물감의 흐름을 비교했습니다. 처음에는 부력과 물의 저항 때문에 궤적 변화가 잘 보이지 않았고, 손으로 던지면 세기가 매번 달랐습니다. 그래서 고무줄 발사 장치를 만들어 같은 조건에서 여러 번 실험했습니다. 그 결과 회전이 없을 때는 물감이 직선에 가깝게 흐르고, 회전이 있을 때는 한쪽으로 휘었으며 회전을 빠르게 할수록 더 뚜렷했습니다. 예상과 다른 결과가 나왔을 때 원인을 분석하고 방법을 고치는 것이 중요하다는 것을 배웠습니다.","kw":[{"l":"프리킥·변화구 궁금증","a":["프리킥","변화구","궁금증"]},{"l":"수조+물감+탁구공","a":["탁구공","수조","물감"]},{"l":"부력·저항 문제","a":["부력·저항 문제","부력","저항","문제"]},{"l":"고무줄 발사 장치","a":["고무줄","발사","장치"]},{"l":"회전 시 휘어짐","a":["회전 시 휘어짐","휘어짐","회전"]}]},"follow":{"id":"kj_FU_A6F","cat":"자소서","grade":"중3","q":"실험은 모두 몇 번 했고 결과는 어떻게 기록했나요?","a":"(「본인이 한 횟수와 기록 방법」을 정확히 말하세요.) 같은 조건에서 반복했고 결과는 「본인이 한 방식, 예: 영상 촬영, 사진, 그림」으로 비교했습니다. 반복 횟수가 적어서 정량적 결론은 어렵고 경향을 확인한 실험이라고 먼저 말하겠습니다.\n\n[추가 꼬리질문]\n1) 이 탐구에서 가장 힘들었던 점과 해결 과정은 무엇이었나요?\n   답: 궤적이 잘 안 보인 것과 매번 던지는 세기가 달랐던 것이 가장 힘들었습니다. 원인을 부력과 저항, 손의 불균일함으로 나누어 생각했고, 그중 손의 불균일함은 고무줄 발사 장치로 줄였습니다. 부력 문제는 완전히 해결하지 못해서 개선 과제로 남아 있습니다.","kw":[{"l":"(「본인이 한 횟수와 기록 방법」을 정확히 말하세요.) 같은 조건에서…","a":["비교했습니다","그림」으로"]},{"l":"반복 횟수가 적어서 정량적 결론은 어렵고 경향을 확인한 실험이라고 먼…","a":["말하겠습니다","실험이라고"]}]}},{"main":{"id":"kj_FU_A7","cat":"자소서","grade":"중3","q":"마그누스 효과란 무엇이고, 회전하는 공은 왜 휘나요?","a":"회전하는 공이 공기나 물 같은 유체 속을 움직일 때 진행 방향에 수직인 힘을 받는 현상입니다. 공 표면이 유체의 흐름과 같은 방향으로 움직이는 쪽은 유체가 빨라져서 압력이 낮아지고, 반대쪽은 느려져서 압력이 높아지므로 공은 압력이 낮은 쪽으로 힘을 받습니다. 다르게 말하면 공이 주변 유체를 한쪽으로 꺾어 보내기 때문에 그 반작용으로 반대쪽 힘을 받는 것입니다.","kw":[{"l":"회전 + 유체 속 이동","a":["회전","유체","이동"]},{"l":"진행 방향에 수직인 힘","a":["방향에","수직인","진행"]},{"l":"빠른 쪽 압력↓","a":["빠른 쪽 압력↓","압력↓","빠른"]},{"l":"유체를 꺾음 → 반작용","a":["유체를","반작용","꺾음"]}]},"follow":{"id":"kj_FU_A7F","cat":"자소서","grade":"중3","q":"톱스핀을 준 공은 어느 쪽으로 힘을 받나요?","a":"아래쪽입니다. 톱스핀에서는 공 윗면이 앞으로, 아랫면이 뒤로 움직입니다. 공 기준으로 공기는 뒤로 흐르므로 아랫면이 공기 흐름과 같은 방향으로 움직여서 아래쪽 흐름이 빨라지고 압력이 낮아집니다. 그래서 공이 아래로 휘어 빨리 떨어집니다.","kw":[{"l":"톱스핀에서는 공 윗면이 앞으로, 아랫면이 뒤로 움직입니다","a":["톱스핀에서는","움직입니다"]},{"l":"공 기준으로 공기는 뒤로 흐르므로 아랫면이 공기 흐름과 같은 방향으로…","a":["낮아집니다","기준으로"]},{"l":"그래서 공이 아래로 휘어 빨리 떨어집니다","a":["떨어집니다","그래서"]}]}},{"main":{"id":"kj_FU_A8","cat":"자소서","grade":"중3","q":"왜 수조와 물감, 탁구공을 선택했나요? 물과 공기는 다른데 같은 효과가 나타나나요?","a":"공기의 흐름은 눈에 보이지 않기 때문에, 물에서 물감을 떨어뜨리면 흐름이 눈에 보인다는 점을 이용했습니다. 탁구공은 가볍고 표면이 매끈하며 구하기 쉬워서 썼습니다. 마그누스 효과는 공기뿐 아니라 물을 포함한 모든 유체에서 일어나는 현상입니다. 다만 물은 공기보다 밀도와 점성이 훨씬 커서 같은 효과가 같은 크기로 나타나지는 않습니다.","kw":[{"l":"흐름 시각화","a":["흐름 시각화","시각화","흐름"]},{"l":"가볍고 매끈한 탁구공","a":["가볍고","매끈한","탁구공"]},{"l":"모든 유체에서 성립","a":["유체에서","모든","성립"]},{"l":"밀도·점성 차이","a":["밀도·점성 차이","밀도","점성","차이"]}]},"follow":{"id":"kj_FU_A8F","cat":"자소서","grade":"중3","q":"물에서의 결과를 공기 중 프리킥의 결과라고 말할 수 있나요?","a":"그대로는 말할 수 없습니다. 같은 원리가 작용한다는 것을 보였을 뿐 휘는 정도의 크기는 비교할 수 없습니다. 크기를 비교하려면 속도, 크기, 점성이 만드는 흐름의 성질이 비슷해야 하는데, 이는 C 문항의 레이놀즈 수와 연결됩니다.","kw":[{"l":"그대로는 말할 수 없습니다","a":["그대로는","없습니다"]},{"l":"같은 원리가 작용한다는 것을 보였을 뿐 휘는 정도의 크기는 비교할 수…","a":["작용한다는","없습니다"]},{"l":"크기를 비교하려면 속도, 크기, 점성이 만드는 흐름의 성질이 비슷해야…","a":["비교하려면","연결됩니다"]}]}},{"main":{"id":"kj_FU_A9","cat":"자소서","grade":"중3","q":"수조에서 예상한 궤적 변화가 뚜렷하지 않았던 이유는 무엇이라고 생각하나요?","a":"탁구공은 가벼워서 물속에서 부력이 중력보다 훨씬 큽니다. 계산해 보면 지름 4 cm, 질량 2.7 g인 탁구공의 부력은 약 0.33 N이고 무게는 약 0.026 N입니다. 그래서 공은 위로 뜨려는 힘이 크고, 물의 저항 때문에 속도도 빨리 줄어들어서 회전에 의한 옆 방향 힘이 잘 드러나지 않았다고 생각합니다. (위 숫자는 이론값 추정이고 「본인이 측정한 값」이 아닙니다.)","kw":[{"l":"부력 ≫ 무게","a":["부력 ≫ 무게","부력","무게"]},{"l":"약 0.33 N vs 0.026 N","a":["026","33","vs"]},{"l":"물의 큰 저항","a":["물의 큰 저항","물의","저항"]},{"l":"속도 빨리 감소","a":["속도 빨리 감소","속도","빨리","감소"]}]},"follow":{"id":"kj_FU_A9F","cat":"자소서","grade":"중3","q":"그렇다면 이 문제를 어떻게 해결할 수 있었을까요?","a":"공의 밀도를 물에 가깝게 만들어 부력과 중력의 차이를 줄이거나, 공을 줄에 매달아 위치를 고정한 채 물을 흘려보내는 방식으로 바꿀 수 있습니다. 또는 탁구공 대신 물속에서 가라앉는 공으로 비교할 수 있습니다.","kw":[{"l":"공의 밀도를 물에 가깝게 만들어 부력과 중력의 차이를 줄이거나, 공을…","a":["흘려보내는","줄이거나"]},{"l":"또는 탁구공 대신 물속에서 가라앉는 공으로 비교할 수 있습니다","a":["물속에서","가라앉는"]}]}},{"main":{"id":"kj_FU_A10","cat":"자소서","grade":"중3","q":"고무줄 발사 장치로 어떻게 같은 세기로 발사했고, 회전 속도는 어떻게 조절하고 확인했나요?","a":"고무줄을 매번 같은 길이만큼 당기면 저장되는 탄성에너지가 같으므로 비슷한 속도로 발사할 수 있습니다. (이 부분은 「본인이 한 방법」을 말하세요.) 속도가 실제로 같았는지는 「본인이 확인한 방법, 예: 영상에서 일정 거리를 지나는 시간」으로 확인했습니다. 회전은 고무줄이 만드는 것이 아니라서 발사 속도와 회전을 따로 다뤄야 했고, 회전 속도를 올렸다는 것은 「본인이 한 방법」으로 구분했습니다. 회전수를 수치로 재지는 못해서 회전이 더 빠르다는 것은 정성적으로만 말할 수 있습니다.","kw":[{"l":"같은 길이 당김 → 같은 탄성에너지","a":["탄성에너지","같은","길이"]},{"l":"속도 확인 방법","a":["속도 확인 방법","속도","확인","방법"]},{"l":"회전은 별도","a":["회전은 별도","회전은","별도"]},{"l":"회전수는 정성적","a":["회전수는 정성적","회전수는","정성적"]}]},"follow":{"id":"kj_FU_A10F","cat":"자소서","grade":"중3","q":"회전 속도를 어떻게 바꾸고, 어떻게 \"높였다\"고 판단했나요?","a":"(「본인이 한 방법」을 말하세요.) 만약 눈으로 보고 빠르다고 판단한 것이라면 정성적 판단이었다고 인정하고, 개선 방법으로 공에 표시선을 그려 영상에서 1초에 몇 바퀴 도는지 세는 방법을 말하겠습니다.","kw":[{"l":"(「본인이 한 방법」을 말하세요.) 만약 눈으로 보고 빠르다고 판단한…","a":["판단이었다고","말하겠습니다"]}]}},{"main":{"id":"kj_FU_A11","cat":"자소서","grade":"중3","q":"이 실험으로 마그누스 효과를 \"확인했다\"고 말할 수 있나요? 한계와 개선점은 무엇인가요?","a":"공의 회전에 따라 주변 물감의 흐름이 달라지는 경향은 확인했습니다. 하지만 공이 받는 힘의 크기를 측정하지는 못했고, 속도와 회전수를 수치로 통제하지 못했으며 반복 횟수도 적었습니다. 그래서 \"원리와 연결해서 이해했다\"가 정확한 표현이고 증명했다고는 말하기 어렵습니다. 개선하려면 스마트폰 슬로모션으로 궤적을 촬영해 각도와 이동 거리를 재고, 회전수를 바꿔 여러 번 반복해서 그래프로 그리겠습니다.","kw":[{"l":"경향은 확인","a":["경향은 확인","경향은","확인"]},{"l":"힘의 크기는 미측정","a":["크기는","미측정","힘의"]},{"l":"속도·회전 통제 부족","a":["속도","회전","통제"]},{"l":"영상 분석 + 반복 + 그래프","a":["그래프","영상","분석"]}]},"follow":{"id":"kj_FU_A11F","cat":"자소서","grade":"중3","q":"대조군은 무엇이었고, 어떤 변수를 통제했나요?","a":"회전이 없는 공이 대조군입니다. 통제한 변수는 같은 공, 같은 수조와 물, 같은 고무줄 당김 길이, 같은 발사 위치입니다. 바꾼 변수는 회전의 유무와 세기입니다.\n\n[추가 꼬리질문]\n1) 만약 회전이 없는 공도 한쪽으로 휘는 결과가 나왔다면 어떻게 해석했을까요?\n   답: 회전 때문이 아니라 실험 장치나 물의 움직임 때문일 수 있다고 의심했을 것입니다. 발사 장치의 방향이 비뚤어졌는지, 수조의 물이 이전 실험 때문에 아직 흔들리는지를 확인하고, 물이 가라앉은 뒤 다시 반복해서 대조군이 직선에 가까운지를 먼저 확인했을 것입니다.","kw":[{"l":"회전이 없는 공이 대조군입니다","a":["대조군입니다","회전이"]},{"l":"통제한 변수는 같은 공, 같은 수조와 물, 같은 고무줄 당김 길이, …","a":["위치입니다","통제한"]},{"l":"바꾼 변수는 회전의 유무와 세기입니다","a":["세기입니다","변수는"]}]}},{"main":{"id":"kj_FU_B4","cat":"자소서","grade":"중3","q":"\"흐르는 속도가 빠른 쪽은 압력이 낮다\"는 설명만으로 충분한가요?","a":"충분하지 않다고 알려져 있습니다. 압력 설명은 결과를 쉽게 설명하는 단순화이고, 실제로는 공 표면 근처의 얇은 층(경계층)이 점성 때문에 공의 회전과 함께 끌려가고, 공 뒤쪽의 흐름이 한쪽으로 꺾이면서 반작용으로 힘이 생깁니다. 중학교 수준에서는 압력 설명과 운동량 설명을 함께 말하고 한계를 인정하는 것이 좋습니다.","kw":[{"l":"압력 설명 = 단순화","a":["단순화","압력","설명"]},{"l":"경계층이 끌려감","a":["경계층이 끌려감","경계층이","끌려감"]},{"l":"뒤쪽 흐름이 꺾임 → 반작용","a":["흐름이","반작용","뒤쪽"]}]},"follow":{"id":"kj_FU_B4F","cat":"자소서","grade":"중3","q":"물감이 한쪽으로 휜다는 것은 공 주변에서 어떤 일이 일어난다는 뜻인가요?","a":"공 표면 근처의 물이 점성 때문에 회전하는 표면에 끌려서 함께 움직인다는 뜻입니다. 그래서 표면이 흐름과 같은 방향으로 움직이는 쪽은 물이 더 빨리 지나가고, 반대쪽은 느려집니다. 물감이 그 비대칭을 눈에 보이게 해준 것입니다.","kw":[{"l":"공 표면 근처의 물이 점성 때문에 회전하는 표면에 끌려서 함께 움직인…","a":["움직인다는","회전하는"]},{"l":"그래서 표면이 흐름과 같은 방향으로 움직이는 쪽은 물이 더 빨리 지나…","a":["느려집니다","방향으로"]},{"l":"물감이 그 비대칭을 눈에 보이게 해준 것입니다","a":["비대칭을","것입니다"]}]}},{"main":{"id":"kj_FU_A12","cat":"자소서","grade":"중3","q":"선거 방식에 따라 결과가 어떻게 달라지는지 탐구한 과정을 처음부터 끝까지 설명해 주세요.","a":"뉴스에서 선거 결과와 공정성에 대한 이야기를 보다가, 득표 수만이 아니라 계산 방식에 따라 결과가 달라질 수 있다는 점이 궁금했습니다. 그래서 학생 45명에게 한식·중식·일식·양식의 선호 순위를 조사하고, 같은 자료에 단순 다수제, 순차적 탈락제, 가중치 점수제, 비교 우위제를 적용해서 결과를 비교했습니다. 같은 자료인데 방식에 따라 결과가 달라지는 것을 보고 \"어떤 결과가 더 공정한가?\"라는 새로운 질문이 생겼습니다. 이 과정에서 큰 값과 작은 값을 어떻게 대응시키느냐에 따라 합이 달라지는 배열 부등식과 연결될 수 있다는 것을 알게 되어 추가로 탐구했습니다.","kw":[{"l":"뉴스 → 공정성 궁금증","a":["공정성","궁금증","뉴스"]},{"l":"45명 순위 조사","a":["45명","순위","조사"]},{"l":"4가지 방식 비교","a":["4가지","방식","비교"]},{"l":"결과가 다름","a":["결과가 다름","결과가","다름"]},{"l":"\"어느 결과가 공정한가\" → 배열 부등식","a":["공정한가","결과가","부등식"]}]},"follow":{"id":"kj_FU_A12F","cat":"자소서","grade":"중3","q":"45명은 어떻게 조사했고, 그 결과를 일반화할 수 있나요?","a":"(「본인이 조사한 방법」을 말하세요. 예: 같은 학교 학생에게 설문.) 45명은 특정 집단이어서 전체 사람의 선호라고 일반화할 수는 없습니다. 이 탐구의 목적은 선호 분포가 주어졌을 때 방식에 따라 결과가 달라지는 구조를 보는 것이어서, 표본이 작아도 구조는 보여줄 수 있다고 생각합니다.\n\n[추가 꼬리질문]\n1) 많은 주제 중 왜 음식 선호로 조사했나요?\n   답: 순위를 매기기 쉽고 사람마다 취향이 달라서 순위가 갈리기 쉬운 주제이기 때문입니다. 실제 선거 같은 민감한 주제가 아니어서 솔직한 순위를 받기도 좋았습니다. (「본인이 정한 이유」로 바꿔 말하세요.)","kw":[{"l":"(「본인이 조사한 방법」을 말하세요","a":["「본인이","방법」을"]},{"l":"예: 같은 학교 학생에게 설문.) 45명은 특정 집단이어서 전체 사람…","a":["집단이어서","학생에게"]},{"l":"이 탐구의 목적은 선호 분포가 주어졌을 때 방식에 따라 결과가 달라지…","a":["생각합니다","주어졌을"]}]}},{"main":{"id":"kj_FU_A13","cat":"자소서","grade":"중3","q":"단순 다수제, 순차적 탈락제, 가중치 점수제, 비교 우위제는 각각 어떻게 결과를 정하나요?","a":"단순 다수제는 1순위 표가 가장 많은 후보가 이깁니다. 순차적 탈락제는 1순위 표가 가장 적은 후보를 탈락시키고 그 표를 다음 순위 후보에게 넘기는 과정을 과반이 나올 때까지 반복합니다. 가중치 점수제는 1순위에 3점, 2순위에 2점, 3순위에 1점, 4순위에 0점처럼 점수를 주어 합이 가장 큰 후보가 이깁니다. 비교 우위제는 후보를 둘씩 맞붙여서 더 많은 표를 받은 쪽이 이기게 하고, 모든 후보를 이기는 후보가 있으면 그 후보가 승자입니다.","kw":[{"l":"다수제=1순위 최다","a":["다수제","1순위","최다"]},{"l":"순차 탈락=최하위 탈락 후 표 이동","a":["최하위","순차","탈락"]},{"l":"점수제=3·2·1·0 합","a":["점수제"]},{"l":"비교 우위=일대일 대결","a":["일대일","비교","우위"]}]},"follow":{"id":"kj_FU_A13F","cat":"자소서","grade":"중3","q":"가중치 점수제를 \"보다 방식\", 비교 우위제를 \"콩도르세 방식\"이라고도 하나요?","a":"네, 그렇게 불린다고 알고 있습니다. 가중치 점수제는 보다(Borda) 방식, 순차적 탈락제는 즉석 결선 투표(IRV)라고도 불리고, 비교 우위제에서 모든 후보를 이기는 후보를 콩도르세 승자라고 합니다.\n\n[추가 꼬리질문]\n1) 네 가지 방식 중 가장 좋은 방식은 무엇이라고 생각하나요?\n   답: 어떤 기준을 중요하게 보느냐에 따라 달라서 하나만 고를 수 없다고 생각합니다. 예를 들어 과반 지지를 중시하면 순차적 탈락제, 선호의 강도를 반영하려면 가중치 점수제, 일대일 대결에서 지지 받는 후보가 필요하면 비교 우위제가 맞습니다. 단순 다수제는 간단하지만 과반이 아닌 후보가 뽑힐 수 있습니다.","kw":[{"l":"네, 그렇게 불린다고 알고 있습니다","a":["불린다고","있습니다"]},{"l":"가중치 점수제는 보다(Borda) 방식, 순차적 탈락제는 즉석 결선 …","a":["우위제에서","점수제는"]}]}},{"main":{"id":"kj_FU_A14","cat":"자소서","grade":"중3","q":"같은 자료로 방식마다 결과가 어떻게 달랐나요? 구체적으로 계산해 보여 주세요.","a":"(「본인의 실제 조사 결과」로 바꿔 말하세요. 아래는 이해를 돕기 위한 가상 예시입니다.) 45명이 이렇게 답했다고 합시다. 19명은 한식>중식>일식>양식, 12명은 일식>양식>중식>한식, 10명은 양식>일식>중식>한식, 4명은 중식>양식>한식>일식입니다. 단순 다수제는 1순위가 19표인 한식이 이깁니다. 순차적 탈락제는 1순위가 4표인 중식이 먼저 탈락해 그 표가 양식으로 가서 양식 14표가 되고, 다음에 12표인 일식이 탈락하면 일식을 1순위로 한 표가 양식으로 가서 양식이 26표가 되어 과반(23표)을 넘으므로 양식이 이깁니다. 가중치 점수제는 한식 61점, 중식 72점, 일식 75점, 양식 62점이어서 일식이 이깁니다(총점은 항상 45×6=270점). 비교 우위제는 중식이 한식을 26:19, 일식을 23:22, 양식을 23:22로 이겨서 중식이 이깁니다. 같은 자료로 네 방식이 서로 다른 후보를 뽑았습니다.","kw":[{"l":"다수제 → 한식","a":["다수제 → 한식","다수제","한식"]},{"l":"순차 탈락 → 양식(26표)","a":["26표","순차","탈락"]},{"l":"점수제 → 일식(75점)","a":["점수제","75점","일식"]},{"l":"비교 우위 → 중식","a":["비교","우위","중식"]},{"l":"총점 270","a":["총점 270","270","총점"]}]},"follow":{"id":"kj_FU_A14F","cat":"자소서","grade":"중3","q":"중식은 1순위가 4표뿐인데 왜 비교 우위제에서는 이기나요?","a":"비교 우위제는 1순위가 아니라 일대일 대결에서 어느 쪽이 더 높은 순위인지를 보기 때문입니다. 중식을 1순위로 한 사람은 적지만 많은 사람이 중식을 상위권에 두었기 때문에, 한 후보와 일대일로 맞붙을 때마다 더 많은 표를 받습니다.","kw":[{"l":"비교 우위제는 1순위가 아니라 일대일 대결에서 어느 쪽이 더 높은 순…","a":["순위인지를","때문입니다"]},{"l":"중식을 1순위로 한 사람은 적지만 많은 사람이 중식을 상위권에 두었기…","a":["1순위로","상위권에"]}]}},{"main":{"id":"kj_FU_A15","cat":"자소서","grade":"중3","q":"가중치를 3·2·1점으로 한 이유는 무엇인가요? 다른 가중치를 쓰면 결과가 달라지나요?","a":"순위가 높을수록 점수를 더 주되 계산이 간단하도록 3·2·1·0으로 했습니다. 모든 응답자가 모든 후보의 순위를 매겼다면 4·3·2·1처럼 모든 가중치에 같은 수를 더해도 후보 사이의 점수 차는 변하지 않아서 순위는 같습니다. 하지만 간격을 바꾸면 달라질 수 있습니다. 위 가상 예시에서 가중치를 5·2·1·0으로 바꾸면 한식 99점, 중식 80점, 일식 99점, 양식 82점이 되어 한식과 일식이 동점이 됩니다. 가중치 선택 자체가 결과에 영향을 주는 것이 가중치 점수제의 약점입니다.","kw":[{"l":"3·2·1·0","a":["3·2·1·0"]},{"l":"모든 가중치에 같은 수를 더해도 순위 같음","a":["가중치에","더해도","모든"]},{"l":"간격이 바뀌면 달라짐","a":["간격이","바뀌면","달라짐"]},{"l":"5·2·1·0 → 한식=일식 99점","a":["99점","한식","일식"]}]},"follow":{"id":"kj_FU_A15F","cat":"자소서","grade":"중3","q":"가중치는 누가 어떻게 정해야 공정한가요?","a":"투표를 하기 전에 모두가 합의해서 정해야 합니다. 결과를 본 뒤에 가중치를 고르면 원하는 후보가 이기도록 조작할 수 있기 때문입니다. 예시에서 3·2·1·0이면 일식이 이기고 5·2·1·0이면 한식과 일식이 동점이 되었으니, 가중치 선택이 결과를 바꿀 수 있다는 점을 투표 전에 알려야 합니다.","kw":[{"l":"투표를 하기 전에 모두가 합의해서 정해야 합니다","a":["합의해서","투표를"]},{"l":"결과를 본 뒤에 가중치를 고르면 원하는 후보가 이기도록 조작할 수 있…","a":["때문입니다","가중치를"]},{"l":"예시에서 3·2·1·0이면 일식이 이기고 5·2·1·0이면 한식과 일…","a":["예시에서","되었으니"]}]}},{"main":{"id":"kj_FU_A16","cat":"자소서","grade":"중3","q":"어떤 결과를 더 공정하다고 판단할 수 있을까요? 이 질문에 어떻게 답했나요?","a":"정답이 하나로 정해져 있지 않고, 어떤 기준으로 공정성을 볼지를 먼저 정해야 한다고 생각합니다. 예를 들어 과반의 지지를 받은 후보가 이겨야 한다는 기준, 다른 모든 후보와 일대일로 이기는 후보가 이겨야 한다는 기준, 선호의 강도도 반영해야 한다는 기준이 있습니다. 단순 다수제는 1순위가 19표(약 42%)인 한식도 이길 수 있어서 과반 지지가 아닌 후보가 뽑힐 수 있고, 비교 우위제는 일대일에서 모두 이기는 후보가 없을 수도 있습니다. 각 방식이 어떤 기준은 만족하고 어떤 기준은 어긴다는 것을 알게 되었습니다. (「본인이 내린 결론」이 있으면 이어서 말하세요.)","kw":[{"l":"공정성 기준을 먼저 정함","a":["공정성","기준을","먼저"]},{"l":"과반 기준","a":["과반 기준","과반","기준"]},{"l":"일대일 우위 기준","a":["일대일","우위","기준"]},{"l":"선호 강도","a":["선호 강도","선호","강도"]},{"l":"방식마다 장단점","a":["방식마다 장단점","방식마다","장단점"]}]},"follow":{"id":"kj_FU_A16F","cat":"자소서","grade":"중3","q":"과반 지지를 받지 못한 후보가 뽑히면 문제가 되나요?","a":"과반의 지지를 받지 못한 후보가 뽑히면 대표성이 약하다는 문제가 있습니다. 예시에서 한식은 1순위 42% 지지로 이기지만 나머지 58%는 다른 후보를 1순위로 골랐습니다. 그래서 결선 투표나 순차적 탈락제처럼 과반을 확보하는 방식이 쓰입니다. 다만 순차적 탈락제로 뽑힌 양식은 처음 1순위가 22%였던 후보라, 어떤 방식이든 약점이 있다는 것을 보았습니다.","kw":[{"l":"과반의 지지를 받지 못한 후보가 뽑히면 대표성이 약하다는 문제가 있습…","a":["대표성이","약하다는"]},{"l":"예시에서 한식은 1순위 42% 지지로 이기지만 나머지 58%는 다른 …","a":["골랐습니다","예시에서"]},{"l":"그래서 결선 투표나 순차적 탈락제처럼 과반을 확보하는 방식이 쓰입니다","a":["탈락제처럼","확보하는"]}]}},{"main":{"id":"kj_FU_A17","cat":"자소서","grade":"중3","q":"배열 부등식이 무엇이고, 선거 탐구와 어떻게 연결되나요?","a":"배열 부등식은 a₁≤a₂≤…≤aₙ, b₁≤b₂≤…≤bₙ일 때, 같은 순서끼리 곱해서 더한 합 a₁b₁+…+aₙbₙ이 가장 크고, 반대 순서끼리 곱해서 더한 합 a₁bₙ+…+aₙb₁이 가장 작으며, 그 밖의 대응은 그 사이에 있다는 성질입니다. 가중치 점수제에서 한 후보의 점수는 (가중치)×(그 순위를 준 표 수)의 합입니다. 큰 가중치와 큰 표 수가 만나도록 대응되면 점수가 커지고 반대로 대응되면 작아지기 때문에, 같은 개수의 표라도 상위 순위에 몰려 있는지 하위 순위에 몰려 있는지에 따라 점수가 달라진다는 것을 설명하는 데 썼습니다. (식을 어떻게 세웠는지 「본인이 한 대로」 말하세요. 두 개념의 연결은 비유에 가까운 부분이 있다는 점을 먼저 인정하는 것이 안전합니다.)","kw":[{"l":"같은 순서 곱의 합 최대","a":["같은","순서","곱의"]},{"l":"반대 순서 곱의 합 최소","a":["반대","순서","곱의"]},{"l":"점수 = 가중치×표 수의 합","a":["가중치×표","점수","수의"]},{"l":"상위에 몰릴수록 점수↑","a":["몰릴수록","상위에","점수↑"]}]},"follow":{"id":"kj_FU_A17F","cat":"자소서","grade":"중3","q":"등호는 언제 성립하나요?","a":"한 수열의 모든 값이 같을 때는 어떻게 짝지어도 합이 같아서 등호가 성립합니다. 두 수열이 모두 변하는 경우에는 일반적으로 순서가 다르면 합이 달라집니다.\n\n[추가 꼬리질문]\n1) 배열 부등식으로 어떤 선거 방식이 더 공정한지 알 수 있나요?\n   답: 아닙니다. 방식 사이의 우열을 가리는 것이 아니라, 가중치와 표 수를 대응시키는 방식에 따라 합이 달라진다는 구조를 보여주는 도구로 썼습니다. 공정성은 별도의 기준을 정해야 판단할 수 있습니다.","kw":[{"l":"한 수열의 모든 값이 같을 때는 어떻게 짝지어도 합이 같아서 등호가 …","a":["성립합니다","짝지어도"]},{"l":"두 수열이 모두 변하는 경우에는 일반적으로 순서가 다르면 합이 달라집…","a":["일반적으로","달라집니다"]}]}},{"main":{"id":"kj_FU_A18","cat":"자소서","grade":"중3","q":"중학교 축구부 활동에서 협력과 소통에 대해 어떤 것을 배웠나요? 주장과 부주장은 어떻게 뽑았나요?","a":"저희 팀은 축구 실력이 뛰어난 선수를 주장으로, 리더십과 소통 능력이 뛰어난 선수를 부주장으로 뽑았습니다. 훈련 중 서로의 부족한 점을 지적하다가 갈등이 생겼을 때, 부주장이 양쪽 의견을 먼저 들어 주었고 갈등이 빠르게 풀리면서 팀워크도 좋아졌습니다. 저는 그 모습을 보면서 소통에서 가장 중요한 것은 말하기 전에 듣는 것이라는 점을 배웠습니다. (본인의 포지션과 역할은 「본인이 한 대로」 말하세요.)","kw":[{"l":"실력 → 주장","a":["실력 → 주장","실력","주장"]},{"l":"소통 → 부주장","a":["소통 → 부주장","부주장","소통"]},{"l":"지적하다 갈등","a":["지적하다 갈등","지적하다","갈등"]},{"l":"의견을 먼저 들음","a":["의견을","먼저","들음"]},{"l":"듣는 것이 먼저","a":["듣는 것이 먼저","듣는","것이","먼저"]}]},"follow":{"id":"kj_FU_A18F","cat":"자소서","grade":"중3","q":"주장은 실력, 부주장은 소통으로 뽑는 방식을 어떻게 생각하나요?","a":"역할을 나눈다는 점에서 장점이 있다고 생각합니다. 실력이 좋은 선수는 경기에서 팀을 이끌고, 소통에 강한 선수는 갈등을 조율합니다. 단점은 주장이 갈등 상황에서 빠지면 부주장에게 부담이 몰릴 수 있다는 것입니다. 그래서 주장도 듣는 태도를 함께 가져야 한다고 생각합니다.\n\n[추가 꼬리질문]\n1) 지적 때문에 생긴 갈등이 구체적으로 어떤 상황이었나요?\n   답: (「본인이 본 대로」 누가 누구에게 무엇을 지적했는지 한 장면으로 말하세요.) 중요한 것은 지적 자체가 아니라 말하는 방식과 상대가 받아들이는 방식이 달랐다는 점이었습니다.","kw":[{"l":"역할을 나눈다는 점에서 장점이 있다고 생각합니다","a":["생각합니다","나눈다는"]},{"l":"실력이 좋은 선수는 경기에서 팀을 이끌고, 소통에 강한 선수는 갈등을…","a":["조율합니다","경기에서"]},{"l":"단점은 주장이 갈등 상황에서 빠지면 부주장에게 부담이 몰릴 수 있다는…","a":["부주장에게","상황에서"]}]}},{"main":{"id":"kj_FU_A19","cat":"자소서","grade":"중3","q":"부주장이 갈등을 풀 때 구체적으로 어떻게 했고, 본인은 거기서 무엇을 느꼈나요?","a":"(「본인이 본 대로」 말하세요.) 부주장은 먼저 두 선수에게 각자의 이야기를 끝까지 하게 했고, 중간에 판단하거나 끼어들지 않았습니다. 그다음 양쪽 입장을 정리해서 서로 확인하게 하자 갈등이 빨리 풀렸습니다. 저는 그 모습을 보고 갈등이 풀리는 것은 누가 맞고 틀린지 가려서가 아니라 서로 이해받았다고 느낄 때라는 것을 알게 되었습니다.","kw":[{"l":"끝까지 듣기","a":["끝까지 듣기","끝까지","듣기"]},{"l":"판단하지 않음","a":["판단하지 않음","판단하지","않음"]},{"l":"입장 정리하고 확인","a":["정리하고","입장","확인"]},{"l":"이해받았다고 느낄 때 풀림","a":["이해받았다고","느낄","풀림"]}]},"follow":{"id":"kj_FU_A19F","cat":"자소서","grade":"중3","q":"본인이 그 상황에서 부주장이었다면 같은 방식으로 할 수 있었을까요?","a":"처음에는 어려웠을 것 같습니다. 그때의 저는 결과를 빨리 내는 데 더 집중했기 때문입니다. 지금은 먼저 듣는 연습을 하고 있고, 조별과제에서 한 명씩 의견을 물어본 것이 그 연습이었습니다. (「본인의 솔직한 생각」으로 바꿔 말하세요.)","kw":[{"l":"처음에는 어려웠을 것 같습니다","a":["처음에는","어려웠을"]},{"l":"그때의 저는 결과를 빨리 내는 데 더 집중했기 때문입니다","a":["때문입니다","집중했기"]},{"l":"지금은 먼저 듣는 연습을 하고 있고, 조별과제에서 한 명씩 의견을 물…","a":["연습이었습니다","조별과제에서"]}]}},{"main":{"id":"kj_FU_A20","cat":"자소서","grade":"중3","q":"조별과제에서 결과를 완성하는 데 급급했다는 것은 어떤 경험이었고, 그 뒤에 무엇을 바꾸었나요?","a":"(「본인이 겪은 조별과제」를 구체적으로 말하세요.) 이전에는 마감과 결과물만 생각해서 팀원의 의견을 충분히 듣지 않고 제가 정리해 완성하는 데 급급했습니다. 축구부에서 의견을 먼저 듣는 모습을 본 뒤로는 조별과제에서 모든 팀원이 참여할 수 있도록 한 사람씩 의견을 물어보았습니다. 시간은 더 걸렸지만 서로 의견을 존중하고 협력하는 과정이 있어야 결과도 더 좋아진다고 생각하게 되었습니다.","kw":[{"l":"결과 중심 → 과정 중시","a":["결과","중심","과정"]},{"l":"한 명씩 의견 묻기","a":["명씩","의견","묻기"]},{"l":"모두 참여","a":["모두 참여","모두","참여"]},{"l":"존중과 협력","a":["존중과 협력","존중과","협력"]}]},"follow":{"id":"kj_FU_A20F","cat":"자소서","grade":"중3","q":"한 명씩 물어봤는데 의견이 모두 다르면 어떻게 정하나요?","a":"먼저 과제의 목표와 기준을 같이 정하고, 각 의견이 기준에 얼마나 맞는지 근거로 비교합니다. 그래도 정해지지 않으면 투표를 하되, 선거 탐구에서 본 것처럼 투표 방식에 따라 결과가 달라질 수 있어서 어떤 방식으로 정할지를 먼저 합의합니다. 선택되지 않은 의견도 장점을 일부 반영하려고 합니다.\n\n[추가 꼬리질문]\n1) 마감이 얼마 남지 않았을 때도 모든 의견을 들을 수 있나요?\n   답: 시간이 부족하면 의견을 듣는 방식을 바꿉니다. 각자 짧게 핵심만 말하게 하고 시간을 정해 두는 식입니다. 의견을 아예 듣지 않고 결정하는 것보다 짧게라도 듣는 것이 갈등과 재작업을 줄인다고 생각합니다.","kw":[{"l":"먼저 과제의 목표와 기준을 같이 정하고, 각 의견이 기준에 얼마나 맞…","a":["비교합니다","과제의"]},{"l":"그래도 정해지지 않으면 투표를 하되, 선거 탐구에서 본 것처럼 투표 …","a":["합의합니다","정해지지"]},{"l":"선택되지 않은 의견도 장점을 일부 반영하려고 합니다","a":["반영하려고","선택되지"]}]}},{"main":{"id":"kj_FU_A21","cat":"자소서","grade":"중3","q":"「세이노의 가르침」을 읽은 이유와 가장 인상 깊었던 내용, 그리고 실제로 실천한 것은 무엇인가요?","a":"(책의 구체적인 내용은 「본인이 읽은 대로」 말하세요. 책 내용을 정확히 확인하지 못해서 이 자료에는 구체적인 문장을 쓰지 않았습니다.) 이 책을 자기주도성과 실천력에 대한 이야기로 읽었습니다. 제일 인상 깊었던 것은 「본인이 고른 구절이나 주장」이고, 그 이유는 「본인의 이유」입니다. 실천한 것은 「본인이 한 것, 예: 계획을 세워 매일 하기」입니다. 탐구에서도 마그누스 효과 실험이 잘 안 되자 고무줄 발사 장치를 직접 만들어 해결했던 경험이 이 책의 실천력과 연결된다고 생각합니다.","kw":[{"l":"자기주도성","a":["자기주도성"]},{"l":"실천력","a":["실천력"]},{"l":"인상 깊은 구절","a":["인상 깊은 구절","인상","깊은","구절"]},{"l":"실제로 한 것","a":["실제로 한 것","실제로"]},{"l":"고무줄 장치 경험","a":["고무줄","장치","경험"]}]},"follow":{"id":"kj_FU_A21F","cat":"자소서","grade":"중3","q":"책에서 읽은 내용을 실천하다가 잘 안 된 경험이 있나요?","a":"(「본인이 겪은 대로」 말하세요.) 실패한 이유를 분석하고 방법을 바꾼 경험을 말하면 가장 좋습니다. 마그누스 실험에서 손으로 던지면 세기가 달랐던 문제를 장치로 바꾼 것도 그런 예입니다.","kw":[{"l":"(「본인이 겪은 대로」 말하세요.) 실패한 이유를 분석하고 방법을 바…","a":["「본인이","말하세요"]},{"l":"마그누스 실험에서 손으로 던지면 세기가 달랐던 문제를 장치로 바꾼 것…","a":["마그누스","실험에서"]}]}},{"main":{"id":"kj_FU_A22","cat":"자소서","grade":"중3","q":"「하늘과 바람과 별과 인간」은 어떤 책이고, 물리학이나 과학적 사고에 대해 무엇을 알게 되었나요?","a":"(책의 구체적인 내용과 저자는 「본인이 읽은 대로」 말하세요. 이 자료는 책 내용을 확인하지 못했습니다.) 이 책에서 물리학이 하늘, 바람, 별 같은 자연 현상을 이해하는 방식과 인간이 자연을 바라보는 시선에 대해 생각했습니다. 인상 깊었던 부분은 「본인이 읽은 내용」입니다. 과학적 사고란 현상을 관찰하고 이유를 질문하며 근거로 확인하는 태도라고 생각하게 되었습니다. 이 책의 \"바람\"은 제 마그누스 효과 탐구에서 다룬 공기의 흐름과도 이어집니다.","kw":[{"l":"하늘·바람·별","a":["하늘·바람·별","하늘","바람"]},{"l":"물리학으로 자연 이해","a":["물리학으로","자연","이해"]},{"l":"과학적 사고 = 관찰·질문·근거","a":["과학적","사고","관찰"]},{"l":"바람 = 유체 흐름","a":["바람","유체","흐름"]},{"l":"인간과 자연","a":["인간과 자연","인간과","자연"]}]},"follow":{"id":"kj_FU_A22F","cat":"자소서","grade":"중3","q":"이 책에서 배운 개념 중 하나를 쉽게 설명해 보세요.","a":"(「본인이 책에서 읽은 개념 하나」를 골라 준비하세요. 설명할 수 없는 개념은 말하지 마세요.) 예를 들어 「개념」은 「본인의 설명」입니다.\n\n[추가 꼬리질문]\n1) 이 책을 읽고 인간과 자연의 관계에 대해 어떤 생각을 하게 되었나요?\n   답: (「본인의 생각」을 말하세요.) 과학은 자연을 이해하는 방법이고, 이해한 것을 인간이 어떻게 쓰는지가 중요하다고 생각합니다. 스포츠과학도 몸과 움직임에 대한 이해를 부상 예방과 건강에 쓰는 일이라고 생각합니다.","kw":[{"l":"(「본인이 책에서 읽은 개념 하나」를 골라 준비하세요","a":["준비하세요","「본인이"]},{"l":"설명할 수 없는 개념은 말하지 마세요.) 예를 들어 「개념」은 「본인…","a":["설명」입니다","「개념」은"]}]}},{"main":{"id":"kj_FU_A23","cat":"자소서","grade":"중3","q":"내시 균형이 무엇인가요? 죄수의 딜레마로 설명해 보세요.","a":"내시 균형은 모든 참가자가 각자 상대의 선택을 고정해 놓고 보았을 때 자기 선택을 바꿔도 더 이득이 되지 않는 상태입니다. 죄수의 딜레마에서 두 죄수가 모두 침묵하면 각각 1년, 한 명만 자백하면 자백한 쪽은 0년이고 침묵한 쪽은 10년, 둘 다 자백하면 각각 5년을 받는다고 합시다. 상대가 침묵하든 자백하든 나는 자백하는 것이 더 이익이므로 둘 다 자백하는 것이 내시 균형입니다.","kw":[{"l":"상대 선택 고정","a":["상대 선택 고정","상대","선택","고정"]},{"l":"혼자 바꿔도 이득 없음","a":["바꿔도","혼자","이득"]},{"l":"죄수의 딜레마","a":["죄수의 딜레마","죄수의","딜레마"]},{"l":"(자백, 자백) 5년씩","a":["5년씩","자백"]}]},"follow":{"id":"kj_FU_A23F","cat":"자소서","grade":"중3","q":"내시 균형이 항상 가장 좋은 결과인가요?","a":"아닙니다. 죄수의 딜레마에서 둘 다 침묵하면 각각 1년이어서 둘 다 자백하는 5년씩보다 둘 모두에게 좋은데도, 각자가 이익을 따지면 둘 다 자백하는 균형으로 갑니다. 개인의 합리적 선택이 모두에게 최선이 아닌 결과를 만들 수 있다는 점이 핵심입니다.\n\n[추가 꼬리질문]\n1) 내시 균형을 현실의 예로 설명할 수 있나요?\n   답: (「책에서 읽은 예」가 있으면 그것을 말하세요.) 두 가게가 가격 경쟁을 하다가 모두 가격을 내려서 둘 다 이익이 줄어드는 경우가 비슷한 구조입니다. 한 곳이 가격을 올려도 상대가 올리지 않으면 손해를 보므로 아무도 올리지 못합니다.","kw":[{"l":"죄수의 딜레마에서 둘 다 침묵하면 각각 1년이어서 둘 다 자백하는 5…","a":["딜레마에서","1년이어서"]},{"l":"개인의 합리적 선택이 모두에게 최선이 아닌 결과를 만들 수 있다는 점…","a":["핵심입니다","모두에게"]}]}},{"main":{"id":"kj_FU_A24","cat":"자소서","grade":"중3","q":"세 권의 책이 본인의 탐구나 진로와 어떻게 이어지나요?","a":"「세이노의 가르침」은 실천력과 자기주도성을 생각하게 해서, 실험이 막혔을 때 방법을 바꿔 끝까지 해 본 태도와 이어집니다. 「하늘과 바람과 별과 인간」은 자연 현상을 물리로 이해하는 시선을 주어서 마그누스 효과의 유체 흐름 탐구와 이어집니다. 「존 내쉬가 들려주는 의사결정이론 이야기」는 합리적 의사결정과 게임이론을 알려 주어서, 선거 방식에 따라 결과가 달라지는 수학 탐구와 스포츠에서의 전략적 선택으로 이어집니다.","kw":[{"l":"실천력 ↔ 고무줄 장치","a":["실천력","고무줄","장치"]},{"l":"유체 흐름 ↔ 마그누스","a":["마그누스","유체","흐름"]},{"l":"의사결정 ↔ 선거 탐구, 스포츠 전략","a":["의사결정","스포츠","선거"]}]},"follow":{"id":"kj_FU_A24F","cat":"자소서","grade":"중3","q":"세 권 중 한 권만 친구에게 추천한다면 어떤 책이고 왜인가요?","a":"(「본인의 선택과 이유」를 말하세요.) 과학고 면접이라면 「존 내쉬가 들려주는 의사결정이론 이야기」를 고르고, 선거 탐구와 연결되는 이유를 말하는 것이 가장 자연스럽습니다.","kw":[{"l":"(「본인의 선택과 이유」를 말하세요.) 과학고 면접이라면 「존 내쉬가…","a":["자연스럽습니다","의사결정이론"]}]}},{"main":{"id":"kj_FU_B11","cat":"자소서","grade":"중3","q":"내시 균형을 축구의 페널티킥에 적용해 설명해 보세요.","a":"키커는 왼쪽이나 오른쪽으로 차고, 골키퍼는 왼쪽이나 오른쪽으로 몸을 날립니다. 같은 쪽이면 막히고 다른 쪽이면 골이 들어간다고 보고, 가상으로 같은 쪽일 때 득점 확률을 0.3, 다른 쪽일 때 0.9라고 합시다. 키커가 늘 한쪽으로만 차면 골키퍼가 그쪽을 막으면 되므로 한쪽으로 정하는 전략은 균형이 될 수 없습니다. 둘 다 왼쪽과 오른쪽을 확률 1/2씩 섞으면, 상대가 어느 쪽을 택해도 득점 확률이 0.5×0.3+0.5×0.9=0.6으로 같아서 어느 쪽도 선택을 바꿔 이득을 볼 수 없으므로 균형이 됩니다. 이렇게 확률로 섞는 전략을 혼합 전략이라고 합니다. (숫자는 설명을 위한 가상의 값입니다.)","kw":[{"l":"키커 좌/우","a":["키커 좌/우","키커"]},{"l":"골키퍼 좌/우","a":["골키퍼 좌/우","골키퍼"]},{"l":"한쪽으로만은 균형 아님","a":["한쪽으로만은","균형","아님"]},{"l":"1/2씩 섞음 → 득점 0.6","a":["2씩","섞음","득점"]},{"l":"혼합 전략","a":["혼합 전략","혼합","전략"]}]},"follow":{"id":"kj_FU_B11F","cat":"자소서","grade":"중3","q":"실제 선수들도 이렇게 행동하나요?","a":"실제 프로 선수들의 페널티킥 자료가 이런 예측과 대체로 비슷하게 나타난다는 연구가 있다고 알고 있습니다. 다만 선수마다 잘 차는 방향이 있어서 확률이 정확히 1/2은 아닐 수 있고, 제가 그 자료를 직접 확인한 것은 아닙니다.","kw":[{"l":"실제 프로 선수들의 페널티킥 자료가 이런 예측과 대체로 비슷하게 나타…","a":["나타난다는","선수들의"]},{"l":"다만 선수마다 잘 차는 방향이 있어서 확률이 정확히 1/2은 아닐 수…","a":["선수마다","아닙니다"]}]}},{"main":{"id":"kj_FU_J1","cat":"자소서","grade":"중3","q":"마그누스 효과에 대해 답하세요. (1) 마그누스 효과가 무엇인지 설명하세요. (2) 어떤 방법으로 실험했나요? (3) 결과는 어땠고 예상과 같았나요? (4) 실험에서 일정하게 해야 하는 조건은 무엇이었나요?","a":"(1) 회전하면서 공기나 물 속을 움직이는 물체가 회전 방향에 따라 옆으로 휘는 현상입니다. 공 주변의 유체 속도가 한쪽은 빨라지고 다른 쪽은 느려져 압력 차이가 생기고, 압력이 높은 쪽에서 낮은 쪽으로 힘을 받기 때문이라고 이해했습니다. 야구의 커브볼과 축구의 감아차기에 나타납니다. (2)~(3) (「본인이 한 방법과 결과」로 바꿔 말하세요.) 수조에서 탁구공을 회전시켜 던지고 물감의 흐름과 궤적을 관찰했습니다. 결과가 뚜렷하지 않았을 때 원인을 부력, 물의 저항, 던지는 세기의 불균일함으로 나누어 생각했고, 던지는 세기를 일정하게 하려고 고무줄 발사 장치를 썼습니다. (4) 공의 크기와 질량, 던지는 세기와 각도, 물의 양과 온도를 같게 하고 회전 여부만 바꿔야 비교가 됩니다.","kw":[{"l":"회전 → 속도·압력 차 → 힘","a":["회전","속도","압력"]},{"l":"변인 통제","a":["변인 통제","변인","통제"]},{"l":"회전 있음/없음 비교","a":["회전","비교"]}]},"follow":{"id":"kj_FU_J1F","cat":"자소서","grade":"중3","q":"대조군은 무엇이었고, 실험군과의 차이는 무엇인가요? 왜 대조군을 두나요?","a":"대조군은 회전을 주지 않고 같은 세기로 던진 공이고, 실험군은 회전을 준 공입니다. 둘의 차이는 회전 하나뿐이어야 하고, 대조군이 있어야 궤적이 휘는 것이 회전 때문인지 다른 요인 때문인지 구분할 수 있습니다.","kw":[{"l":"대조군은 회전을 주지 않고 같은 세기로 던진 공이고, 실험군은 회전을…","a":["대조군은","실험군은"]},{"l":"둘의 차이는 회전 하나뿐이어야 하고, 대조군이 있어야 궤적이 휘는 것…","a":["하나뿐이어야","대조군이"]}]}},{"main":{"id":"kj_FU_M2","cat":"수학","grade":"중3","q":"두 이차함수 y = f(x), y = g(x)의 그래프가 만나는 점에 대해 답하세요. (1) 두 그래프의 교점의 x좌표가 방정식 f(x) − g(x) = 0의 해인 이유를 설명하세요. (2) f(x) = ax² + bx + c, g(x) = px² + qx + r일 때 f(x) − g(x) = 0을 이차방정식의 일반형으로 나타내세요. (3) 두 그래프가 서로 다른 두 점에서 만날 조건을 말하세요.","a":"(1) 교점은 두 그래프 위에 동시에 있는 점이므로, 그 점의 x좌표에서 f(x)의 값과 g(x)의 값이 같습니다. 즉 f(x) = g(x)이고 이항하면 f(x) − g(x) = 0입니다. 거꾸로 이 방정식의 해 x에서는 두 함수의 값이 같아서 그 점에서 그래프가 만납니다. (2) (a − p)x² + (b − q)x + (c − r) = 0입니다. (3) 이차방정식이 되려면 a ≠ p여야 하고, 서로 다른 두 실근을 가지려면 판별식 D = (b − q)² − 4(a − p)(c − r) > 0이어야 합니다. D = 0이면 한 점에서 접하고, D \u003c 0이면 만나지 않습니다. 예를 들어 f = x² − 2x + 3, g = −x² + 4x − 1이면 f − g = 2x² − 6x + 4 = 2(x − 1)(x − 2)이므로 x = 1, 2에서 만나고 교점은 (1, 2), (2, 3)입니다.","kw":[{"l":"교점에서 f(x)=g(x)","a":["교점에서"]},{"l":"f−g=0","a":["f−g=0","f−g"]},{"l":"(a−p)x²+(b−q)x+(c−r)=0","a":["a−p","b−q","c−r"]},{"l":"D>0 이면 두 점","a":["이면"]}]},"follow":{"id":"kj_FU_M2F","cat":"수학","grade":"중3","q":"a = p이면 어떻게 되나요?","a":"x²의 계수가 사라져서 f − g가 일차식 (b − q)x + (c − r)이 됩니다. b ≠ q이면 교점이 한 개이고, b = q이면서 c ≠ r이면 평행해서 만나지 않으며, 둘 다 같으면 두 그래프가 일치합니다.","kw":[{"l":"x²의 계수가 사라져서 f − g가 일차식 (b − q)x + (c …","a":["사라져서","x²의"]},{"l":"b ≠ q이면 교점이 한 개이고, b = q이면서 c ≠ r이면 평행…","a":["일치합니다","q이면서"]}]}},{"main":{"id":"kj_FU_M16","cat":"수학","grade":"중3","q":"루트2가 자연수가 아닌 이유를 증명하시오.","a":"1의 제곱은 1이고 2의 제곱은 4인데 2는 1과 4 사이에 있으 ]},{"l":"나누면 항상 a가 됨","a":["항상 a"]}]},"follow":{"id":"kj_FU_M22F","cat":"수학","grade":"중2","q":"기울기가 일정하다는 성질을 이용하면 일차함수의 그래프가 왜 반드시 직선이 되는지 설명할 수 있습니다. 그 까닭을 설명하시오.","a":"그래프 위의 어느 두 점을 선택해도 x의 증가량에 대한 y의 증가량의 비율이 항상 같은 값 a로 일정하다는 것은, 그래프가 방향을 바꾸지 않고 일정한 기울기로 곧게 뻗어 나간다는 것을 의미하므로 일차함수의 그래프는 반드시 직선이 됩니다.","kw":[{"l":"기울기가 항상 일정함","a":["일정"]},{"l":"방향이 바뀌지 않고 곧게 뻗음(직선)","a":["곧게","직선"]}]}},{"main":{"id":"kj_FU_M23","cat":"수학","grade":"중3","q":"이차함수의 그래프가 좌우 대칭인 곡선이 되는 까닭을 식을 이용해 설명하시오.","a":"이차함수 y=ax제곱에서 x 대신 -x를 대입해도 (-x)의 제곱은 x의 제곱과 같으므로 y의 값이 똑같이 나오는데, 이는 축(y축)을 기준으로 좌우 대칭인 위치에 있는 두 x값이 항상 같은 y값을 가진다는 것을 의미하므로 그래프가 좌우 대칭이 됩니다.","kw":[{"l":"(-x)²=x²이므로 y값이 같음","a":["(-x)²","같음"]},{"l":"축을 기준으로 좌우 대칭","a":["좌우 대칭"]}]},"follow":{"id":"kj_FU_M23F","cat":"수학","grade":"중3","q":"이차함수 y=a(x-p)의 제곱+q의 그래프가 좌우 대칭이 되는 축은 y축이 아니라 무엇인지, 그 까닭과 함께 설명하시오.","a":"이 그래프는 y=ax제곱의 그래프를 x축의 방향으로 p만큼 평행이동한 것이므로, 대칭축도 함께 p만큼 이동하여 직선 x=p가 대칭축이 됩니다.","kw":[{"l":"x=p가 대칭축","a":["x=p"]},{"l":"그래프가 p만큼 평행이동했기 때문","a":["평행이동"]}]}},{"main":{"id":"kj_FU_M24","cat":"수학","grade":"중2","q":"일차함수의 그래프와 일차방정식의 그래프가 사실상 같은 것으로 다루어지는 까닭을 설명하시오.","a":"미지수가 2개인 일차방정식 ax+by+c=0을 y에 대해 정리하면 일차함수 y=-(a/b)x-(c/b)의 꼴이 되므로, 두 식은 표현 방식만 다를 뿐 나타내는 x와 y 사이의 관계는 완전히 같아서 그래프도 정확히 일치합니다.","kw":[{"l":"y에 대해 정리하면 일차함수 꼴이 됨","a":["y에 대해 정리"]},{"l":"같은 관계를 나타내 그래프가 일치","a":["그래프가 일치"]}]},"follow":{"id":"kj_FU_M24F","cat":"수학","grade":"중2","q":"일차방정식 x=3처럼 y가 포함되지 않은 방정식은 일차함수 y=ax+b의 꼴로 나타낼 수 없습니다. 그런데도 이 방정식의 그래프를 그릴 수 있는 까닭을 설명하시오.","a":"x=3은 y의 값에 관계없이 x좌표가 항상 3인 모든 점을 만족하는 방정식이므로, 함수는 아니지만 좌표평면 위에서 점 (3, 0)을 지나고 y축에 평행한 직선으로 나타낼 수 있습니다.","kw":[{"l":"x좌표가 항상 3인 점들의 모임","a":["항상 3"]},{"l":"y축에 평행한 직선","a":["y축에 평행"]}]}},{"main":{"id":"kj_FU_M25","cat":"수학","grade":"중1","q":"반비례 관계 y=a/x(a≠0)에서 x의 값이 2배, 3배가 될 때 y의 값이 어떻게 변하는지 식을 이용해 설명하시오.","a":"y=a/x에서 x가 2배가 되면 y=a/(2x)이므로 원래 y의 값의 1/2배가 되고, x가 3배가 되면 y는 원래 값의 1/3배가 됩니다. 이처럼 반비례 관계에서는 x가 커지는 배수만큼 y는 그 역수배로 작아집니다.","kw":[{"l":"x가 2배면 y는 1/2배","a":["1/2"]},{"l":"x가 커지는 배수의 역수배로 y가 작아짐","a":["역수배"]}]},"follow":{"id":"kj_FU_M25F","cat":"수학","grade":"중1","q":"정비례 관계 y=ax(a≠0)에서는 x의 값이 2배가 될 때 y의 값은 어떻게 변하는지, 반비례와 비교하여 설명하시오.","a":"정비례 관계에서는 x가 2배가 되면 y=a×(2x)이므로 y의 값도 그대로 2배가 되어, x가 커지는 배수만큼 y도 똑같이 커지는 반비례와는 반대되는 변화 양상을 보입니다.","kw":[{"l":"x가 2배면 y도 2배","a":["y도 2배"]},{"l":"반비례와 반대되는 변화","a":["반대"]}]}},{"main":{"id":"kj_FU_M26","cat":"수학","grade":"중2","q":"피타고라스 정리를 정사각형의 넓이를 이용해 증명하시오.","a":"직각을 낀 두 변이 a, b이고 빗변이 c인 직각삼각형 4개를 이용해, 한 변의 길이가 a+b인 큰 정사각형 안에 한 변의 길이가 c인 정사각형이 놓이도록 배치합니다. 큰 정사각형의 넓이는 (a+b)의 제곱이면서 동시에 네 직각삼각형의 넓이의 합(2ab)과 가운데 작은 정사각형의 넓이(c의 제곱)의 합과도 같으므로, (a+b)의 제곱=2ab+c의 제곱이 되고, 좌변을 전개해 정리하면 a의 제곱+b의 제곱=c의 제곱을 얻습니다.","kw":[{"l":"큰 정사각형의 넓이를 두 가지 방식으로 계산","a":["큰 정사각형","넓이"]},{"l":"(a+b)²=2ab+c²을 정리해 a²+b²=c² 도출","a":["2ab","c²"]}]},"follow":{"id":"kj_FU_M26F","cat":"수학","grade":"중2","q":"피타고라스 정리의 역, 즉 세 변의 길이가 a²+b²=c²을 만족하면 그 삼각형이 직각삼각형이 된다는 것은 왜 참인지 설명하시오.","a":"세 변의 길이가 a, b, c이고 a²+b²=c²을 만족하는 삼각형과, 직각을 낀 두 변이 a, b인 직각삼각형을 비교하면, 두 삼각형 모두 세 변의 길이가 각각 a, b, c로 같으므로 SSS 합동에 의해 두 삼각형은 합동입니다. 따라서 원래 삼각형의 a, b 사이의 각도 직각이어야 하므로 이 삼각형은 직각삼각형이 됩니다.","kw":[{"l":"직각삼각형과 세 변의 길이가 같아 SSS 합동","a":["SSS","합동"]},{"l":"대응하는 각도 직각이 됨","a":["직각"]}]}},{"main":{"id":"kj_FU_M27","cat":"수학","grade":"중2","q":"평행사변형의 두 대각선이 서로 다른 것을 이등분한다는 성질을 삼각형의 합동을 이용해 증명하시오.","a":"평행사변형 ABCD에서 두 대각선의 교점을 O라고 하면, 삼각형 OAB와 삼각형 OCD에서 AB와 CD의 길이가 같고, AB와 CD가 평행하므로 엇각인 각 OAB와 각 OCD, 각 OBA와 각 ODC의 크기가 각각 같습니다. 따라서 ASA 합동에 의해 두 삼각형은 합동이므로 대응변인 OA와 OC, OB와 OD의 길이가 각각 같아져 두 대각선은 서로를 이등분합니다.","kw":[{"l":"삼각형 OAB와 OCD가 ASA 합동","a":["ASA","합동"]},{"l":"대응변 OA=OC, OB=OD","a":["OA","OC"]}]},"follow":{"id":"kj_FU_M27F","cat":"수학","grade":"중2","q":"반대로 어떤 사각형의 두 대각선이 서로 다른 것을 이등분한다는 사실만 알고 있을 때, 이 사각형이 평행사변형이 됨을 어떻게 보일 수 있는지 설명하시오.","a":"두 대각선의 교점을 O라 하면 OA=OC, OB=OD이고 맞꼭지각인 각 AOB와 각 COD의 크기가 같으므로, 삼각형 OAB와 삼각형 OCD는 SAS 합동입니다. 이로부터 엇각인 각들의 크기가 같아져 AB와 CD가 평행함을 알 수 있고, 같은 방법으로 AD와 BC도 평행함을 보이면 두 쌍의 대변이 각각 평행하므로 이 사각형은 평행사변형이 됩니다.","kw":[{"l":"맞꼭지각을 이용해 SAS 합동","a":["맞꼭지각","SAS"]},{"l":"엇각이 같아져 두 쌍의 대변이 평행(평행사변형)","a":["평행","평행사변형"]}]}},{"main":{"id":"kj_FU_M28","cat":"수학","grade":"중2","q":"삼각형의 두 변의 중점을 연결한 선분이 나머지 한 변과 평행하고 길이가 그 절반이 된다는 성질(중점연결정리)을 닮음을 이용해 증명하시오.","a":"삼각형 ABC에서 AB, AC의 중점을 각각 M, N이라고 하면, 삼각형 AMN과 삼각형 ABC에서 AM:AB=AN:AC=1:2이고 각 A는 공통이므로 SAS 닮음입니다. 닮음비가 1:2이므로 대응변인 MN과 BC의 길이의 비도 1:2가 되어 MN의 길이는 BC의 절반이고, 대응각이 같으므로 MN과 BC는 평행합니다.","kw":[{"l":"삼각형 AMN과 ABC가 SAS 닮음(닮음비 1:2)","a":["SAS 닮음","1:2"]},{"l":"MN=BC의 절반, MN∥BC","a":["절반","평행"]}]},"follow":{"id":"kj_FU_M28F","cat":"수학","grade":"중2","q":"중점연결정리를 이용하면 사각형의 네 변의 중점을 연결하여 만든 사각형이 항상 평행사변형이 되는 이유를 설명할 수 있습니다. 그 까닭을 설명하시오.","a":"사각형의 한 대각선을 그으면 사각형이 두 삼각형으로 나뉘는데, 각 삼각형에서 중점연결정리를 적용하면 네 변의 중점을 이은 선분 중 마주 보는 두 변이 각각 그 대각선과 평행하고 길이도 대각선의 절반으로 같아지므로, 한 쌍의 대변이 평행하고 길이가 같아 평행사변형이 됩니다.","kw":[{"l":"대각선을 기준으로 중점연결정리를 두 번 적용","a":["대각선","중점연결정리"]},{"l":"한 쌍의 대변이 평행하고 길이가 같음","a":["평행하고 길이가 같"]}]}},{"main":{"id":"kj_FU_M29","cat":"수학","grade":"중3","q":"한 호에 대한 원주각의 크기가 그 호에 대한 중심각의 크기의 절반이 되는 까닭을, 원의 중심이 원주각의 내부에 있는 경우를 예로 들어 증명하시오.","a":"원 위의 점 P와 원의 중심 O, 호의 양 끝 점 A, B에 대해 선분 PO를 연장하여 지름을 그으면 삼각형 OPA와 삼각형 OPB는 각각 이등변삼각형이 되므로, 이등변삼각형의 두 밑각이 같다는 성질과 삼각형의 외각은 이웃하지 않는 두 내각의 합과 같다는 성질을 이용하면, 중심각 AOB의 크기가 원주각 APB의 크기의 2배가 됨을 보일 수 있습니다.","kw":[{"l":"PO를 연장한 지름을 이용해 이등변삼각형을 만듦","a":["이등변삼각형","지름"]},{"l":"외각의 성질로 중심각이 원주각의 2배임을 보임","a":["외각","2배"]}]},"follow":{"id":"kj_FU_M29F","cat":"수학","grade":"중3","q":"반원에 대한 원주각의 크기가 항상 90°인 까닭을 원주각과 중심각의 관계를 이용해 설명하시오.","a":"반원에 대한 중심각은 일직선을 이루는 평각이므로 그 크기가 180°인데, 원주각의 크기는 중심각의 절반이므로 반원에 대한 원주각의 크기는 항상 180°의 절반인 90°가 됩니다.","kw":[{"l":"반원에 대한 중심각은 180°(평각)","a":["180","평각"]},{"l":"원주각은 그 절반인 90°","a":["90"]}]}},{"main":{"id":"kj_FU_M30","cat":"수학","grade":"중2","q":"닮은 두 입체도형의 부피의 비가 닮음비의 세제곱이 되는 까닭을, 닮음비가 넓이의 비에 미치는 영향과 관련지어 설명하시오.","a":"닮음비가 m:n인 두 입체도형은 대응하는 모든 길이의 비가 m:n이므로, 밑면의 넓이와 같은 이차원적인 양은 닮음비의 제곱인 m²:n²의 비를 가집니다. 부피는 이 넓이에 다시 높이(길이)를 곱한 양이므로, 넓이의 비(m²:n²)에 다시 길이의 비(m:n)를 곱하여 부피의 비는 m³:n³이 됩니다.","kw":[{"l":"넓이는 닮음비의 제곱","a":["제곱","넓이" ":"수학","grade":"중2","q":"여사건의 확률(어떤 사건이 일어나지 않을 확률)을 이용해 확률을 구하는 것이 유용한 경우는 어떤 상황인지, \"적어도\"라는 표현과 관련지어 설명하시오.","a":"\"적어도 하나는 ~일 확률\"을 직접 구하려면 하나인 경우, 둘인 경우 등 여러 경우를 따로 더해야 해서 복잡해지는 경우가 많은데, 반대로 그 사건이 하나도 일어나지 않는 여사건의 확률은 한 가지 경우만 계산하면 되므로 훨씬 간단할 때가 많아, 전체 확률 1에서 여사건의 확률을 빼는 방법이 유용합니다.","kw":[{"l":"\"적어도\"의 확률은 직접 구하면 복잡함","a":["적어도","복잡"]},{"l":"여사건은 한 가지 경우만 계산하면 되어 간단","a":["여사건","간단"]}]},"follow":{"id":"kj_FU_M33F","cat":"수학","grade":"중2","q":"서로 다른 세 개의 동전을 던질 때 적어도 하나는 앞면이 나올 확률을 여사건을 이용해 구하는 과정을 설명하시오.","a":"적어도 하나가 앞면인 사건의 여사건은 세 개 모두 뒷면이 나오는 사건이며, 이 확률은 1/2×1/2×1/2=1/8입니다. 따라서 적어도 하나가 앞면이 나올 확률은 1-1/8=7/8입니다.","kw":[{"l":"모두 뒷면일 확률 1/8을 구함","a":["1/8"]},{"l":"1-1/8=7/8","a":["7/8"]}]}},{"main":{"id":"kj_FU_M34","cat":"수학","grade":"중3","q":"키와 몸무게처럼 서로 관련이 있어 보이는 두 변량 사이의 관계를, 원인과 결과로 단정하지 않고 \"상관관계\"라는 표현을 쓰는 까닭을 설명하시오.","a":"상관관계는 두 변량이 함께 증가하거나 감소하는 경향이 있다는 것을 보여줄 뿐, 한 변량이 다른 변량의 직접적인 원인이라는 것까지 증명하지는 못합니다. 두 변량 모두에 영향을 주는 다른 숨은 요인이 있을 수도 있으므로, 산점도에서 경향성이 보이더라도 이를 곧바로 인과 관계로 단정하지 않고 상관관계라고 표현합니다.","kw":[{"l":"경향성이 있다고 원인·결과까지 증명하지 못함","a":["원인","결과"]},{"l":"다른 숨은 요인이 있을 수 있음","a":["숨은 요인"]}]},"follow":{"id":"kj_FU_M34F","cat":"수학","grade":"중3","q":"아이스크림 판매량과 물놀이 사고 건수가 함께 증가하는 양의 상관관계를 보인다고 해서, 아이스크림 판매가 물놀이 사고의 원인이라고 말할 수 없는 까닭을 설명하시오.","a":"두 변량은 실제로는 서로 직접적인 원인과 결과 관계가 아니라, 무더운 날씨라는 공통의 숨은 요인 때문에 함께 증가하는 것일 가능성이 높으므로, 산점도에서 양의 상관관계가 나타난다고 해서 한 변량이 다른 변량의 원인이라고 단정할 수 없습니다.","kw":[{"l":"더운 날씨라는 공통의 숨은 요인","a":["날씨","숨은 요인"]},{"l":"원인이라고 단정할 수 없음","a":["단정할 수 없"]}]}},{"main":{"id":"kj_FU_M35","cat":"수학","grade":"중3","q":"분모가 루트를 포함한 무리수일 때, 분모와 분자에 같은 무리수를 곱해 분모를 유리수로 만들 수 있는 원리를 설명하시오.","a":"루트a와 루트a를 곱하면 근호가 사라져 a라는 유리수가 되는 성질을 이용하는 것으로, 분모가 루트a 꼴일 때 분모와 분자에 똑같이 루트a를 곱하면 분모는 a라는 유리수로 바뀌면서도 분수 전체의 값은 1을 곱한 것과 같으므로 변하지 않습니다.","kw":[{"l":"루트a×루트a=a(유리수)","a":["루트a×루트a","유리수"]},{"l":"분모·분자에 같은 수를 곱해 값이 변하지 않음","a":["값이 변하지 않","1을 곱"]}]},"follow":{"id":"kj_FU_M35F","cat":"수학","grade":"중3","q":"분모가 (루트a+루트b) 꼴처럼 두 개의 항으로 된 경우에는 어떤 수를 곱해야 분모를 유리수로 만들 수 있는지 추론  그래프인데 그래프 전체가 x축보다 아래쪽에 있으면, 그래프가 x축과 만나는 점이 전혀 없게 되므로 이차방정식 ax제곱+bx+c=0은 실근을 갖지 않게 됩니다.","kw":[{"l":"아래로 볼록하면서 전체가 x축 위에 있음","a":["아래로 볼록","위"]},{"l":"위로 볼록하면서 전체가 x축 아래에 있음","a":["위로 볼록","아래"]}]},"follow":{"id":"kj_FU_M41F","cat":"수학","grade":"중3","q":"이러한 경우가 이차방정식의 판별식과 어떤 관계가 있는지 설명하시오.","a":"그래프가 x축과 만나지 않는다는 것은 이차방정식이 실근을 가지지 않는다는 것과 같은 의미이므로, 이때는 판별식 b제곱-4ac의 값이 음수가 됩니다.","kw":[{"l":"실근이 없음과 같은 의미","a":["실근이 없"]},{"l":"판별식이 음수","a":["판별식","음수"]}]}},{"main":{"id":"kj_FU_M42","cat":"수학","grade":"중2","q":"서로 다른 두 점이 주어지면 그 두 점을 지나는 일차함수의 식이 오직 하나로 정해지는 까닭을 설명하시오.","a":"일차함수의 그래프는 직선인데, 서로 다른 두 점을 지나는 직선은 기하학적으로 오직 하나만 그을 수 있습니다. 두 점의 좌표를 이용하면 기울기를 하나로 정할 수 있고, 그 기울기와 한 점의 좌표를 이용하면 y절편도 하나로 정해지므로, 결국 일차함수의 식 y=ax+b에서 a와 b가 각각 하나의 값으로 정해집니다.","kw":[{"l":"두 점을 지나는 직선은 하나뿐","a":["직선은 하나","두 점"]},{"l":"기울기와 y절편이 각각 하나로 정해짐","a":["기울기","y절편"]}]},"follow":{"id":"kj_FU_M42F","cat":"수학","grade":"중2","q":"그렇다면 한 점만 주어졌을 때는 그 점을 지나는 일차함수의 식이 하나로 정해지지 않는 까닭을 설명하시오.","a":"한 점만으로는 기울기를 계산할 수 없으므로, 그 점을 지나면서 기울기가 서로 다른 직선을 무수히 많이 그을 수 있어 일차함수의 식이 하나로 정해지지 않습니다.","kw":[{"l":"기울기를 계산할 수 없음","a":["기울기를 계산할 수 없"]},{"l":"기울기가 다른 직선이 무수히 많음","a":["무수히 많"]}]}},{"main":{"id":"kj_FU_M43","cat":"수학","grade":"중1","q":"평행한 두 직선이 한 직선과 만날 때 동위각의 크기가 같다는 성질을 이용해, 엇각의 크기도 같다는 것을 증명하시오.","a":"평행선이 한 직선과 만날 때 동위각의 크기는 서로 같은데, 엇각의 위치에 있는 두 각 중 하나는 어떤 각의 맞꼭지각이면서 동시에 다른 한 엇각과는 동위각 관계에 있습니다. 맞꼭지각의 크기는 항상 같고 동위각의 크기도 평행선에서 항상 같으므로, 이 두 성질을 연결하면 엇각의 크기도 서로 같다는 것을 알 수 있습니다.","kw":[{"l":"맞꼭지각과 동위각 관계를 함께 이용","a":["맞꼭지각","동위각"]},{"l":"엇각의 크기가 같음을 보임","a":["엇각","같"]}]},"follow":{"id":"kj_FU_M43F","cat":"수학","grade":"중1","q":"반대로 두 직선이 한 직선과 만날 때 엇각의 크기가 같으면 그 두 직선이 평행하다는 것도 참인지, 그 까닭과 함께 설명하시오.","a":"참입니다. 엇각의 크기가 같다는 것으로부터 맞꼭지각 관계를 이용하면 동위각의 크기도 같다는 것을 이끌어낼 수 있는데, 동위각의 크기가 같으면 두 직선이 서로 다른 방향으로 벌어지지 않고 나란하게 나아가야 하므로 두 직선은 평행합니다.","kw":[{"l":"엇각이 같으면 동위각도 같음을 이끌어냄","a":["동위각도 같"]},{"l":"두 직선이 평행함","a":["평행"]}]}},{"main":{"id":"kj_FU_M44","cat":"수학","grade":"중1","q":"삼각형의 한 외각의 크기가 그와 이웃하지 않는 두 내각의 크기의 합과 같다는 성질을 증명하시오.","a":"삼각형의 세 내각의 크기의 합은 180°이고, 한 내각과 그에 대응하는 외각의 크기의 합도 180°(평각)이므로, 외각의 크기는 180°에서 그 내각을 뺀 값과 같습니다. 그런데 세 내각의 합이 180°이므로 180°에서 한 내각을 뺀 값은 나머지 두 내각의 합과 같으므로, 결국 외각의 크기는 이웃하지 않는 두 내각의 크기의 합과 같습니다.","kw":[{"l":"세 내각의 합(180°)과 평각(180°)을 이용","a":["180°","평각"]},{"l":"외각=나머지 두 내각의 합","a":["외각","두 내각의 합"]}]},"follow":{"id":"kj_FU_M44F","cat":"수학","grade":"중1","q":"이 성질을 이용하면 삼각형의 세 외각의 크기의 합이 항상 360°가 된다는 것도 쉽게 확인할 수 있습니다. 그 과정을 설명하시오.","a":"각 외각은 이웃하지 않는 두 내각의 합과 같으므로, 세 외각의 합을 모두 더하면 각 내각이 두 번씩 더해진 것과 같아져 세 내각의 합(180°)의 두 배인 360°가 됩니다.","kw":[{"l":"각 내각이 두 번씩 더해짐","a":["두 번씩"]},{"l":"180°의 두 배인 360°","a":["360"]}]}},{"main":{"id":"kj_FU_M45","cat":"수학","grade":"중2","q":"마름모의 두 대각선이 서로 수직으로 만난다는 성질을 이등변삼각형의 성질을 이용해 증명하시오.","a":"마름모 ABCD에서 두 대각선의 교점을 O라고 하면 마름모는 평행사변형이므로 OB=OD이고, 마름모의 네 변의 길이가 모두 같으므로 삼각형 ABD는 AB=AD인 이등변삼각형입니다. 이등변삼각형에서 꼭지각의 이등분선(대각선 AC)은 밑변(BD)을 수직이등분하므로, 두 대각선 AC와 BD는 서로 수직으로 만납니다.","kw":[{"l":"삼각형 ABD가 이등변삼각형(AB=AD)","a":["이등변삼각형","AB=AD"]},{"l":"꼭지각의 이등분선이 밑변을 수직이등분","a":["수직이등분"]}]},"follow":{"id":"kj_FU_M45F","cat":"수학","grade":"중2","q":"반대로 평행사변형의 두 대각선이 수직으로 만난다면 이 평행사변형이 마름모가 되는 까닭을 설명하시오.","a":"평행사변형에서는 두 대각선이 서로를 이등분하는데, 여기에 두 대각선이 수직이라는 조건이 더해지면 각 변은 대각선의 교점에서 수직이등분선 위에 있는 점과 두 꼭짓점을 잇는 선분이 되어, 삼각형의 합동에 의해 네 변의 길이가 모두 같아지므로 마름모가 됩니다.","kw":[{"l":"대각선이 서로를 수직이등분","a":["수직이등분"]},{"l":"네 변의 길이가 모두 같아짐","a":["네 변","같아"]}]}},{"main":{"id":"kj_FU_M46","cat":"수학","grade":"중3","q":"한 원에서 크기가 같은 두 중심각에 대한 호의 길이는 서로 같다는 성질을 증명하시오.","a":"한 원에서 중심각의 크기와 호의 길이는 정비례 관계에 있으므로, 중심각의 크기가 같으면 그에 대응하는 호의 길이의 비율도 같아 두 호의 길이는 서로 같아집니다. 이는 두 부채꼴을 원의 중심을 기준으로 회전시켰을 때 중심각이 같으므로 완전히 겹쳐진다는 사실로도 확인할 수 있습니다.","kw":[{"l":"중심각과 호의 길이가 정비례","a":["정비례"]},{"l":"회전시키면 완전히 겹쳐짐","a":["겹쳐","회전"]}]},"follow":{"id":"kj_FU_M46F","cat":"수학","grade":"중3","q":"그렇다면 크기가 같은 두 중심각에 대한 현의 길이도 서로 같다고 말할 수 있는지, 그 까닭과 함께 설명하시오.","a":"현의 길이도 서로 같다고 말할 수 있습니다. 중심각이 같은 두 부채꼴은 회전시켰을 때 완전히 겹쳐지므로, 호의 양 끝 점을 이은 현도 함께 겹쳐지게 되어 현의 길이 역시 서로 같아집니다.","kw":[{"l":"중심각이 같으면 회전시켜 겹쳐짐","a":["겹쳐"]},{"l":"현의 길이도 같음","a":["현의 길이","같"]}]}},{"main":{"id":"kj_FU_M47","cat":"수학","grade":"중3","q":"부채꼴의 호의 길이와 넓이를 구하는 공식이 중심각의 크기에 정비례하는 까닭을 원 전체와 비교하여 설명하시오.","a":"부채꼴은 원을 중심각의 크기만큼 잘라낸 도형으로 볼 수 있는데, 원 전체의 중심각은 360°이므로 부채꼴의 중심각이 원 전체 중심각(360°)에서 차지하는 비율만큼 원의 둘레(호의 길이)와 원의 넓이도 함께 차지하게 됩니다. 따라서 부채꼴의 호의 길이와 넓이는 각각 원의 둘레와 넓이에 (중심각/360°)라는 비율을 곱한 값이 되어, 중심각의 크기에 정비례합니다.","kw":[{"l":"중심각이 360°에서 차지하는 비율만큼 잘라낸 것","a":["360°","비율"]},{"l":"원의 둘레·넓이에 그 비율을 곱함","a":["둘레","넓이","비율을 곱"]}]},"follow":{"id":"kj_FU_M47F","cat":"수학","grade":"중3","q":"반지름의 길이는 같지만 중심각이 2배인 두 부채꼴이 있다면, 호의 길이와 넓이는 각각 몇 배가 되는지 설명하시오.","a":"호의 길이와 넓이는 모두 중심각의 크기에 정비례하므로, 중심각이 2배가 되면 호의 길이도 2배, 넓이도 2배가 됩니다.","kw":[{"l":"호의 길이 2배, 넓이도 2배","a":["2배"]}]}},{"main":{"id":"kj_FU_M48","cat":"수학","grade":"중3","q":"30°, 45°, 60°의 삼각비 값이 특수한 직각삼각형에서 어떻게 얻어지는지, 45°인 경우를 예로 들어 설명하시오.","a":"두 밑각이 모두 45°인 직각이등변삼각형은 직각을 낀 두 변의 길이가 서로 같은데, 이 길이를 1이라 하면 피타고라스 정리에 의해 빗변의 길이는 루트2가 됩니다. 이때 sin45°는 빗변에 대한 높이의 비이므로 1/루트2, 즉 루트2/2가 되고, 같은 방식으로 cos45°도 루트2/2, tan45°는 1/1=1이 됩니다.","kw":[{"l":"직각이등변삼각형(변 1, 1, 빗변 루트2)","a":["직각이등변삼각형","루트2"]},{"l":"sin45°=cos45°=루트2/2","a":["루트2/2"]}]},"follow":{"id":"kj_FU_M48F","cat":"수학","grade":"중3","q":"30°와 60°의 삼각비 값은 정삼각형을 반으로 나눈 직각삼각형에서 얻어집니다. 이 삼각형의 세 변의 길이의 비가 어떻게 되는지 설명하시오.","a":"한 변의 길이가 2인 정삼각형을 반으로 나누면 밑변이 1, 빗변이 2인 직각삼각형이 되고, 피타고라스 정리에 의해 남은 한 변의 길이는 루트3이 되므로, 세 변의 길이의 비는 1:루트3:2가 됩니다.","kw":[{"l":"정삼각형을 반으로 나눔","a":["정삼각형","반으로"]},{"l":"변의 비가 1:루트3:2","a":["1","루트3","2"]}]}},{"main":{"id":"kj_FU_M49","cat":"수학","grade":"중2","q":"닮은 두 삼각형에서 대응변의 길이의 비가 모두 같으면 대응각의 크기도 모두 같아지는 까닭을 SSS 닮음과 관련지어 설명하시오.","a":"세 쌍의 대응변의 길이의 비가 모두 같으면 SSS 닮음 조건에 의해 두 삼각형은 닮은 도형이 되는데, 닮음의 정의에 따르면 한 도형을 일정한 비율로 확대·축소한 것이 다른 도형과 합동이 되어야 하므로, 합동인 도형에서 대응각의 크기가 같다는 성질이 그대로 이어져 닮은 두 삼각형의 대응각의 크기도 모두 같아집니다.","kw":[{"l":"SSS 닮음 조건을 만족","a":["SSS","닮음"]},{"l":"합동에서 대응각이 같다는 성질이 이어짐","a":["합동","대응각"]}]},"follow":{"id":"kj_FU_M49F","cat":"수학","grade":"중2","q":"반대로 두 삼각형의 대응각의 크기가 모두 같다고 해서 대응변의 길이까지 항상 같은 것은 아닙니다. 그 까닭을 설명하시오.","a":"대응각의 크기가 모두 같은 것은 AA 닮음 조건으로 두 삼각형이 닮음이라는 것만 보장할 뿐이며, 닮음인 두 도형은 크기가 서로 다를 수 있으므로 변의 길이의 비만 일정할 뿐 실제 길이 자체는 서로 다를 수 있습니다.","kw":[{"l":"닮음은 크기가 달라도 성립","a":["크기가 다를","닮음"]},{"l":"길이의 비만 같고 실제 길이는 다를 수 있음","a":["비만","실제 길이"]}]}},{"main":{"id":"kj_FU_M50","cat":"수학","grade":"중3","q":"5개 변량 x1~x5의 평균이 6, 분산이 4일 때 각 변량을 2배 한 뒤 3을 더한 새 변량의 평균, 분산, 표준편차를 구하시오.","a":"새 변량 y=2x+3의 평균은 2×6+3=15입니다. 편차는 (2x+3)−15=2(x−6)이므로 편차의 제곱은 4배가 되어 분산은 4×4=16이고 표준편차는 4입니다. 더한 값 3은 평균만 옮기고 흩어진 정도에는 영향이 없습니다.","kw":[{"l":"평균 15","a":["15"]},{"l":"분산 16 (2²배)","a":["16","4배","2²"]},{"l":"표준편차 4, 더하기는 분산에 영향 없음","a":["표준편차","4"]}]},"follow":{"id":"kj_FU_M50F","cat":"수학","grade":"중3","q":"평균이 4, 분산이 2인 5개의 자료와 평균이 8, 분산이 2인 5개의 자료를 합친 10개 자료의 평균과 분산을 구하시오.","a":"합친 평균은 (4×5+8×5)/10=6입니다. 분산은 각 변량의 (편차)²의 평균으로 첫 자료는 평균 4에서 6까지 거리가 2이므로 (편차²)의 평균은 2+2²=6, 둘째 자료도 2+2²=6입니다. 따라서 합친 분산은 (6×5+6×5)/10=6입니다. 이처럼 평균이 다른 자료를 합치면 각 자료의 분산에 평균들이 흩어진 정도가 더해집니다.","kw":[{"l":"합친 평균 6","a":["6"]},{"l":"(분산+(평균차)²)의 가중평균 → 6","a":["2+4","2+2²","편차"]}]}},{"main":{"id":"kj_FU_M51","cat":"수학","grade":"중3","q":"40명인 반의 수학 평균이 70점이고 남학생 24명의 평균이 65점일 때 여학생 16명의 평균을 구하시오.","a":"전체 점수의 합은 70×40=2800점이고 남학생의 점수 합은 65×24=1560점입니다. 여학생의 점수 합은 2800−1560=1240점이므로 평균은 1240÷16=77.5점입니다.","kw":[{"l":"전체 합 2800, 남학생 합 1560","a":["2800","1560"]},{"l":"여학생 평균 77.5","a":["77.5"]}]},"follow":{"id":"kj_FU_M51F","cat":"수학","grade":"중3","q":"5개 변량의 편차가 −3, x, 0, 2, −1일 때 x의 값과 분산을 구하시오. 편차의 합이 항상 0인 이유도 설명하시오.","a":"편차의 합은 항상 0이므로 −3+x+0+2−1=0에서 x=2입니다. 분산은 편차의 제곱의 평균이므로 (9+4+0+4+1)/5=18/5=3.6입니다. 편차의 합 Σ(변량−평균)=(변량의 합)−(평균×개수)이고 평균×개수가 변량의 합과 같으므로 0이 됩니다.","kw":[{"l":"편차의 합 0 → x=2","a":["x=2","합은 0","0"]},{"l":"분산 18/5=3.6","a":["18/5","3.6"]},{"l":"평균×개수=변량의 합","a":["평균×","변량의 합"]}]}},{"main":{"id":"kj_FU_M52","cat":"수학","grade":"중2","q":"동전 4개를 동시에 던질 때 앞면이 정확히 2개일 확률과 앞면이 뒷면보다 많을 확률을 구하시오.","a":"전체 경우의 수는 2⁴=16가지입니다. 앞면이 정확히 2개인 경우는 4개 중 2개를 고르는 6가지이므로 확률은 6/16=3/8입니다. 앞면이 3개인 경우 4가지와 4개인 경우 1가지를 더한 5가지이므로 앞면이 뒷면보다 많을 확률은 5/16입니다.","kw":[{"l":"전체 16","a":["16"]},{"l":"정확히 2개 6/16=3/8","a":["3/8","6가지"]},{"l":"앞면이 더 많음 5/16","a":["5/16"]}]},"follow":{"id":"kj_FU_M52F","cat":"수학","grade":"중2","q":"동전 5개를 던질 때 앞면이 뒷면보다 많을 확률을 대칭성을 이용해 구하시오.","a":"5개를 던지면 앞면과 뒷면의 개수가 같을 수 없으므로 앞면이 더 많거나 뒷면이 더 많거나 둘 중 하나입니다. 앞면과 뒷면이 나올 확률이 같아 두 경우는 대칭이므로 각각 1/2입니다. 직접 세면 5C3+5C4+5C5=10+5+1=16가지이므로 16/32=1/2로 같습니다.","kw":[{"l":"앞과 뒤가 대칭","a":["대칭"]},{"l":"1/2","a":["1/2","16/32"]}]}},{"main":{"id":"kj_FU_M53","cat":"수학","grade":"중3","q":"이차함수 y=x²−4x+1의 정의역이 −1≤x≤4일 때 최댓값과 최솟값을 구하시오. 정의역이 3≤x≤6으로 바뀌면 어떻게 됩니까?","a":"y=(x−2)²−3이고 꼭짓점 x=2가 정의역에 들어 있으므로 최솟값은 −3입니다. 최댓값은 꼭짓점에서 먼 쪽 끝인 x=−1에서 y=6(x=4에서는 y=1)입니다. 정의역이 3≤x≤6이면 꼭짓점이 범위 밖이고 그래프가 증가하므로 최솟값은 x=3에서 −2, 최댓값은 x=6에서 13입니다.","kw":[{"l":"꼭짓점 (2,−3)이 범위 안 → 최솟값 −3","a":["−3"]},{"l":"꼭짓점에서 먼 끝에서 최댓값 6","a":["6","x=−1"]},{"l":"범위 밖이면 끝점: 최소 −2, 최대 13","a":["−2","13","끝점"]}]},"follow":{"id":"kj_FU_M53F","cat":"수학","grade":"중3","q":"정의역이 제한된 이차함수의 최대·최소를 구할 때 꼭짓점만 보면 안 되는 이유를 설명하시오.","a":"꼭짓점은 정의역 전체에서의 최솟값(또는 최댓값)이지만 정의역이 제한되면 꼭짓점이 범위 밖에 있을 수 있습니다. 이때는 범위 안에서 그래프가 증가나 감소만 하므로 두 끝점에서 최대·최소가 정해집니다. 그래서 꼭짓점이 범위 안에 있는지 먼저 확인하고 양 끝점의 값도 비교해야 합니다.","kw":[{"l":"꼭짓점이 범위 밖일 수 있음","a":["범위 밖","밖"]},{"l":"끝점의 값 비교","a":["끝점","양 끝"]}]}},{"main":{"id":"kj_FU_M54","cat":"수학","grade":"중3","q":"길이 40m의 울타리로 벽을 한 면으로 이용하여 직사각형 모양의 닭장을 만들려고 합니다. 벽 쪽에는 울타리를 치지 않을 때 닭장의 넓이가 최대가 되는 가로, 세로의 길이를 구하시오.","a":"벽에 수직한 변의 길이를 x라 하면 벽에 평행한 변은 40−2x이고 넓이는 x(40−2x)=−2x²+40x=−2(x−10)²+200입니다. 따라서 x=10일 때 넓이가 최대 200m²이고 이때 벽에 평행한 변은 20m입니다.","kw":[{"l":"변의 길이 x와 40−2x","a":["40−2x"]},{"l":"−2(x−10)²+200 꼴 완성","a":["(x−10)²","200"]},{"l":"10m, 20m","a":["10","20"]}]},"follow":{"id":"kj_FU_M54F","cat":"수학","grade":"중3","q":"만약 벽의 길이가 15m뿐이어서 벽에 평행한 변이 15m를 넘을 수 없다면 넓이의 최댓값은 얼마입니까? 꼭짓점의 x좌표가 허용 범위 밖이면 어떻게 해야 하는지 설명하시오.","a":"벽에 평행한 변 40−2x≤15에서 x≥12.5입니다. 이차함수 −2(x−10)²+200은 x>10에서 감소하므로 허용 범위 x≥12.5에서의 최댓값은 가장 왼쪽 끝 x=12.5에서 나옵니다. 이때 넓이는 12.5×15=187.5m²입니다. 꼭짓점이 허용 범위 밖에 있으면 범위의 끝점에서 최댓값을 확인해야 합니다.","kw":[{"l":"x≥12.5","a":["12.5"]},{"l":"범위의 끝점에서 최대","a":["끝점","가장 왼쪽","경계"]},{"l":"187.5","a":["187.5"]}]}},{"main":{"id":"kj_FU_M55","cat":"수학","grade":"중2","q":"남학생 5명, 여학생 4명 중에서 4명의 대표를 뽑을 때 여학생이 적어도 1명 포함되는 경우의 수와, 특정한 두 학생 A, B가 함께 뽑히거나 둘 다 뽑히지 않는 경우의 수를 구하시오.","a":"전체 9C4=126가지에서 남학생만 4명 뽑는 5C4=5가지를 빼면 121가지입니다. A, B가 모두 뽑히면 나머지 7명 중 2명을 뽑는 7C2=21가지, 둘 다 뽑히지 않으면 7명 중 4명을 뽑는 7C4=35가지이므로 합의 법칙으로 56가지입니다.","kw":[{"l":"여사건: 126−5=121","a":["121","여사건"]},{"l":"둘 다 뽑힘 21, 둘 다 안 뽑힘 35","a":["21","35"]},{"l":"56","a":["56"]}]},"follow":{"id":"kj_FU_M55F","cat":"수학","grade":"중2","q":"위 대표 선출에서 A만 뽑히고 B는 뽑히지 않는 경우의 수를 구하고 세 경우(A, B 모두/둘 다 안/한 명만)의 합이 전체와 같음을 확인하시오.","a":"A만 뽑히고 B는 뽑히지 않으면 나머지 7명 중 3명을 뽑아 7C3=35가지이고 B만 뽑히는 경우도 35가지이므로 한 명만 뽑히는 경우는 70가지입니다. 21+35+70=126으로 전체 9C4=126과 같습니다.","kw":[{"l":"한 명만 70","a":["70","35"]},{"l":"21+35+70=126","a":["126"]}]}},{"main":{"id":"kj_FU_M56","cat":"수학","grade":"중2","q":"빨간 공 3개와 파란 공 2개가 들어 있는 주머니에서 동시에 2개를 꺼낼 때 나오는 빨간 공의 개수의 기댓값을 구하시오.","a":"전체 경우는 5C2=10가지입니다. 빨간 공이 0개일 확률은 1/10, 1개일 확률은 3×2/10=6/10, 2개일 확률은 3/10입니다. 기댓값은 0×(1/10)+1×(6/10)+2×(3/10)=12/10=6/5=1.2개입니다.","kw":[{"l":"확률 1/10, 6/10, 3/10","a":["1/10","6/10","3/10"]},{"l":"기댓값 0·1/10+1·6/10+2·3/10","a":["기댓값"]},{"l":"6/5=1.2","a":["6/5","1.2"]}]},"follow":{"id":"kj_FU_M56F","cat":"수학","grade":"중2","q":"이 기댓값이 2×(3/5)와 같은 이유를 설명하시오.","a":"꺼낸 공 각각이 빨간 공일 확률은 순서와 관계없이 3/5로 같고, 두 공 중 빨간 공의 평균 개수는 각 공이 빨간 공일 때의 기여를 더한 것이므로 3/5+3/5=2×(3/5)=6/5입니다. 이렇게 각 공을 따로 생각해서 더하면 경우를 나누어 계산하지 않고도 기댓값을 구할 수 있습니다.","kw":[{"l":"각 공이 빨간 공일 확률 3/5","a":["3/5"]},{"l":"더하면 2×3/5","a":["더하","2×"]}]}},{"main":{"id":"kj_FU_S3","cat":"과학","grade":"중3","q":"금속 토막을 용수철저울에 매달았더니 공기 중에서 2.7 N이었고, 물에 완전히 잠기게 했더니 1.7 N이었습니다. (1) 이 금속에 작용하는 부력은 얼마인가요? (2) 금속의 부피, 질량, 밀도를 구하세요. (3) 더 깊이 넣으면 저울 눈금이 어떻게 되나요? (4) 부력의 방향과 크기가 정해지는 원리를 말하세요. (g = 10 m/s², 물의 밀도 1000 kg/m³)","a":"(1) 부력은 공기 중 무게에서 물속 무게를 뺀 값이므로 2.7 − 1.7 = 1.0 N입니다. (2) 부력은 밀어낸 물의 무게이므로 1.0 N = 1000 × V × 10에서 V = 1.0 × 10⁻⁴ m³ = 100 cm³입니다. 질량은 무게 2.7 N ÷ 10 = 0.27 kg = 270 g이고 밀도는 270 g ÷ 100 cm³ = 2.7 g/cm³입니다(알루미늄과 비슷합니다). (3) 완전히 잠긴 뒤에는 밀어낸 물의 부피가 일정하므로 부력이 그대로이고 눈금은 1.7 N으로 변하지 않습니다. 부력은 물체가 잠긴 부피에 따라 정해지고 깊이와는 관계가 없습니다. (4) 부력은 위쪽으로 작용하고 크기는 물체가 밀어낸 유체의 무게와 같습니다(아르키메데스의 원리). 물속에서는 아래쪽 면이 받는 압력이 위쪽 면보다 커서 위로 향하는 힘이 생깁니다.","kw":[{"l":"부력 = W − W′ = 1.0 N","a":["부력","W′"]},{"l":"V = F/ρg = 100 cm³","a":["100","cm³","ρg"]},{"l":"밀도 2.7 g/cm³","a":["cm³","밀도"]},{"l":"깊이와 무관","a":["깊이와 무관","깊이와","무관"]}]},"follow":{"id":"kj_FU_S3F","cat":"과학","grade":"중3","q":"용수철저울로 부피를 재는 방법 말고, 눈금 실린더로 부피를 재는 방법도 말해 보세요.","a":"눈금 실린더에 물을 넣어 눈금을 읽고 금속을 완전히 잠기게 한 뒤 다시 읽습니다. 올라간 눈금의 차가 금속의 부피입니다. 물이 튀거나 기포가 붙지 않도록 조심하고, 눈높이에서 수면의 아랫부분을 읽어야 합니다.","kw":[{"l":"눈금 실린더에 물을 넣어 눈금을 읽고 금속을 완전히 잠기게 한 뒤 다…","a":["실린더에","읽습니다"]},{"l":"올라간 눈금의 차가 금속의 부피입니다","a":["부피입니다","올라간"]},{"l":"물이 튀거나 기포가 붙지 않도록 조심하고, 눈높이에서 수면의 아랫부분…","a":["눈높이에서","아랫부분을"]}]}},{"main":{"id":"kj_FU_S18","cat":"과학","grade":"중1","q":"무거운 바위를 지레를 이용해 들어 올리려고 합니다. 받침점을 바위에 최대한 가깝게 두는 것과 멀리 두는 것 중 어느 쪽이 힘이 적게 드는지 설명하시오.","a":"받침점을 힘을 주는 곳보다 바위 쪽에 가깝게 둘수록, 힘점에서 받침점까지의 거리가 멀어져 작은 힘으로도 무거운 물체를 들어 올릴 수 있습니다.","kw":[{"l":"받침점을 물체에 가깝게","a":["가깝","가까이"]},{"l":"힘점까지 거리가 멀수록 유리","a":["거리","멀"]}]},"follow":{"id":"kj_FU_S18F","cat":"과학","grade":"중1","q":"그렇다면 손톱깎이나 가위처럼 우리 주변에서 지레의 원리를 이용한 도구를 한 가지 들고, 어느 부분이 받침점·힘점·작용점에 해당하는지 설명하시오.","a":"손톱깎이를 예로 들면, 위아래 지렛대가 만나는 부분이 받침점, 손가락으로 누르는 부분이 힘점, 실제 손톱을 자르는 날 부분이 작용점입니다.","kw":[{"l":"받침점·힘점·작용점 구분","a":["받침점","힘점","작용점"]}]}},{"main":{"id":"kj_FU_S19","cat":"과학","grade":"중1","q":"무거운 물건을 옮길 때 도르래를 사용하면 편리합니다. 천장에 고정해서 사용하는 고정 도르래는 힘의 방향과 크기 면에서 어떤 특징이 있나요?","a":"고정 도르래는 줄을 당기는 방향과 물체가 올라가는 방향을 다르게 바꿔 줄 수 있어 힘의 방향을 편리하게 바꿀 수 있지만, 필요한 힘의 크기는 줄어들지 않습니다.","kw":[{"l":"힘의 방향을 바꿈","a":["방향"]},{"l":"힘의 크기는 그대로","a":["크기","줄어들지"]}]},"follow":{"id":"kj_FU_S19F","cat":"과학","grade":"중1","q":"그렇다면 물체에 매달아 함께 움직이는 움직 도르래를 사용하면 필요한 힘의 크기는 어떻게 달라지나요?","a":"움직 도르래를 사용하면 물체의 무게를 두 줄이 나누어 지탱하기 때문에, 물체를 직접 들어 올릴 때보다 절반의 힘으로
