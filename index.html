 보임","a":["x+2","x+3"]}]},{"id":"lk_M23","cat":"수학","grade":"중2","q":"일차함수 y=ax+b의 그래프에서 a의 값이 그래프의 기울기와 같다는 것을 x의 증가량과 y의 증가량의 비율로 확인하는 과정을 설명하시오.","a":"x의 값이 x1에서 x2로 변할 때 y의 값은 각각 a×x1+b와 a×x2+b가 되므로, y의 증가량은 a×(x2-x1)이 되고, 이를 x의 증가량인 (x2-x1)으로 나누면 항상 a라는 값을 얻게 되어 기울기가 a임을 확인할 수 있습니다.","kw":[{"l":"y의 증가량이 a×(x의 증가량)이 됨","a":["a×","증가량"]},{"l":"나누면 항상 a가 됨","a":["항상 a"]}]},{"id":"lk_M24","cat":"수학","grade":"중3","q":"이차함수의 그래프가 좌우 대칭인 곡선이 되는 까닭을 식을 이용해 설명하시오.","a":"이차함수 y=ax제곱에서 x 대신 -x를 대입해도 (-x)의 제곱은 x의 제곱과 같으므로 y의 값이 똑같이 나오는데, 이는 축(y축)을 기준으로 좌우 대칭인 위치에 있는 두 x값이 항상 같은 y값을 가진다는 것을 의미하므로 그래프가 좌우 대칭이 됩니다.","kw":[{"l":"(-x)²=x²이므로 y값이 같음","a":["(-x)²","같음"]},{"l":"축을 기준으로 좌우 대칭","a":["좌우 대칭"]}]},{"id":"lk_M25","cat":"수학","grade":"중2","q":"일차함수의 그래프와 일차방정식의 그래프가 사실상 같은 것으로 다루어지는 까닭을 설명하시오.","a":"미지수가 2개인 일차방정식 ax+by+c=0을 y에 대해 정리하면 일차함수 y=-(a/b)x-(c/b)의 꼴이 되므로, 두 식은 표현 방식만 다를 뿐 나타내는 x와 y 사이의 관계는 완전히 같아서 그래프도 정확히 일치합니다.","kw":[{"l":"y에 대해 정리하면 일차함수 꼴이 됨","a":["y에 대해 정리"]},{"l":"같은 관계를 나타내 그래프가 일치","a":["그래프가 일치"]}]},{"id":"lk_M26","cat":"수학","grade":"중1","q":"반비례 관계 y=a/x(a≠0)에서 x의 값이 2배, 3배가 될 때 y의 값이 어떻게 변하는지 식을 이용해 설명하시오.","a":"y=a/x에서 x가 2배가 되면 y=a/(2x)이므로 원래 y의 값의 1/2배가 되고, x가 3배가 되면 y는 원래 값의 1/3배가 됩니다. 이처럼 반비례 관계에서는 x가 커지는 배수만큼 y는 그 역수배로 작아집니다.","kw":[{"l":"x가 2배면 y는 1/2배","a":["1/2"]},{"l":"x가 커지는 배수의 역수배로 y가 작아짐","a":["역수배"]}]},{"id":"lk_M27","cat":"수학","grade":"중2","q":"피타고라스 정리를 정사각형의 넓이를 이용해 증명하시오.","a":"직각을 낀 두 변이 a, b이고 빗변이 c인 직각삼각형 4개를 이용해, 한 변의 길이가 a+b인 큰 정사각형 안에 한 변의 길이가 c인 정사각형이 놓이도록 배치합니다. 큰 정사각형의 넓이는 (a+b)의 제곱이면서 동시에 네 직각삼각형의 넓이의 합(2ab)과 가운데 작은 정사각형의 넓이(c의 제곱)의 합과도 같으므로, (a+b)의 제곱=2ab+c의 제곱이 되고, 좌변을 전개해 정리하면 a의 제곱+b의 제곱=c의 제곱을 얻습니다.","kw":[{"l":"큰 정사각형의 넓이를 두 가지 방식으로 계산","a":["큰 정사각형","넓이"]},{"l":"(a+b)²=2ab+c²을 정리해 a²+b²=c² 도출","a":["2ab","c²"]}]},{"id":"lk_M28","cat":"수학","grade":"중2","q":"평행사변형의 두 대각선이 서로 다른 것을 이등분한다는 성질을 삼각형의 합동을 이용해 증명하시오.","a":"평행사변형 ABCD에서 두 대각선의 교점을 O라고 하면, 삼각형 OAB와 삼각형 OCD에서 AB와 CD의 길이가 같고, AB와 CD가 평행하므로 엇각인 각 OAB와 각 OCD, 각 OBA와 각 ODC의 크기가 각각 같습니다. 따라서 ASA 합동에 의해 두 삼각형은 합동이므로 대응변인 OA와 OC, OB와 OD의 길이가 각각 같아져 두 대각선은 서로를 이등분합니다.","kw":[{"l":"삼각형 OAB와 OCD가 ASA 합동","a":["ASA","합동"]},{"l":"대응변 OA=OC, OB=OD","a":["OA","OC"]}]},{"id":"lk_M29","cat":"수학","grade":"중2","q":"삼각형의 두 변의 중점을 연결한 선분이 나머지 한 변과 평행하고 길이가 그 절반이 된다는 성질(중점연결정리)을 닮음을 이용해 증명하시오.","a":"삼각형 ABC에서 AB, AC의 중점을 각각 M, N이라고 하면, 삼각형 AMN과 삼각형 ABC에서 AM:AB=AN:AC=1:2이고 각 A는 공통이므로 SAS 닮음입니다. 닮음비가 1:2이므로 대응변인 MN과 BC의 길이의 비도 1:2가 되어 MN의 길이는 BC의 절반이고, 대응각이 같으므로 MN과 BC는 평행합니다.","kw":[{"l":"삼각형 AMN과 ABC가 SAS 닮음(닮음비 1:2)","a":["SAS 닮음","1:2"]},{"l":"MN=BC의 절반, MN∥BC","a":["절반","평행"]}]},{"id":"lk_M30","cat":"수학","grade":"중3","q":"한 호에 대한 원주각의 크기가 그 호에 대한 중심각의 크기의 절반이 되는 까닭을, 원의 중심이 원주각의 내부에 있는 경우를 예로 들어 증명하시오.","a":"원 위의 점 P와 원의 중심 O, 호의 양 끝 점 A, B에 대해 선분 PO를 연장하여 지름을 그으면 삼각형 OPA와 삼각형 OPB는 각각 이등변삼각형이 되므로, 이등변삼각형의 두 밑각이 같다는 성질과 삼각형의 외각은 이웃하지 않는 두 내각의 합과 같다는 성질을 이용하면, 중심각 AOB의 크기가 원주각 APB의 크기의 2배가 됨을 보일 수 있습니다.","kw":[{"l":"PO를 연장한 지름을 이용해 이등변삼각형을 만듦","a":["이등변삼각형","지름"]},{"l":"외각의 성질로 중심각이 원주각의 2배임을 보임","a":["외각","2배"]}]},{"id":"lk_M31","cat":"수학","grade":"중1","q":"다각형의 내각의 크기의 합을 구하는 공식이 (n-2)×180°인 까닭을 대각선을 이용해 설명하시오.","a":"n각형의 한 꼭짓점에서 그을 수 있는 대각선으로 다각형을 나누면 (n-2)개의 삼각형으로 나뉘는데, 삼각형 하나의 내각의 합은 180°이므로 이 삼각형들의 내각의 합을 모두 더하면 다각형 전체의 내각의 합인 (n-2)×180°를 얻게 됩니다.","kw":[{"l":"한 꼭짓점에서 대각선을 그어 (n-2)개의 삼각형으로 나눔","a":["n-2","삼각형으로 나눔"]},{"l":"삼각형 내각의 합(180°)을 모두 더함","a":["180°","더함"]}]},{"id":"lk_M32","cat":"수학","grade":"중2","q":"닮은 두 입체도형의 부피의 비가 닮음비의 세제곱이 되는 까닭을, 닮음비가 넓이의 비에 미치는 영향과 관련지어 설명하시오.","a":"닮음비가 m:n인 두 입체도형은 대응하는 모든 길이의 비가 m:n이므로, 밑면의 넓이와 같은 이차원적인 양은 닮음비의 제곱인 m²:n²의 비를 가집니다. 부피는 이 넓이에 다시 높이(길이)를 곱한 양이므로, 넓이의 비(m²:n²)에 다시 길이의 비(m:n)를 곱하여 부피의 비는 m³:n³이 됩니다.","kw":[{"l":"넓이는 닮음비의 제곱","a":["제곱","넓이"]},{"l":"부피는 넓이×높이라 닮음비의 세제곱","a":["세제곱","부피"]}]},{"id":"lk_M33","cat":"수학","grade":"중3","q":"어떤 자료에 매우 크거나 매우 작은 극단적인 값(이상치)이 하나 포함되어 있을 때, 평균과 중앙값 중 어느 대푯값이 영향을 덜 받는지 설명하시오.","a":"평균은 모든 변량의 값을 더해서 구하므로 극단적으로 크거나 작은 값 하나가 있으면 전체 평균이 크게 영향을 받을 수 있지만, 중앙값은 자료를 크기순으로 나열했을 때 가운데 있는 값만을 이용하므로 극단적인 값의 크기 자체보다는 순서에만 영향을 받아 상대적으로 영향을 덜 받습니다.","kw":[{"l":"평균은 극단값에 크게 영향받음","a":["평균","영향"]},{"l":"중앙값은 순서만 이용해 영향을 덜 받음","a":["중앙값","영향을 덜"]}]},{"id":"lk_M34","cat":"수학","grade":"중2","q":"여사건의 확률(어떤 사건이 일어나지 않을 확률)을 이용해 확률을 구하는 것이 유용한 경우는 어떤 상황인지, \"적어도\"라는 표현과 관련지어 설명하시오.","a":"\"적어도 하나는 ~일 확률\"을 직접 구하려면 하나인 경우, 둘인 경우 등 여러 경우를 따로 더해야 해서 복잡해지는 경우가 많은데, 반대로 그 사건이 하나도 일어나지 않는 여사건의 확률은 한 가지 경우만 계산하면 되므로 훨씬 간단할 때가 많아, 전체 확률 1에서 여사건의 확률을 빼는 방법이 유용합니다.","kw":[{"l":"\"적어도\"의 확률은 직접 구하면 복잡함","a":["적어도","복잡"]},{"l":"여사건은 한 가지 경우만 계산하면 되어 간단","a":["여사건","간단"]}]},{"id":"lk_M35","cat":"수학","grade":"중3","q":"키와 몸무게처럼 서로 관련이 있어 보이는 두 변량 사이의 관계를, 원인과 결과로 단정하지 않고 \"상관관계\"라는 표현을 쓰는 까닭을 설명하시오.","a":"상관관계는 두 변량이 함께 증가하거나 감소하는 경향이 있다는 것을 보여줄 뿐, 한 변량이 다른 변량의 직접적인 원인이라는 것까지 증명하지는 못합니다. 두 변량 모두에 영향을 주는 다른 숨은 요인이 있을 수도 있으므로, 산점도에서 경향성이 보이더라도 이를 곧바로 인과 관계로 단정하지 않고 상관관계라고 표현합니다.","kw":[{"l":"경향성이 있다고 원인·결과까지 증명하지 못함","a":["원인","결과"]},{"l":"다른 숨은 요인이 있을 수 있음","a":["숨은 요인"]}]},{"id":"lk_M36","cat":"수학","grade":"중3","q":"분모가 루트를 포함한 무리수일 때, 분모와 분자에 같은 무리수를 곱해 분모를 유리수로 만들 수 있는 원리를 설명하시오.","a":"루트a와 루트a를 곱하면 근호가 사라져 a라는 유리수가 되는 성질을 이용하는 것으로, 분모가 루트a 꼴일 때 분모와 분자에 똑같이 루트a를 곱하면 분모는 a라는 유리수로 바뀌면서도 분수 전체의 값은 1을 곱한 것과 같으므로 변하지 않습니다.","kw":[{"l":"루트a×루트a=a(유리수)","a":["루트a×루트a","유리수"]},{"l":"분모·분자에 같은 수를 곱해 값이 변하지 않음","a":["값이 변하지 않","1을 곱"]}]},{"id":"lk_M37","cat":"수학","grade":"중2","q":"연립방정식을 이루는 두 일차방정식이 x, y의 계수는 각각 같지만 상수항이 다를 때 해가 없는 까닭을, 두 직선의 관계로 증명하시오.","a":"x, y의 계수가 각각 같은 두 일차방정식은 두 직선의 기울기가 서로 같다는 것을 의미하는데, 상수항까지 다르므로 두 직선은 서로 평행하면서 일치하지는 않는 서로 다른 직선이 됩니다. 평행한 두 직선은 아무리 연장해도 만나는 점이 없으므로, 두 방정식을 동시에 만족하는 x, y의 값이 존재하지 않아 해가 없습니다.","kw":[{"l":"계수가 같아 기울기가 같음(평행)","a":["기울기","평행"]},{"l":"상수항이 달라 일치하지 않아 만나지 않음","a":["일치하지 않","만나지 않"]}]},{"id":"lk_M38","cat":"수학","grade":"중3","q":"이차방정식 x제곱+bx+c=0을 완전제곱식을 이용해 푸는 과정을, x제곱+6x+2=0을 예로 들어 설명하시오.","a":"x제곱+6x+2=0에서 상수항을 우변으로 이항하면 x제곱+6x=-2가 되고, 양변에 x의 계수의 절반의 제곱인 9를 더하면 좌변이 완전제곱식이 되어 (x+3)의 제곱=7이 됩니다. 양변에 제곱근을 취하면 x+3=±루트7이므로 x=-3±루트7이라는 해를 얻습니다.","kw":[{"l":"x의 계수 절반의 제곱을 양변에 더해 완전제곱식을 만듦","a":["완전제곱식","절반의 제곱"]},{"l":"제곱근을 취해 x=-3±루트7","a":["제곱근","±루트7"]}]},{"id":"lk_M39","cat":"수학","grade":"중2","q":"두 수의 합이 20이고 차가 4일 때, 연립방정식을 세워 이 두 수를 구하는 과정을 설명하시오.","a":"두 수를 x, y라 하면 합이 20이므로 x+y=20, 차가 4이므로 x-y=4라는 연립방정식을 세울 수 있습니다. 두 식을 변끼리 더하면 2x=24이므로 x=12이고, 이를 x+y=20에 대입하면 y=8이 되어 두 수는 12와 8입니다.","kw":[{"l":"x+y=20, x-y=4로 연립방정식을 세움","a":["x+y=20","x-y=4"]},{"l":"더해서 x=12, y=8을 구함","a":["12","8"]}]},{"id":"lk_M40","cat":"수학","grade":"중3","q":"곱셈 공식 (a-b)의 제곱을 (a+b)의 제곱 공식으로부터 유도하는 과정을 설명하시오.","a":"(a-b)는 a+(-b)로 볼 수 있으므로, (a+b)의 제곱 공식인 a제곱+2ab+b제곱에서 b 대신 -b를 대입하면 a제곱+2a(-b)+(-b)의 제곱이 되고, 이를 정리하면 a제곱-2ab+b제곱이 되어 (a-b)의 제곱 공식을 얻을 수 있습니다.","kw":[{"l":"a-b를 a+(-b)로 보고 b 대신 -b를 대입","a":["-b","대입"]},{"l":"a²-2ab+b²을 얻음","a":["a²-2ab+b²","-2ab"]}]},{"id":"lk_M41","cat":"수학","grade":"중3","q":"이차함수 y=ax제곱+bx+c의 그래프가 x축과 만나지 않을 수 있는 경우를, a의 부호와 그래프의 위치 관계로 설명하시오.","a":"a가 양수여서 아래로 볼록한 그래프인데 그래프 전체가 x축보다 위쪽에 있거나, a가 음수여서 위로 볼록한 그래프인데 그래프 전체가 x축보다 아래쪽에 있으면, 그래프가 x축과 만나는 점이 전혀 없게 되므로 이차방정식 ax제곱+bx+c=0은 실근을 갖지 않게 됩니다.","kw":[{"l":"아래로 볼록하면서 전체가 x축 위에 있음","a":["아래로 볼록","위"]},{"l":"위로 볼록하면서 전체가 x축 아래에 있음","a":["위로 볼록","아래"]}]},{"id":"lk_M42","cat":"수학","grade":"중2","q":"서로 다른 두 점이 주어지면 그 두 점을 지나는 일차함수의 식이 오직 하나로 정해지는 까닭을 설명하시오.","a":"일차함수의 그래프는 직선인데, 서로 다른 두 점을 지나는 직선은 기하학적으로 오직 하나만 그을 수 있습니다. 두 점의 좌표를 이용하면 기울기를 하나로 정할 수 있고, 그 기울기와 한 점의 좌표를 이용하면 y절편도 하나로 정해지므로, 결국 일차함수의 식 y=ax+b에서 a와 b가 각각 하나의 값으로 정해집니다.","kw":[{"l":"두 점을 지나는 직선은 하나뿐","a":["직선은 하나","두 점"]},{"l":"기울기와 y절편이 각각 하나로 정해짐","a":["기울기","y절편"]}]},{"id":"lk_M43","cat":"수학","grade":"중3","q":"피보나치 수열 1, 1, 2, 3, 5, 8, 13, …에서 이웃한 두 항의 비(뒤의 항÷앞의 항)가 어떤 값에 가까워지는지 확인하는 방법을 중학교 수학으로 설명하시오.","a":"이웃한 두 항의 비를 r(n)=a(n+1)÷a(n)이라 하면 a(n+2)=a(n+1)+a(n)의 양변을 a(n+1)로 나누어 r(n+1)=1+1/r(n)이 됩니다. n이 커질 때 비가 어떤 일정한 값 r에 가까워진다면 r(n)과 r(n+1)이 모두 r에 가까워지므로 r=1+1/r이 되고, 양변에 r을 곱해 정리하면 r²−r−1=0입니다. 근의 공식으로 r=(1±√5)/2인데 비는 양수이므로 r=(1+√5)/2≈1.618, 즉 황금비입니다. 실제로 8/5=1.6, 13/8=1.625, 21/13≈1.615로 1.618 근처에서 오르내리며 가까워집니다.","kw":[{"l":"r(n+1)=1+1/r(n) 관계식 유도","a":["1+1/","1+1÷","점화식","a(n+2)"]},{"l":"극한값 r이 r=1+1/r 만족 → r²−r−1=0","a":["r²−r−1","x²−x−1","이차방정식"]},{"l":"양수 근 (1+√5)/2 = 황금비 ≈1.618","a":["1+√5","1.618","황금비"]}],"level":"advanced"},{"id":"lk_M44","cat":"수학","grade":"중3","q":"φ=(1+√5)/2일 때 φ²=φ+1임을 보이고, 이를 이용해 φ³, φ⁴, φ⁵, φ⁶을 차례로 aφ+b 꼴로 나타내시오. 이때 나타나는 계수의 규칙은 무엇입니까?","a":"φ²=(1+2√5+5)/4=(3+√5)/2이고 φ+1=(3+√5)/2이므로 φ²=φ+1입니다. φ³=φ·φ²=φ²+φ=2φ+1, φ⁴=φ·(2φ+1)=2φ²+φ=3φ+2, φ⁵=3φ²+2φ=5φ+3, φ⁶=5φ²+3φ=8φ+5입니다. 계수가 (1,0),(1,1),(2,1),(3,2),(5,3),(8,5)로 1,1,2,3,5,8 즉 피보나치 수열이 나타나며 φⁿ=F(n)φ+F(n−1)입니다. 실제로 φ⁶=8φ+5=9+4√5입니다.","kw":[{"l":"φ²=φ+1 확인","a":["φ+1","(3+√5)/2"]},{"l":"φ³=2φ+1, φ⁴=3φ+2, φ⁵=5φ+3, φ⁶=8φ+5","a":["2φ+1","3φ+2","5φ+3","8φ+5"]},{"l":"계수가 피보나치 수열","a":["피보나치","1, 1, 2, 3","1,1,2,3"]}],"level":"advanced"},{"id":"lk_M45","cat":"수학","grade":"중3","q":"한 변의 길이가 1인 정오각형의 대각선의 길이를 닮음을 이용해 구하시오.","a":"정오각형 ABCDE의 한 내각은 108°이고 삼각형 ABC는 AB=BC=1인 이등변삼각형이므로 ∠BAC=∠BCA=36°입니다. 대각선 AC=BD=x이고 두 대각선의 교점을 P라 하면 ∠PBC=∠PCB=36°이어서 삼각형 PBC도 PB=PC인 이등변삼각형이고 ∠BPC=108°입니다. 삼각형 ABC와 삼각형 PBC는 모두 각이 36°, 36°, 108°이므로 닮음이고 ∠ABP=72°, ∠APB=72°에서 AP=AB=1이므로 PC=x−1입니다. 닮음비로 AC:BC=BC:PC이므로 x:1=1:(x−1)이고 x²−x−1=0입니다. 근의 공식으로 x=(1+√5)/2≈1.618이며 이는 황금비입니다.","kw":[{"l":"내각 108°, 이등변삼각형의 밑각 36°","a":["108","36"]},{"l":"△ABC ∽ △PBC, AP=AB=1","a":["닮음","AP=1","AP=AB"]},{"l":"x²−x−1=0, x=(1+√5)/2","a":["x²−x−1","1+√5","황금비"]}],"level":"advanced"},{"id":"lk_M46","cat":"수학","grade":"중3","q":"포물선 y=x²과 직선 y=2x+k가 한 점에서만 만나도록 하는 k의 값과 그때의 접점의 좌표를 구하고, k의 값에 따라 교점의 개수가 어떻게 달라지는지 설명하시오.","a":"x²=2x+k에서 x²−2x−k=0이고 한 점에서만 만나려면 중근을 가져야 합니다. (x−1)²=1+k이므로 1+k=0, 즉 k=−1이고 접점은 x=1, y=1인 (1, 1)입니다. k>−1이면 (x−1)²=1+k>0이므로 서로 다른 두 점에서 만나고, k\u003c−1이면 (x−1)²가 음수가 되어 만나지 않습니다.","kw":[{"l":"중근 조건으로 k=−1","a":["k=−1","중근"]},{"l":"접점 (1,1)","a":["(1, 1)","(1,1)"]},{"l":"k>−1 두 점, k\u003c−1 만나지 않음","a":["두 점","만나지 않"]}],"level":"advanced"},{"id":"lk_M47","cat":"수학","grade":"중3","q":"한 변의 길이가 a인 정삼각형의 외접원의 반지름 R과 내접원의 반지름 r을 구하고 R=2r임을 보이시오.","a":"정삼각형에서는 외심, 내심, 무게중심이 모두 같은 점입니다. 높이는 (√3/2)a이고 무게중심은 중선을 꼭짓점으로부터 2:1로 나누므로 R=(2/3)×(√3/2)a=√3a/3, r=(1/3)×(√3/2)a=√3a/6입니다. 따라서 R=2r입니다.","kw":[{"l":"외심=내심=무게중심","a":["무게중심","같은 점"]},{"l":"높이 (√3/2)a, 2:1 분할","a":["2:1","(√3/2)a"]},{"l":"R=√3a/3, r=√3a/6, R=2r","a":["√3a/3","√3a/6","R=2r"]}],"level":"advanced"},{"id":"lk_M48","cat":"수학","grade":"중3","q":"x에 대한 이차방정식 x²−ax+12=0의 두 근이 모두 정수일 때 가능한 a의 값을 모두 구하시오.","a":"두 근을 p, q라 하면 x²−ax+12=(x−p)(x−q)=x²−(p+q)x+pq이므로 pq=12, a=p+q입니다. 곱이 12인 정수의 쌍은 (1, 12), (2, 6), (3, 4)와 각각의 부호를 모두 바꾼 쌍이므로 a=13, 8, 7 또는 −13, −8, −7입니다.","kw":[{"l":"(x−p)(x−q)로 인수분해, pq=12","a":["pq=12","(x−p)(x−q)"]},{"l":"곱이 12인 쌍 (1,12),(2,6),(3,4)","a":["(1, 12)","(2, 6)","(3, 4)"]},{"l":"a=±7, ±8, ±13","a":["13","8","7"]}],"level":"advanced"},{"id":"lk_M49","cat":"수학","grade":"중3","q":"x에 대한 이차방정식 x²+ax+b=0 (a, b는 유리수)의 한 근이 1+√2일 때 a, b의 값을 구하고 다른 한 근을 구하시오.","a":"x=1+√2를 대입하면 (1+√2)²+a(1+√2)+b=0이고 전개하면 (3+a+b)+(2+a)√2=0입니다. a, b가 유리수이고 √2는 무리수이므로 3+a+b=0이고 2+a=0이어야 하며, a=−2, b=−1입니다. 이때 방정식은 x²−2x−1=0이고 근의 공식으로 x=1±√2이므로 다른 한 근은 1−√2입니다.","kw":[{"l":"대입해 (3+a+b)+(2+a)√2=0","a":["(2+a)√2","3+a+b"]},{"l":"유리수 부분과 무리수 부분이 각각 0","a":["무리수","유리수"]},{"l":"a=−2, b=−1, 다른 근 1−√2","a":["a=−2","b=−1","1−√2"]}],"level":"advanced"},{"id":"lk_M50","cat":"수학","grade":"중3","q":"방정식 x⁴−13x²+36=0을 푸시오. 또 x⁴+x²+1을 인수분해하시오.","a":"x²=t로 놓으면 t²−13t+36=(t−4)(t−9)=0이므로 x²=4 또는 x²=9이고 x=±2, ±3입니다. x⁴+x²+1=(x⁴+2x²+1)−x²=(x²+1)²−x²=(x²+x+1)(x²−x+1)입니다.","kw":[{"l":"치환 후 (t−4)(t−9)","a":["(t−4)(t−9)","치환"]},{"l":"x=±2, ±3","a":["±2","±3","2, 3"]},{"l":"(x²+x+1)(x²−x+1)","a":["x²+x+1","x²−x+1"]}],"level":"advanced"},{"id":"lk_M51","cat":"수학","grade":"중3","q":"∠A=90°인 직각삼각형 ABC의 점 A에서 빗변 BC에 내린 수선의 발을 H라 할 때 닮음을 이용해 AB²=BH×BC, AC²=CH×CB를 보이고 이로부터 피타고라스 정리를 유도하시오.","a":"삼각형 ABC와 삼각형 HBA는 ∠B가 공통이고 ∠BAC=∠BHA=90°이므로 닮음이며 BA:BH=BC:BA에서 AB²=BH×BC입니다. 마찬가지로 삼각형 ABC와 삼각형 HAC는 ∠C가 공통이고 직각이 하나씩 있어 닮음이며 AC²=CH×CB입니다. 두 식을 변끼리 더하면 AB²+AC²=BC×(BH+CH)=BC×BC=BC²이므로 피타고라스 정리가 성립합니다.","kw":[{"l":"△ABC ∽ △HBA","a":["△HBA","HBA","닮음"]},{"l":"AB²=BH×BC, AC²=CH×CB","a":["BH×BC","BH·BC","CH×CB"]},{"l":"합하면 BC² (BH+CH=BC)","a":["BH+CH","BC²"]}],"level":"advanced"},{"id":"lk_M52","cat":"수학","grade":"중3","q":"삼각형 ABC에서 ∠A의 이등분선이 변 BC와 만나는 점을 D라 할 때 BD:DC=AB:AC임을 증명하시오.","a":"점 C를 지나 AD에 평행한 직선을 긋고 변 BA의 연장선과 만나는 점을 E라 합니다. 평행선의 성질에서 ∠BAD=∠AEC(동위각), ∠DAC=∠ACE(엇각)인데 ∠BAD=∠DAC이므로 ∠AEC=∠ACE이고 삼각형 ACE는 이등변삼각형이어서 AE=AC입니다. 또 삼각형 BAD와 삼각형 BEC는 AD∥EC이므로 닮음이고 BD:DC=BA:AE입니다. AE=AC이므로 BD:DC=AB:AC입니다.","kw":[{"l":"C를 지나 AD에 평행한 직선, 연장선과 E","a":["평행","연장"]},{"l":"AE=AC (이등변삼각형)","a":["AE=AC","이등변"]},{"l":"평행선과 비례 / 닮음 → BD:DC=AB:AC","a":["닮음","비례","BD:DC"]}],"level":"advanced"},{"id":"lk_M53","cat":"수학","grade":"중2","q":"삼각형의 세 중선이 한 점에서 만나고 그 점이 각 중선을 꼭짓점으로부터 2:1로 나눔을 증명하시오.","a":"삼각형 ABC에서 AB, AC의 중점을 F, E라 하고 중선 BE, CF의 교점을 G라 합니다. 중점연결정리에 의해 EF∥BC이고 EF=BC/2이므로 삼각형 GEF와 삼각형 GBC는 닮음비 1:2입니다. 따라서 GE:GB=1:2, GF:GC=1:2입니다. 같은 방법으로 중선 AD와 BE의 교점 G′도 BG′:G′E=2:1이므로 G′=G이고 세 중선이 한 점에서 만납니다.","kw":[{"l":"중점연결정리 EF∥BC, EF=BC/2","a":["중점연결","EF∥BC","EF="]},{"l":"△GEF ∽ △GBC (1:2)","a":["닮음","1:2"]},{"l":"세 번째 중선도 같은 점 (G′=G)","a":["G′","세 중선","한 점"]}],"level":"advanced"},{"id":"lk_M54","cat":"수학","grade":"중3","q":"이차함수 y=x²−4x+1의 그래프를 x축, y축, 원점에 대하여 각각 대칭이동한 그래프의 식을 구하시오.","a":"x축 대칭은 y 대신 −y를 대입하여 y=−x²+4x−1, y축 대칭은 x 대신 −x를 대입하여 y=x²+4x+1, 원점 대칭은 x, y 모두 부호를 바꾸어 y=−x²−4x−1입니다.","kw":[{"l":"x축 대칭 y=−x²+4x−1","a":["−x²+4x−1"]},{"l":"y축 대칭 y=x²+4x+1","a":["x²+4x+1"]},{"l":"원점 대칭 y=−x²−4x−1","a":["−x²−4x−1"]}],"level":"advanced"},{"id":"lk_M55","cat":"수학","grade":"중3","q":"x축과 두 점 (−1, 0), (2, 0)에서 만나고 점 (0, −4)를 지나는 이차함수의 식과 최솟값을 구하시오.","a":"x축과 만나는 점이 −1, 2이므로 y=a(x+1)(x−2)로 놓습니다. (0, −4)를 대입하면 −4=a×1×(−2)이므로 a=2이고 y=2(x+1)(x−2)=2x²−2x−4입니다. y=2(x−1/2)²−9/2이므로 최솟값은 x=1/2일 때 −9/2입니다.","kw":[{"l":"y=a(x+1)(x−2)","a":["a(x+1)(x−2)"]},{"l":"a=2, y=2x²−2x−4","a":["a=2","2x²−2x−4"]},{"l":"최솟값 −9/2","a":["−9/2","−4.5"]}],"level":"advanced"},{"id":"lk_M56","cat":"수학","grade":"중3","q":"x+1/x=3일 때 x²+1/x²과 x³+1/x³의 값을 구하시오.","a":"(x+1/x)²=x²+2+1/x²이므로 9=x²+2+1/x²에서 x²+1/x²=7입니다. (x+1/x)³=x³+1/x³+3(x+1/x)이므로 27=x³+1/x³+9에서 x³+1/x³=18입니다.","kw":[{"l":"x²+1/x²=7","a":["7"]},{"l":"(x+1/x)³ 전개 이용","a":["(x+1/x)³","3(x+1/x)","세제곱"]},{"l":"x³+1/x³=18","a":["18"]}],"level":"advanced"},{"id":"lk_S1","cat":"과학","grade":"중3","q":"멘델의 유전 법칙에 대해 답하세요. (1) 멘델의 유전 법칙 세 가지를 설명하세요. (2) 우열의 원리를 완두의 형질을 예로 들어 설명하세요. (3) 분리의 법칙이 무엇인지 설명하세요. (4) 독립의 법칙을 설명하고, 모든 유전자에 독립의 법칙이 적용되는지 말하세요.","a":"(1) 우열의 원리, 분리의 법칙, 독립의 법칙입니다. (2) 대립 형질이 다른 순종끼리 교배하면 잡종 1대에는 한 가지 형질(우성)만 나타납니다. 예를 들어 둥근 완두(RR)와 주름진 완두(rr)를 교배하면 1대는 모두 둥근 완두(Rr)이고, 나타나지 않는 주름진 형질이 열성입니다. (3) 생식세포가 만들어질 때 쌍으로 있던 대립 유전자가 분리되어 서로 다른 생식세포로 들어가는 것입니다. Rr은 R와 r를 가진 생식세포가 1:1로 만들어지고, 잡종 2대에서 둥근 것 : 주름진 것이 약 3 : 1로 나옵니다. (4) 두 쌍 이상의 대립 형질이 함께 유전될 때 각 형질이 서로 영향을 주지 않고 독립적으로 유전되는 것입니다. 둥글고 노란 완두(RRYY)와 주름지고 초록인 완두(rryy)를 교배한 2대에서 둥글고 노란 것 : 둥글고 초록 : 주름지고 노란 것 : 주름지고 초록 = 9 : 3 : 3 : 1입니다. 모든 유전자에 적용되지는 않습니다. 같은 염색체 위에 가까이 있는 유전자는 함께 유전되는 경우가 있어서 독립의 법칙을 따르지 않고, 서로 다른 염색체에 있는 유전자에서 성립합니다.","kw":[{"l":"우열·분리·독립","a":["우열·분리·독립","우열","분리","독립"]},{"l":"RR×rr → Rr","a":["RR×rr","Rr"]},{"l":"3:1","a":["3:1"]},{"l":"9:3:3:1","a":["9:3:3:1"]},{"l":"같은 염색체의 유전자는 독립 아님","a":["염색체의","유전자는","같은"]}]},{"id":"lk_S2","cat":"과학","grade":"중3","q":"지구형 행성과 목성형 행성을 비교하세요. (1) 지구형 행성에 해당하는 행성을 모두 쓰세요. (2) 목성형 행성에 해당하는 행성을 모두 쓰세요. (3) 크기, 질량, 평균 밀도, 주요 구성 물질, 위성 수, 고리의 존재, 태양과의 거리 측면에서 두 행성군을 비교하세요. (4) 평균 밀도에 차이가 나타나는 이유를 설명하세요.","a":"(1) 수성, 금성, 지구, 화성입니다. (2) 목성, 토성, 천왕성, 해왕성입니다. (3) 크기와 질량은 지구형이 작고 목성형이 큽니다(목성의 지름은 지구의 약 11배, 질량은 약 318배). 평균 밀도는 지구형이 약 3.9~5.5 g/cm³로 크고 목성형이 약 0.7~1.6 g/cm³로 작습니다. 주요 구성 물질은 지구형은 암석과 금속(철 등), 목성형은 수소와 헬륨 같은 기체이고, 천왕성과 해왕성은 얼음 성분의 비중이 큽니다. 위성 수는 지구형이 적거나 없고(수성·금성 0개, 지구 1개, 화성 2개) 목성형은 많습니다. 고리는 지구형에는 없고 목성형에는 모두 있습니다(토성이 가장 뚜렷). 태양과의 거리는 지구형이 가깝고 목성형이 멉니다. (4) 지구형은 단단한 암석과 금속으로 이루어져 밀도가 크고, 목성형은 부피가 크지만 가벼운 수소와 헬륨이 대부분이라 밀도가 작기 때문입니다.","kw":[{"l":"수금지화 / 목토천해","a":["수금지화","목토천해"]},{"l":"지구형: 작고 밀도 큼, 암석·금속, 위성 적음, 고리 없음","a":["지구형","작고","밀도"]},{"l":"목성형: 크고 밀도 작음, 기체, 위성 많음, 고리 있음","a":["목성형","크고","밀도"]}]},{"id":"lk_S3","cat":"과학","grade":"중3","q":"산화와 환원에 대해 답하세요. (1) 산화 반응과 환원 반응을 설명하세요. (2) 전자의 이동을 기준으로 산화와 환원을 설명하세요. (3) 산소의 이동을 기준으로, 구리와 산소의 반응, 산화 구리와 탄소의 반응에서 산화되는 물질과 환원되는 물질을 말하세요.","a":"(1) 어떤 물질이 산소를 얻는 반응이 산화이고 산소를 잃는 반응이 환원입니다. 산화와 환원은 항상 동시에 일어납니다. (2) 전자를 잃는 반응이 산화, 전자를 얻는 반응이 환원입니다. 예를 들어 Zn → Zn²⁺ + 2e⁻는 산화이고 Cu²⁺ + 2e⁻ → Cu는 환원입니다. (3) 구리를 가열하면 2Cu + O₂ → 2CuO로 구리가 산소를 얻어 산화됩니다. 산화 구리와 탄소를 가열하면 2CuO + C → 2Cu + CO₂로 산화 구리는 산소를 잃어 환원되고 탄소는 산소를 얻어 산화됩니다. 이때 산화되는 물질은 다른 물질을 환원시키는 환원제, 환원되는 물질은 산화제 역할을 합니다.","kw":[{"l":"산소 얻음=산화","a":["산소 얻음=산화","산소","얻음","산화"]},{"l":"산소 잃음=환원","a":["산소 잃음=환원","산소","잃음","환원"]},{"l":"전자 잃음=산화","a":["전자 잃음=산화","전자","잃음","산화"]},{"l":"동시에 일어남","a":["동시에 일어남","동시에","일어남"]},{"l":"2CuO + C → 2Cu + CO₂","a":["2CuO","2Cu","CO₂"]}]},{"id":"lk_S4","cat":"과학","grade":"중3","q":"중학교 과학에서 배운 힘을 아는 대로 모두 말하고, 각각을 설명하세요.","a":"중력은 지구가 물체를 끌어당기는 힘으로 크기가 무게이고 단위는 N입니다. 탄성력은 변형된 물체가 원래 모양으로 돌아가려는 힘으로 변형시킨 힘과 반대 방향이며 용수철에서는 늘어난 길이에 비례합니다. 마찰력은 접촉면에서 운동을 방해하는 힘으로 운동하려는 방향과 반대이고 면이 거칠수록, 수직으로 누르는 힘이 클수록 커지며 접촉 넓이와는 관계가 없습니다. 수직항력은 면이 물체를 수직으로 떠받치는 힘이고, 장력은 줄이 당기는 힘입니다. 부력은 물이나 공기가 물체를 위로 미는 힘으로 크기는 밀어낸 유체의 무게입니다. 전기력은 같은 전하끼리 밀고 다른 전하끼리 당기는 힘, 자기력은 같은 극끼리 밀고 다른 극끼리 당기는 힘입니다. 이 밖에 작용·반작용(크기가 같고 방향이 반대이며 서로 다른 물체에 작용)과 힘의 평형(한 물체에 작용하는 두 힘이 크기가 같고 방향이 반대라 합력이 0)이 있습니다. 중력·전기력·자기력은 떨어져서 작용하고 나머지는 접촉해서 작용합니다. 관성은 힘이 아니라 물체의 성질이고, 압력도 힘이 아닙니다.","kw":[{"l":"중력·탄성력·마찰력·수직항력·장력·부력·전기력·자기력","a":["수직항력","탄성력","마찰력"]},{"l":"작용·반작용","a":["작용·반작용","반작용","작용"]},{"l":"힘의 평형","a":["힘의 평형","힘의","평형"]},{"l":"관성은 힘이 아님","a":["관성은","힘이","아님"]}]},{"id":"lk_S5","cat":"과학","grade":"중3","q":"(1) 질량과 무게의 차이를 설명하세요. (2) 지구에서 질량이 60 kg인 사람이 달에 가면 질량과 무게는 어떻게 되나요? (3) 용수철저울과 양팔저울은 달에서 각각 어떤 값을 가리키나요? (4) 100 g짜리 추를 매달면 용수철이 2 cm 늘어날 때, 250 g을 매달면 얼마나 늘어나나요?","a":"(1) 질량은 물체가 가진 물질의 양으로 어디서나 같고 단위는 kg입니다. 무게는 물체에 작용하는 중력의 크기로 장소에 따라 달라지고 단위는 N입니다. (2) 질량은 60 kg으로 그대로입니다. 지구에서 무게는 60 × 9.8 = 588 N이고, 달의 중력은 지구의 약 1/6이므로 약 98 N이 됩니다. (3) 용수철저울은 중력(무게)을 재므로 달에서 값이 약 1/6로 줄어듭니다. 양팔저울은 물체와 분동에 같은 중력이 작용해서 비교하므로 달에서도 같은 질량을 가리킵니다. (4) 용수철이 늘어난 길이는 매단 물체의 무게에 비례(훅의 법칙)하므로 250 g이면 2 × 2.5 = 5 cm입니다. 용수철의 탄성 한계를 넘지 않는 범위에서만 성립합니다.","kw":[{"l":"질량: 일정, kg","a":["질량","일정","kg"]},{"l":"무게: 중력, N","a":["무게","중력"]},{"l":"달 1/6","a":["달 1/6"]},{"l":"용수철저울 변함, 양팔저울 변하지 않음","a":["용수철저울","양팔저울","변하지"]},{"l":"늘어난 길이 ∝ 무게","a":["늘어난","길이","무게"]}]},{"id":"lk_S6","cat":"과학","grade":"중3","q":"금속 토막을 용수철저울에 매달았더니 공기 중에서 2.7 N이었고, 물에 완전히 잠기게 했더니 1.7 N이었습니다. (1) 이 금속에 작용하는 부력은 얼마인가요? (2) 금속의 부피, 질량, 밀도를 구하세요. (3) 더 깊이 넣으면 저울 눈금이 어떻게 되나요? (4) 부력의 방향과 크기가 정해지는 원리를 말하세요. (g = 10 m/s², 물의 밀도 1000 kg/m³)","a":"(1) 부력은 공기 중 무게에서 물속 무게를 뺀 값이므로 2.7 − 1.7 = 1.0 N입니다. (2) 부력은 밀어낸 물의 무게이므로 1.0 N = 1000 × V × 10에서 V = 1.0 × 10⁻⁴ m³ = 100 cm³입니다. 질량은 무게 2.7 N ÷ 10 = 0.27 kg = 270 g이고 밀도는 270 g ÷ 100 cm³ = 2.7 g/cm³입니다(알루미늄과 비슷합니다). (3) 완전히 잠긴 뒤에는 밀어낸 물의 부피가 일정하므로 부력이 그대로이고 눈금은 1.7 N으로 변하지 않습니다. 부력은 물체가 잠긴 부피에 따라 정해지고 깊이와는 관계가 없습니다. (4) 부력은 위쪽으로 작용하고 크기는 물체가 밀어낸 유체의 무게와 같습니다(아르키메데스의 원리). 물속에서는 아래쪽 면이 받는 압력이 위쪽 면보다 커서 위로 향하는 힘이 생깁니다.","kw":[{"l":"부력 = W − W′ = 1.0 N","a":["부력","W′"]},{"l":"V = F/ρg = 100 cm³","a":["100","cm³","ρg"]},{"l":"밀도 2.7 g/cm³","a":["cm³","밀도"]},{"l":"깊이와 무관","a":["깊이와 무관","깊이와","무관"]}]},{"id":"lk_S7","cat":"과학","grade":"중3","q":"전기 회로에 대해 답하세요. (1) 옴의 법칙을 설명하세요. (2) 6 V 전원에 2 Ω과 3 Ω 저항을 직렬로 연결할 때 회로에 흐르는 전류와 각 저항에 걸리는 전압을 구하세요. (3) 같은 저항을 병렬로 연결할 때 합성 저항과 전체 전류를 구하세요. (4) 도선에 전류가 흐를 때 주위에 생기는 현상을 설명하세요.","a":"(1) 도선에 흐르는 전류의 세기 I는 전압 V에 비례하고 저항 R에 반비례합니다. V = IR입니다. (2) 직렬이면 합성 저항이 2 + 3 = 5 Ω이므로 전류는 6 ÷ 5 = 1.2 A이고 각 저항에는 같은 전류가 흐릅니다. 전압은 2 Ω에 1.2 × 2 = 2.4 V, 3 Ω에 1.2 × 3 = 3.6 V이고 합이 6 V입니다. (3) 병렬이면 1/R = 1/2 + 1/3 = 5/6이므로 R = 1.2 Ω이고 전체 전류는 6 ÷ 1.2 = 5 A입니다. 각 저항에 6 V가 걸리고 전류는 2 Ω에 3 A, 3 Ω에 2 A로 나뉩니다. (4) 전류가 흐르는 도선 주위에는 자기장이 생깁니다. 직선 도선에서는 엄지를 전류 방향으로 하고 감아쥔 네 손가락 방향이 자기장 방향입니다(오른손 법칙). 반대로 코일 근처에서 자석을 움직이면 코일에 유도 전류가 생깁니다.","kw":[{"l":"V=IR","a":["V=IR","IR"]},{"l":"직렬 5 Ω, 1.2 A, 2.4 V + 3.6 V","a":["직렬"]},{"l":"병렬 1.2 Ω, 5 A","a":["병렬"]},{"l":"전류의 자기 작용","a":["전류의","자기","작용"]}]},{"id":"lk_S8","cat":"과학","grade":"중3","q":"열과 온도에 대해 답하세요. (1) 열과 온도의 차이를 설명하세요. (2) 열이 이동하는 세 가지 방법을 쓰고 일상 예를 한 가지씩 말하세요. (3) 온도가 서로 다른 두 물체를 접촉시켰을 때 어떤 일이 일어나며 결국 어떻게 되나요?","a":"(1) 온도는 물체의 차갑고 뜨거운 정도를 숫자로 나타낸 것이고, 열은 온도가 다른 두 물체 사이에서 이동하는 에너지입니다. 온도는 입자의 평균 운동 정도와 관련이 있습니다. (2) 전도는 물체 속에서 이웃한 입자를 통해 열이 이동하는 것으로 뜨거운 국에 담근 숟가락이 뜨거워지는 경우가 있습니다. 대류는 액체나 기체가 직접 이동해 열을 옮기는 것으로 난로 위쪽 공기가 순환하는 경우가 있습니다. 복사는 물질 없이 열이 전달되는 것으로 햇빛이 지구를 데우는 경우가 있습니다. (3) 열은 온도가 높은 물체에서 낮은 물체로 이동하고, 두 물체의 온도가 같아지는 열평형 상태에 도달하면 더 이상 이동하지 않습니다.","kw":[{"l":"열=이동하는 에너지","a":["이동하는","에너지"]},{"l":"온도=뜨거운 정도","a":["뜨거운","온도","정도"]},{"l":"전도/대류/복사","a":["전도/대류/복사","전도","대류","복사"]},{"l":"열평형","a":["열평형"]}]},{"id":"lk_S9","cat":"과학","grade":"중3","q":"일과 에너지에 대해 답하세요. (1) 과학에서 말하는 일을 정의하세요. (2) 위치 에너지와 운동 에너지의 식을 쓰세요. (3) 질량 2 kg의 물체를 높이 5 m에서 떨어뜨릴 때 처음 위치 에너지와 땅에 닿기 직전의 속력을 구하세요. (마찰 무시, g = 10 m/s²)","a":"(1) 일은 물체에 힘을 가해 힘의 방향으로 이동시킨 것으로 W = F × s이고 단위는 J(줄)입니다. 힘을 주었어도 움직이지 않으면 일이 0이고, 물체를 들고 수평으로 걸을 때도 힘의 방향(위쪽)으로 이동하지 않았으므로 일을 하지 않은 것입니다. (2) 위치 에너지는 mgh, 운동 에너지는 (1/2)mv²입니다. (3) 위치 에너지는 2 × 10 × 5 = 100 J입니다. 마찰이 없으면 역학적 에너지가 보존되어 위치 에너지가 모두 운동 에너지가 되므로 (1/2) × 2 × v² = 100에서 v = 10 m/s입니다.","kw":[{"l":"W=Fs (J)","a":["W=Fs (J)","Fs"]},{"l":"위치 mgh","a":["위치 mgh","mgh","위치"]},{"l":"운동 ½mv²","a":["운동 ½mv²","½mv²","운동"]},{"l":"역학적 에너지 보존","a":["역학적","에너지","보존"]},{"l":"100 J → 10 m/s","a":["100","10"]}]},{"id":"lk_S10","cat":"과학","grade":"중3","q":"밀도에 대해 답하세요. (1) 밀도의 정의와 단위를 말하세요. (2) 질량이 54 g이고 부피가 20 cm³인 금속의 밀도를 구하세요. (3) 물체가 물에 뜨는 조건은 무엇인가요? (4) 대부분의 물질에서 온도가 올라가면 밀도는 어떻게 되나요?","a":"(1) 밀도는 단위 부피당 질량으로 밀도 = 질량 ÷ 부피이고 단위는 g/cm³ 또는 kg/m³입니다. 물질의 종류에 따라 정해지는 고유한 성질이어서 물질을 구별하는 데 쓰입니다. (2) 54 ÷ 20 = 2.7 g/cm³입니다(알루미늄과 비슷합니다). (3) 물체의 밀도가 물(1 g/cm³)보다 작으면 뜨고 크면 가라앉습니다. (4) 온도가 올라가면 질량은 같고 부피가 늘어나서 밀도는 작아집니다. 물은 4℃에서 밀도가 가장 커서 얼음이 물 위에 뜹니다.","kw":[{"l":"밀도 = 질량/부피","a":["밀도","질량","부피"]},{"l":"54/20 = 2.7 g/cm³","a":["cm³","54","20"]},{"l":"물보다 작으면 뜸","a":["물보다","작으면"]},{"l":"온도↑ 부피↑ 밀도↓","a":["온도↑","부피↑","밀도↓"]}]},{"id":"lk_S11","cat":"과학","grade":"중3","q":"물질의 상태 변화에 대해 답하세요. (1) 고체, 액체, 기체의 입자 배열과 운동을 비교하세요. (2) 얼음을 가열할 때 온도가 일정한 구간이 있는 이유를 설명하세요. (3) 융해, 응고, 기화, 액화, 승화가 무엇인지 말하고 열의 출입을 구분하세요.","a":"(1) 고체는 입자가 규칙적으로 배열되어 제자리에서 진동하고, 액체는 입자가 비교적 가까이 있지만 자리를 바꾸며 움직이고, 기체는 입자 사이가 매우 멀고 자유롭게 움직입니다. (2) 얼음이 녹는 동안(0℃)과 물이 끓는 동안(100℃)에는 가해 준 열이 온도를 올리는 데 쓰이지 않고 입자 사이의 거리를 변화시키는 상태 변화에 쓰이므로 온도가 일정합니다. (3) 고체가 액체로 변하는 것이 융해, 액체가 고체로 변하는 것이 응고, 액체가 기체로 변하는 것이 기화, 기체가 액체로 변하는 것이 액화이고, 고체가 기체로(또는 반대로) 곧바로 변하는 것이 승화입니다. 융해, 기화, 승화(고체 → 기체)는 열을 흡수하고, 응고, 액화는 열을 방출합니다. 상태가 변해도 질량은 변하지 않고 입자 수는 같으며, 부피는 변할 수 있습니다.","kw":[{"l":"고체 규칙·진동 / 액체 자리 바꿈 / 기체 자유","a":["고체","규칙","진동"]},{"l":"상태 변화 중 온도 일정","a":["상태","변화","온도"]},{"l":"융해·기화 흡열, 응고·액화 방열","a":["융해","기화","흡열"]},{"l":"질량 불변","a":["질량 불변","질량","불변"]}]},{"id":"lk_S12","cat":"과학","grade":"중3","q":"원자와 이온에 대해 답하세요. (1) 원자의 구조를 설명하세요. (2) 원자번호가 11이고 전자가 11개인 나트륨 원자가 이온이 되는 과정을 설명하세요. (3) 원자, 분자, 이온의 차이를 말하세요.","a":"(1) 원자는 중심에 (+)전하를 띤 원자핵이 있고 그 주위를 (−)전하를 띤 전자가 움직입니다. 원자핵은 (+)전하의 양성자와 전하가 없는 중성자로 이루어져 있고, 원자는 양성자 수와 전자 수가 같아서 전기적으로 중성입니다. 원자번호는 양성자 수입니다. (2) 나트륨 원자(Na)는 전자 1개를 잃으면 양성자 11개, 전자 10개가 되어 +1의 전하를 띠는 양이온 Na⁺이 됩니다. 염소 원자(Cl)는 전자 1개를 얻으면 음이온 Cl⁻이 되고, 두 이온이 전기적으로 결합하면 염화 나트륨(NaCl)입니다. (3) 원자는 물질을 이루는 기본 입자이고, 분자는 원자가 결합해서 물질의 성질을 나타내는 가장 작은 입자(예: H₂O)이며, 이온은 원자가 전자를 잃거나 얻어 전하를 띤 입자입니다.","kw":[{"l":"핵(양성자+, 중성자0) + 전자−","a":["중성자0","양성자","전자−"]},{"l":"원자번호 = 양성자 수","a":["원자번호","양성자"]},{"l":"전자 잃음 → 양이온","a":["양이온","전자","잃음"]},{"l":"전자 얻음 → 음이온","a":["음이온","전자","얻음"]},{"l":"분자 H₂O","a":["분자 H₂O","H₂O","분자"]}]},{"id":"lk_S13","cat":"과학","grade":"중3","q":"화학 반응의 법칙에 대해 답하세요. (1) 질량 보존 법칙을 설명하고 밀폐된 용기에서만 성립하는 것처럼 보이는 이유를 말하세요. (2) 일정 성분비 법칙을 물을 예로 설명하세요. (3) 수소 4 g이 산소와 완전히 반응하면 물이 몇 g 생기며 산소는 몇 g 필요한가요?","a":"(1) 화학 반응 전후에 원자의 종류와 수가 변하지 않으므로 물질의 전체 질량은 같습니다. 열린 용기에서 기체가 빠져나가거나 들어오면 질량이 변한 것처럼 보이지만, 기체까지 포함하면 질량은 보존됩니다. (2) 한 화합물을 이루는 성분 원소의 질량비는 항상 일정합니다. 물은 수소와 산소의 질량비가 1 : 8이고, 수소 1 g에는 산소 8 g이 반응합니다. (3) 수소 4 g에 반응하는 산소는 4 × 8 = 32 g이고 생성되는 물은 4 + 32 = 36 g입니다. 기체 반응 법칙에 따르면 같은 온도와 압력에서 반응하는 기체의 부피비도 간단한 정수비(2H₂ + O₂ → 2H₂O에서 2 : 1 : 2)입니다.","kw":[{"l":"반응 전후 원자 종류·수 같음","a":["반응","전후","원자"]},{"l":"질량 보존","a":["질량 보존","질량","보존"]},{"l":"물 H:O = 1:8","a":["물 H:O = 1:8"]},{"l":"수소 4g + 산소 32g → 물 36g","a":["32g","36g","수소"]},{"l":"부피비 2:1:2","a":["부피비"]}]},{"id":"lk_S14","cat":"과학","grade":"중3","q":"판 구조론에 대해 답하세요. (1) 판이란 무엇이고 판의 경계에는 어떤 종류가 있나요? (2) 각 경계에서 나타나는 지형과 현상을 말하세요. (3) 지진파 P파와 S파의 차이를 말하세요. (4) 규모와 진도는 어떻게 다른가요?","a":"(1) 판은 지각과 상부 맨틀 일부로 이루어진 단단한 암석권 조각이고 맨틀의 대류를 따라 움직입니다. 경계는 판이 멀어지는 발산형, 서로 다가가는 수렴형, 서로 어긋나는 보존형이 있습니다. (2) 발산형에서는 해령과 열곡이 생기고 새 지각이 만들어집니다. 수렴형에서는 해양판이 대륙판 아래로 들어가는 섭입 때문에 해구, 화산, 지진이 일어나고, 대륙판끼리 충돌하면 히말라야 같은 습곡 산맥이 생깁니다. 보존형에서는 변환 단층이 생겨서 지진이 일어납니다. (3) P파는 진행 방향과 나란히 진동하는 종파로 속도가 빠르고 고체, 액체, 기체를 모두 통과하며, S파는 진행 방향에 수직으로 진동하는 횡파로 속도가 느리고 고체만 통과합니다. (4) 규모는 지진 자체의 에너지로 하나의 값이며, 진도는 어떤 장소에서 느끼는 흔들림과 피해 정도라 장소마다 다릅니다.","kw":[{"l":"발산(해령)·수렴(해구, 습곡 산맥)·보존(변환 단층)","a":["발산","해령","수렴"]},{"l":"P파 빠름·종파 / S파 느림·횡파","a":["P파","빠름","종파"]},{"l":"규모 = 에너지, 진도 = 피해 정도","a":["에너지","규모","진도"]}]},{"id":"lk_S15","cat":"과학","grade":"중3","q":"빛에 대해 답하세요. (1) 빛의 반사 법칙을 설명하세요. (2) 빛이 공기에서 물로 들어갈 때 굴절하는 방향과 이유를 말하세요. (3) 볼록 렌즈로 만들어지는 상을 물체의 위치에 따라 설명하세요.","a":"(1) 입사각과 반사각의 크기가 같고 입사 광선, 반사 광선, 법선은 같은 평면에 있습니다. 거친 면에서는 난반사가 일어나 여러 방향에서 물체가 보입니다. (2) 빛은 매질에 따라 속력이 달라서 경계면에서 꺾이는데, 공기에서 물로 들어가면 속력이 느려져 법선 쪽으로 꺾입니다. 그래서 물속의 물체는 실제보다 얕게 보입니다. (3) 볼록 렌즈는 빛을 모읍니다. 물체가 초점 밖에 있으면 거꾸로 선 실상(스크린에 맺힘)이 생기고, 초점 안쪽에 있으면 바로 선 확대된 허상이 보이므로 돋보기로 쓰입니다. 물체가 초점에 있으면 상이 생기지 않습니다. 빛이 물이나 유리에서 공기로 나갈 때 입사각이 임계각보다 크면 전반사가 일어나며, 광섬유가 이를 이용합니다.","kw":[{"l":"입사각 = 반사각","a":["입사각","반사각"]},{"l":"공기→물: 법선 쪽으로 꺾임","a":["쪽으로","공기","법선"]},{"l":"초점 밖: 도립 실상 / 초점 안: 정립 허상","a":["초점","도립","실상"]},{"l":"전반사: 광섬유","a":["전반사: 광섬유","전반사","광섬유"]}]},{"id":"lk_S16","cat":"과학","grade":"중3","q":"소리에 대해 답하세요. (1) 소리의 세 요소를 말하고 파동의 어떤 성질과 관련되는지 설명하세요. (2) 소리가 진공에서 전달되지 않는 이유를 말하세요. (3) 번개가 친 뒤 3초 후 천둥소리가 들렸다면 번개까지의 거리는 얼마인가요? (소리의 속력 약 340 m/s)","a":"(1) 소리의 높낮이는 진동수(Hz)가 클수록 높은 소리, 세기(크기)는 진폭이 클수록 큰 소리, 음색은 파형이 달라서 구분됩니다. (2) 소리는 매질(공기, 물, 고체)의 입자가 진동하며 전달하는 파동이어서 입자가 없는 진공에서는 전달되지 않습니다. 소리는 일반적으로 고체에서 가장 빠르고 기체에서 가장 느립니다. (3) 빛의 속력은 매우 커서 번개가 보이는 시각은 거의 같다고 보면 거리는 340 × 3 = 1020 m, 약 1 km입니다.","kw":[{"l":"높이=진동수, 크기=진폭, 음색=파형","a":["진동수","높이","크기"]},{"l":"매질 필요(진공 전달 X)","a":["매질","필요","진공"]},{"l":"340×3 ≈ 1 km","a":["340×3","km"]}]},{"id":"lk_S17","cat":"과학","grade":"중3","q":"지구와 달에 대해 답하세요. (1) 달의 위상이 변하는 이유를 설명하세요. (2) 일식과 월식은 각각 언제 어떤 위치에서 일어나나요? (3) 계절이 변하는 까닭은 무엇인가요?","a":"(1) 달은 스스로 빛을 내지 않고 태양 빛을 반사하는데, 달이 지구 둘레를 공전하면서 태양, 지구, 달의 위치 관계가 달라져 우리가 볼 수 있는 밝은 부분이 달라집니다. (2) 일식은 태양-달-지구 순으로 일직선이 되어 달이 태양을 가리는 현상으로 달이 삭(그믐 · 신월) 위치일 때 일어나고, 월식은 태양-지구-달 순으로 일직선이 되어 달이 지구의 그림자에 들어가는 현상으로 보름달 위치일 때 일어납니다. 달의 공전 궤도가 지구 공전 궤도면에 기울어져 있어서 매달 일어나지는 않습니다. (3) 지구의 자전축이 공전 궤도면에 대해 약 23.5° 기울어진 채 공전하기 때문에 태양 빛이 비치는 각도와 낮의 길이가 달라져 계절이 생깁니다. 지구와 태양의 거리 때문이 아닙니다.","kw":[{"l":"위상: 위치 관계 변화","a":["위상","위치","관계"]},{"l":"일식: 삭, 태양-달-지구","a":["태양-달-지구","일식"]},{"l":"월식: 보름, 태양-지구-달","a":["태양-지구-달","월식","보름"]},{"l":"계절 = 자전축 23.5° 기울기","a":["자전축","기울기","계절"]}]},{"id":"lk_S18","cat":"과학","grade":"중3","q":"소화와 배설에 대해 답하세요. (1) 소화계를 구성하는 기관을 순서대로 쓰세요. (2) 배설계를 구성하는 기관과 오줌이 만들어져 나가는 경로를 설명하세요. (3) 소화 효소가 잘 작용하는 조건을 말하세요.","a":"(1) 소화관은 입 → 식도 → 위 → 소장 → 대장 → 항문이고, 소화액을 만드는 소화샘으로 침샘, 간, 쓸개, 이자가 있습니다. 소장에서 영양소가 가장 많이 흡수되며 융털이 표면적을 넓힙니다. (2) 콩팥에서 혈액을 걸러 오줌을 만들고(여과, 재흡수, 분비), 오줌관을 지나 방광에 모였다가 요도로 나갑니다. 노폐물 중 이산화 탄소는 호흡계로, 물·요소·무기염류는 오줌과 땀으로 나갑니다. (3) 소화 효소는 온도와 pH의 영향을 받습니다. 체온 정도(약 37℃)에서 가장 활발하고 온도가 너무 높으면 효소가 변성되어 작용하지 못합니다. 효소마다 잘 작용하는 최적 pH가 달라서 침 속 아밀레이스는 중성, 위의 펩신은 강한 산성, 이자액의 효소는 약한 알칼리성에서 잘 작용합니다. 기질의 농도와 효소의 양도 반응 속도에 영향을 줍니다.","kw":[{"l":"입-식도-위-소장-대장-항문","a":["입-식도-위-소장-대장-항문"]},{"l":"간·쓸개·이자·침샘","a":["쓸개","이자","침샘"]},{"l":"콩팥-오줌관-방광-요도","a":["콩팥-오줌관-방광-요도"]},{"l":"효소 조건: 온도(37℃), pH(효소마다 다름), 기질 농도","a":["효소마다","37℃","효소"]}]},{"id":"lk_S19","cat":"과학","grade":"중1","q":"무거운 바위를 지레를 이용해 들어 올리려고 합니다. 받침점을 바위에 최대한 가깝게 두는 것과 멀리 두는 것 중 어느 쪽이 힘이 적게 드는지 설명하시오.","a":"받침점을 힘을 주는 곳보다 바위 쪽에 가깝게 둘수록, 힘점에서 받침점까지의 거리가 멀어져 작은 힘으로도 무거운 물체를 들어 올릴 수 있습니다.","kw":[{"l":"받침점을 물체에 가깝게","a":["가깝","가까이"]},{"l":"힘점까지 거리가 멀수록 유리","a":["거리","멀"]}]},{"id":"lk_S20","cat":"과학","grade":"중1","q":"무거운 물건을 옮길 때 도르래를 사용하면 편리합니다. 천장에 고정해서 사용하는 고정 도르래는 힘의 방향과 크기 면에서 어떤 특징이 있나요?","a":"고정 도르래는 줄을 당기는 방향과 물체가 올라가는 방향을 다르게 바꿔 줄 수 있어 힘의 방향을 편리하게 바꿀 수 있지만, 필요한 힘의 크기는 줄어들지 않습니다.","kw":[{"l":"힘의 방향을 바꿈","a":["방향"]},{"l":"힘의 크기는 그대로","a":["크기","줄어들지"]}]},{"id":"lk_S21","cat":"과학","grade":"중1","q":"물을 가득 채운 컵의 입구를 마분지 조각으로 막고 조심스럽게 거꾸로 뒤집으면, 마분지가 떨어지지 않고 물이 쏟아지지 않습니다. 이런 현상이 나타나는 까닭을 설명하시오.","a":"마분지의 아래쪽(바깥쪽)에서 대기가 마분지를 떠받치는 힘인 대기압이 작용하는데, 이 대기압의 크기가 컵 속 물의 무게보다 크기 때문에 마분지가 떨어지지 않습니다.","kw":[{"l":"대기압","a":["대기압"]},{"l":"물의 무게보다 큼","a":["무게보다","더 큼"]}]},{"id":"lk_S22","cat":"과학","grade":"중1","q":"줄다리기에서 양쪽 팀이 똑같은 힘으로 당기면 줄이 움직이지 않습니다. 이렇게 두 힘이 겉으로 아무 효과가 나타나지 않도록 균형을 이루는 상태를 무엇이라고 하며, 그 조건은 무엇인가요?","a":"힘의 평형이라고 합니다. 두 힘의 크기가 같고, 방향이 반대이며, 같은 작용선(일직선) 위에 있을 때 힘의 평형이 이루어집니다.","kw":[{"l":"힘의 평형","a":["평형"]},{"l":"크기가 같고 방향이 반대","a":["크기가 같","방향이 반대"]}]},{"id":"lk_S23","cat":"과학","grade":"중2","q":"막대자석 위에 종이를 놓고 철가루를 뿌리면 자석의 극 주위로 특정한 무늬가 나타납니다. 이 무늬를 통해 자석 주위의 자기장에 대해 알 수 있는 것은 무엇인가요?","a":"철가루가 만드는 무늬(자기력선)를 통해 자기장의 방향과 세기를 알 수 있습니다. 무늬가 촘촘할수록 자기장이 세고, 자석의 극에 가까울수록 무늬가 촘촘합니다.","kw":[{"l":"자기장의 방향","a":["방향"]},{"l":"무늬가 촘촘할수록 자기장이 셈","a":["촘촘","세"]}]},{"id":"lk_S24","cat":"과학","grade":"중1","q":"상자에 작은 구멍을 뚫고 반대쪽 면에 기름종이(스크린)를 붙인 바늘구멍 사진기로 촛불을 비추면, 스크린에 상하좌우가 바뀐 촛불의 모습이 나타납니다. 이런 상이 생기는 까닭을 설명하시오.","a":"빛은 곧게 나아가는 직진 성질이 있어서, 촛불의 윗부분에서 나온 빛은 구멍을 지나 스크린의 아랫부분에, 아랫부분에서 나온 빛은 스크린의 윗부분에 도달하기 때문에 상하좌우가 뒤바뀐 상이 생깁니다.","kw":[{"l":"빛의 직진","a":["직진"]},{"l":"상하좌우가 바뀜","a":["상하","좌우","바뀐"]}]},{"id":"lk_S25","cat":"과학","grade":"중1","q":"보온병에 뜨거운 물을 담아 두면 시간이 지나도 온도가 잘 떨어지지 않습니다. 보온병이 열의 이동을 막아 온도를 유지하는 구조를 설명하시오.","a":"보온병은 안쪽과 바깥쪽 벽 사이를 진공(또는 이중벽 구조)으로 만들어 전도와 대류에 의한 열 이동을 막고, 안쪽 벽을 은빛으로 처리해 복사에 의한 열도 반사시켜 잘 빠져나가지 않도록 합니다.","kw":[{"l":"전도와 대류를 막음","a":["전도","대류"]},{"l":"복사(열 반사)","a":["복사","반사"]}]},{"id":"lk_S26","cat":"과학","grade":"중1","q":"그네의 줄 길이가 같으면 몸무게가 다른 두 사람이 타도 한 번 왕복하는 데 걸리는 시간(주기)이 거의 비슷합니다. 그네와 같은 진자의 주기에 가장 큰 영향을 주는 요인은 무엇인가요?","a":"진자의 주기는 줄(진자)의 길이에 의해 결정되며, 매달린 물체의 무게와는 거의 관계가 없습니다. 줄이 길수록 주기가 길어집니다.","kw":[{"l":"줄의 길이","a":["길이"]},{"l":"무게와 관계없음","a":["무게","관계없"]}]},{"id":"lk_S27","cat":"과학","grade":"중2","q":"동굴이나 넓은 산속에서 소리를 지르면 잠시 후 같은 소리가 다시 들려오는 메아리 현상이 나타납니다. 메아리가 생기는 까닭을 소리의 성질과 관련지어 설명하시오.","a":"소리도 빛처럼 물체에 부딪히면 반사되는 성질이 있습니다. 소리가 멀리 있는 벽이나 산에 부딪혀 반사되어 돌아오는 데 시간이 걸리기 때문에, 원래 소리를 들은 후 잠시 뒤에 반사된 소리가 다시 들리는 메아리가 생깁니다.","kw":[{"l":"소리의 반사","a":["반사"]},{"l":"되돌아오는 데 시간이 걸림","a":["시간"]}]},{"id":"lk_S28","cat":"과학","grade":"중3","q":"바닷가에서 파도를 보면 물결이 계속 해안으로 밀려오지만, 물 위에 뜬 튜브는 앞으로 나아가지 않고 제자리에서 위아래로 오르내리기만 합니다. 이런 모습으로 알 수 있는 파동의 특징은 무엇인가요?","a":"파도(파동)가 진행할 때 파동을 전달하는 물(매질) 자체는 함께 이동하지 않고 제자리에서 진동만 하며, 에너지만 진행 방향으로 전달된다는 것을 알 수 있습니다.","kw":[{"l":"매질은 이동하지 않고 제자리에서 진동","a":["제자리","이동하지 않"]},{"l":"에너지가 전달됨","a":["에너지"]}]},{"id":"lk_S29","cat":"과학","grade":"중2","q":"생선회를 먹을 때 레몬즙을 뿌려 먹으면 비린내가 줄어들고, 벌에 쏘였을 때는 암모니아수를 발라 통증을 줄이기도 합니다. 이 두 가지 방법에 공통으로 숨어 있는 원리는 무엇일까요?","a":"생선 비린내를 내는 물질이나 벌독처럼 성질이 강한 물질을, 그와 반대되는 성질을 가진 물질(레몬즙, 암모니아수)로 서로 성질을 약하게 만들어 상쇄시키는 원리가 숨어 있습니다.","kw":[{"l":"서로 반대되는 성질을 상쇄","a":["반대","상쇄","약하게"]},{"l":"중화","a":["중화"]}]},{"id":"lk_S30","cat":"과학","grade":"중2","q":"못을 식초에 며칠 담가 두면 기포가 보글보글 올라오면서 못 표면이 변합니다. 반면 같은 식초에 은수저를 담가 두면 별다른 변화가 없습니다. 이런 차이가 나타나는 까닭은 무엇일까요?","a":"철은 산성 물질과 활발하게 반응하여 기체를 발생시키며 성질이 변하지만, 은은 철보다 다른 물질과 반응하는 정도가 훨씬 약해서 식초와 잘 반응하지 않기 때문에 별다른 변화가 없습니다.","kw":[{"l":"금속마다 반응하는 정도가 다름","a":["반응"]},{"l":"기체 발생","a":["기체"]}]},{"id":"lk_S31","cat":"과학","grade":"중2","q":"촛불이 타다가 촛불에 유리컵을 씌우면 잠시 후 불이 꺼집니다. 이렇게 물질이 타기(연소하기) 위해서는 탈 물질, 산소, 발화점 이상의 온도라는 세 가지 조건이 모두 필요한데, 유리컵을 씌웠을 때는 이 중 무엇이 사라져서 불이 꺼지는 것인가요?","a":"유리컵으로 덮으면 컵 안의 산소가 연소에 다 쓰이고 새로운 산소가 공급되지 않아, 연소에 필요한 세 가지 조건 중 산소가 사라지기 때문에 촛불이 꺼집니다.","kw":[{"l":"산소 부족(공급 차단)","a":["산소"]},{"l":"연소의 조건","a":["조건"]}]},{"id":"lk_S32","cat":"과학","grade":"중2","q":"과산화수소수(오래된 상처 소독약)에 감자 조각이나 이산화 망가니즈를 넣으면 기포가 활발하게 발생합니다. 이때 발생하는 기체가 무엇인지 확인할 수 있는 간단한 방법은 무엇인가요?","a":"꺼져가는 향불을 기체 가까이 가져갔을 때 향불이 다시 살아나 밝게 타오르면, 그 기체는 다른 물질이 타는 것을 돕는 산소라는 것을 확인할 수 있습니다.","kw":[{"l":"꺼져가는 향불이 다시 타오름","a":["향불","다시 타"]},{"l":"산소 확인","a":["산소"]}]},{"id":"lk_S33","cat":"과학","grade":"중1","q":"물 100g에 설탕 25g을 녹인 설탕물의 진하기를 숫자로 나타내려고 합니다. 이렇게 용액의 진하기를 나타내는 퍼센트 농도는 어떻게 구하나요?","a":"퍼센트 농도는 용액 전체의 양에 대한 용질의 양의 비율을 백분율로 나타낸 것으로, (용질의 양 ÷ 용액 전체의 양) × 100으로 구합니다.","kw":[{"l":"용질/용액×100","a":["용질","용액"]},{"l":"백분율","a":["백분율","퍼센트"]}]},{"id":"lk_S34","cat":"과학","grade":"중2","q":"태양계는 거대한 성운이 중력에 의해 서서히 수축하면서 만들어졌다고 알려져 있습니다. 이 과정에서 태양은 어떻게 만들어졌나요?","a":"성운이 중력에 의해 수축하면서 중심부에 물질이 모여들어 온도와 밀도가 매우 높아지고, 그 중심부에서 수소 핵융합 반응이 시작되면서 스스로 빛을 내는 태양이 만들어졌습니다.","kw":[{"l":"중심부에 물질이 모임","a":["중심"]},{"l":"온도와 밀도가 높아짐","a":["온도","밀도"]}]},{"id":"lk_S35","cat":"과학","grade":"중2","q":"비가 그친 뒤 하늘에 무지개가 나타나는 것을 볼 수 있습니다. 무지개가 생기는 원리를 빛의 성질과 관련지어 설명하시오.","a":"공기 중에 떠 있는 물방울이 작은 렌즈와 같은 역할을 하여, 물방울 속을 통과하는 햇빛이 굴절되고 여러 색의 빛으로 나뉘어 흩어지면서(분산) 무지개가 나타납니다.","kw":[{"l":"물방울에 의한 굴절","a":["굴절"]},{"l":"빛의 분산(여러 색으로 나뉨)","a":["분산","나뉘"]}]},{"id":"lk_S36","cat":"과학","grade":"중1","q":"버스가 갑자기 출발하면 서 있던 사람은 뒤로 쏠리고, 갑자기 멈추면 앞으로 쏠립니다. 이런 현상이 나타나는 까닭을 설명하시오.","a":"물체는 원래의 운동 상태를 계속 유지하려는 관성을 가지고 있어서, 버스가 갑자기 움직이면 사람의 몸은 정지 상태를 유지하려 해 뒤로 쏠리고, 버스가 갑자기 멈추면 몸은 움직이던 상태를 유지하려 해 앞으로 쏠립니다.","kw":[{"l":"관성","a":["관성"]},{"l":"원래 운동 상태를 유지하려 함","a":["유지"]}]},{"id":"lk_S37","cat":"과학","grade":"중2","q":"추운 겨울 밖에 있다가 따뜻한 실내에 들어오면 안경알에 뿌옇게 김이 서립니다. 이런 현상이 나타나는 까닭을 설명하시오.","a":"차가운 안경알 표면에 실내의 따뜻하고 습한 공기가 닿으면, 공기 중의 수증기가 급격히 냉각되어 작은 물방울로 응결되기 때문에 뿌옇게 김이 서립니다.","kw":[{"l":"수증기가 응결(액화)","a":["응결","액화"]},{"l":"차가운 표면에 닿음","a":["차가운"]}]},{"id":"lk_S38","cat":"과학","grade":"중1","q":"공사장에서는 안전모를 쓰고, 택배 상자에는 뽁뽁이(에어캡)를 넣어 물건을 보호합니다. 이런 물건들이 충격으로부터 머리나 내용물을 보호하는 공통적인 원리를 설명하시오.","a":"충격이 전달되는 시간을 늘려 충격이 한 순간에 집중되지 않고 서서히 전달되게 함으로써, 순간적으로 받는 힘의 크기를 줄여 주기 때문에 머리나 내용물을 보호할 수 있습니다.","kw":[{"l":"충격이 전달되는 시간을 늘림","a":["시간"]},{"l":"순간적인 힘을 줄임","a":["힘을 줄"]}]},{"id":"lk_S39","cat":"과학","grade":"중1","q":"탄산음료의 뚜껑을 열면 \"치익\" 소리와 함께 거품이 솟아오릅니다. 이런 현상이 나타나는 까닭을 기체의 성질과 관련지어 설명하시오.","a":"병 속은 압력이 높게 유지되어 이산화 탄소 기체가 많이 녹아 있는데, 뚜껑을 열어 압력이 낮아지면 기체가 녹아 있을 수 있는 양이 줄어들어, 녹아 있던 이산화 탄소가 기포가 되어 빠르게 빠져나오기 때문에 거품이 솟아오릅니다.","kw":[{"l":"압력이 낮아짐","a":["압력"]},{"l":"녹아 있던 기체가 빠져나옴","a":["빠져나"]}]},{"id":"lk_S40","cat":"과학","grade":"중1","q":"뜨거운 기름에 물이 조금이라도 떨어지면 기름이 사방으로 튀어 매우 위험합니다. 이런 현상이 나타나는 까닭을 물과 기름의 특성 차이와 관련지어 설명하시오.","a":"물은 기름보다 끓는점이 훨씬 낮아 뜨거운 기름 속에서 순간적으로 기체(수증기)로 변하면서 부피가 급격히 커지는데, 이때 주변의 기름을 밀어내며 사방으로 튀게 됩니다.","kw":[{"l":"물이 급격히 기체로 변함","a":["기체","끓"]},{"l":"부피가 급격히 커짐","a":["부피"]}]},{"id":"lk_S41","cat":"과학","grade":"중3","q":"부모의 혈액형이 각각 A형과 B형인데, 자녀의 혈액형이 O형으로 나오는 경우가 있습니다. 이런 일이 어떻게 가능한지 유전자형의 관점에서 설명하시오.","a":"A형인 부모가 유전자형 AO를, B형인 부모가 유전자형 BO를 가지고 있다면, 두 부모 모두 자녀에게 O 유전자를 물려줄 수 있어, 자녀가 O 유전자만 두 개(OO) 물려받으면 O형이 될 수 있습니다.","kw":[{"l":"부모가 AO, BO 유전자형을 가짐","a":["AO","BO"]},{"l":"O 유전자를 물려받음","a":["O 유전자"]}]},{"id":"lk_S42","cat":"과학","grade":"중2","q":"지구에서 촛불을 켜면 불꽃이 위로 길쭉하게 솟아오르는 모양이 됩니다. 그런데 우주정거장처럼 무중력에 가까운 환경에서 촛불을 켜면 불꽃이 위로 솟지 않고 동그란 공 모양으로 약하게 타오릅니다. 지구에서 불꽃이 위쪽으로 길게 솟아오르는 까닭은 무엇인가요?","a":"촛불 주변의 뜨거워진 공기는 밀도가 작아져 위로 올라가고 차가운 공기가 아래에서 채워지는 대류가 일어나는데, 이 대류 때문에 불꽃이 위쪽으로 길게 늘어난 모양이 됩니다.","kw":[{"l":"대류","a":["대류"]},{"l":"뜨거운 공기가 위로 올라감","a":["위로","올라"]}]},{"id":"lk_S43","cat":"과학","grade":"중2","q":"우주정거장에서 물을 공중에 살짝 띄우면 지구에서와 달리 동그란 구슬 모양으로 둥둥 떠 있습니다. 이런 모양이 되는 까닭은 무엇인가요?","a":"지구에서는 중력 때문에 물이 아래로 처지지만, 무중력 상태에서는 중력의 영향이 거의 없어 물의 표면적을 최소로 만들려는 표면 장력만 작용하기 때문에, 표면적이 가장 작은 모양인 구형이 됩니다.","kw":[{"l":"표면 장력","a":["표면 장력"]},{"l":"중력의 영향이 거의 없음","a":["중력"]}]},{"id":"lk_S44","cat":"과학","grade":"중3","q":"어떤 행성에 착륙한 우주 탐사 로봇이 스톱워치와 줄자만을 이용해서 그 행성의 중력의 세기를 대략적으로 알아보려고 합니다. 어떤 실험을 설계할 수 있을지 방법을 설명하시오.","a":"일정한 높이에서 물체를 가만히 떨어뜨리면서 바닥에 닿을 때까지 걸리는 시간을 스톱워치로 재고, 떨어뜨린 높이를 줄자로 측정합니다. 여러 번 반복해서 얻은 높이와 걸린 시간의 관계를 살펴보면, 그 행성에서 물체가 얼마나 빠르게 떨어지는지(중력의 세기)를 짐작할 수 있습니다.","kw":[{"l":"자유 낙하시켜 시간을 측정","a":["시간","스톱워치"]},{"l":"떨어뜨린 높이를 측정","a":["높이"]}]},{"id":"lk_S45","cat":"과학","grade":"중2","q":"우주 비행사가 우주복 없이 진공인 우주 공간에 그대로 노출되면 매우 위험합니다. 특히 몸속의 물이 순식간에 끓어오르듯 기화될 수 있다고 하는데, 체온이 높지 않은데도 이런 일이 일어날 수 있는 까닭은 무엇인가요?","a":"액체의 끓는점은 주변 압력이 낮을수록 낮아지는데, 진공 상태인 우주 공간은 압력이 거의 0에 가까워서 몸의 온도가 높지 않아도 몸속의 물이 매우 낮은 온도에서 끓어(기화되어) 버릴 수 있기 때문입니다.","kw":[{"l":"압력이 낮을수록 끓는점이 낮아짐","a":["압력","끓는점"]},{"l":"진공(압력이 거의 없음)","a":["진공"]}]},{"id":"lk_S46","cat":"과학","grade":"중3","q":"방 안의 불을 껐다 켜면 순간적으로 어두워집니다. 스위치를 끄기 직전까지 전구에서 나오고 있던 빛은 갑자기 사라지는 걸까요, 아니면 어딘가로 계속 나아가는 걸까요? 빛의 성질과 관련지어 설명하시오.","a":"빛은 갑자기 사라지지 않고 초속 약 30만 km라는 매우 빠른 속도로 계속 나아갑니다. 방 안에서는 빛이 벽이나 물체에 부딪혀 흡수되기까지 아주 짧은 시간(수십억 분의 1초)밖에 걸리지 않기 때문에, 우리 눈에는 스위치를 끄자마자 즉시 어두워지는 것처럼 느껴지는 것뿐입니다.","kw":[{"l":"빛은 사라지지 않고 계속 나아감","a":["사라지지","계속"]},{"l":"물체에 부딪혀 흡수됨","a":["흡수"]},{"l":"매우 빠른 속도","a":["속도","빠른"]}]},{"id":"lk_S47","cat":"과학","grade":"중3","q":"자석을 코일 근처에서 빠르게 움직이면, 코일이 전지에 연결되어 있지 않은데도 순간적으로 전류가 흐릅니다. 이렇게 자석의 움직임으로 코일에 전류가 만들어지는 현상을 무엇이라고 하며, 전류가 흐르려면 어떤 조건이 필요한가요?","a":"이런 현상을 전자기 유도라고 하고, 이때 흐르는 전류를 유도 전류라고 합니다. 코일을 통과하는 자기장이 변할 때(자석이 움직이거나 자석과 코일 사이의 거리가 달라질 때) 유도 전류가 흐르며, 자석이 멈춰 있으면 자기장이 변하지 않아 전류가 흐르지 않습니다.","kw":[{"l":"전자기 유도","a":["전자기 유도"]},{"l":"유도 전류","a":["유도 전류"]},{"l":"자기장이 변할 때","a":["자기장이 변"]}]},{"id":"lk_S48","cat":"과학","grade":"중1","q":"생물체는 모두 세포로 이루어져 있습니다. 동물 세포와 식물 세포에 공통으로 있는 세포막과 핵은 각각 어떤 역할을 하나요?","a":"세포막은 세포를 둘러싸 세포의 형태를 유지하고 물질이 세포 안팎으로 드나드는 것을 조절하는 역할을 하며, 핵은 세포의 생명 활동을 조절하는 유전 정보를 담고 있어 세포의 중심 역할을 합니다.","kw":[{"l":"세포막-물질 출입 조절","a":["세포막"]},{"l":"핵-유전 정보","a":["핵","유전 정보"]}]},{"id":"lk_S49","cat":"과학","grade":"중3","q":"선풍기는 전기 에너지를 이용해 날개를 돌려 시원한 바람(운동 에너지)을 만들어 냅니다. 그런데 선풍기를 오래 켜 두면 몸체가 조금씩 따뜻해지는 것을 느낄 수 있습니다. 이 현상은 에너지가 어떻게 되는 것을 보여주나요?","a":"선풍기에 공급된 전기 에너지의 일부는 날개를 돌리는 운동 에너지로 전환되지만, 나머지 일부는 모터의 마찰 등에 의해 열에너지로 전환되어 몸체가 따뜻해지는 것입니다. 이렇게 에너지는 새로 생기거나 사라지지 않고 다른 형태로 전환될 뿐이며, 전환 전후 에너지의 총량은 일정하게 보존됩니다.","kw":[{"l":"에너지 보존","a":["보존"]},{"l":"다른 형태로 전환됨(열에너지 등)","a":["전환","열에너지"]}]},{"id":"lk_S50","cat":"과학","grade":"중3","q":"로켓은 아무것도 없는 진공의 우주 공간에서도 앞으로 나아갈 수 있습니다. 주변에 밀어낼 공기도 없는데 로켓이 앞으로 나아갈 수 있는 까닭은 무엇인가요?","a":"로켓은 연료를 태워 만든 가스를 뒤쪽으로 강하게 분출하는데, 이때 가스가 로켓을 미는 힘과 로켓이 가스를 미는 힘이 서로 반대 방향으로 작용하는 작용·반작용의 원리로 나아갑니다. 이 원리는 주변에 공기가 없어도 성립하기 때문에 진공인 우주에서도 로켓이 나아갈 수 있습니다.","kw":[{"l":"작용·반작용","a":["작용","반작용"]},{"l":"가스를 뒤로 분출","a":["분출","가스"]}]},{"id":"lk_S51","cat":"과학","grade":"중3","q":"인공위성은 지구의 중력에 끊임없이 끌리고 있는데도 왜 지표면에 떨어지지 않고 계속 지구 주위를 도는 걸까요?","a":"인공위성은 지구 중력에 의해 계속 지구 쪽으로 끌려가고 있지만, 동시에 매우 빠른 속도로 옆으로 움직이고 있습니다. 떨어지는 동안 지구 표면도 둥글게 휘어져 멀어지기 때문에, 계속 떨어지면서도 지표면에 닿지 않고 일정한 높이를 유지하며 지구 주위를 돌게 됩니다.","kw":[{"l":"중력에 끌리면서 동시에 빠르게 옆으로 이동","a":["옆으로","속도"]},{"l":"지구 표면이 둥글게 휘어짐","a":["휘어"]}]},{"id":"lk_S52","cat":"과학","grade":"중2","q":"흔들지 않았는데도 봉지를 뜯으면 저절로 따뜻해지는 손난로가 있습니다. 이 손난로 안에서는 어떤 반응이 일어나고 있는 걸까요?","a":"손난로 안에는 철가루가 들어 있는데, 봉지를 뜯어 공기 중의 산소와 닿으면 철가루가 산소와 반응하여 산화되면서 열을 내는 발열 반응이 일어나기 때문에 저절로 따뜻해집니다.","kw":[{"l":"철가루와 산소의 반응(산화)","a":["철가루","산소","산화"]},{"l":"발열 반응","a":["발열"]}]},{"id":"lk_S53","cat":"과학","grade":"중2","q":"나침반 바늘은 어디에 있든 항상 북쪽을 가리킵니다. 그 까닭은 무엇인가요?","a":"지구 자체가 하나의 거대한 자석과 같은 성질을 가지고 있어서 지구 전체에 자기장이 형성되어 있는데, 나침반 바늘도 작은 자석이기 때문에 이 지구 자기장의 영향을 받아 N극이 북쪽 방향을 가리키게 됩니다.","kw":[{"l":"지구 자체가 거대한 자석","a":["지구","자석"]},{"l":"지구 자기장의 영향","a":["자기장"]}]},{"id":"lk_S54","cat":"과학","grade":"중1","q":"높은 곳에서 뛰어내릴 때 낙하산을 펴면 천천히 떨어집니다. 낙하산이 떨어지는 속력을 줄여주는 원리는 무엇인가요?","a":"낙하산을 펴면 넓게 펼쳐진 천이 떨어지는 반대 방향으로 공기 저항을 많이 받게 되는데, 이 공기 저항력이 중력과 비슷해질 만큼 커지면서 떨어지는 속력이 크게 줄어들어 천천히 떨어지게 됩니다.","kw":[{"l":"공기 저항력","a":["공기 저항"]},{"l":"중력과 저항력이 비슷해짐","a":["중력"]}]},{"id":"lk_S55","cat":"과학","grade":"중2","q":"비행기가 이륙하거나 빠른 엘리베이터를 탈 때 귀가 먹먹해지는 경우가 있습니다. 그 까닭은 무엇인가요?","a":"고막의 안쪽과 바깥쪽은 원래 압력이 같아야 하는데, 비행기나 엘리베이터가 빠르게 높이를 바꾸면 바깥쪽 기압이 갑자기 달라지면서 고막 안팎의 압력 차이가 생기고, 이 압력 차이가 고막을 밀어 먹먹한 느낌이 듭니다.","kw":[{"l":"고막 안팎의 압력 차이","a":["압력 차이","고막"]}]},{"id":"lk_S56","cat":"과학","grade":"중2","q":"아이오딘 반응으로 침 속 소화 효소(아밀레이스)가 녹말을 분해하는지 확인하는 실험을 설계하려고 합니다. 실험군과 비교할 대조군을 어떻게 구성해야 할까요?","a":"녹말 용액이 든 시험관 두 개를 준비해서, 한쪽에는 침을 넣고(실험군) 다른 한쪽에는 침 대신 물을 넣어(대조군) 같은 온도에서 같은 시간 동안 둔 뒤, 두 시험관에 아이오딘-아이오딘화 칼륨 용액을 떨어뜨려 색깔 변화를 비교합니다.","kw":[{"l":"침을 넣은 것과 안 넣은 것을 비교","a":["대조군","침을 넣"]},{"l":"아이오딘 반응으로 확인","a":["아이오딘"]}]},{"id":"lk_S57","cat":"과학","grade":"중2","q":"초록색 BTB 용액이 든 시험관에 검정말을 넣고 빛을 충분히 비추면 시간이 지나 용액의 색깔이 파란색으로 변합니다. 그 까닭은 무엇인가요?","a":"BTB 용액은 이산화 탄소의 양에 따라 색이 변하는 지시약인데, 검정말이 빛을 받아 광합성을 하면서 물속의 이산화 탄소를 흡수하면 용액이 염기성 쪽으로 기울어 파란색으로 변합니다.","kw":[{"l":"광합성으로 이산화 탄소를 흡수","a":["이산화 탄소","흡수"]},{"l":"파란색으로 변함","a":["파란"]}]},{"id":"lk_S58","cat":"과학","grade":"중1","q":"울퉁불퉁하게 생긴 돌멩이는 자로 부피를 재기 어렵습니다. 눈금 실린더와 물을 이용해서 이 돌멩이의 부피를 구하는 방법을 설명하시오.","a":"눈금 실린더에 물을 어느 정도 채우고 처음 물의 부피를 읽은 뒤, 돌멩이를 물에 완전히 잠기도록 넣고 늘어난 물의 부피를 다시 읽습니다. 이때 늘어난 물의 부피만큼이 돌멩이가 밀어낸 부피이므로, 이 값이 곧 돌멩이의 부피가 됩니다.","kw":[{"l":"늘어난 물의 부피를 측정","a":["늘어난"]},{"l":"밀어낸 부피=물체의 부피","a":["밀어낸","부피"]}]},{"id":"lk_S59","cat":"과학","grade":"중2","q":"불순물이 조금 섞인 질산 칼륨을 뜨거운 물에 녹인 뒤 천천히 식히면 순수한 질산 칼륨 결정만 얻을 수 있습니다. 그 까닭은 무엇인가요?","a":"온도가 낮아지면 질산 칼륨은 용해도가 크게 줄어들어 결정으로 석출되지만, 소량 섞인 불순물은 양이 적어 낮아진 온도에서도 계속 물에 녹아 있을 수 있기 때문에, 걸러내면 순수한 질산 칼륨 결정만 얻을 수 있습니다.","kw":[{"l":"온도가 낮아지면 용해도가 줄어듦","a":["용해도"]},{"l":"불순물은 소량이라 계속 녹아 있음","a":["불순물"]}]},{"id":"lk_S60","cat":"과학","grade":"중3","q":"수레가 일정한 속력으로 움직이는지 확인하려고 합니다. 종이테이프와 타점 장치를 이용한 실험 방법을 설명하시오.","a":"수레에 종이테이프를 끼우고 일정한 시간 간격(예: 1초)마다 점을 찍는 타점 장치에 연결해 수레를 움직이게 한 뒤, 테이프에 찍힌 점과 점 사이의 간격을 자로 측정합니다. 이 간격이 일정하면 같은 시간 동안 같은 거리를 이동했다는 뜻이므로 등속 운동을 하고 있다는 것을 확인할 수 있습니다.","kw":[{"l":"일정한 시간 간격으로 타점","a":["타점","시간 간격"]},{"l":"점 사이 간격이 일정하면 등속","a":["간격이 일정"]}]},{"id":"lk_S61","cat":"과학","grade":"중2","q":"설탕물과 소금물에 전지와 전구를 연결한 간이 장치를 각각 담그면, 어느 쪽에서 전구에 불이 들어올까요? 그 까닭과 함께 설명하시오.","a":"소금물에서 전구에 불이 들어옵니다. 소금은 물에 녹으면 양이온과 음이온으로 나뉘는 전해질이라 전류가 흐를 수 있지만, 설탕은 물에 녹아도 이온으로 나뉘지 않는 비전해질이라 전류가 흐르지 않기 때문입니다.","kw":[{"l":"소금물은 전해질","a":["전해질"]},{"l":"설탕물은 비전해질","a":["비전해질"]}]},{"id":"lk_S62","cat":"과학","grade":"중2","q":"코일 주위에 자기장이 생기는 원리와 전자석의 특징을 설명하시오.","a":"코일에 전류를 흘려주면 코일 주위에 자기장이 생기는데, 철심을 넣은 코일에 전류를 흐르게 해 만든 전자석은 전류가 흐를 때만 자석이 되고 전류의 세기와 감은 수로 자기장의 세기를 조절할 수 있습니다.","kw":[{"l":"코일에 전류를 흘림","a":["코일","전류"]},{"l":"철심을 넣은 전자석","a":["철심","전자석"]},{"l":"전류가 흐를 때만 자석이 됨","a":["흐를 때만"]},{"l":"세기 조절 가능","a":["조절"]}]},{"id":"lk_S63","cat":"과학","grade":"중2","q":"전동기가 회전하는 원리를 설명하시오.","a":"자석 사이에 놓인 코일에 전류가 흐르면 코일이 자기장 속에서 자기력을 받는데, 정류자에 의해 전류의 방향이 주기적으로 바뀌면서 코일이 계속 같은 방향으로 회전합니다.","kw":[{"l":"자기장 속에서 자기력을 받음","a":["자기장","자기력"]},{"l":"정류자","a":["정류자"]},{"l":"전류 방향이 바뀌며 계속 회전","a":["방향이 바뀌","계속"]}]},{"id":"lk_S64","cat":"과학","grade":"중2","q":"정전기 유도 현상을 설명하시오.","a":"대전체를 도체 가까이 가져가면 대전체와 가까운 쪽에는 대전체와 다른 종류의 전하가, 먼 쪽에는 같은 종류의 전하가 유도되는 현상입니다.","kw":[{"l":"대전체를 가까이 가져감","a":["대전체"]},{"l":"가까운 쪽: 다른 전하","a":["가까운","다른"]},{"l":"먼 쪽: 같은 전하","a":["먼","같은"]}]},{"id":"lk_S65","cat":"과학","grade":"중3","q":"비열이 큰 물질의 온도 변화 특징과 이를 이용한 예를 설명하시오.","a":"비열이 큰 물질은 같은 열량을 가해도 온도 변화가 작은데, 물은 비열이 매우 커서 바다가 지구의 급격한 기온 변화를 막아주고 해안 지방의 일교차를 작게 해줍니다.","kw":[{"l":"비열이 클수록 온도 변화가 작음","a":["비열","온도 변화"]},{"l":"물의 비열이 큼","a":["물"]},{"l":"해안 지방의 일교차를 작게 함","a":["일교차"]}]},{"id":"lk_S66","cat":"과학","grade":"중3","q":"열팽창이 일어나는 원리를 설명하시오.","a":"온도가 높아지면 물질을 이루는 입자의 운동이 활발해져 입자 사이의 거리가 멀어지므로 물체의 길이나 부피가 늘어나는 열팽창이 일어납니다.","kw":[{"l":"입자 운동이 활발해짐","a":["입자","운동"]},{"l":"입자 사이 거리가 멀어짐","a":["거리"]},{"l":"부피(길이)가 늘어남","a":["부피","늘어"]}]},{"id":"lk_S67","cat":"과학","grade":"중3","q":"과학에서 말하는 \"일\"의 정의와 일의 양을 구하는 방법을 설명하시오.","a":"과학에서 일은 물체에 힘이 작용하여 힘의 방향으로 물체가 이동했을 때 성립하며, 일의 양은 힘의 크기와 힘의 방향으로 이동한 거리를 곱하여 구합니다.","kw":[{"l":"힘의 방향으로 이동","a":["힘의 방향"]},{"l":"일 = 힘 × 이동 거리","a":["이동 거리","곱"]}]},{"id":"lk_S68","cat":"과학","grade":"중3","q":"평면거울에 상이 생기는 원리와 상의 특징을 설명하시오.","a":"물체에서 반사된 빛이 평면거울에서 반사되어 눈에 들어오면 거울 뒤로 빛을 연장한 곳에 상이 보이는데, 이 상은 물체와 크기가 같고 거울 면을 기준으로 대칭인 위치에 생깁니다.","kw":[{"l":"반사된 빛이 거울 뒤로 연장","a":["거울 뒤","연장"]},{"l":"물체와 크기가 같음","a":["크기가 같"]},{"l":"거울 면 기준 대칭 위치","a":["대칭"]}]},{"id":"lk_S69","cat":"과학","grade":"중3","q":"대립 형질이란 무엇이며, 우성과 열성은 각각 무엇인가요?","a":"대립 형질은 하나의 형질에 대해 서로 다르게 나타나는 두 가지 형질을 말하며, 순종을 교배했을 때 잡종 1대에서 나타나는 형질을 우성, 나타나지 않는 형질을 열성이라고 합니다.","kw":[{"l":"대립 형질: 한 형질에 대해 다르게 나타나는 두 형질","a":["대립 형질"]},{"l":"우성: 잡종 1대에서 나타나는 형질","a":["우성"]},{"l":"열성: 잡종 1대에서 나타나지 않는 형질","a":["열성"]}]},{"id":"lk_S70","cat":"과학","grade":"중3","q":"유전자형과 표현형의 차이를 설명하시오.","a":"유전자형은 어떤 형질에 대한 유전자의 구성을 기호로 나타낸 것(예: RR, Rr, rr)이고, 표현형은 유전자형에 의해 겉으로 드러나는 형질(예: 둥근 모양, 주름진 모양)을 말합니다.","kw":[{"l":"유전자형: 유전자 구성을 기호로 나타냄","a":["유전자형"]},{"l":"표현형: 겉으로 드러나는 형질","a":["표현형"]}]},{"id":"lk_S71","cat":"과학","grade":"중3","q":"둥근 완두(RR)와 주름진 완두(rr)를 교배했을 때 잡종 1대의 표현형과 그 까닭을 설명하시오.","a":"둥근 완두는 우성, 주름진 완두는 열성이므로 우열의 법칙에 따라 잡종 1대는 모두 유전자형이 Rr이 되고, 우성인 둥근 모양만 표현형으로 나타납니다.","kw":[{"l":"잡종 1대의 유전자형은 모두 Rr","a":["Rr"]},{"l":"우성인 둥근 모양만 나타남","a":["둥근"]}]},{"id":"lk_S72","cat":"과학","grade":"중3","q":"잡종 1대(Rr)끼리 교배하면 잡종 2대의 유전자형과 표현형의 분리비는 각각 어떻게 되나요?","a":"잡종 1대(Rr)를 자가 교배하면 잡종 2대의 유전자형은 RR : Rr : rr가 1 : 2 : 1의 비율로 나타나고, 표현형은 우성(둥근) : 열성(주름진)이 3 : 1의 비율로 나타납니다.","kw":[{"l":"유전자형 비율 RR:Rr:rr = 1:2:1","a":["1:2:1"]},{"l":"표현형 비율 우성:열성 = 3:1","a":["3:1"]}]},{"id":"lk_S73","cat":"과학","grade":"중3","q":"검정 교배는 무엇이며 왜 하는지 설명하시오.","a":"검정 교배는 우성 표현형을 나타내는 개체의 유전자형이 순종(RR)인지 잡종(Rr)인지 알아보기 위해 열성 순종(rr) 개체와 교배하는 것으로, 자손에서 열성 형질이 나오면 원래 개체가 잡종이고, 열성 형질이 전혀 나오지 않으면 순종임을 알 수 있습니다.","kw":[{"l":"열성 순종(rr)과 교배","a":["열성 순종"]},{"l":"우성 개체의 유전자형(순종/잡종)을 확인하기 위함","a":["순종","잡종"]},{"l":"자손에 열성이 나오면 잡종","a":["열성"]}]},{"id":"lk_S74","cat":"과학","grade":"중1","q":"마찰력을 크게 하거나 작게 하는 예를 각각 들어보세요.","a":"미끄럼을 방지하기 위해 신발 밑창을 거칠게 만드는 것은 마찰력을 크게 하는 예이고, 스키나 스노보드처럼 표면을 매끄럽게 하여 잘 미끄러지게 하는 것은 마찰력을 작게 하는 예입니다.","kw":[{"l":"마찰력을 크게 하는 예","a":["크게"]},{"l":"마찰력을 작게 하는 예","a":["작게"]}]},{"id":"lk_S75","cat":"과학","grade":"중1","q":"부력의 크기가 무게보다 클 때와 작을 때 물체는 각각 어떻게 되나요?","a":"부력이 무게보다 크면 물체가 위로 떠오르고, 부력이 무게보다 작으면 물체가 가라앉습니다.","kw":[{"l":"부력이 무게보다 크면 뜸","a":["크면","떠오"]},{"l":"부력이 무게보다 작으면 가라앉음","a":["작으면","가라앉"]}]},{"id":"lk_S76","cat":"과학","grade":"중3","q":"자유 낙하 운동에서 속력은 시간에 따라 어떻게 변하나요?","a":"자유 낙하 운동을 하는 물체는 중력만 받아 속력이 1초마다 9.8m/s씩 일정하게 증가하며, 속력은 9.8과 걸린 시간을 곱한 값입니다.","kw":[{"l":"중력만 작용","a":["중력만"]},{"l":"속력이 시간에 비례하여 증가","a":["비례","증가"]},{"l":"9.8","a":["9.8"]}]},{"id":"lk_S77","cat":"과학","grade":"중3","q":"중력에 의한 위치 에너지와 운동 에너지는 각각 무엇에 비례하나요?","a":"중력에 의한 위치 에너지는 물체의 질량과 높이에 각각 비례하고, 운동 에너지는 물체의 질량에 비례하며 속력의 제곱에 비례합니다.","kw":[{"l":"위치 에너지: 질량과 높이에 비례","a":["위치 에너지"]},{"l":"운동 에너지: 질량과 속력의 제곱에 비례","a":["운동 에너지","제곱"]}]},{"id":"lk_S78","cat":"과학","grade":"중2","q":"지구형 행성과 목성형 행성의 차이를 설명하시오.","a":"지구형 행성은 크기와 질량이 작고 평균 밀도가 크며 단단한 지각으로 이루어져 있는 반면, 목성형 행성은 크기와 질량이 크고 평균 밀도가 작으며 가벼운 기체로 이루어져 있습니다.","kw":[{"l":"지구형: 크기 작음","a":["지구형"]},{"l":"목성형: 크기 큼","a":["목성형"]},{"l":"밀도 차이","a":["밀도"]},{"l":"기체 구성","a":["기체"]}]},{"id":"lk_S79","cat":"과학","grade":"중2","q":"목성형 행성인 목성, 토성, 천왕성, 해왕성의 공통적인 특징을 설명하시오.","a":"목성형 행성은 크기와 질량이 크고 평균 밀도가 작으며 수소와 헬륨 같은 가벼운 기체로 이루어져 있고, 대부분 여러 개의 위성과 뚜렷한 고리를 가지고 있습니다.","kw":[{"l":"크기와 질량이 큼, 밀도 작음","a":["크기","밀도"]},{"l":"가벼운 기체(수소·헬륨)로 구성","a":["수소","헬륨","기체"]},{"l":"많은 위성과 고리","a":["위성","고리"]}]}],"TOP":[{"main":{"id":"lk_FU_A1","cat":"자소서","grade":"중3","q":"자석을 가열하면 자성이 변하는지 알아본 실험을 간단히 설명해 보세요.","a":"중학교에서 열이 물질의 성질에 영향을 줄 수 있다는 것을 배우고, 온도가 달라지면 자석의 성질도 변할지 궁금해서 실험했습니다. 처음에는 가열한 자석에 붙는 클립 개수를 비교했는데 차이를 구별하기 어려워서, 전자기 유도를 이용하기로 했습니다. 코일은 고정하고 자석이 코일 옆을 빠르게 지나가게 하면 코일에 유도전류가 생기는데, 이 전류의 최댓값을 전류계로 읽어 비교했습니다. 드라이기로 자석을 40℃, 60℃, 80℃로 가열해서 각각 측정했고, 온도가 높을수록 유도전류가 작아지는 경향을 확인해서 자성이 약해진다고 해석했습니다. (온도별 전류 값과 가열 시간은 「본인이 측정한 값」으로 말하세요.)","kw":[{"l":"열→자석 성질","a":["열→자석 성질","자석","성질"]},{"l":"클립은 비교 어려움","a":["클립은","어려움","비교"]},{"l":"코일+자석→유도전류","a":["유도전류","코일","자석"]},{"l":"40/60/80℃","a":["80℃","40","60"]},{"l":"전류 최댓값","a":["전류 최댓값","최댓값","전류"]},{"l":"온도↑ 전류↓","a":["온도↑ 전류↓","온도↑","전류↓"]}]},"follow":{"id":"lk_FU_A1F","cat":"자소서","grade":"중3","q":"실험 방법을 처음부터 끝까지 순서대로 구체적으로 설명해 보세요.","a":"① 자석을 드라이기로 정해진 온도까지 가열합니다. ② 온도를 확인합니다. ③ 고정해 둔 코일 옆으로 자석을 같은 방법으로 지나가게 합니다. ④ 코일에 연결한 전류계의 최댓값을 읽어 기록합니다. ⑤ 같은 온도에서 여러 번 반복하고 온도를 바꿔 같은 과정을 되풀이합니다. (실제 순서와 다른 부분은 「본인이 한 대로」 고치세요.)\n\n[추가 꼬리질문]\n1) 처음 코일을 회전시키려 했을 때 생긴 문제는 무엇이었나요?\n   답: 코일을 돌리면 코일에 연결된 도선이 함께 꼬여서 도선이 당겨지거나 접촉이 흔들렸고, 그러면 전류 값이 자석 때문인지 도선 움직임 때문인지 구분하기 어려워 측정이 불안정했습니다. 그래서 코일은 고정하고 자석을 움직이는 방법으로 바꿨습니다.","kw":[{"l":"① 자석을 드라이기로 정해진 온도까지 가열합니다","a":["드라이기로","가열합니다"]},{"l":"② 온도를 확인합니다","a":["확인합니다","온도를"]},{"l":"③ 고정해 둔 코일 옆으로 자석을 같은 방법으로 지나가게 합니다","a":["방법으로","지나가게"]}]}},{"main":{"id":"lk_FU_A2","cat":"자소서","grade":"중3","q":"처음에 클립을 붙여 비교했는데, 자성의 변화를 비교하기 어려웠던 이유는 무엇인가요?","a":"클립 개수는 1개, 2개처럼 끊어서만 셀 수 있기 때문에 자성이 조금 약해져도 개수가 그대로일 수 있어서 작은 변화를 구별하기 어렵습니다. 또 클립이 붙는 모양이나 자석과 닿는 위치에 따라 붙는 개수가 달라질 수 있어서, 자성의 세기 때문인지 붙은 모양 때문인지 구분하기도 어렵습니다. 그래서 값을 연속적으로 읽을 수 있는 전류 측정으로 바꿨습니다.","kw":[{"l":"개수는 끊어진 값","a":["개수는","끊어진"]},{"l":"작은 변화 구별 못함","a":["작은","변화","구별"]},{"l":"붙는 위치·모양 영향","a":["붙는","위치","모양"]},{"l":"연속적인 값(전류)","a":["연속적인","전류"]}]},"follow":{"id":"lk_FU_A2F","cat":"자소서","grade":"중3","q":"전류계로 바꾸면 이 문제가 완전히 해결되나요?","a":"완전히는 아닙니다. 값을 더 세밀하게 읽을 수는 있지만, 자석이 코일 옆을 지나가는 속도와 위치가 달라지면 전류 값도 달라지기 때문에 그 조건을 같게 만드는 것이 새로운 과제가 됩니다.","kw":[{"l":"완전히는 아닙니다","a":["완전히는","아닙니다"]},{"l":"값을 더 세밀하게 읽을 수는 있지만, 자석이 코일 옆을 지나가는 속도…","a":["세밀하게","지나가는"]}]}},{"main":{"id":"lk_FU_A3","cat":"자소서","grade":"중3","q":"전자기 유도를 구체적으로 설명하고, 유도기전력이 무엇인지도 말해 보세요.","a":"코일을 지나는 자기장의 세기나 방향, 또는 코일을 통과하는 자기장의 양이 변하면 코일에 전류를 흐르게 하려는 전압이 생기는데, 이것이 유도기전력이고 이때 흐르는 전류가 유도전류입니다. 자석을 코일에 가까이 하거나 멀리 할 때만 전류가 흐르고, 자석이 가만히 있으면 흐르지 않습니다. 변화가 빠를수록, 자석이 강할수록, 코일을 많이 감을수록 유도기전력이 큽니다. 이 실험에서는 자석이 약해지면 같은 속도로 지나가도 코일을 통과하는 자기장의 변화가 작아져서 유도전류도 작아진다고 생각했습니다.","kw":[{"l":"자기장 변화 → 유도기전력 → 유도전류","a":["유도기전력","유도전류","자기장"]},{"l":"변화가 있을 때만","a":["변화가","있을","때만"]},{"l":"빠를수록·강할수록·감은 수 많을수록 큼","a":["빠를수록","강할수록","많을수록"]}]},"follow":{"id":"lk_FU_A3F","cat":"자소서","grade":"중3","q":"이 실험에서 전자기 유도의 크기에 변화를 줄 수 있는 요인에는 무엇이 있나요?","a":"자석이 지나가는 속도, 자석의 세기, 코일의 감은 수, 코일의 단면적, 자석과 코일 사이의 거리가 있습니다. 이 실험에서 보려는 것은 자석의 세기이므로 나머지는 모두 같게 해야 합니다.\n\n[추가 꼬리질문]\n1) 유도전류의 방향은 어떻게 결정되나요?\n   답: 렌츠 법칙에 따라, 유도전류는 코일을 지나는 자기장의 변화를 방해하는 방향으로 흐릅니다. 예를 들어 N극이 코일에 가까워지면 코일의 그쪽 면이 N극이 되어 밀어내는 방향으로 전류가 흐릅니다. 이 실험에서는 방향이 아니라 크기만 비교했습니다.","kw":[{"l":"자석이 지나가는 속도, 자석의 세기, 코일의 감은 수, 코일의 단면적…","a":["지나가는","있습니다"]},{"l":"이 실험에서 보려는 것은 자석의 세기이므로 나머지는 모두 같게 해야 …","a":["세기이므로","실험에서"]}]}},{"main":{"id":"lk_FU_A4","cat":"자소서","grade":"중3","q":"이 실험에서 실험군과 대조군은 무엇인가요?","a":"가열한 자석이 실험군이고, 가열하지 않은 실온의 자석이 대조군입니다. 같은 자석으로 가열 전과 가열 후를 비교하거나, 온도를 40, 60, 80℃로 바꿔 가며 비교했습니다. 바꾼 조건은 자석의 온도 하나뿐이고 나머지는 같게 하려고 했습니다. (실온 상태에서 측정한 값을 기준값으로 두었는지는 「본인이 한 대로」 말하세요. 두지 않았다면 \"기준이 되는 실온 측정이 있었으면 더 좋았다\"고 한계로 말하세요.)","kw":[{"l":"실험군=가열한 자석","a":["실험군","가열한","자석"]},{"l":"대조군=실온 자석","a":["대조군","실온","자석"]},{"l":"바꾼 것=온도 하나","a":["바꾼","온도","하나"]}]},"follow":{"id":"lk_FU_A4F","cat":"자소서","grade":"중3","q":"실온 기준값이 없었다면 결론이 어떻게 약해지나요?","a":"온도가 올라갈수록 전류가 작아졌다는 경향은 말할 수 있지만, 그 감소가 실온에 비해 얼마만큼인지는 정확히 말하기 어렵습니다. 그래서 기준이 되는 실온 측정을 함께 하는 것이 필요합니다.","kw":[{"l":"온도가 올라갈수록 전류가 작아졌다는 경향은 말할 수 있지만, 그 감소…","a":["얼마만큼인지는","올라갈수록"]},{"l":"그래서 기준이 되는 실온 측정을 함께 하는 것이 필요합니다","a":["필요합니다","그래서"]}]}},{"main":{"id":"lk_FU_A5","cat":"자소서","grade":"중3","q":"이 실험에서 같게 유지한 점과 변화시킨 점은 무엇인가요? 자석이 코일을 지나가는 속도는 어떻게 일정하게 유지했나요?","a":"변화시킨 것은 자석의 온도이고, 같게 유지한 것은 같은 자석과 같은 코일, 자석이 코일을 지나가는 속도와 위치, 전류계입니다. 속도는 「(본인이 쓴 방법: 예를 들어 같은 높이에서 놓아 경사면이나 진자로 지나가게 하기, 같은 길이의 끈에 매달아 같은 각도에서 놓기 등)」으로 같게 하려고 했습니다. 손으로 지나가게 하면 속도가 매번 달라져서 전류 값이 흔들리기 때문에, 같은 방법으로 반복하고 여러 번 측정해서 평균을 보려고 했습니다.","kw":[{"l":"바꾼 것=온도","a":["바꾼 것=온도","바꾼","온도"]},{"l":"같게=자석·코일·속도·위치","a":["같게","자석","코일"]},{"l":"속도 통제 방법(본인)","a":["속도","통제","방법"]},{"l":"반복 후 평균","a":["반복 후 평균","반복","평균"]}]},"follow":{"id":"lk_FU_A5F","cat":"자소서","grade":"중3","q":"손으로 자석을 움직였다면 속도의 차이를 어떻게 줄이나요?","a":"손으로 하면 완전히 같게 하기는 어렵습니다. 그래서 같은 지점에서 출발해 같은 구간을 지나가게 하고, 여러 번 반복해서 대푯값을 쓰며, 값이 너무 튀는 측정은 다시 합니다. 더 좋은 방법은 기울기나 진자 장치를 이용해 같은 높이에서 놓아 같은 속도가 되게 하는 것입니다.\n\n[추가 꼬리질문]\n1) 자석의 온도는 어떻게 측정했나요? 가열한 자석이 식는 동안의 열 손실은 어떻게 통제했나요?\n   답: (본인이 쓴 방법으로 말하세요.) 온도계나 적외선 온도계로 가열 직후의 온도를 재고 바로 측정했습니다. 가열한 자석은 공기 중에서 계속 식기 때문에, 측정하는 순간의 온도는 재 두었던 온도보다 조금 낮을 수 있습니다. 이를 줄이려고 가열 후 바로 같은 시간 안에 측정했고, 이 부분은 실험의 한계라고 생각합니다.","kw":[{"l":"손으로 하면 완전히 같게 하기는 어렵습니다","a":["어렵습니다","손으로"]},{"l":"그래서 같은 지점에서 출발해 같은 구간을 지나가게 하고, 여러 번 반…","a":["지점에서","지나가게"]},{"l":"더 좋은 방법은 기울기나 진자 장치를 이용해 같은 높이에서 놓아 같은…","a":["기울기나","높이에서"]}]}},{"main":{"id":"lk_FU_A6","cat":"자소서","grade":"중3","q":"유도전류가 줄어든 것을 \"온도가 높을수록 자성이 약해졌다\"고 해석한 근거는 무엇인가요? 다른 원인은 없었나요?","a":"코일, 속도, 위치를 같게 했을 때 달라진 것은 자석의 온도뿐이었는데 온도가 오를수록 전류가 작아졌기 때문에 자석이 만드는 자기장이 약해졌다고 해석했습니다. 다만 다른 원인도 생각할 수 있습니다. 첫째, 드라이기 열이 코일 가까이 가서 코일 도선의 저항이 커지면 같은 기전력에도 전류가 줄 수 있습니다. 둘째, 자석이 지나가는 속도가 우연히 달라졌을 수 있습니다. 그래서 속도를 같게 하려고 했고 여러 번 반복했지만, 이런 가능성을 완전히 없앴다고는 말할 수 없습니다. 이 실험은 \"자성이 약해졌을 가능성이 크다\"는 경향을 보인 것이고, 정확한 측정은 아닙니다.","kw":[{"l":"다른 조건 같음 → 온도만 변화","a":["온도만","다른","조건"]},{"l":"다른 원인: 코일 저항, 속도","a":["다른","원인","코일"]},{"l":"한계 인정","a":["한계 인정","한계","인정"]},{"l":"경향이지 정확한 값은 아님","a":["경향이지","정확한","값은"]}]},"follow":{"id":"lk_FU_A6F","cat":"자소서","grade":"중3","q":"코일이 가열되었는지는 어떻게 확인할 수 있나요?","a":"코일을 자석 가까이 두지 않고 코일 온도를 직접 재 보거나, 가열한 후 바로가 아니라 코일이 실온인지 확인한 뒤 측정하는 방법이 있습니다. 또 같은 코일에 가열하지 않은 자석을 반복해서 측정해서 전류가 변하지 않는지 확인하면 코일 때문이 아니라는 것을 보일 수 있습니다.\n\n[추가 꼬리질문]\n1) 자성이 약해지는 것을 이 실험 말고 다른 방법으로 확인할 수 있나요?\n   답: 자기장 센서나 가우스미터로 자석 주변의 자기장 세기를 직접 재면 됩니다. 스마트폰의 자기장 센서로 같은 거리에서 값을 비교하는 방법도 있습니다. 이 방법이 유도전류보다 속도 같은 변수가 적어서 더 직접적입니다.","kw":[{"l":"코일을 자석 가까이 두지 않고 코일 온도를 직접 재 보거나, 가열한 …","a":["실온인지","측정하는"]},{"l":"또 같은 코일에 가열하지 않은 자석을 반복해서 측정해서 전류가 변하지…","a":["가열하지","반복해서"]}]}},{"main":{"id":"lk_FU_A7","cat":"자소서","grade":"중3","q":"같은 온도로 실험을 반복한 횟수와 그 대푯값은 무엇인가요? 같은 실험을 다시 한다면 바꾸고 싶은 점은 무엇인가요?","a":"(본인이 한 횟수로 말하세요.) 같은 온도에서 「(횟수)」번 측정했고, 대푯값으로는 「(평균 또는 중앙값 또는 최댓값 제외한 평균)」을 썼습니다. 값이 한 번씩 튀는 경우가 있어서 평균은 튀는 값의 영향을 받고, 중앙값은 영향을 덜 받습니다. 다시 한다면 첫째 자석이 지나가는 속도를 장치로 같게 하고, 둘째 온도 범위를 더 넓고 촘촘하게 하고, 셋째 :["정렬"]},{"l":"열운동이 정렬을 흐트러뜨림","a":["흐트러뜨림","열운동이","정렬을"]},{"l":"퀴리 온도에서 자성 소실","a":["온도에서","퀴리","자성"]}]},"follow":{"id":"lk_FU_B1F","cat":"자소서","grade":"중3","q":"가열했던 자석은 식히면 원래의 자성으로 돌아오나요?","a":"퀴리 온도보다 훨씬 낮은 온도에서 가열했다면 대부분 식으면 원래 가까이 돌아옵니다. 다만 자석 종류마다 견디는 한계 온도가 있어서, 그것을 넘기면 식어도 완전히 돌아오지 않는 영구적인 손실이 생깁니다. 제 실험의 80℃에서 어느 정도 돌아왔는지는 확인하지 못했습니다.\n\n[추가 꼬리질문]\n1) 자석을 계속 가열하면 어떻게 되나요?\n   답: 온도가 퀴리 온도에 가까워질수록 자성이 급격히 약해지다가, 퀴리 온도를 넘으면 강자성이 사라지고 자석에 붙지 않게 됩니다. 자석 종류에 따라 퀴리 온도가 다르고, 철은 약 770℃ 정도로 알고 있습니다. 실제 실험에서는 자석의 코팅이 상하거나 위험하므로 일반 환경에서 해 볼 수 없습니다.","kw":[{"l":"퀴리 온도보다 훨씬 낮은 온도에서 가열했다면 대부분 식으면 원래 가까…","a":["가열했다면","돌아옵니다"]},{"l":"다만 자석 종류마다 견디는 한계 온도가 있어서, 그것을 넘기면 식어도…","a":["종류마다","돌아오지"]},{"l":"제 실험의 80℃에서 어느 정도 돌아왔는지는 확인하지 못했습니다","a":["돌아왔는지는","80℃에서"]}]}},{"main":{"id":"lk_FU_B2","cat":"자소서","grade":"중3","q":"이 결과가 실제로 쓰이는 예와, 열이 물질의 성질에 영향을 주는 다른 예를 말해 보세요.","a":"온도에 따라 자성이 달라지는 성질은 일부 전기밥솥의 온도 감지 장치처럼, 일정 온도가 되면 자석이 자성을 잃어 스위치가 작동하게 하는 데 쓰이는 것으로 알고 있습니다. 열이 물질의 성질에 영향을 주는 예로는 금속이 가열되면 팽창하는 것, 두 금속을 붙인 바이메탈이 온도에 따라 휘는 것, 물이 온도에 따라 얼음·물·수증기로 상태가 바뀌는 것이 있습니다. (밥솥의 예는 정확한 구조를 확인해서 말하세요.)","kw":[{"l":"퀴리 온도 이용 스위치(밥솥)","a":["스위치","퀴리","온도"]},{"l":"열팽창","a":["열팽창"]},{"l":"바이메탈","a":["바이메탈"]},{"l":"상태 변화","a":["상태 변화","상태","변화"]}]},"follow":{"id":"lk_FU_B2F","cat":"자소서","grade":"중3","q":"이 결과를 통해 추가로 추론해 볼 수 있는 것은 무엇인가요?","a":"전류가 줄어드는 정도가 온도에 비례하는지, 어떤 온도에서 급격히 줄어드는지 더 촘촘한 온도에서 측정하면 알 수 있습니다. 또 자석의 종류(네오디뮴, 페라이트 등)에 따라 온도에 대한 반응이 다른지도 같은 방법으로 비교해 볼 수 있습니다.\n\n[추가 꼬리질문]\n1) 입학 후 여러 이론을 함께 사용해서 해 보고 싶은 실험이 있나요?\n   답: (본인의 계획으로 말하세요.) 예를 들어 자석의 종류별로 온도에 따른 자기장 세기를 자기장 센서로 측정해 비교하고, 이를 열운동과 연결해서 설명해 보고 싶습니다. 이 실험에서 부족했던 속도 통제와 온도 측정을 개선해서 같은 질문을 다시 확인하는 것이 목표입니다.","kw":[{"l":"전류가 줄어드는 정도가 온도에 비례하는지, 어떤 온도에서 급격히 줄어…","a":["비례하는지","줄어드는지"]},{"l":"또 자석의 종류(네오디뮴, 페라이트 등)에 따라 온도에 대한 반응이 …","a":["네오디뮴","페라이트"]}]}},{"main":{"id":"lk_FU_A9","cat":"자소서","grade":"중3","q":"이 탐구를 계획하게 된 계기는 무엇인가요? 근의 공식을 작도했다는 것은 무슨 뜻인가요?","a":"이차방정식과 근의 공식을 배우면서, 공식으로 구한 무리수 근을 소수로 근삿값만 적는 것이 아쉬워서 자와 컴퍼스만으로 수직선 위에 정확한 위치로 나타낼 수 있을지 궁금했습니다. 근의 공식에 들어 있는 덧셈, 뺄셈, 곱셈, 나눗셈, 제곱, 제곱근을 각각 선분의 길이로 만들 수 있으면 근의 공식을 그대로 도형으로 옮길 수 있다고 생각했습니다. 그래서 각 계산을 작도하는 방법을 하나씩 찾았고, 그것을 이어서 근의 길이를 작도했습니다.","kw":[{"l":"근삿값이 아니라 정확한 위치","a":["근삿값이","아니라","정확한"]},{"l":"자+컴퍼스","a":["자+컴퍼스","컴퍼스"]},{"l":"합 차 곱 나눗셈 제곱 제곱근을 각각 작도","a":["제곱근을","나눗셈","제곱"]},{"l":"이어 붙임","a":["이어 붙임","이어","붙임"]}]},"follow":{"id":"lk_FU_A9F","cat":"자소서","grade":"중3","q":"근의 공식을 작도한 과정을 처음부터 끝까지 구체적으로 설명해 보세요.","a":"이차방정식 ax²+bx+c=0의 근은 (−b±√(b²−4ac))÷(2a)입니다. 먼저 b²을 곱의 작도로, 4ac를 곱의 작도 두 번과 합의 작도로 만듭니다. 이 둘의 차로 b²−4ac를 만들고, 사영정리로 그 제곱근 선분을 만듭니다. 다음으로 −b를 수직선에서 반대 방향으로 잡은 뒤 제곱근 선분을 더하고 빼서 −b±√(b²−4ac)를 만들고, 마지막으로 나눗셈 작도로 2a로 나눕니다. (본인이 사용한 순서와 다르면 본인 방법으로 말하세요.)\n\n[추가 꼬리질문]\n1) 이 탐구를 하기 전에는 근의 공식을 어떻게 생각했고, 무엇이 달라졌나요?\n   답: 처음에는 근의 공식을 해를 계산하기 위한 식으로만 생각했습니다. 이번 탐구로 같은 해를 도형의 길이와 닮음 관계로도 나타낼 수 있다는 것을 알았고, 대수적인 계산 결과가 기하학적 길이로 표현될 수 있다는 점에서 수학의 영역들이 밀접하게 연결되어 있다고 느꼈습니다.","kw":[{"l":"이차방정식 ax²+bx+c=0의 근은 (−b±√(b²−4ac))÷(2…","a":["이차방정식"]},{"l":"먼저 b²을 곱의 작도로, 4ac를 곱의 작도 두 번과 합의 작도로 …","a":["4ac를","만듭니다"]},{"l":"이 둘의 차로 b²−4ac를 만들고, 사영정리로 그 제곱근 선분을 만…","a":["b²−4ac를","사영정리로"]}]}},{"main":{"id":"lk_FU_A11","cat":"자소서","grade":"중3","q":"두 선분의 곱과 나눗셈을 작도하는 방법을 말해 보세요. 두 방법의 차이는 무엇이고, 여기서 닮음비는 어떻게 쓰였나요? 단위 1은 어떻게 쓰였나요?","a":"곱은 한 점 O에서 두 반직선을 긋고, 한 반직선 위에 길이 1인 점 U와 길이 a인 점 A를, 다른 반직선 위에 길이 b인 점 B를 잡습니다. U와 B를 이은 직선에 평행하게 A를 지나는 직선을 그어 다른 반직선과 만나는 점을 C라 하면, 삼각형 OUB와 OAC가 닮음이어서 OU:OA = OB:OC, 즉 1:a = b:OC이므로 OC = ab입니다. 나눗셈은 같은 그림에서 점 배치만 바꿉니다. 한 반직선 위에 길이 b인 점 B와 길이 a인 점 A를, 다른 반직선 위에 길이 1인 점 U를 잡고, B와 U를 이은 직선에 평행하게 A를 지나는 직선을 그으면 OB:OA = OU:OC, 즉 b:a = 1:OC이므로 OC = a÷b입니다. 곱은 1을 한 줄에 a와 함께, 나눗셈은 1을 b와 반대쪽 줄에 놓는다는 차이가 있고, 두 경우 모두 단위 길이 1을 기준 선분으로 두어야 닮음비를 세울 수 있습니다. 제곱은 곱에서 a와 b를 같게 하면 됩니다.","kw":[{"l":"평행선 → 닮음","a":["평행선 → 닮음","평행선","닮음"]},{"l":"곱: 1:a=b:x","a":["곱: 1:a=b:x"]},{"l":"나눗셈: b:a=1:x","a":["나눗셈"]},{"l":"단위 1이 기준","a":["단위 1이 기준","단위","1이","기준"]},{"l":"제곱=곱에서 a=b","a":["곱에서","제곱"]}]},"follow":{"id":"lk_FU_A11F","cat":"자소서","grade":"중3","q":"단위 1을 임의로 잡았을 때 어떤 문제가 있었나요?","a":"(본인의 경험으로 말하세요.) 곱과 나눗셈의 닮음비는 1을 기준으로 세우기 때문에, 1의 길이를 작도 그림마다 다르게 잡으면 a, b, ab의 길이를 서로 비교할 수 없게 됩니다. 그래서 처음에 단위 길이를 한 번 정하고, 계산 전체에서 같은 단위를 쓰도록 했습니다. 또 길이를 곱하면 원래는 넓이에 해당하는데, 단위 1을 기준으로 정하기 때문에 길이로 나타낼 수 있다는 점도 알게 되었습니다.\n\n[추가 꼬리질문]\n1) 곱과 제곱을 작도할 때 쓴 삼각형의 닮음비와 삼각형의 모양은 어떻게 되나요?\n   답: 두 삼각형 OUB와 OAC는 점 O를 공통 꼭짓점으로 하고 한 변이 서로 평행한 닮은 삼각형입니다. 닮음비는 OU:OA = 1:a이고, 대응하는 변 OB:OC도 같은 비 1:a이므로 OC = a×OB가 됩니다. 제곱은 OB = a로 놓은 경우입니다.","kw":[{"l":"(본인의 경험으로 말하세요.) 곱과 나눗셈의 닮음비는 1을 기준으로 …","a":["경험으로","말하세요"]},{"l":"그래서 처음에 단위 길이를 한 번 정하고, 계산 전체에서 같은 단위를…","a":["전체에서","했습니다"]},{"l":"또 길이를 곱하면 원래는 넓이에 해당하는데, 단위 1을 기준으로 정하…","a":["해당하는데","되었습니다"]}]}},{"main":{"id":"lk_FU_A12","cat":"자소서","grade":"중3","q":"제곱근을 닮음으로만 나타내려 했을 때는 어떻게 시도했고 왜 어려웠나요? 그 뒤 사영정리를 이용해 제곱근을 어떻게 작도했나요?","a":"곱과 나눗셈은 닮음비로 되었지만, √a를 닮음비로 나타내려면 x:1 = a:x처럼 같은 x가 두 번 들어가는 식을 세워야 하는데, 평행선을 이용한 방법으로는 x 위치를 정할 수 없어서 어려웠습니다. 그래서 원의 성질과 사영정리를 떠올렸습니다. 한 직선 위에 길이 a인 선분 AB와 이어서 길이 1인 선분 BC를 잡고, AC를 지름으로 하는 원을 그립니다. B를 지나 AC에 수직인 직선이 원과 만나는 점을 D라 하면, 각 ADC는 지름에 대한 원주각이어서 직각입니다. 직각삼각형 ADC에서 D에서 빗변 AC에 내린 수선이 BD이므로 사영정리에 의해 BD² = AB × BC = a × 1 = a이고, 따라서 BD = √a입니다.","kw":[{"l":"x:1=a:x 모양","a":["모양"]},{"l":"지름 AC의 원","a":["지름 AC의 원","AC의","지름"]},{"l":"수선 BD","a":["수선 BD","수선","BD"]},{"l":"원주각 90°","a":["원주각 90°","원주각","90°"]},{"l":"BD²=AB·BC=a","a":["BD²","AB","BC"]},{"l":"BD=√a","a":["BD=√a","BD","√a"]}]},"follow":{"id":"lk_FU_A12F","cat":"자소서","grade":"중3","q":"사영정리를 구체적으로 설명해 보세요. 어떻게 증명되나요?","a":"직각삼각형 ABC에서 ∠A가 직각이고, A에서 빗변 BC에 내린 수선의 발을 H라 하면 AB² = BH × BC, AC² = CH × BC, AH² = BH × CH가 성립합니다. 삼각형 ABC와 삼각형 HBA가 각 B가 공통이고 직각이 하나씩 있어서 닮음이므로 BA:BH = BC:BA이고, 이를 정리하면 AB² = BH × BC입니다. 나머지도 같은 방법의 닮음으로 증명됩니다.\n\n[추가 꼬리질문]\n1) 제곱근 작도에서 닮음비나 사영정리 말고 다른 정리를 써 보려 한 적이 있나요?\n   답: (본인의 경험으로 말하세요.) 피타고라스 정리로 √2, √3 같은 길이를 차례로 만드는 방법을 생각해 보았습니다. 이 방법은 √2, √3처럼 특정한 값은 만들 수 있지만 임의의 길이 a에 대해 √a를 한 번에 만들 수 없어서, 일반적인 근의 공식에 쓰기에는 사영정리가 더 적합했습니다.","kw":[{"l":"직각삼각형 ABC에서 ∠A가 직각이고, A에서 빗변 BC에 내린 수선…","a":["직각삼각형","ABC에서"]},{"l":"삼각형 ABC와 삼각형 HBA가 각 B가 공통이고 직각이 하나씩 있어…","a":["닮음이므로","BC입니다"]},{"l":"나머지도 같은 방법의 닮음으로 증명됩니다","a":["증명됩니다","나머지도"]}]}},{"main":{"id":"lk_FU_A13","cat":"자소서","grade":"중3","q":"작도한 근이 양수인지 음수인지는 어떻게 확인했나요? 근의 공식에서 √ 안의 식 b²−4ac는 어떻게 적용했나요?","a":"작도에서 길이는 항상 양수이므로, 수직선 위에서 오른쪽 방향을 양수, 왼쪽 방향을 음수로 정해 두고 −b를 b의 반대 방향으로 잡아서 부호를 구분했습니다. −b에서 제곱근 선분을 오른쪽과 왼쪽으로 한 번씩 옮기면 두 근의 위치가 됩니다. 제곱근 안의 b²−4ac는 b²과 4ac를 각각 작도하고 차를 구해서 만들었는데, 이 값이 0보다 작으면 큰 쪽에서 작은 쪽을 뺄 수 없어서 작도가 되지 않고, 이는 실근이 없다는 뜻과 일치합니다.","kw":[{"l":"방향으로 부호 구분","a":["방향으로","부호","구분"]},{"l":"−b±√","a":["−b±√"]},{"l":"b²−4ac\u003c0이면 작도 불가 = 실근 없음","a":["b²−4ac","0이면","작도"]}]},"follow":{"id":"lk_FU_A13F","cat":"자소서","grade":"중3","q":"판별식이 0이면 작도는 어떻게 되나요?","a":"b²−4ac가 0이면 제곱근 선분의 길이가 0이 되어서 −b 위치에 점이 하나만 남고, 이것이 중근입니다.","kw":[{"l":"b²−4ac가 0이면 제곱근 선분의 길이가 0이 되어서 −b 위치에 …","a":["b²−4ac가","중근입니다"]}]}},{"main":{"id":"lk_FU_A14","cat":"자소서","grade":"중3","q":"암기만으로 어려웠던 공식과 그것을 활용한 경험, 그리고 답을 구하는 데서 그치지 않고 이유를 탐색해 본 경험을 말해 보세요.","a":"(본인의 경험으로 말하세요.) 사영정리는 공식으로만 외우고 있었을 때는 어느 변이 어느 선분의 곱이 되는지 자주 헷갈렸습니다. 이번에 제곱근 작도에 직접 쓰려고 하면서 닮은 삼각형을 그려 대응변을 세워 보니, 공식이 아니라 닮음에서 나온 결과라는 것을 이해했고 헷갈리지 않게 되었습니다. 이후에는 공식을 외우기 전에 왜 그렇게 되는지 그림으로 한 번 확인하는 습관이 생겼습니다.","kw":[{"l":"외운 공식 헷갈림 → 닮음으로 이해","a":["닮음으로","헷갈림","외운"]},{"l":"활용해 보니 이해","a":["활용해","보니","이해"]},{"l":"이유 확인 습관","a":["이유 확인 습관","이유","확인","습관"]}]},"follow":{"id":"lk_FU_A14F","cat":"자소서","grade":"중3","q":"같은 탐구를 다시 한다면 바꾸고 싶은 점은 무엇인가요?","a":"작도 결과를 눈으로 맞다고 확인했을 뿐 직접 길이를 재거나 좌표로 계산해서 확인하지 않았다면, 좌표를 이용해 실제 길이가 맞는지 검증하겠습니다. 또 작도가 되지 않는 경우도 함께 정리하겠습니다.","kw":[{"l":"작도 결과를 눈으로 맞다고 확인했을 뿐 직접 길이를 재거나 좌표로 계…","a":["검증하겠습니다","확인했을"]},{"l":"또 작도가 되지 않는 경우도 함께 정리하겠습니다","a":["정리하겠습니다","작도가"]}]}},{"main":{"id":"lk_FU_A15","cat":"자소서","grade":"중3","q":"친구가 설명을 이해하지 못한다는 것을 어떻게 알아차렸나요? 그때 설명 방식을 구체적으로 어떻게 바꾸었나요?","a":"제가 조사한 내용을 설명하는 동안 친구가 질문을 하지 않고 표정이 굳거나 \"응, 응\" 하고만 대답해서, 정말 이해한 것이 아니라 따라오지 못하고 있다고 느꼈습니다. (본인이 알아차린 신호로 바꾸어 말하세요  있었습니다","a":["있었습니다","덕분에"]}]}},{"main":{"id":"lk_FU_B5","cat":"자소서","grade":"중3","q":"서로 다른 의견이 나왔을 때 조율한 경험, 서로의 강점이 합쳐져 시너지가 난 경험이 있나요? 팀원으로서 내가 잘하는 것은 무엇인가요?","a":"(본인의 경험으로 말하세요. 아래는 구성 예입니다.) 실험에서 줄의 길이를 몇 단계로 할지에 대해 서로 의견이 달랐을 때, 각자 이유를 말하고 둘 다 해 보기로 했습니다. 제가 이론과 정리를 맡고 친구가 측정을 꼼꼼히 맡으면서 둘의 장점이 합쳐졌습니다. 저는 팀에서 자료를 조사하고 정리해서 방향을 잡는 일을 잘하고, 이번 경험으로 상대의 이해를 살피는 것도 더 신경 쓰게 되었습니다.","kw":[{"l":"이유를 듣고 둘 다 해 봄","a":["이유를","듣고"]},{"l":"강점 분담","a":["강점 분담","강점","분담"]},{"l":"정리와 방향","a":["정리와 방향","정리와","방향"]},{"l":"이해 살피기","a":["이해 살피기","살피기","이해"]}]},"follow":{"id":"lk_FU_B5F","cat":"자소서","grade":"중3","q":"다시 돌아간다면 바꾸고 싶은 설명 방식이나 협력 방식은 무엇인가요?","a":"설명을 시작하기 전에 친구가 이미 아는 것이 무엇인지 먼저 물어보겠습니다. 그러면 처음부터 친구의 눈높이에 맞게 시작할 수 있고, 돌아가는 시간을 줄일 수 있습니다.\n\n[추가 꼬리질문]\n1) 친구가 내 설명을 잘못 이해했던 경험과 그때의 대응은 무엇인가요?\n   답: (본인의 경험으로 말하세요.) 친구가 제 설명을 다르게 이해했을 때, 먼저 \"내 설명이 부족했나 보다\"라고 생각하고 같은 말을 반복하지 않고 다른 예로 다시 설명했습니다. 이해한 내용을 친구에게 직접 말해 보게 해서 어디서 갈렸는지도 확인했습니다.\n2) 단어와 말투 중 어느 것에 더 신경을 썼나요?\n   답: 둘 다 중요했지만 저는 단어에 더 신경을 썼다고 생각합니다. 어려운 용어를 쉬운 말로 바꾸는 것이 이해에 직접 영향을 주었기 때문입니다. 말투는 친구가 위축되지 않도록 부드럽게 하려고 했습니다. (본인 생각대로 바꾸어 말하세요.)","kw":[{"l":"설명을 시작하기 전에 친구가 이미 아는 것이 무엇인지 먼저 물어보겠습…","a":["물어보겠습니다","시작하기"]},{"l":"그러면 처음부터 친구의 눈높이에 맞게 시작할 수 있고, 돌아가는 시간…","a":["처음부터","눈높이에"]}]}},{"main":{"id":"lk_FU_A19","cat":"자소서","grade":"중3","q":"입자물리학자를 꿈꾸게 된 계기는 무엇인가요? 가장 인상 깊었던 사고실험은 무엇인가요?","a":"중학교 때 양자역학과 상대성이론에 관한 책을 읽으면서, 눈에 보이지 않는 작은 입자와 빛의 움직임을 수학으로 설명해 낸다는 점에 큰 흥미를 느꼈습니다. 길이 수축과 시간 팽창 같은 효과를 사고실험으로 따라가 보면서, 예상과 다른 결과가 나와도 끝까지 따져 보는 과정이 재미있었고, 실제로 실험하기 어려운 것을 생각으로 상상해 보는 힘도 길렀습니다. 그중 가장 인상 깊었던 것은 빛시계 사고실험입니다. 위아래로 거울이 있고 빛이 왕복하는 시계가 움직이면, 움직이는 시계 안에서 빛이 지나야 하는 길이 비스듬해져서 길어지는데 빛의 속도는 같으므로 시간이 더 걸린다는 결과가 나옵니다. (본인이 읽은 책과 사고실험으로 바꾸어 말하세요.)","kw":[{"l":"양자역학·상대성이론 책","a":["상대성이론","양자역학"]},{"l":"수학으로 설명","a":["수학으로 설명","수학으로","설명"]},{"l":"사고실험","a":["사고실험"]},{"l":"빛시계","a":["빛시계"]},{"l":"끝까지 따져 봄","a":["끝까지 따져 봄","끝까지","따져"]}]},"follow":{"id":"lk_FU_A19F","cat":"자소서","grade":"중3","q":"길이 수축과 시간 팽창을 설명해 보세요.","a":"특수상대성이론에서는 움직이는 물체를 관찰하면 움직이는 방향으로 길이가 줄어들어 보이고(길이 수축), 움직이는 시계는 정지한 시계보다 느리게 가는 것으로 관측됩니다(시간 팽창). 속도가 v일 때 1÷√(1−v²/c²)를 γ라고 하면 시간은 γ배로 늘어나고 길이는 1/γ배가 됩니다. 일상 속도에서는 γ가 1과 거의 같아서 못 느낍니다.\n\n[추가 꼬리질문]\n1) 입자물리학자가 되기 위해 지금까지 한 구체적인 노력은 무엇인가요?\n   답: (본인이 한 것으로 말하세요.) 관련 책을 읽었고(독서활동에 기록), 사고실험으로 상대론의 효과를 따져 보았으며, 그 바탕이 되는 수학 공부를 병행했습니다. 아직은 학교에서 배우는 수준이어서, 입학 후 심화 물리와 AP 물리에서 더 깊이 있게 공부하려고 합니다.","kw":[{"l":"특수상대성이론에서는 움직이는 물체를 관찰하면 움직이는 방향으로 길이가…","a":["특수상대성이론에서는","관측됩니다"]},{"l":"일상 속도에서는 γ가 1과 거의 같아서 못 느낍니다","a":["속도에서는","느낍니다"]}]}},{"main":{"id":"lk_FU_A20","cat":"자소서","grade":"중3","q":"특수상대성이론의 기본 가설은 무엇이고, 로런츠 변환은 갈릴레이 변환과 비교했을 때 어떤 의미가 있나요?","a":"기본 가설은 두 가지입니다. 첫째, 모든 관성좌표계에서 물리 법칙이 같다는 상대성 원리입니다. 둘째, 진공에서 빛의 속력은 관측자나 광원의 운동과 관계없이 항상 같다는 광속 불변의 원리입니다. 갈릴레이 변환은 속도를 단순히 더하고 빼기 때문에 빛의 속력도 관측자에 따라 달라지게 되는데, 이것은 두 번째 가설과 충돌합니다. 로런츠 변환은 x' = γ(x − vt), t' = γ(t − vx/c²)의 식으로, 시간과 공간을 함께 변환하여 광속이 모든 관성계에서 같게 유지됩니다. 속도 v가 빛의 속력보다 훨씬 작으면 γ가 1에 가까워져서 갈릴레이 변환과 거의 같아지기 때문에, 갈릴레이 변환은 로런츠 변환의 낮은 속도에서의 근삿값입니다.","kw":[{"l":"상대성 원리 + 광속 불변","a":["상대성","원리","광속"]},{"l":"갈릴레이: 단순 합","a":["갈릴레이","단순"]},{"l":"로런츠: 시간·공간 함께 변환","a":["로런츠","시간","공간"]},{"l":"v≪c이면 갈릴레이","a":["v≪c이면","갈릴레이"]}]},"follow":{"id":"lk_FU_A20F","cat":"자소서","grade":"중3","q":"속도가 광속에 가까워져야 현상이 관측되는 수학적 이유는 무엇인가요?","a":"γ = 1÷√(1−v²/c²)에서 v/c가 작을 때는 γ가 1 + (v²/2c²)과 거의 같아서 1과 차이가 거의 없고, v가 c에 가까워질수록 √ 안이 0에 가까워져서 γ가 급격히 커지기 때문입니다. 예를 들어 v = 0.1c에서는 약 1.005, 0.9c에서는 약 2.3, 0.99c에서는 약 7입니다. v/c의 제곱으로 들어가기 때문에 낮은 속도에서는 아주 작은 효과만 나옵니다.","kw":[{"l":"γ = 1÷√(1−v²/c²)에서 v/c가 작을 때는 γ가 1 + (…","a":["가까워질수록","가까워져서"]},{"l":"예를 들어 v = 0.1c에서는 약 1.005, 0.9c에서는 약 2…","a":["99c에서는","1c에서는"]},{"l":"v/c의 제곱으로 들어가기 때문에 낮은 속도에서는 아주 작은 효과만 …","a":["속도에서는","제곱으로"]}]}},{"main":{"id":"lk_FU_A21","cat":"자소서","grade":"중3","q":"마이컬슨 간섭계는 어떤 장치이고, 왜 직접 구성해서 간섭무늬의 원리를 확인해 보고 싶나요?","a":"마이컬슨 간섭계는 한 빛줄기를 반투명 거울로 둘로 나누어 서로 수직인 두 방향으로 보냈다가, 각각 거울에 반사되어 돌아온 빛을 다시 합쳐서 간섭무늬를 보는 장치입니다. 두 빛이 간 거리의 차가 파장의 정수배이면 서로 강화되어 밝고, 반정수배이면 상쇄되어 어둡습니다. 한쪽 거울을 파장 정도로 조금만 움직여도 무늬가 눈에 띄게 바뀌기 때문에 아주 작은 길이의 변화를 잴 수 있습니다. 제가 이것을 직접 구성해 보고 싶은 이유는 특수상대성이론을 공부하면서 빛의 속도에 대해 흥미가 생겼고, 이 장치가 빛의 성질을 확인하는 대표적인 실험이어서 그 원리를 직접 확인하고 싶기 때문입니다. (간섭계로 빛의 속도 값을 직접 재는 것이 아니라, 빛의 파동 성질과 속도 차이 여부를 확인하는 것임을 구분해서 말하세요.)","kw":[{"l":"빛을 둘로 나눔","a":["빛을 둘로 나눔","빛을","둘로","나눔"]},{"l":"수직 두 경로","a":["수직 두 경로","수직","경로"]},{"l":"다시 합침","a":["다시 합침","다시","합침"]},{"l":"경로차 = 정수배 파장 → 밝음","a":["경로차","정수배","파장"]},{"l":"작은 길이 변화 측정","a":["작은","길이","변화"]}]},"follow":{"id":"lk_FU_A21F","cat":"자소서","grade":"중3","q":"간섭무늬에 대해 아는 것을 말해 보세요.","a":"두 파동이 만날 때 마루와 마루가 만나면 강해지고(보강 간섭), 마루와 골이 만나면 약해지는(상쇄 간섭) 현상이 반복되어 밝고 어두운 무늬가 생깁니다. 이중 슬릿 실험이나 마이컬슨 간섭계에서 볼 수 있고, 빛이 파동이라는 증거입니다. 경로차가 파장의 정수배일 때 밝고 반정수배일 때 어둡습니다.\n\n[추가 꼬리질문]\n1) 마이컬슨-몰리 실험은 어떤 실험이고, 물리학에 어떤 영향을 주었나요? 에테르는 무엇인가요?\n   답: 19세기에는 빛이 파동이라면 소리가 공기를 통해 전해지듯 빛도 에테르라는 매질을 통해 전해진다고 생각했습니다. 지구가 에테르 속을 지나가고 있다면 지구의 운동 방향과 수직 방향으로 간 빛의 왕복 시간이 달라서 간섭무늬가 달라질 것이라고 예상하고 마이컬슨과 몰리가 간섭계를 이용해 실험했는데, 기대한 무늬 변화가 나타나지 않았습니다. 이 결과는 에테르가 존재하지 않는다는 쪽을 지지했고, 광속이 관측자의 운동과 관계없이 일정하다는 생각이 상대성이론으로 이어지는 배경이 되었다고 알고 있습니다. 다만 아인슈타인이 이 실험을 직접 계기로 삼았는지는 역사가들 사이에 의견이 갈린다고 들었습니다.\n2) 양자역학에서의 파동 간섭과 마이컬슨 간섭계에서의 간섭은 무엇이 다른가요?\n   답: 마이컬슨 간섭계에서는 빛이라는 고전적인 파동의 전기장이 합쳐져서 세기 분포가 나타납니다. 양자역학의 이중 슬릿 실험에서는 전자 같은 입자를 한 개씩 보내도 무늬가 쌓여서 나타나는데, 이때 간섭하는 것은 각 입자의 확률 진폭입니다. 즉 무늬의 모양은 비슷하지만, 양자역학에서는 입자 하나 하나가 스스로 간섭한다는 점이 다릅니다. 제가 이해한 수준에서는 여기까지이고 더 깊은 부분은 입학 후 배우고 싶습니다.","kw":[{"l":"두 파동이 만날 때 마루와 마루가 만나면 강해지고(보강 간섭), 마루…","a":["강해지고","약해지는"]},{"l":"이중 슬릿 실험이나 마이컬슨 간섭계에서 볼 수 있고, 빛이 파동이라는…","a":["간섭계에서","파동이라는"]},{"l":"경로차가 파장의 정수배일 때 밝고 반정수배일 때 어둡습니다","a":["반정수배일","어둡습니다"]}]}},{"main":{"id":"lk_FU_A22","cat":"자소서","grade":"중3","q":"한성과학고에 입학하면 어떤 공부와 활동을 하고 싶나요? 입자물리학은 실험이 어려운데 어떻게 실현할 건가요?","a":"입학하면 심화 물리와 AP 물리를 공부해서 물리 개념을 수학으로 이해하는 힘을 키우고, R&E 활동에서는 기본 입자와 관련된 주제를 탐구하고 싶습니다. 입자물리학은 가속기 같은 거대한 장비가 필요해서 학교에서 직접 하기는 어렵지만, 공개된 입자 충돌 데이터를 분석하거나 안개상자로 우주에서 오는 입자의 궤적을 관찰하거나, 컴퓨터 시뮬레이션으로 입자의 운동을 계산하는 식으로 할 수 있다고 생각합니다. 그리고 특수상대성이론과 로런츠 변환을 더 공부하고 마이컬슨 간섭계를 만들어 간섭무늬의 원리를 확인하고 싶습니다. (학교의 교육과정과 R&E 운영 방식은 학생이 직접 조사한 내용으로 말하세요.)","kw":[{"l":"심화 물리·AP 물리","a":["심화","물리","AP"]},{"l":"R&E 기본 입자","a":["R&E","기본","입자"]},{"l":"가속기는 불가 → 공개 데이터, 안개상자, 시뮬레이션","a":["시뮬레이션","가속기는","안개상자"]},{"l":"간섭계 제작","a":["간섭계 제작","간섭계","제작"]}]},"follow":{"id":"lk_FU_A22F","cat":"자소서","grade":"중3","q":"심화 물리나 AP 물리에서는 무엇을 배우는지 알고 있나요? R&E는 어떤 활동인가요?","a":"(본인이 조사한 내용으로 말하세요.) 저는 심화 물리가 중학교에서 배운 물리를 미적분 같은 수학으로 더 깊이 다루는 과목이라고 알고 있고, R&E는 학생이 주제를 정해서 교수나 선생님의 지도 아래 연구하고 논문이나 보고서로 정리하는 활동이라고 알고 있습니다. 자세한 운영은 학교 안내를 더 확인하겠습니다.\n\n[추가 꼬리질문]\n1) 한성과학고 입학 이후의 구체적인 계획은 무엇인가요?\n   답: 1학년에서는 수학과 물리의 기초를 단단히 하고, 특수상대성이론을 식으로 이해할 수 있게 공부하겠습니다. 이후 R&E에서 기본 입자 또는 상대론과 관련된 주제를 정해서 공개 데이터나 시뮬레이션으로 탐구하겠습니다. 틈틈이 간섭계를 만들어 보는 실험도 하겠습니다. (본인의 계획으로 바꾸어 말하세요.)","kw":[{"l":"(본인이 조사한 내용으로 말하세요.) 저는 심화 물리가 중학교에서 배…","a":["중학교에서","과목이라고"]},{"l":"자세한 운영은 학교 안내를 더 확인하겠습니다","a":["확인하겠습니다","자세한"]}]}},{"main":{"id":"lk_FU_B6","cat":"자소서","grade":"중3","q":"기본 입자와 표준모형을 설명해 보세요. 그리고 입자물리학자에게 가장 중요한 덕목은 무엇인가요?","a":"표준모형은 물질을 이루는 기본 입자와 그 사이의 힘을 설명하는 이론입니다. 물질 입자로 쿼크 6종과 렙톤(전자, 뮤온, 타우와 각각의 중성미자) 6종이 있고, 힘을 전달하는 입자로 광자, 글루온, W와 Z 보손이 있으며, 입자에 질량을 주는 힉스 입자가 있습니다. 중력은 표준모형에 들어 있지 않다고 알고 있습니다. 가장 중요한 덕목은 끝까지 의심하고 확인하는 태도라고 생각합니다. 실험 결과가 예상과 달라도 이를 버리지 않고 이유를 따져 보는 것이 새로운 발견으로 이어지기 때문입니다.","kw":[{"l":"쿼크 6","a":["쿼크 6","쿼크"]},{"l":"렙톤 6","a":["렙톤 6","렙톤"]},{"l":"힘 전달 입자","a":["힘 전달 입자","전달","입자"]},{"l":"힉스","a":["힉스"]},{"l":"중력은 제외","a":["중력은 제외","중력은","제외"]},{"l":"덕목=의심하고 확인","a":["의심하고","덕목","확인"]}]},"follow":{"id":"lk_FU_B6F","cat":"자소서","grade":"중3","q":"입자물리학자 중 본받고 싶은 학자와 이유는 무엇인가요?","a":"(본인이 정한 학자로 말하세요.) 예를 들어 파인만을 말한다면, 복잡한 물리를 쉬운 설명으로 풀어내는 점과 직접 계산해 확인하려는 태도를 본받고 싶다고 말할 수 있습니다. 읽은 책(파인만의 물리학 강의 1)과 연결해서 이야기하면 좋습니다.\n\n[추가 꼬리질문]\n1) 양자역학과 상대성이론 중 과학고에서 더 구체적으로 공부하고 싶은 분야는 어느 쪽인가요?\n   답: 저는 먼저 특수상대성이론을 구체적으로 공부하고 싶습니다. 로런츠 변환까지는 수학적으로 따라갈 수 있고, 그것이 기본 입자의 운동을 설명하는 바탕이 되기 때문입니다. 양자역학은 그다음 단계로 배우고 싶습니다.\n2) 물리 개념을 이해하는 데 어려움을 느낀 경험은 무엇이었나요?\n   답: (본인의 경험으로 말하세요.) 로런츠 변환에서 이고, 실험군은 가열한 자석입니다","a":["자석입니다","대조군은"]},{"l":"둘의 차이는 온도 하나뿐이어야 하고, 대조군이 있어야 유도 전류의 차…","a":["하나뿐이어야","대조군이"]}]}},{"main":{"id":"lk_FU_J6","cat":"자소서","grade":"중3","q":"이차방정식의 근을 자와 컴퍼스로 작도한 탐구를 설명하세요. (1) 무엇을 어떻게 작도했나요? (2) 왜 이것이 근이 되나요? (3) 이 탐구에서 가장 어려웠던 점과 배운 점은 무엇인가요?","a":"(1)(2) (「본인이 사용한 방법」으로 바꿔 말하세요.) 예를 들어 x² − 5x + 6 = 0의 근은 점 (0, 1)과 (5, 6)을 지름의 양 끝으로 하는 원이 x축과 만나는 점으로 작도할 수 있습니다. 이 원의 중심은 (2.5, 3.5), 반지름의 제곱은 12.5이고, y = 0에서 (x − 2.5)² = 0.25이므로 x = 2, 3입니다. 일반적으로 근과 계수의 관계(합 −b/a, 곱 c/a)를 도형으로 옮긴 것입니다. (3) 계산한 숫자 근을 길이로 나타내는 일이 어려웠고, 대수와 기하가 서로 연결되어 있음을 배웠습니다.","kw":[{"l":"근 = 길이","a":["근 = 길이","길이"]},{"l":"합과 곱","a":["합과 곱","합과"]},{"l":"대수와 기하 연결","a":["대수와","기하","연결"]},{"l":"계산 vs 작도","a":["계산 vs 작도","계산","vs","작도"]}]},"follow":{"id":"lk_FU_J6F","cat":"자소서","grade":"중3","q":"자와 컴퍼스로 모든 수를 작도할 수 있나요?","a":"아닙니다. 자와 컴퍼스로는 사칙연산과 제곱근으로 만들 수 있는 길이만 작도할 수 있습니다. 그래서 임의의 각의 삼등분이나 정육면체의 부피를 두 배로 만드는 문제는 작도할 수 없다고 알고 있습니다.","kw":[{"l":"자와 컴퍼스로는 사칙연산과 제곱근으로 만들 수 있는 길이만 작도할 수…","a":["컴퍼스로는","사칙연산과"]},{"l":"그래서 임의의 각의 삼등분이나 정육면체의 부피를 두 배로 만드는 문제…","a":["삼등분이나","정육면체의"]}]}},{"main":{"id":"lk_FU_M1","cat":"수학","grade":"중3","q":"두 이차함수 y = f(x), y = g(x)의 그래프가 만나는 점에 대해 답하세요. (1) 두 그래프의 교점의 x좌표가 방정식 f(x) − g(x) = 0의 해인 이유를 설명하세요. (2) f(x) = ax² + bx + c, g(x) = px² + qx + r일 때 f(x) − g(x) = 0을 이차방정식의 일반형으로 나타내세요. (3) 두 그래프가 서로 다른 두 점에서 만날 조건을 말하세요.","a":"(1) 교점은 두 그래프 위에 동시에 있는 점이므로, 그 점의 x좌표에서 f(x)의 값과 g(x)의 값이 같습니다. 즉 f(x) = g(x)이고 이항하면 f(x) − g(x) = 0입니다. 거꾸로 이 방정식의 해 x에서는 두 함수의 값이 같아서 그 점에서 그래프가 만납니다. (2) (a − p)x² + (b − q)x + (c − r) = 0입니다. (3) 이차방정식이 되려면 a ≠ p여야 하고, 서로 다른 두 실근을 가지려면 판별식 D = (b − q)² − 4(a − p)(c − r) > 0이어야 합니다. D = 0이면 한 점에서 접하고, D \u003c 0이면 만나지 않습니다. 예를 들어 f = x² − 2x + 3, g = −x² + 4x − 1이면 f − g = 2x² − 6x + 4 = 2(x − 1)(x − 2)이므로 x = 1, 2에서 만나고 교점은 (1, 2), (2, 3)입니다.","kw":[{"l":"교점에서 f(x)=g(x)","a":["교점에서"]},{"l":"f−g=0","a":["f−g=0","f−g"]},{"l":"(a−p)x²+(b−q)x+(c−r)=0","a":["a−p","b−q","c−r"]},{"l":"D>0 이면 두 점","a":["이면"]}]},"foll  설명하시오.","a":"인수분해한 결과를 다시 전개해 보아 처음의 이차식과 같아지는지 확인하면, 인수분해가 올바르게 되었는지 검산할 수 있습니다.","kw":[{"l":"인수분해한 결과를 다시 전개해 확인","a":["전개","확인"]}]}},{"main":{"id":"lk_FU_M23","cat":"수학","grade":"중2","q":"일차함수 y=ax+b의 그래프에서 a의 값이 그래프의 기울기와 같다는 것을 x의 증가량과 y의 증가량의 비율로 확인하는 과정을 설명하시오.","a":"x의 값이 x1에서 x2로 변할 때 y의 값은 각각 a×x1+b와 a×x2+b가 되므로, y의 증가량은 a×(x2-x1)이 되고, 이를 x의 증가량인 (x2-x1)으로 나누면 항상 a라는 값을 얻게 되어 기울기가 a임을 확인할 수 있습니다.","kw":[{"l":"y의 증가량이 a×(x의 증가량)이 됨","a":["a×","증가량"]},{"l":"나누면 항상 a가 됨","a":["항상 a"]}]},"follow":{"id":"lk_FU_M23F","cat":"수학","grade":"중2","q":"기울기가 일정하다는 성질을 이용하면 일차함수의 그래프가 왜 반드시 직선이 되는지 설명할 수 있습니다. 그 까닭을 설명하시오.","a":"그래프 위의 어느 두 점을 선택해도 x의 증가량에 대한 y의 증가량의 비율이 항상 같은 값 a로 일정하다는 것은, 그래프가 방향을 바꾸지 않고 일정한 기울기로 곧게 뻗어 나간다는 것을 의미하므로 일차함수의 그래프는 반드시 직선이 됩니다.","kw":[{"l":"기울기가 항상 일정함","a":["일정"]},{"l":"방향이 바뀌지 않고 곧게 뻗음(직선)","a":["곧게","직선"]}]}},{"main":{"id":"lk_FU_M24","cat":"수학","grade":"중3","q":"이차함수의 그래프가 좌우 대칭인 곡선이 되는 까닭을 식을 이용해 설명하시오.","a":"이차함수 y=ax제곱에서 x 대신 -x를 대입해도 (-x)의 제곱은 x의 제곱과 같으므로 y의 값이 똑같이 나오는데, 이는 축(y축)을 기준으로 좌우 대칭인 위치에 있는 두 x값이 항상 같은 y값을 가진다는 것을 의미하므로 그래프가 좌우 대칭이 됩니다.","kw":[{"l":"(-x)²=x²이므로 y값이 같음","a":["(-x)²","같음"]},{"l":"축을 기준으로 좌우 대칭","a":["좌우 대칭"]}]},"follow":{"id":"lk_FU_M24F","cat":"수학","grade":"중3","q":"이차함수 y=a(x-p)의 제곱+q의 그래프가 좌우 대칭이 되는 축은 y축이 아니라 무엇인지, 그 까닭과 함께 설명하시오.","a":"이 그래프는 y=ax제곱의 그래프를 x축의 방향으로 p만큼 평행이동한 것이므로, 대칭축도 함께 p만큼 이동하여 직선 x=p가 대칭축이 됩니다.","kw":[{"l":"x=p가 대칭축","a":["x=p"]},{"l":"그래프가 p만큼 평행이동했기 때문","a":["평행이동"]}]}},{"main":{"id":"lk_FU_M25","cat":"수학","grade":"중2","q":"일차함수의 그래프와 일차방정식의 그래프가 사실상 같은 것으로 다루어지는 까닭을 설명하시오.","a":"미지수가 2개인 일차방정식 ax+by+c=0을 y에 대해 정리하면 일차함수 y=-(a/b)x-(c/b)의 꼴이 되므로, 두 식은 표현 방식만 다를 뿐 나타내는 x와 y 사이의 관계는 완전히 같아서 그래프도 정확히 일치합니다.","kw":[{"l":"y에 대해 정리하면 일차함수 꼴이 됨","a":["y에 대해 정리"]},{"l":"같은 관계를 나타내 그래프가 일치","a":["그래프가 일치"]}]},"follow":{"id":"lk_FU_M25F","cat":"수학","grade":"중2","q":"일차방정식 x=3처럼 y가 포함되지 않은 방정식은 일차함수 y=ax+b의 꼴로 나타낼 수 없습니다. 그런데도 이 방정식의 그래프를 그릴 수 있는 까닭을 설명하시오.","a":"x=3은 y의 값에 관계없이 x좌표가 항상 3인 모든 점을 만족하는 방정식이므로, 함수는 아니지만 좌표평면 위에서 점 (3, 0)을 지나고 y축에 평행한 직선으로 나타낼 수 있습니다.","kw":[{"l":"x좌표가 항상 3인 점들의 모임","a":["항상 3"]},{"l":"y축에 평행한 직선","a":["y축에 평행"]}]}},{"main":{"id":"lk_FU_M26","cat":"수학","grade":"중1","q":"반비례 관계 y=a/x(a≠0)에서 x의 값이 2배, 3배가 될 때 y의 값이 어떻게 변하는지 식을 이용해 설명하시오.","a":"y=a/x에서 x가 2배가 되면 y=a/(2x)이므로 원래 y의 값의 1/2배가 되고, x가 3배가 되면 y는 원래 값의 1/3배가 됩니다. 이처럼 반비례 관계에서는 x가 커지는 배수만큼 y는 그 역수배로 작아집니다.","kw":[{"l":"x가 2배면 y는 1/2배","a":["1/2"]},{"l":"x가 커지는 배수의 역수배로 y가 작아짐","a":["역수배"]}]},"follow":{"id":"lk_FU_M26F","cat":"수학","grade":"중1","q":"정비례 관계 y=ax(a≠0)에서는 x의 값이 2배가 될 때 y의 값은 어떻게 변하는지, 반비례와 비교하여 설명하시오.","a":"정비례 관계에서는 x가 2배가 되면 y=a×(2x)이므로 y의 값도 그대로 2배가 되어, x가 커지는 배수만큼 y도 똑같이 커지는 반비례와는 반대되는 변화 양상을 보입니다.","kw":[{"l":"x가 2배면 y도 2배","a":["y도 2배"]},{"l":"반비례와 반대되는 변화","a":["반대"]}]}},{"main":{"id":"lk_FU_M27","cat":"수학","grade":"중2","q":"피타고라스 정리를 정사각형의 넓이를 이용해 증명하시오.","a":"직각을 낀 두 변이 a, b이고 빗변이 c인 직각삼각형 4개를 이용해, 한 변의 길이가 a+b인 큰 정사각형 안에 한 변의 길이가 c인 정사각형이 놓이도록 배치합니다. 큰 정사각형의 넓이는 (a+b)의 제곱이면서 동시에 네 직각삼각형의 넓이의 합(2ab)과 가운데 작은 정사각형의 넓이(c의 제곱)의 합과도 같으므로, (a+b)의 제곱=2ab+c의 제곱이 되고, 좌변을 전개해 정리하면 a의 제곱+b의 제곱=c의 제곱을 얻습니다.","kw":[{"l":"큰 정사각형의 넓이를 두 가지 방식으로 계산","a":["큰 정사각형","넓이"]},{"l":"(a+b)²=2ab+c²을 정리해 a²+b²=c² 도출","a":["2ab","c²"]}]},"follow":{"id":"lk_FU_M27F","cat":"수학","grade":"중2","q":"피타고라스 정리의 역, 즉 세 변의 길이가 a²+b²=c²을 만족하면 그 삼각형이 직각삼각형이 된다는 것은 왜 참인지 설명하시오.","a":"세 변의 길이가 a, b, c이고 a²+b²=c²을 만족하는 삼각형과, 직각을 낀 두 변이 a, b인 직각삼각형을 비교하면, 두 삼각형 모두 세 변의 길이가 각각 a, b, c로 같으므로 SSS 합동에 의해 두 삼각형은 합동입니다. 따라서 원래 삼각형의 a, b 사이의 각도 직각이어야 하므로 이 삼각형은 직각삼각형이 됩니다.","kw":[{"l":"직각삼각형과 세 변의 길이가 같아 SSS 합동","a":["SSS","합동"]},{"l":"대응하는 각도 직각이 됨","a":["직각"]}]}},{"main":{"id":"lk_FU_M28","cat":"수학","grade":"중2","q":"평행사변형의 두 대각선이 서로 다른 것을 이등분한다는 성질을 삼각형의 합동을 이용해 증명하시오.","a":"평행사변형 ABCD에서 두 대각선의 교점을 O라고 하면, 삼각형 OAB와 삼각형 OCD에서 AB와 CD의 길이가 같고, AB와 CD가 평행하므로 엇각인 각 OAB와 각 OCD, 각 OBA와 각 ODC의 크기가 각각 같습니다. 따라서 ASA 합동에 의해 두 삼각형은 합동이므로 대응변인 OA와 OC, OB와 OD의 길이가 각각 같아져 두 대각선은 서로를 이등분합니다.","kw":[{"l":"삼각형 O
