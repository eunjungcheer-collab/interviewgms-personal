<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>학생별 모의면접 마스터 · GMS학원 이은정 강사</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A3A3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --navy:#0F5257; --navy2:#0A3A3E; --gold:#b8902f; --gold-light:#e9d9a8;
  --paper:#eef6f6; --paper2:#e4f0f0; --card:#ffffff; --ink:#1b2230; --sub:#6b7280;
  --good:#2f7d5b; --good-bg:#e7f3ec; --bad:#b3432b; --bad-bg:#fbeae5; --line:#d3e3e3;
  --rec:#c0392b;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Noto Sans KR',sans-serif;color:var(--ink);
  background:
    radial-gradient(1200px 400px at 50% -10%, #1f6f75 0%, transparent 60%),
    linear-gradient(180deg,var(--navy2) 0%, var(--navy) 220px, var(--paper) 220px, var(--paper2) 100%);
  min-height:100vh;padding-bottom:50px;}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 60px;}
.hero{text-align:center;padding:34px 10px 26px;color:#fff;}
.hero .eyebrow{font-size:12px;letter-spacing:2px;color:var(--gold-light);font-weight:700;text-transform:uppercase;}
.hero h1{font-family:'Noto Serif KR',serif;font-size:26px;margin:8px 0 8px;font-weight:900;letter-spacing:-.5px;}
.hero p{font-size:13px;color:#cfe3e4;margin:0;}
.mic-badge{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2a7d83,var(--navy2));
  border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:22px;}
.card{background:var(--card);border-radius:18px;box-shadow:0 14px 34px rgba(20,20,40,.14);padding:22px 20px;margin-bottom:16px;border:1px solid var(--line);}
h2.card-title{font-family:'Noto Serif KR',serif;font-size:19px;margin:0 0 4px;color:var(--navy);font-weight:700;}
.card-sub{font-size:12.5px;color:var(--sub);margin:0 0 14px;}
label.field-label{display:block;font-size:13.5px;font-weight:700;margin:16px 0 8px;color:var(--ink);}
input[type=text],input[type=password]{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);font-size:15px;background:#fffdf8;font-family:inherit;box-sizing:border-box;}
.row2{min-width:0;}
.row2 input[type=text],.row2 input[type=password]{min-width:0;}
input[type=text]:focus,input[type=password]:focus{outline:2px solid var(--navy);}
.chip-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.chip{border:1.5px solid var(--line);border-radius:14px;padding:12px;text-align:center;cursor:pointer;background:#fffdf8;transition:.15s;}
.chip b{display:block;font-size:14px;}
.chip small{color:var(--sub);font-size:11px;}
.chip.active{border-color:var(--gold);background:#fbf3df;box-shadow:0 0 0 2px rgba(184,144,47,.18) inset;}
.opt-row{display:flex;gap:8px;flex-wrap:wrap;}
.opt-chip{flex:1;min-width:64px;text-align:center;border:1.5px solid var(--line);border-radius:12px;padding:10px 6px;font-size:13px;font-weight:700;cursor:pointer;background:#fffdf8;color:var(--sub);}
.opt-chip.active{border-color:var(--navy);background:#eef1f6;color:var(--navy);}
.toggle-row{display:flex;align-items:center;gap:8px;margin:14px 0 4px;font-size:13.5px;}
.toggle-row input{width:18px;height:18px;}
.mode-card{border:1.6px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;cursor:pointer;background:#fffdf8;}
.mode-card.active{border-color:var(--navy);background:#eef1f6;box-shadow:0 0 0 2px rgba(27,42,74,.12) inset;}
.mode-card.disabled{opacity:.5;cursor:not-allowed;}
.mode-card .mt{font-weight:800;font-size:15px;}
.mode-card .md{font-size:12px;color:var(--sub);margin-top:3px;line-height:1.5;}
.btn{display:block;width:100%;text-align:center;padding:15px;border-radius:14px;font-weight:800;font-size:15.5px;border:none;cursor:pointer;box-sizing:border-box;}
.btn-icon-del{background:none;border:none;cursor:pointer;font-size:15px;padding:2px 6px;border-radius:8px;opacity:0.7;}
.btn-icon-del:hover{opacity:1;background:#fbeaea;}
.btn-primary{background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;box-shadow:0 10px 20px rgba(15,24,48,.28);}
.btn-gold{background:linear-gradient(90deg,#c9a53c,var(--gold));color:#3a2c05;box-shadow:0 8px 16px rgba(184,144,47,.3);}
.btn-outline{background:#fff;border:1.6px solid var(--navy);color:var(--navy);}
.btn-ghost{background:#f0eee6;color:var(--ink);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.row2{display:flex;gap:10px;margin-top:10px;}
.row2 .btn{flex:1;}
.small-note{font-size:12px;color:var(--sub);text-align:center;margin-top:10px;line-height:1.6;}
.hidden{display:none !important;}

.progressbar{height:6px;border-radius:4px;background:#e2ddcb;overflow:hidden;margin-bottom:10px;}
.progressbar-inner{height:100%;background:linear-gradient(90deg,var(--gold),var(--navy));transition:width .3s ease;}
.meta-row{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--sub);margin-bottom:14px;}
.answer-timer{display:inline-block;background:#eef1f6;color:var(--navy);font-weight:800;font-size:13px;padding:8px 14px;border-radius:20px;margin-bottom:14px;}
.answer-timer.urgent{background:var(--bad-bg);color:var(--bad);}
.cat-tag{display:inline-block;background:var(--navy);color:#fff;font-weight:700;font-size:12px;padding:5px 12px;border-radius:20px;}
.name-tag{font-size:12.5px;color:var(--sub);}

.qcard{position:relative;background:linear-gradient(180deg,#fffdf8,#fff);border:1.5px solid var(--gold-light);border-radius:16px;padding:22px 20px 20px;margin-bottom:16px;}
.qtext.reading{background:linear-gradient(90deg,rgba(184,144,47,.18),rgba(184,144,47,.05));border-radius:8px;animation:ttsPulse 1.2s ease-in-out infinite;}
@keyframes ttsPulse{0%,100%{opacity:1;}50%{opacity:.72;}}
.prep-num{font-size:34px;font-weight:800;color:var(--navy);margin:6px 0 14px;}
.kb-mic-hint{display:none;text-align:center;background:linear-gradient(180deg,#fff8e6,#fff);border:2px solid var(--gold);border-radius:12px;padding:14px;margin-bottom:10px;animation:kbHintPulse 1s ease-in-out infinite;}
.kb-mic-hint.show{display:block;}
.kb-mic-hint .arrow{font-size:26px;}
@keyframes kbHintPulse{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
.qcard::before{content:"Q";position:absolute;top:-14px;left:18px;background:var(--gold);color:#3a2c05;font-family:'Noto Serif KR',serif;font-weight:900;font-size:14px;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,.15);}
.qtext{font-family:'Noto Serif KR',serif;font-size:19px;font-weight:700;line-height:1.55;margin:10px 0 0;color:var(--navy);}

.rec-zone{border:1.5px dashed var(--line);border-radius:16px;padding:18px;text-align:center;background:#fbf9f3;margin-bottom:14px;}
.mic-btn{width:74px;height:74px;border-radius:50%;border:none;cursor:pointer;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;
  background:radial-gradient(circle at 35% 30%,#2a7d83,var(--navy2));box-shadow:0 10px 22px rgba(15,24,48,.3);transition:.15s;}
.mic-btn.recording{background:radial-gradient(circle at 35% 30%,#e05b47,var(--rec));animation:pulse 1.4s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(192,57,43,.45);}70%{box-shadow:0 0 0 18px rgba(192,57,43,0);}100%{box-shadow:0 0 0 0 rgba(192,57,43,0);}}
.rec-status{font-size:12.5px;font-weight:700;color:var(--sub);min-height:18px;white-space:pre-line;}
.rec-status.on{color:var(--rec);}
.rec-status.err{color:var(--bad);}
.waveform{display:flex;align-items:flex-end;justify-content:center;gap:3px;height:22px;margin:8px 0 2px;}
.waveform span{width:3px;background:var(--rec);border-radius:2px;animation:wave 1s infinite ease-in-out;}
.waveform span:nth-child(1){animation-delay:0s;} .waveform span:nth-child(2){animation-delay:.1s;}
.waveform span:nth-child(3){animation-delay:.2s;} .waveform span:nth-child(4){animation-delay:.3s;}
.waveform span:nth-child(5){animation-delay:.4s;} .waveform span:nth-child(6){animation-delay:.5s;}
.waveform span:nth-child(7){animation-delay:.6s;}
@keyframes wave{0%,100%{height:5px;}50%{height:22px;}}

textarea.answer-box{width:100%;min-height:110px;padding:14px;border-radius:14px;border:1.5px solid var(--line);font-size:15px;font-family:inherit;background:#fff;resize:vertical;line-height:1.6;}
textarea.answer-box:focus{outline:2px solid var(--navy);}
.answer-label{display:flex;justify-content:space-between;align-items:center;margin:14px 0 6px;}
.answer-label span{font-size:13.5px;font-weight:700;}
.char-count{font-size:11.5px;color:var(--sub);}

.giveup{display:block;text-align:center;color:var(--sub);font-size:12.5px;margin-top:14px;text-decoration:underline;cursor:pointer;}

.score-wrap{text-align:center;margin:6px 0 4px;}
.score-ring{width:150px;height:150px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative;}
.score-num{font-family:'Noto Serif KR',serif;font-size:44px;font-weight:900;line-height:1;}
.score-max{font-size:12px;color:var(--sub);margin-top:2px;}
.tier-label{text-align:center;font-weight:800;font-size:16px;border-radius:14px;padding:12px;margin:6px 0 16px;}
.tier-perfect{background:linear-gradient(135deg,#ffe9a8,#e9c65e);color:#5a4200;}
.tier-good{background:var(--good-bg);color:var(--good);}
.tier-mid{background:#fdf2e0;color:#a8631a;}
.tier-low{background:var(--bad-bg);color:var(--bad);}

.kw-section{margin-top:6px;}
.kw-title{font-size:13.5px;font-weight:700;margin:14px 0 8px;color:var(--ink);}
.kw-grid{display:flex;flex-wrap:wrap;gap:8px;}
.kw-chip{border-radius:20px;padding:7px 13px;font-size:12.5px;font-weight:700;}
.kw-chip.ok{background:var(--good-bg);color:var(--good);border:1px solid #bfe3cd;}
.kw-chip.miss{background:var(--bad-bg);color:var(--bad);border:1px solid #f2c9bd;}

.ans-box{border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.65;margin:10px 0;}
.ans-box.mine{background:#eef1f6;color:var(--navy);}
.ans-box.model{background:#fbf3df;color:#5a4200;}
.ans-box b{display:block;margin-bottom:6px;font-size:13px;letter-spacing:.3px;}

.result-list{margin-top:4px;}
.result-item{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:12px;border:1px solid var(--line);margin-bottom:8px;background:#fffdf8;}
.result-item .ri-q{font-size:13px;flex:1;padding-right:10px;line-height:1.4;}
.result-item .ri-score{font-weight:900;font-size:15px;min-width:52px;text-align:right;}
.avg-big{text-align:center;font-family:'Noto Serif KR',serif;font-size:52px;font-weight:900;color:var(--navy);margin:4px 0 0;}
.avg-sub{text-align:center;color:var(--sub);font-size:13px;margin-bottom:16px;}

.warnbox{background:#fdf2e0;border-radius:12px;padding:12px 14px;font-size:12.5px;color:#7a5a1a;margin-bottom:14px;line-height:1.65;white-space:pre-line;}
.infobox{background:#eef1f6;border-radius:12px;padding:12px 14px;font-size:12.5px;color:var(--navy);margin-bottom:14px;line-height:1.65;white-space:pre-line;}
.footer-copy{text-align:center;color:#9aa0ac;font-size:11.5px;margin-top:22px;}
.hist-item{border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:9px;background:#fffdf8;cursor:pointer;}
.hist-top{display:flex;justify-content:space-between;font-weight:700;font-size:13.5px;}
.hist-sub{font-size:11.5px;color:var(--sub);margin-top:3px;}

.wrongitem{border:1.5px solid var(--line);border-radius:14px;padding:14px 15px;margin-bottom:10px;background:#fffdf8;}
.wrongitem .wq{font-weight:700;margin-bottom:6px;font-size:14px;color:var(--navy);}
.wrongitem .wmeta{font-size:11px;color:var(--sub);margin-bottom:8px;}
.wrongitem .wa{color:var(--bad);font-size:13px;margin-bottom:4px;}
.wrongitem .wc{color:var(--good);font-size:13px;}

.tabbar{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:14px;overflow-x:auto;}
.tabbtn{flex:1;text-align:center;padding:10px 4px;font-size:13px;font-weight:700;color:var(--sub);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;}
.tabbtn.active{color:var(--navy);border-color:var(--gold);}
table{width:100%;border-collapse:collapse;font-size:13px;}
.scrollable-table{overflow-x:auto;}
.sticky-name-table th:first-child,.sticky-name-table td:first-child{position:sticky;left:0;z-index:2;box-shadow:2px 0 4px rgba(0,0,0,.06);}
.sticky-name-table th:first-child{background:#fbf9f3;}
.sticky-name-table td:first-child{background:#fff;}
.sticky-name-table tr.clickable:active td:first-child{background:#f3f0e6;}
.scrollable-table table{width:auto;min-width:100%;}
.scrollable-table th,.scrollable-table td{white-space:nowrap;padding-left:10px;padding-right:10px;}
th,td{padding:9px 6px;text-align:center;border-bottom:1px solid var(--line);}
th{color:var(--sub);font-weight:700;background:#fbf9f3;}
tr.clickable{cursor:pointer;}
tr.clickable:active{background:#f4eeee;}

.modal-overlay{position:fixed;inset:0;background:rgba(10,15,30,.55);display:flex;align-items:center;justify-content:center;z-index:1200;padding:24px;}
.modal-overlay.hidden{display:none !important;}
.modal-box{background:#fff;border-radius:20px;padding:24px 20px;max-width:340px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.3);}
.modal-box p{font-size:14.5px;line-height:1.6;margin:0 0 18px;text-align:center;color:var(--ink);white-space:pre-line;}@media print{
  body *{ visibility:hidden; }
  #printArea, #printArea *{ visibility:visible; }
  #printArea{ position:absolute; left:0; top:0; width:100%; padding:20px; }
  #printArea .print-item{ break-inside:avoid; page-break-inside:avoid; }
}
.print-item{ break-inside:avoid; page-break-inside:avoid; border:1px solid #ccc;border-radius:6px;padding:10px 12px;margin-bottom:8px; }
</style>
</head>
<body>
<div class="hero">
  <div class="mic-badge">🎙️</div>
  <div class="eyebrow">GMS학원 이은정 강사 · 자사·특목·과고반 대비</div>
  <h1>학생별 모의면접 마스터</h1>
  <p>질문을 읽고 실제 면접처럼 목소리로 답해보세요</p>
</div>
<div class="wrap" id="app"></div>
<div id="printArea" class="hidden"></div>
<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal-box">
    <p id="modalMsg"></p>
    <div class="row2" id="modalBtns"></div>
  </div>
</div>

<script>
/* ===================== 문제 은행 ===================== */
/* ===== 학생별 문제 은행 (로그인한 이름에 따라 자동 전환) ===== */
const STUDENT_BANKS = {"강승준":{"Q":[{"id":"kj_A1","cat":"자소서","grade":"중3","q":"스포츠과학에 관심을 갖게 된 계기는 무엇이고, \"부상을 줄이고 운동수행능력을 높이는 요인\"에 대해 무엇을 알게 되었나요?","a":"어릴 적 축구선수로 뛰다가 부상을 겪으면서 \"같은 훈련을 해도 왜 어떤 선수는 다치고 어떤 선수는 기록이 오를까?\"라는 질문이 생겼습니다. 감으로 하는 훈련이 아니라 수치로 요인을 찾으면 부상은 줄이고 성적은 올릴 수 있겠다고 생각해서 스포츠과학에 관심을 갖게 되었습니다. 그 질문을 따라 찾아본 요인 중에서 가장 구체적으로 알게 된 것이 수면입니다. (부상의 종류와 그때 느낀 점은 「본인이 겪은 대로」 짧게 말하세요. 부상 이야기를 길게 하기보다 거기서 어떤 질문이 생겼는지가 핵심입니다.)","kw":[{"l":"축구선수","a":["축구선수"]},{"l":"부상","a":["부상"]},{"l":"\"왜 어떤 선수는 다치나\"","a":["선수는","다치나","어떤"]},{"l":"수치로 요인 찾기","a":["수치로","요인","찾기"]},{"l":"수면","a":["수면"]}]},{"id":"kj_A2","cat":"자소서","grade":"중3","q":"수면과 운동수행능력의 관계를 어떻게 알아보았나요? 직접 측정했나요, 자료를 조사했나요?","a":"(「본인이 한 방식」을 정확히 말하세요. 직접 측정하지 않고 자료를 조사한 것이라면 그대로 말하는 것이 낫습니다.) 저는 수면 시간과 수면의 질이 피로 회복, 근육 회복, 신체 기능 유지에 어떤 역할을 하는지 조사했습니다. 충분히 자면 운동 중에 손상된 근육이 회복되고 신체 기능이 유지된다는 점을 알게 되었고, 그래서 스포츠에서 수면 같은 변인도 숫자로 분석해야 한다고 느꼈습니다.","kw":[{"l":"수면 시간","a":["수면 시간","수면","시간"]},{"l":"피로 회복","a":["피로 회복","피로","회복"]},{"l":"근육 회복","a":["근육 회복","근육","회복"]},{"l":"신체 기능 유지","a":["신체 기능 유지","신체","기능","유지"]},{"l":"변인을 정량적으로","a":["정량적으로","변인을"]}]},{"id":"kj_A3","cat":"자소서","grade":"중3","q":"피타고라스 승률이 무엇인가요? 왜 \"피타고라스\"라는 이름이 붙었나요?","a":"팀의 득점 RS와 실점 RA로 승률을 추정하는 식입니다. 승률 ≈ RS²/(RS²+RA²)입니다. 예를 들어 한 시즌에 700점을 내고 600점을 잃었다면 700²/(700²+600²)=490000/850000으로 약 0.576, 즉 승률 약 57.6%가 예상됩니다. 이름은 식이 직각삼각형의 a²+b²=c² 꼴과 비슷해서 붙었을 뿐, 피타고라스 정리와 수학적 관계가 있는 것은 아닙니다. 야구 통계학자 빌 제임스가 제안했습니다.","kw":[{"l":"RS²/(RS²+RA²)","a":["RS²","RA²"]},{"l":"득점·실점","a":["득점·실점","득점","실점"]},{"l":"700:600 → 약 57.6%","a":["700","600","57"]},{"l":"이름은 꼴이 비슷해서","a":["비슷해서","이름은","꼴이"]},{"l":"빌 제임스","a":["빌 제임스","제임스"]}]},{"id":"kj_A4","cat":"자소서","grade":"중3","q":"타율을 수학적으로 어떻게 분석했나요? 타율만으로 타자의 능력을 판단할 수 있을까요?","a":"타율은 안타 수를 타수로 나눈 값입니다. (「본인이 분석한 방법」을 말하세요. 예: 선수 몇 명의 시즌 기록을 비교한 것.) 하지만 타율만으로는 부족합니다. 볼넷은 타수에 들어가지 않아서 출루 능력이 반영되지 않고, 단타와 홈런이 똑같이 안타 1개로 계산됩니다. 그래서 출루율과 장타율을 더한 OPS 같은 지표를 함께 봅니다.","kw":[{"l":"타율 = 안타 ÷ 타수","a":["타율","안타","타수"]},{"l":"볼넷 제외","a":["볼넷 제외","볼넷","제외"]},{"l":"단타와 홈런 같은 1","a":["단타와","홈런","같은"]},{"l":"출루율, 장타율, OPS","a":["출루율","장타율","OPS"]}]},{"id":"kj_A5","cat":"자소서","grade":"중3","q":"세종과학고에서 심화수학과 심화물리를 배워 스포츠과학에 어떻게 활용하고 싶은가요?","a":"수학에서는 확률과 통계로 부상 위험 요인을 분석하거나 승률 모델의 지수를 데이터로 추정해 보고 싶습니다. 물리에서는 운동량, 회전운동, 유체 속에서 받는 힘을 배워서 공의 움직임을 분석하고 싶습니다. 특히 자소서 2번의 마그누스 효과 탐구를 이어서, 프리킥 영상에서 공의 회전수와 휘어지는 정도의 관계를 분석해 보고 싶습니다. (학교의 정확한 프로그램 이름과 내용은 「본인이 조사한 것」으로 바꿔 말하세요.)","kw":[{"l":"확률·통계 → 부상 요인, 승률 모델","a":["확률","통계","부상"]},{"l":"물리 → 회전운동, 유체","a":["회전운동","물리","유체"]},{"l":"마그누스 탐구 연결","a":["마그누스","탐구","연결"]}]},{"id":"kj_B1","cat":"자소서","grade":"중3","q":"부상 위험 요인을 알아내려면 어떤 자료를 모아서 어떻게 분석하겠나요?","a":"선수들의 주간 훈련량, 수면 시간, 부상 여부를 일정 기간 기록해서 부상이 난 주와 나지 않은 주를 비교하겠습니다. 나이와 포지션 같은 다른 변인은 같은 조건끼리 묶어서 비교하거나 따로 고려해야 합니다. 선수 수가 적으면 결론을 강하게 말할 수 없고, 개인 기록을 쓰므로 동의와 개인정보 보호도 필요합니다.","kw":[{"l":"훈련량","a":["훈련량"]},{"l":"수면","a":["수면"]},{"l":"부상 기록","a":["부상 기록","부상","기록"]},{"l":"혼동변수","a":["혼동변수"]},{"l":"표본 크기","a":["표본 크기","표본","크기"]},{"l":"동의","a":["동의"]}]},{"id":"kj_B2","cat":"자소서","grade":"중3","q":"수면이 근육 회복에 왜 중요한가요?","a":"깊은 잠을 잘 때 성장호르몬 분비가 늘어나고, 이것이 조직의 회복과 근육 단백질 합성에 관여한다고 알려져 있습니다. 반대로 잠이 부족하면 회복이 늦어지고 반응 속도와 집중력이 떨어질 수 있습니다. 제가 직접 확인한 것이 아니라 자료로 아는 내용이라는 점도 함께 말하겠습니다.","kw":[{"l":"깊은 잠","a":["깊은 잠","깊은"]},{"l":"성장호르몬","a":["성장호르몬"]},{"l":"조직 회복","a":["조직 회복","조직","회복"]},{"l":"단백질 합성","a":["단백질 합성","단백질","합성"]},{"l":"자료로 아는 내용","a":["자료로","아는","내용"]}]},{"id":"kj_C1","cat":"자소서","grade":"중3","q":"피타고라스 승률의 지수를 실제 시즌 기록에서 어떻게 구할 수 있을까요?","a":"승률 W/(W+L) = RS^k/(RS^k+RA^k)에서 W/L = (RS/RA)^k가 됩니다. 양변에 로그를 취하면 log(W/L) = k·log(RS/RA)이므로 여러 팀의 (log(RS/RA), log(W/L)) 점을 찍어 원점을 지나는 직선의 기울기를 구하면 그것이 k입니다. 야구에서는 약 1.8~2가 알려져 있습니다.","kw":[{"l":"W/L=(RS/RA)^k","a":["RS","RA","^k"]},{"l":"로그 → 직선","a":["로그 → 직선","로그","직선"]},{"l":"기울기 = 지수 k","a":["기울기","지수"]}],"level":"advanced"},{"id":"kj_A6","cat":"자소서","grade":"중3","q":"마그누스 효과 탐구를 처음부터 끝까지 설명해 주세요.","a":"축구의 프리킥과 야구의 변화구가 휘는 원리가 궁금해서 마그누스 효과를 직접 확인해 보려고 했습니다. 투명한 수조에 물을 채우고 물감을 떨어뜨려 흐름이 보이게 한 뒤, 회전이 없는 탁구공과 회전시킨 탁구공을 움직여서 물감의 흐름을 비교했습니다. 처음에는 부력과 물의 저항 때문에 궤적 변화가 잘 보이지 않았고, 손으로 던지면 세기가 매번 달랐습니다. 그래서 고무줄 발사 장치를 만들어 같은 조건에서 여러 번 실험했습니다. 그 결과 회전이 없을 때는 물감이 직선에 가깝게 흐르고, 회전이 있을 때는 한쪽으로 휘었으며 회전을 빠르게 할수록 더 뚜렷했습니다. 예상과 다른 결과가 나왔을 때 원인을 분석하고 방법을 고치는 것이 중요하다는 것을 배웠습니다.","kw":[{"l":"프리킥·변화구 궁금증","a":["프리킥","변화구","궁금증"]},{"l":"수조+물감+탁구공","a":["탁구공","수조","물감"]},{"l":"부력·저항 문제","a":["부력·저항 문제","부력","저항","문제"]},{"l":"고무줄 발사 장치","a":["고무줄","발사","장치"]},{"l":"회전 시 휘어짐","a":["회전 시 휘어짐","휘어짐","회전"]}]},{"id":"kj_A7","cat":"자소서","grade":"중3","q":"마그누스 효과란 무엇이고, 회전하는 공은 왜 휘나요?","a":"회전하는 공이 공기나 물 같은 유체 속을 움직일 때 진행 방향에 수직인 힘을 받는 현상입니다. 공 표면이 유체의 흐름과 같은 방향으로 움직이는 쪽은 유체가 빨라져서 압력이 낮아지고, 반대쪽은 느려져서 압력이 높아지므로 공은 압력이 낮은 쪽으로 힘을 받습니다. 다르게 말하면 공이 주변 유체를 한쪽으로 꺾어 보내기 때문에 그 반작용으로 반대쪽 힘을 받는 것입니다.","kw":[{"l":"회전 + 유체 속 이동","a":["회전","유체","이동"]},{"l":"진행 방향에 수직인 힘","a":["방향에","수직인","진행"]},{"l":"빠른 쪽 압력↓","a":["빠른 쪽 압력↓","압력↓","빠른"]},{"l":"유체를 꺾음 → 반작용","a":["유체를","반작용","꺾음"]}]},{"id":"kj_A8","cat":"자소서","grade":"중3","q":"왜 수조와 물감, 탁구공을 선택했나요? 물과 공기는 다른데 같은 효과가 나타나나요?","a":"공기의 흐름은 눈에 보이지 않기 때문에, 물에서 물감을 떨어뜨리면 흐름이 눈에 보인다는 점을 이용했습니다. 탁구공은 가볍고 표면이 매끈하며 구하기 쉬워서 썼습니다. 마그누스 효과는 공기뿐 아니라 물을 포함한 모든 유체에서 일어나는 현상입니다. 다만 물은 공기보다 밀도와 점성이 훨씬 커서 같은 효과가 같은 크기로 나타나지는 않습니다.","kw":[{"l":"흐름 시각화","a":["흐름 시각화","시각화","흐름"]},{"l":"가볍고 매끈한 탁구공","a":["가볍고","매끈한","탁구공"]},{"l":"모든 유체에서 성립","a":["유체에서","모든","성립"]},{"l":"밀도·점성 차이","a":["밀도·점성 차이","밀도","점성","차이"]}]},{"id":"kj_A9","cat":"자소서","grade":"중3","q":"수조에서 예상한 궤적 변화가 뚜렷하지 않았던 이유는 무엇이라고 생각하나요?","a":"탁구공은 가벼워서 물속에서 부력이 중력보다 훨씬 큽니다. 계산해 보면 지름 4 cm, 질량 2.7 g인 탁구공의 부력은 약 0.33 N이고 무게는 약 0.026 N입니다. 그래서 공은 위로 뜨려는 힘이 크고, 물의 저항 때문에 속도도 빨리 줄어들어서 회전에 의한 옆 방향 힘이 잘 드러나지 않았다고 생각합니다. (위 숫자는 이론값 추정이고 「본인이 측정한 값」이 아닙니다.)","kw":[{"l":"부력 ≫ 무게","a":["부력 ≫ 무게","부력","무게"]},{"l":"약 0.33 N vs 0.026 N","a":["026","33","vs"]},{"l":"물의 큰 저항","a":["물의 큰 저항","물의","저항"]},{"l":"속도 빨리 감소","a":["속도 빨리 감소","속도","빨리","감소"]}]},{"id":"kj_A10","cat":"자소서","grade":"중3","q":"고무줄 발사 장치로 어떻게 같은 세기로 발사했고, 회전 속도는 어떻게 조절하고 확인했나요?","a":"고무줄을 매번 같은 길이만큼 당기면 저장되는 탄성에너지가 같으므로 비슷한 속도로 발사할 수 있습니다. (이 부분은 「본인이 한 방법」을 말하세요.) 속도가 실제로 같았는지는 「본인이 확인한 방법, 예: 영상에서 일정 거리를 지나는 시간」으로 확인했습니다. 회전은 고무줄이 만드는 것이 아니라서 발사 속도와 회전을 따로 다뤄야 했고, 회전 속도를 올렸다는 것은 「본인이 한 방법」으로 구분했습니다. 회전수를 수치로 재지는 못해서 회전이 더 빠르다는 것은 정성적으로만 말할 수 있습니다.","kw":[{"l":"같은 길이 당김 → 같은 탄성에너지","a":["탄성에너지","같은","길이"]},{"l":"속도 확인 방법","a":["속도 확인 방법","속도","확인","방법"]},{"l":"회전은 별도","a":["회전은 별도","회전은","별도"]},{"l":"회전수는 정성적","a":["회전수는 정성적","회전수는","정성적"]}]},{"id":"kj_A11","cat":"자소서","grade":"중3","q":"이 실험으로 마그누스 효과를 \"확인했다\"고 말할 수 있나요? 한계와 개선점은 무엇인가요?","a":"공의 회전에 따라 주변 물감의 흐름이 달라지는 경향은 확인했습니다. 하지만 공이 받는 힘의 크기를 측정하지는 못했고, 속도와 회전수를 수치로 통제하지 못했으며 반복 횟수도 적었습니다. 그래서 \"원리와 연결해서 이해했다\"가 정확한 표현이고 증명했다고는 말하기 어렵습니다. 개선하려면 스마트폰 슬로모션으로 궤적을 촬영해 각도와 이동 거리를 재고, 회전수를 바꿔 여러 번 반복해서 그래프로 그리겠습니다.","kw":[{"l":"경향은 확인","a":["경향은 확인","경향은","확인"]},{"l":"힘의 크기는 미측정","a":["크기는","미측정","힘의"]},{"l":"속도·회전 통제 부족","a":["속도","회전","통제"]},{"l":"영상 분석 + 반복 + 그래프","a":["그래프","영상","분석"]}]},{"id":"kj_B3","cat":"자소서","grade":"중3","q":"프리킥이나 야구 변화구는 모두 마그누스 효과 때문인가요?","a":"회전이 있는 공은 대부분 마그누스 효과의 영향이 큽니다. 하지만 모두는 아닙니다. 너클볼이나 무회전 킥처럼 거의 회전하지 않는 공도 불규칙하게 흔들리는데, 이는 공 표면의 솔기나 꿰맨 선 때문에 뒤쪽 공기 흐름이 불안정해지기 때문이라고 알려져 있습니다. 그래서 휘는 원인은 회전 때문인지 흐름의 불안정 때문인지 구분해서 봐야 합니다.","kw":[{"l":"회전 → 마그누스","a":["마그누스","회전"]},{"l":"무회전(너클볼) → 솔기, 후류 불안정","a":["무회전","너클볼","불안정"]},{"l":"원인 구분","a":["원인 구분","원인","구분"]}]},{"id":"kj_B4","cat":"자소서","grade":"중3","q":"\"흐르는 속도가 빠른 쪽은 압력이 낮다\"는 설명만으로 충분한가요?","a":"충분하지 않다고 알려져 있습니다. 압력 설명은 결과를 쉽게 설명하는 단순화이고, 실제로는 공 표면 근처의 얇은 층(경계층)이 점성 때문에 공의 회전과 함께 끌려가고, 공 뒤쪽의 흐름이 한쪽으로 꺾이면서 반작용으로 힘이 생깁니다. 중학교 수준에서는 압력 설명과 운동량 설명을 함께 말하고 한계를 인정하는 것이 좋습니다.","kw":[{"l":"압력 설명 = 단순화","a":["단순화","압력","설명"]},{"l":"경계층이 끌려감","a":["경계층이 끌려감","경계층이","끌려감"]},{"l":"뒤쪽 흐름이 꺾임 → 반작용","a":["흐름이","반작용","뒤쪽"]}]},{"id":"kj_B5","cat":"자소서","grade":"중3","q":"스마트폰만으로 이 실험을 정량적으로 개선한다면 어떻게 하겠나요?","a":"슬로모션으로 공의 궤적을 촬영하고, 배경에 격자를 두어 위치를 읽겠습니다. 프레임 사이의 이동거리로 속도를 구하고, 공에 표시한 선으로 회전수를 세겠습니다. 회전수를 바꿔 가며 옆으로 휜 거리를 여러 번 재서 평균과 오차를 구하고 그래프로 그려 관계를 확인합니다. 영상의 해상도와 프레임 수가 오차의 한계입니다.","kw":[{"l":"슬로모션","a":["슬로모션"]},{"l":"격자 배경","a":["격자 배경","격자","배경"]},{"l":"속도, 회전수 측정","a":["회전수","속도","측정"]},{"l":"반복·평균·오차","a":["반복·평균·오차","반복","평균","오차"]},{"l":"그래프","a":["그래프"]}]},{"id":"kj_C2","cat":"자소서","grade":"중3","q":"물속의 탁구공과 공기 중의 축구공을 비교하려면 무엇을 맞춰야 하나요? (레이놀즈 수)","a":"레이놀즈 수 Re = ρvD/μ(밀도, 속도, 지름, 점성계수)가 비슷해야 흐름의 성질이 비슷해집니다. 물에서 지름 4 cm인 공이 1 m/s로 움직이면 Re ≈ 1000×1×0.04/0.001 = 4×10⁴입니다. 공기(밀도 1.2, 점성계수 1.8×10⁻⁵)에서 같은 크기의 공이 약 12~20 m/s로 움직일 때 Re ≈ 3~5×10⁴으로 비슷합니다. 거기에 회전비 ωR/v도 맞추면 이론적으로 물에서의 실험이 공기 중의 현상을 모형으로 보여줄 수 있습니다. (계산은 어림값입니다.)","kw":[{"l":"Re=ρvD/μ","a":["Re=ρvD/μ","ρvD","Re"]},{"l":"물 1 m/s ≈ 4×10⁴","a":["4×10⁴"]},{"l":"공기 12~20 m/s ≈ 3~5×10⁴","a":["5×10⁴","공기","12"]},{"l":"회전비 ωR/v","a":["회전비 ωR/v","회전비","ωR"]}],"level":"advanced"},{"id":"kj_C3","cat":"자소서","grade":"중3","q":"물속에서 탁구공의 부력과 마그누스 힘은 어느 정도 크기인가요?","a":"부력은 약 0.33 N입니다. 마그누스 힘은 F ≈ ½ρAC_L v²로 어림할 수 있는데, 단면적 A=π(0.02)²≈1.26×10⁻³ m², 속도 1 m/s, 양력계수 C_L=0.1~0.3(제가 가정한 값)이면 약 0.06~0.19 N입니다. 부력의 약 20~60% 수준입니다. 부력보다 작지만 무시할 정도는 아니어서, 궤적은 부력이 크게 좌우하고 마그누스 힘은 그 위에 얹히는 작은 변화로 나타난다고 어림됩니다. 양력계수는 가정이라 정확한 값은 아닙니다.","kw":[{"l":"부력 0.33 N","a":["부력","33"]},{"l":"F≈½ρAC_L v²","a":["F≈½ρAC_L","v²"]},{"l":"0.06~0.19 N(가정)","a":["06","19","가정"]},{"l":"부력이 더 큼","a":["부력이 더 큼","부력이"]}],"level":"advanced"},{"id":"kj_C4","cat":"자소서","grade":"중3","q":"공기 중에서 어떤 속도에서는 마그누스 방향이 반대가 되기도 한다는데, 왜 그런가요?","a":"공의 속도에 따라 공 뒤쪽에서 흐름이 떨어지는 지점이 갑자기 바뀌는 구간이 있어서, 그 구간에서는 휘는 방향이 반대로 된다는 연구가 알려져 있습니다. 제가 직접 확인한 내용이 아니라 알려진 내용이라는 점을 말하겠습니다.","kw":[{"l":"흐름이 떨어지는 지점 변화","a":["떨어지는","흐름이","지점"]},{"l":"어떤 속도 구간","a":["어떤 속도 구간","어떤","속도","구간"]},{"l":"방향 반대 가능","a":["방향 반대 가능","방향","반대","가능"]},{"l":"알려진 연구","a":["알려진 연구","알려진","연구"]}],"level":"advanced"},{"id":"kj_A12","cat":"자소서","grade":"중3","q":"선거 방식에 따라 결과가 어떻게 달라지는지 탐구한 과정을 처음부터 끝까지 설명해 주세요.","a":"뉴스에서 선거 결과와 공정성에 대한 이야기를 보다가, 득표 수만이 아니라 계산 방식에 따라 결과가 달라질 수 있다는 점이 궁금했습니다. 그래서 학생 45명에게 한식·중식·일식·양식의 선호 순위를 조사하고, 같은 자료에 단순 다수제, 순차적 탈락제, 가중치 점수제, 비교 우위제를 적용해서 결과를 비교했습니다. 같은 자료인데 방식에 따라 결과가 달라지는 것을 보고 \"어떤 결과가 더 공정한가?\"라는 새로운 질문이 생겼습니다. 이 과정에서 큰 값과 작은 값을 어떻게 대응시키느냐에 따라 합이 달라지는 배열 부등식과 연결될 수 있다는 것을 알게 되어 추가로 탐구했습니다.","kw":[{"l":"뉴스 → 공정성 궁금증","a":["공정성","궁금증","뉴스"]},{"l":"45명 순위 조사","a":["45명","순위","조사"]},{"l":"4가지 방식 비교","a":["4가지","방식","비교"]},{"l":"결과가 다름","a":["결과가 다름","결과가","다름"]},{"l":"\"어느 결과가 공정한가\" → 배열 부등식","a":["공정한가","결과가","부등식"]}]},{"id":"kj_A13","cat":"자소서","grade":"중3","q":"단순 다수제, 순차적 탈락제, 가중치 점수제, 비교 우위제는 각각 어떻게 결과를 정하나요?","a":"단순 다수제는 1순위 표가 가장 많은 후보가 이깁니다. 순차적 탈락제는 1순위 표가 가장 적은 후보를 탈락시키고 그 표를 다음 순위 후보에게 넘기는 과정을 과반이 나올 때까지 반복합니다. 가중치 점수제는 1순위에 3점, 2순위에 2점, 3순위에 1점, 4순위에 0점처럼 점수를 주어 합이 가장 큰 후보가 이깁니다. 비교 우위제는 후보를 둘씩 맞붙여서 더 많은 표를 받은 쪽이 이기게 하고, 모든 후보를 이기는 후보가 있으면 그 후보가 승자입니다.","kw":[{"l":"다수제=1순위 최다","a":["다수제","1순위","최다"]},{"l":"순차 탈락=최하위 탈락 후 표 이동","a":["최하위","순차","탈락"]},{"l":"점수제=3·2·1·0 합","a":["점수제"]},{"l":"비교 우위=일대일 대결","a":["일대일","비교","우위"]}]},{"id":"kj_A14","cat":"자소서","grade":"중3","q":"같은 자료로 방식마다 결과가 어떻게 달랐나요? 구체적으로 계산해 보여 주세요.","a":"(「본인의 실제 조사 결과」로 바꿔 말하세요. 아래는 이해를 돕기 위한 가상 예시입니다.) 45명이 이렇게 답했다고 합시다. 19명은 한식>중식>일식>양식, 12명은 일식>양식>중식>한식, 10명은 양식>일식>중식>한식, 4명은 중식>양식>한식>일식입니다. 단순 다수제는 1순위가 19표인 한식이 이깁니다. 순차적 탈락제는 1순위가 4표인 중식이 먼저 탈락해 그 표가 양식으로 가서 양식 14표가 되고, 다음에 12표인 일식이 탈락하면 일식을 1순위로 한 표가 양식으로 가서 양식이 26표가 되어 과반(23표)을 넘으므로 양식이 이깁니다. 가중치 점수제는 한식 61점, 중식 72점, 일식 75점, 양식 62점이어서 일식이 이깁니다(총점은 항상 45×6=270점). 비교 우위제는 중식이 한식을 26:19, 일식을 23:22, 양식을 23:22로 이겨서 중식이 이깁니다. 같은 자료로 네 방식이 서로 다른 후보를 뽑았습니다.","kw":[{"l":"다수제 → 한식","a":["다수제 → 한식","다수제","한식"]},{"l":"순차 탈락 → 양식(26표)","a":["26표","순차","탈락"]},{"l":"점수제 → 일식(75점)","a":["점수제","75점","일식"]},{"l":"비교 우위 → 중식","a":["비교","우위","중식"]},{"l":"총점 270","a":["총점 270","270","총점"]}]},{"id":"kj_A15","cat":"자소서","grade":"중3","q":"가중치를 3·2·1점으로 한 이유는 무엇인가요? 다른 가중치를 쓰면 결과가 달라지나요?","a":"순위가 높을수록 점수를 더 주되 계산이 간단하도록 3·2·1·0으로 했습니다. 모든 응답자가 모든 후보의 순위를 매겼다면 4·3·2·1처럼 모든 가중치에 같은 수를 더해도 후보 사이의 점수 차는 변하지 않아서 순위는 같습니다. 하지만 간격을 바꾸면 달라질 수 있습니다. 위 가상 예시에서 가중치를 5·2·1·0으로 바꾸면 한식 99점, 중식 80점, 일식 99점, 양식 82점이 되어 한식과 일식이 동점이 됩니다. 가중치 선택 자체가 결과에 영향을 주는 것이 가중치 점수제의 약점입니다.","kw":[{"l":"3·2·1·0","a":["3·2·1·0"]},{"l":"모든 가중치에 같은 수를 더해도 순위 같음","a":["가중치에","더해도","모든"]},{"l":"간격이 바뀌면 달라짐","a":["간격이","바뀌면","달라짐"]},{"l":"5·2·1·0 → 한식=일식 99점","a":["99점","한식","일식"]}]},{"id":"kj_A16","cat":"자소서","grade":"중3","q":"어떤 결과를 더 공정하다고 판단할 수 있을까요? 이 질문에 어떻게 답했나요?","a":"정답이 하나로 정해져 있지 않고, 어떤 기준으로 공정성을 볼지를 먼저 정해야 한다고 생각합니다. 예를 들어 과반의 지지를 받은 후보가 이겨야 한다는 기준, 다른 모든 후보와 일대일로 이기는 후보가 이겨야 한다는 기준, 선호의 강도도 반영해야 한다는 기준이 있습니다. 단순 다수제는 1순위가 19표(약 42%)인 한식도 이길 수 있어서 과반 지지가 아닌 후보가 뽑힐 수 있고, 비교 우위제는 일대일에서 모두 이기는 후보가 없을 수도 있습니다. 각 방식이 어떤 기준은 만족하고 어떤 기준은 어긴다는 것을 알게 되었습니다. (「본인이 내린 결론」이 있으면 이어서 말하세요.)","kw":[{"l":"공정성 기준을 먼저 정함","a":["공정성","기준을","먼저"]},{"l":"과반 기준","a":["과반 기준","과반","기준"]},{"l":"일대일 우위 기준","a":["일대일","우위","기준"]},{"l":"선호 강도","a":["선호 강도","선호","강도"]},{"l":"방식마다 장단점","a":["방식마다 장단점","방식마다","장단점"]}]},{"id":"kj_A17","cat":"자소서","grade":"중3","q":"배열 부등식이 무엇이고, 선거 탐구와 어떻게 연결되나요?","a":"배열 부등식은 a₁≤a₂≤…≤aₙ, b₁≤b₂≤…≤bₙ일 때, 같은 순서끼리 곱해서 더한 합 a₁b₁+…+aₙbₙ이 가장 크고, 반대 순서끼리 곱해서 더한 합 a₁bₙ+…+aₙb₁이 가장 작으며, 그 밖의 대응은 그 사이에 있다는 성질입니다. 가중치 점수제에서 한 후보의 점수는 (가중치)×(그 순위를 준 표 수)의 합입니다. 큰 가중치와 큰 표 수가 만나도록 대응되면 점수가 커지고 반대로 대응되면 작아지기 때문에, 같은 개수의 표라도 상위 순위에 몰려 있는지 하위 순위에 몰려 있는지에 따라 점수가 달라진다는 것을 설명하는 데 썼습니다. (식을 어떻게 세웠는지 「본인이 한 대로」 말하세요. 두 개념의 연결은 비유에 가까운 부분이 있다는 점을 먼저 인정하는 것이 안전합니다.)","kw":[{"l":"같은 순서 곱의 합 최대","a":["같은","순서","곱의"]},{"l":"반대 순서 곱의 합 최소","a":["반대","순서","곱의"]},{"l":"점수 = 가중치×표 수의 합","a":["가중치×표","점수","수의"]},{"l":"상위에 몰릴수록 점수↑","a":["몰릴수록","상위에","점수↑"]}]},{"id":"kj_B6","cat":"자소서","grade":"중3","q":"콩도르세 역설이 무엇인가요?","a":"개인의 선호는 일관되어도 다수결로 모은 집단의 선호는 순환할 수 있다는 현상입니다. 세 사람의 순위가 A>B>C, B>C>A, C>A>B라면 A는 B를 2:1로, B는 C를 2:1로, C는 A를 2:1로 이겨서 가장 선호되는 후보를 정할 수 없습니다. 그래서 비교 우위제는 항상 승자가 있다고 보장할 수 없습니다.","kw":[{"l":"A>B>C, B>C>A, C>A>B","a":["A>B>C, B>C>A, C>A>B"]},{"l":"2:1 순환","a":["2:1 순환","순환"]},{"l":"승자 없음","a":["승자 없음","승자"]}]},{"id":"kj_B7","cat":"자소서","grade":"중3","q":"애로의 불가능성 정리를 들어 본 적이 있나요? 어떤 내용인가요?","a":"제가 이해한 범위에서는, 후보가 세 명 이상일 때 순위를 모아 집단의 순위를 정하는 방식이 몇 가지 합리적인 조건을 모두 만족하기는 불가능하다는 정리입니다. 조건은 모든 순위를 허용할 것, 모두가 어떤 후보를 더 좋아하면 집단도 그렇게 할 것, 독재자가 없을 것, 무관한 후보의 존재가 두 후보의 순위에 영향을 주지 않을 것 등입니다. 케네스 애로가 1950년대에 증명했다고 알고 있습니다. 증명은 못 하고 개념만 아는 수준입니다.","kw":[{"l":"후보 3명 이상","a":["후보 3명 이상","후보","3명","이상"]},{"l":"합리적 조건 동시 만족 불가능","a":["합리적","불가능","조건"]},{"l":"독재자 없음, 무관한 후보로부터의 독립","a":["후보로부터의","독재자","무관한"]},{"l":"개념 수준","a":["개념 수준","개념","수준"]}]},{"id":"kj_B8","cat":"자소서","grade":"중3","q":"사람들이 자기 생각과 다르게 투표하면 어떻게 되나요? (전략 투표)","a":"자신의 진짜 선호와 다르게 투표해서 더 좋은 결과를 얻으려는 행동을 전략 투표라고 합니다. 단순 다수제에서는 지지하는 후보가 이길 가능성이 낮으면 그 표를 버리는 것 같아서 차선책 후보에 투표하기도 합니다. 후보가 세 명 이상이면 독재가 아닌 거의 모든 결정 방식에서 전략 투표로 결과를 바꿀 수 있는 경우가 있다는 정리가 있다고 알고 있습니다(기버드–새터스웨이트 정리). 이 탐구는 모두가 진심으로 순위를 적는다고 가정한 것이 한계입니다.","kw":[{"l":"진짜 선호와 다른 투표","a":["선호와","진짜","다른"]},{"l":"사표 방지 심리","a":["사표 방지 심리","사표","방지","심리"]},{"l":"거의 모든 방식에서 가능","a":["방식에서","거의","모든"]},{"l":"진심 가정이 한계","a":["가정이","진심","한계"]}]},{"id":"kj_C5","cat":"자소서","grade":"중3","q":"배열 부등식을 항이 두 개일 때 증명해 보세요.","a":"a₁≤a₂, b₁≤b₂라 하면 (a₁b₁+a₂b₂)−(a₁b₂+a₂b₁) = a₁b₁+a₂b₂−a₁b₂−a₂b₁ = (a₂−a₁)(b₂−b₁)입니다. a₂−a₁≥0, b₂−b₁≥0이므로 이 값은 0 이상이고, 따라서 같은 순서끼리 곱한 합이 더 크거나 같습니다. 항이 n개일 때는 순서가 어긋난 두 쌍을 서로 바꾸면 합이 줄지 않는다는 이 사실을 반복해서 쓰면 증명됩니다.","kw":[{"l":"(a₂−a₁)(b₂−b₁)≥0","a":["a₂−a₁","b₂−b₁","≥0"]},{"l":"어긋난 쌍을 맞바꾸면 합이 증가","a":["맞바꾸면","어긋난","쌍을"]},{"l":"반복 적용","a":["반복 적용","반복","적용"]}],"level":"advanced"},{"id":"kj_C6","cat":"자소서","grade":"중3","q":"가중치 점수제에서 후보를 하나 빼면 결과가 바뀔 수도 있나요?","a":"네, 바뀔 수 있습니다. 앞의 가상 예시에서 양식을 빼고 3개 후보에 2·1·0점을 주면 한식 42점, 중식 49점, 일식 44점이 되어 중식이 이깁니다. 양식이 있을 때는 일식이 75점으로 이겼던 결과가 양식을 제거하자 바뀌었습니다. 이처럼 선택지에 없던 후보의 유무가 두 후보의 순위를 바꾸는 것을 \"무관한 대안으로부터의 독립\" 조건을 어긴다고 합니다. (위 숫자는 가상 예시 기준입니다.)","kw":[{"l":"양식 제거 → 한 42·중 49·일 44","a":["양식","제거","42"]},{"l":"일식 1위 → 중식 1위","a":["일식","1위","중식"]},{"l":"무관한 대안으로부터의 독립 위반","a":["대안으로부터의","무관한","독립"]}],"level":"advanced"},{"id":"kj_A18","cat":"자소서","grade":"중3","q":"중학교 축구부 활동에서 협력과 소통에 대해 어떤 것을 배웠나요? 주장과 부주장은 어떻게 뽑았나요?","a":"저희 팀은 축구 실력이 뛰어난 선수를 주장으로, 리더십과 소통 능력이 뛰어난 선수를 부주장으로 뽑았습니다. 훈련 중 서로의 부족한 점을 지적하다가 갈등이 생겼을 때, 부주장이 양쪽 의견을 먼저 들어 주었고 갈등이 빠르게 풀리면서 팀워크도 좋아졌습니다. 저는 그 모습을 보면서 소통에서 가장 중요한 것은 말하기 전에 듣는 것이라는 점을 배웠습니다. (본인의 포지션과 역할은 「본인이 한 대로」 말하세요.)","kw":[{"l":"실력 → 주장","a":["실력 → 주장","실력","주장"]},{"l":"소통 → 부주장","a":["소통 → 부주장","부주장","소통"]},{"l":"지적하다 갈등","a":["지적하다 갈등","지적하다","갈등"]},{"l":"의견을 먼저 들음","a":["의견을","먼저","들음"]},{"l":"듣는 것이 먼저","a":["듣는 것이 먼저","듣는","것이","먼저"]}]},{"id":"kj_A19","cat":"자소서","grade":"중3","q":"부주장이 갈등을 풀 때 구체적으로 어떻게 했고, 본인은 거기서 무엇을 느꼈나요?","a":"(「본인이 본 대로」 말하세요.) 부주장은 먼저 두 선수에게 각자의 이야기를 끝까지 하게 했고, 중간에 판단하거나 끼어들지 않았습니다. 그다음 양쪽 입장을 정리해서 서로 확인하게 하자 갈등이 빨리 풀렸습니다. 저는 그 모습을 보고 갈등이 풀리는 것은 누가 맞고 틀린지 가려서가 아니라 서로 이해받았다고 느낄 때라는 것을 알게 되었습니다.","kw":[{"l":"끝까지 듣기","a":["끝까지 듣기","끝까지","듣기"]},{"l":"판단하지 않음","a":["판단하지 않음","판단하지","않음"]},{"l":"입장 정리하고 확인","a":["정리하고","입장","확인"]},{"l":"이해받았다고 느낄 때 풀림","a":["이해받았다고","느낄","풀림"]}]},{"id":"kj_A20","cat":"자소서","grade":"중3","q":"조별과제에서 결과를 완성하는 데 급급했다는 것은 어떤 경험이었고, 그 뒤에 무엇을 바꾸었나요?","a":"(「본인이 겪은 조별과제」를 구체적으로 말하세요.) 이전에는 마감과 결과물만 생각해서 팀원의 의견을 충분히 듣지 않고 제가 정리해 완성하는 데 급급했습니다. 축구부에서 의견을 먼저 듣는 모습을 본 뒤로는 조별과제에서 모든 팀원이 참여할 수 있도록 한 사람씩 의견을 물어보았습니다. 시간은 더 걸렸지만 서로 의견을 존중하고 협력하는 과정이 있어야 결과도 더 좋아진다고 생각하게 되었습니다.","kw":[{"l":"결과 중심 → 과정 중시","a":["결과","중심","과정"]},{"l":"한 명씩 의견 묻기","a":["명씩","의견","묻기"]},{"l":"모두 참여","a":["모두 참여","모두","참여"]},{"l":"존중과 협력","a":["존중과 협력","존중과","협력"]}]},{"id":"kj_B9","cat":"자소서","grade":"중3","q":"과학고에서 팀 프로젝트나 기숙사 생활 중 친구와 크게 의견이 부딪히면 어떻게 하겠나요?","a":"먼저 상대의 이야기를 끝까지 듣고, 의견이 다른 이유를 확인하겠습니다. 감정이 올라왔을 때는 바로 답하지 않고 시간을 두겠습니다. 그다음 서로가 원하는 것이 무엇인지 정리해서 공통 목표를 찾고, 기준이나 근거를 정해 비교하겠습니다. 축구부에서 부주장이 했던 방식과 조별과제에서 바꾼 방식을 그대로 적용해 보겠습니다.","kw":[{"l":"끝까지 듣기","a":["끝까지 듣기","끝까지","듣기"]},{"l":"이유 확인","a":["이유 확인","이유","확인"]},{"l":"감정은 시간을 둠","a":["감정은","시간을"]},{"l":"공통 목표","a":["공통 목표","공통","목표"]},{"l":"기준과 근거","a":["기준과 근거","기준과","근거"]}]},{"id":"kj_A21","cat":"자소서","grade":"중3","q":"「세이노의 가르침」을 읽은 이유와 가장 인상 깊었던 내용, 그리고 실제로 실천한 것은 무엇인가요?","a":"(책의 구체적인 내용은 「본인이 읽은 대로」 말하세요. 책 내용을 정확히 확인하지 못해서 이 자료에는 구체적인 문장을 쓰지 않았습니다.) 이 책을 자기주도성과 실천력에 대한 이야기로 읽었습니다. 제일 인상 깊었던 것은 「본인이 고른 구절이나 주장」이고, 그 이유는 「본인의 이유」입니다. 실천한 것은 「본인이 한 것, 예: 계획을 세워 매일 하기」입니다. 탐구에서도 마그누스 효과 실험이 잘 안 되자 고무줄 발사 장치를 직접 만들어 해결했던 경험이 이 책의 실천력과 연결된다고 생각합니다.","kw":[{"l":"자기주도성","a":["자기주도성"]},{"l":"실천력","a":["실천력"]},{"l":"인상 깊은 구절","a":["인상 깊은 구절","인상","깊은","구절"]},{"l":"실제로 한 것","a":["실제로 한 것","실제로"]},{"l":"고무줄 장치 경험","a":["고무줄","장치","경험"]}]},{"id":"kj_A22","cat":"자소서","grade":"중3","q":"「하늘과 바람과 별과 인간」은 어떤 책이고, 물리학이나 과학적 사고에 대해 무엇을 알게 되었나요?","a":"(책의 구체적인 내용과 저자는 「본인이 읽은 대로」 말하세요. 이 자료는 책 내용을 확인하지 못했습니다.) 이 책에서 물리학이 하늘, 바람, 별 같은 자연 현상을 이해하는 방식과 인간이 자연을 바라보는 시선에 대해 생각했습니다. 인상 깊었던 부분은 「본인이 읽은 내용」입니다. 과학적 사고란 현상을 관찰하고 이유를 질문하며 근거로 확인하는 태도라고 생각하게 되었습니다. 이 책의 \"바람\"은 제 마그누스 효과 탐구에서 다룬 공기의 흐름과도 이어집니다.","kw":[{"l":"하늘·바람·별","a":["하늘·바람·별","하늘","바람"]},{"l":"물리학으로 자연 이해","a":["물리학으로","자연","이해"]},{"l":"과학적 사고 = 관찰·질문·근거","a":["과학적","사고","관찰"]},{"l":"바람 = 유체 흐름","a":["바람","유체","흐름"]},{"l":"인간과 자연","a":["인간과 자연","인간과","자연"]}]},{"id":"kj_A23","cat":"자소서","grade":"중3","q":"내시 균형이 무엇인가요? 죄수의 딜레마로 설명해 보세요.","a":"내시 균형은 모든 참가자가 각자 상대의 선택을 고정해 놓고 보았을 때 자기 선택을 바꿔도 더 이득이 되지 않는 상태입니다. 죄수의 딜레마에서 두 죄수가 모두 침묵하면 각각 1년, 한 명만 자백하면 자백한 쪽은 0년이고 침묵한 쪽은 10년, 둘 다 자백하면 각각 5년을 받는다고 합시다. 상대가 침묵하든 자백하든 나는 자백하는 것이 더 이익이므로 둘 다 자백하는 것이 내시 균형입니다.","kw":[{"l":"상대 선택 고정","a":["상대 선택 고정","상대","선택","고정"]},{"l":"혼자 바꿔도 이득 없음","a":["바꿔도","혼자","이득"]},{"l":"죄수의 딜레마","a":["죄수의 딜레마","죄수의","딜레마"]},{"l":"(자백, 자백) 5년씩","a":["5년씩","자백"]}]},{"id":"kj_A24","cat":"자소서","grade":"중3","q":"세 권의 책이 본인의 탐구나 진로와 어떻게 이어지나요?","a":"「세이노의 가르침」은 실천력과 자기주도성을 생각하게 해서, 실험이 막혔을 때 방법을 바꿔 끝까지 해 본 태도와 이어집니다. 「하늘과 바람과 별과 인간」은 자연 현상을 물리로 이해하는 시선을 주어서 마그누스 효과의 유체 흐름 탐구와 이어집니다. 「존 내쉬가 들려주는 의사결정이론 이야기」는 합리적 의사결정과 게임이론을 알려 주어서, 선거 방식에 따라 결과가 달라지는 수학 탐구와 스포츠에서의 전략적 선택으로 이어집니다.","kw":[{"l":"실천력 ↔ 고무줄 장치","a":["실천력","고무줄","장치"]},{"l":"유체 흐름 ↔ 마그누스","a":["마그누스","유체","흐름"]},{"l":"의사결정 ↔ 선거 탐구, 스포츠 전략","a":["의사결정","스포츠","선거"]}]},{"id":"kj_B10","cat":"자소서","grade":"중3","q":"자기계발서의 주장에 동의하지 않는 부분이나 한계는 없었나요?","a":"(「본인이 책에서 동의하지 않은 부분」을 말하세요.) 일반적으로 자기계발서는 개인의 노력과 의지를 강조하는데, 사람마다 환경과 조건이 다르다는 점과 성공한 사례만 보이고 실패한 사례는 잘 보이지 않는다는 점은 한계라고 생각합니다. 그래서 저는 책의 주장을 그대로 따르기보다 제 상황에 맞게 골라서 실천하려고 합니다.","kw":[{"l":"개인의 노력 강조","a":["개인의","노력","강조"]},{"l":"환경 차이","a":["환경 차이","환경","차이"]},{"l":"성공 사례만 보임(생존자 편향)","a":["사례만","생존자","성공"]},{"l":"상황에 맞게 골라서","a":["상황에","골라서","맞게"]}]},{"id":"kj_B11","cat":"자소서","grade":"중3","q":"내시 균형을 축구의 페널티킥에 적용해 설명해 보세요.","a":"키커는 왼쪽이나 오른쪽으로 차고, 골키퍼는 왼쪽이나 오른쪽으로 몸을 날립니다. 같은 쪽이면 막히고 다른 쪽이면 골이 들어간다고 보고, 가상으로 같은 쪽일 때 득점 확률을 0.3, 다른 쪽일 때 0.9라고 합시다. 키커가 늘 한쪽으로만 차면 골키퍼가 그쪽을 막으면 되므로 한쪽으로 정하는 전략은 균형이 될 수 없습니다. 둘 다 왼쪽과 오른쪽을 확률 1/2씩 섞으면, 상대가 어느 쪽을 택해도 득점 확률이 0.5×0.3+0.5×0.9=0.6으로 같아서 어느 쪽도 선택을 바꿔 이득을 볼 수 없으므로 균형이 됩니다. 이렇게 확률로 섞는 전략을 혼합 전략이라고 합니다. (숫자는 설명을 위한 가상의 값입니다.)","kw":[{"l":"키커 좌/우","a":["키커 좌/우","키커"]},{"l":"골키퍼 좌/우","a":["골키퍼 좌/우","골키퍼"]},{"l":"한쪽으로만은 균형 아님","a":["한쪽으로만은","균형","아님"]},{"l":"1/2씩 섞음 → 득점 0.6","a":["2씩","섞음","득점"]},{"l":"혼합 전략","a":["혼합 전략","혼합","전략"]}]},{"id":"kj_B12","cat":"자소서","grade":"중3","q":"선거 탐구와 게임이론은 어떻게 연결되나요?","a":"투표는 다른 사람의 선택에 따라 내 선택의 결과가 달라지는 상황이어서 게임으로 볼 수 있습니다. 예를 들어 단순 다수제에서는 내가 지지하는 후보가 이길 가능성이 낮으면 차선책 후보에게 투표하는 전략 투표가 나타납니다. 이때 모두가 진심 투표를 하는 상태가 항상 균형이 되는 것은 아닙니다. 그래서 제 탐구처럼 모두가 진심으로 순위를 적는다고 가정한 결과는, 사람들이 전략적으로 투표하면 달라질 수 있다는 한계가 있습니다.","kw":[{"l":"투표 = 게임","a":["투표 = 게임","투표","게임"]},{"l":"전략 투표","a":["전략 투표","전략","투표"]},{"l":"진심 투표가 균형이 아닐 수 있음","a":["투표가","균형이","진심"]},{"l":"탐구의 한계","a":["탐구의 한계","탐구의","한계"]}]},{"id":"kj_C7","cat":"자소서","grade":"중3","q":"내시 균형은 항상 존재하나요?","a":"제가 아는 범위에서는, 참가자와 선택이 유한한 게임에서는 확률로 섞는 혼합 전략까지 허용하면 내시 균형이 적어도 하나는 존재한다는 것을 내시가 증명했습니다. 증명에는 고정점 정리 같은 도구를 쓴다고 알고 있고, 제가 증명할 수는 없습니다. 순수 전략만 허용하면 균형이 없을 수 있다는 것은 페널티킥 예시에서 보았습니다. 내시는 1994년에 이 업적으로 노벨 경제학상을 공동 수상했습니다.","kw":[{"l":"유한 게임","a":["유한 게임","유한","게임"]},{"l":"혼합 전략 허용 시 존재","a":["혼합","전략","허용"]},{"l":"고정점 정리","a":["고정점 정리","고정점","정리"]},{"l":"개념 수준","a":["개념 수준","개념","수준"]}],"level":"advanced"},{"id":"kj_C8","cat":"자소서","grade":"중3","q":"죄수의 딜레마를 여러 번 반복하면 협력이 가능한가요?","a":"반복하면 상대가 앞으로 나를 어떻게 대할지가 중요해져서 협력이 이득이 될 수 있습니다. 액셀로드의 컴퓨터 대회에서 \"처음에는 협력하고 그다음부터는 상대가 직전에 한 대로 따라 한다\"는 단순한 전략(팃포탯)이 좋은 성적을 냈다고 알려져 있습니다. 반복 횟수가 정해져 있고 마지막 판을 모두 안다면 마지막에 배신하려는 유인이 생긴다는 문제도 있습니다. 축구부에서 신뢰가 쌓여 협력이 쉬워지는 경험과도 연결해 볼 수 있습니다.","kw":[{"l":"반복 게임","a":["반복 게임","반복","게임"]},{"l":"미래의 보복·보상","a":["미래의","보복","보상"]},{"l":"팃포탯(처음 협력, 따라 하기)","a":["팃포탯","처음","협력"]},{"l":"마지막 판 문제","a":["마지막 판 문제","마지막","문제"]}],"level":"advanced"},{"id":"kj_J1","cat":"자소서","grade":"중3","q":"마그누스 효과에 대해 답하세요. (1) 마그누스 효과가 무엇인지 설명하세요. (2) 어떤 방법으로 실험했나요? (3) 결과는 어땠고 예상과 같았나요? (4) 실험에서 일정하게 해야 하는 조건은 무엇이었나요?","a":"(1) 회전하면서 공기나 물 속을 움직이는 물체가 회전 방향에 따라 옆으로 휘는 현상입니다. 공 주변의 유체 속도가 한쪽은 빨라지고 다른 쪽은 느려져 압력 차이가 생기고, 압력이 높은 쪽에서 낮은 쪽으로 힘을 받기 때문이라고 이해했습니다. 야구의 커브볼과 축구의 감아차기에 나타납니다. (2)~(3) (「본인이 한 방법과 결과」로 바꿔 말하세요.) 수조에서 탁구공을 회전시켜 던지고 물감의 흐름과 궤적을 관찰했습니다. 결과가 뚜렷하지 않았을 때 원인을 부력, 물의 저항, 던지는 세기의 불균일함으로 나누어 생각했고, 던지는 세기를 일정하게 하려고 고무줄 발사 장치를 썼습니다. (4) 공의 크기와 질량, 던지는 세기와 각도, 물의 양과 온도를 같게 하고 회전 여부만 바꿔야 비교가 됩니다.","kw":[{"l":"회전 → 속도·압력 차 → 힘","a":["회전","속도","압력"]},{"l":"변인 통제","a":["변인 통제","변인","통제"]},{"l":"회전 있음/없음 비교","a":["회전","비교"]}]},{"id":"kj_J2","cat":"자소서","grade":"중3","q":"수조 속에서 탁구공의 궤적이 뚜렷하지 않았던 이유를 물리적으로 설명해 보세요. 지름 4 cm, 질량 2.7 g인 탁구공이 물에 완전히 잠겼을 때 받는 부력과 중력을 비교하세요. (g = 10 m/s², 물의 밀도 1 g/cm³)","a":"공의 부피는 (4/3)π × 2³ ≈ 33.5 cm³입니다. 부력은 밀어낸 물의 무게이므로 33.5 g의 무게, 즉 약 0.33 N이고 공의 중력은 0.0027 kg × 10 = 0.027 N(약 0.03 N)입니다. 부력이 중력의 약 12배라서 공은 위로 크게 뜨려고 하고 회전에 의한 옆으로의 힘보다 부력과 물의 저항이 훨씬 커서 마그누스 효과에 의한 휘어짐이 뚜렷하지 않았을 수 있습니다. 공의 평균 밀도는 2.7 g ÷ 33.5 cm³ ≈ 0.08 g/cm³로 물보다 훨씬 작습니다. 그래서 던지는 세기를 일정하게 하고, 공 속에 물을 채우거나 무거운 공을 쓰는 방법을 생각해 볼 수 있습니다.","kw":[{"l":"부피 33.5 cm³","a":["cm³","부피","33"]},{"l":"부력 0.33 N ≫ 중력 0.03 N","a":["부력","33","중력"]},{"l":"밀도 0.08 g/cm³","a":["cm³","밀도","08"]},{"l":"저항","a":["저항"]}]},{"id":"kj_J3","cat":"자소서","grade":"중3","q":"마그누스 효과가 생기는 원리를 베르누이 원리와 연결해서 설명하고, 축구에서 윗부분이 앞으로 구르는 회전(탑스핀)과 뒤로 구르는 회전(백스핀)을 한 공이 각각 어떻게 날아가는지 말해 보세요.","a":"베르누이 원리는 유체의 속력이 빠른 곳은 압력이 낮고 느린 곳은 압력이 높다는 원리입니다. 회전하는 공은 표면에 붙은 공기를 같이 끌고 돌기 때문에 한쪽은 공기의 흐름과 표면의 움직임이 같은 방향이라 속력이 빨라지고, 반대쪽은 반대 방향이라 느려집니다. 그 결과 압력 차이로 압력이 높은 쪽에서 낮은 쪽으로 힘이 작용합니다. 최근 설명에서는 공 뒤쪽의 공기 흐름이 한쪽으로 꺾여 공기가 반대쪽으로 밀리고, 그 반작용으로 공이 힘을 받는다고도 합니다. 탑스핀을 준 공은 아래로 향하는 힘을 받아 빨리 떨어지고, 백스핀을 준 공은 위로 향하는 힘을 받아 더 오래 뜹니다. 좌우 회전을 주면 옆으로 휘는 바나나킥이 됩니다.","kw":[{"l":"빠른 쪽 압력 낮음","a":["빠른","압력","낮음"]},{"l":"압력 차 → 힘","a":["압력 차 → 힘","압력"]},{"l":"탑스핀: 아래","a":["탑스핀: 아래","탑스핀","아래"]},{"l":"백스핀: 위","a":["백스핀: 위","백스핀"]},{"l":"좌우 회전: 옆으로 휨","a":["옆으로","좌우","회전"]}]},{"id":"kj_J4","cat":"자소서","grade":"중3","q":"실험할 때 위험하거나 조심해야 할 점은 무엇이었고, 어떤 안전 조치를 했나요?","a":"(「본인이 실제로 한 것」으로 바꿔 말하세요.) 수조의 물이 바닥에 튀면 미끄러울 수 있어서 바닥에 수건을 깔고 즉시 닦았습니다. 공을 빠르게 던지는 장치를 쓸 때는 사람이 없는 방향으로 놓고 보호 안경을 쓰는 것이 좋습니다. 전기 기구를 쓰는 경우 물과 거리를 두어야 합니다. 실험 전에 지도 선생님께 계획을 말씀드리고 허락을 받는 것도 안전 조치입니다.","kw":[{"l":"바닥 물기","a":["바닥 물기","바닥","물기"]},{"l":"보호 장비","a":["보호 장비","보호","장비"]},{"l":"사람 없는 방향","a":["사람 없는 방향","사람","없는","방향"]},{"l":"전기와 물 분리","a":["전기와 물 분리","전기와","분리"]},{"l":"선생님 허락","a":["선생님 허락","선생님","허락"]}]},{"id":"kj_J5","cat":"자소서","grade":"중3","q":"선거 방식에 대한 탐구를 설명하세요. (1) 탐구 주제는 무엇이었나요? (2) 단순 다수결, 순차적 탈락제(IRV), 보르다 득표제는 각각 무엇이 다른가요? (3) 탐구를 하면서 가장 어려웠던 점은 무엇이었나요?","a":"(1) 같은 투표 결과도 집계 방식에 따라 당선자가 바뀔 수 있는지를 수학으로 확인한 탐구입니다. (2) 단순 다수결은 1순위 표가 가장 많은 후보가 이기는 방식입니다. 순차적 탈락제는 1순위 표가 가장 적은 후보를 탈락시키고 그 표를 다음 순위로 옮기는 과정을 과반이 나올 때까지 반복합니다. 보르다 득표제는 순위에 점수(3-2-1-0점 등)를 주어 합산합니다. 예를 들어 45명의 선호가 (19명 한>중>일>양, 12명 일>양>중>한, 10명 양>일>중>한, 4명 중>양>한>일)일 때 단순 다수결은 한식, 순차적 탈락제는 양식, 보르다 득표제는 일식이 이기고, 일대일 비교로는 중식이 이깁니다. (3) (「본인이 겪은 어려움」으로 바꿔 말하세요.) 배열 부등식을 선거 모형에 연결하는 과정이 가장 어려웠습니다.","kw":[{"l":"같은 표, 다른 결과","a":["같은","다른","결과"]},{"l":"다수결 / IRV / 보르다","a":["다수결","IRV","보르다"]},{"l":"45명 예시: 한식·양식·일식·중식","a":["45명","예시","한식"]}]},{"id":"kj_J6","cat":"자소서","grade":"중3","q":"45명의 유권자가 한식, 중식, 일식, 양식 네 후보 중 메뉴를 고릅니다. 선호는 19명 한>중>일>양, 12명 일>양>중>한, 10명 양>일>중>한, 4명 중>양>한>일입니다. (1) 단순 다수결로는 무엇이 뽑히나요? (2) 1순위 표가 가장 적은 후보를 차례로 탈락시키는 방식은요? (3) 1순위 3점, 2순위 2점, 3순위 1점, 4순위 0점을 주는 보르다 방식은요? (4) 모든 후보와 일대일로 비교해 모두 이기는 후보가 있나요?","a":"(1) 1순위 표는 한 19, 일 12, 양 10, 중 4이므로 한식입니다. (2) 중식(4표)을 먼저 탈락시키고 이 표는 다음 순위인 양식으로 가서 양 14, 한 19, 일 12가 됩니다. 일식(12표)을 탈락시키면 이 표도 양식으로 가서 양 26, 한 19가 되어 과반(23표)을 넘은 양식이 뽑힙니다. (3) 한식 19×3 + 4×1 = 61, 중식 19×2 + 12×1 + 10×1 + 4×3 = 72, 일식 19×1 + 12×3 + 10×2 = 75, 양식 12×2 + 10×3 + 4×2 = 62이고 합은 270(= 45 × 6)이므로 일식이 뽑힙니다. (4) 중식은 한식에 26 : 19, 일식에 23 : 22, 양식에 23 : 22로 모두 이기므로 중식이 일대일 비교의 승자(콩도르세 승자)입니다. 같은 투표인데 방식에 따라 한식, 양식, 일식, 중식이 모두 뽑힐 수 있습니다.","kw":[{"l":"다수결 한식","a":["다수결 한식","다수결","한식"]},{"l":"탈락제 양식","a":["탈락제 양식","탈락제","양식"]},{"l":"보르다 일식 75","a":["보르다","일식","75"]},{"l":"일대일 중식","a":["일대일 중식","일대일","중식"]},{"l":"총점 270으로 검산","a":["270으로","총점","검산"]}]},{"id":"kj_J7","cat":"자소서","grade":"중3","q":"배열 부등식이 무엇인지 설명하고, 수열 (1, 2, 3)과 (4, 5, 6)을 짝지어 곱의 합을 만들 때 최댓값과 최솟값을 구하세요. 두 수일 때 왜 성립하는지 증명해 보세요.","a":"두 수열 a₁ ≤ a₂ ≤ … ≤ aₙ, b₁ ≤ b₂ ≤ … ≤ bₙ에서 같은 순서끼리 곱해 더한 값(순서합)이 가장 크고, 반대 순서로 곱해 더한 값(역순합)이 가장 작으며, 다른 모든 짝짓기의 값은 그 사이에 있다는 부등식입니다. (1, 2, 3)과 (4, 5, 6)에서 순서합은 1×4 + 2×5 + 3×6 = 32, 역순합은 1×6 + 2×5 + 3×4 = 28입니다. 두 수일 때 a₁ ≤ a₂, b₁ ≤ b₂이면 (a₁ − a₂)(b₁ − b₂) ≥ 0이고 전개하면 a₁b₁ + a₂b₂ − a₁b₂ − a₂b₁ ≥ 0이므로 a₁b₁ + a₂b₂ ≥ a₁b₂ + a₂b₁입니다. 등호는 두 수가 같을 때 성립합니다.","kw":[{"l":"순서합 최대 32","a":["순서합","최대","32"]},{"l":"역순합 최소 28","a":["역순합","최소","28"]},{"l":"(a₁−a₂)(b₁−b₂) ≥ 0","a":["a₁−a₂","b₁−b₂"]}]},{"id":"kj_J8","cat":"자소서","grade":"중3","q":"수면 시간이 길수록 운동 기록이 좋다는 자료를 얻었다면, 수면이 기록을 좋게 만든다고 결론내릴 수 있나요? 상관관계와 인과관계의 차이를 말하고 확인 방법을 말해 보세요.","a":"결론을 내릴 수 없습니다. 상관관계는 두 값이 함께 변하는 경향이고, 인과관계는 하나가 원인이 되어 다른 하나를 바꾼다는 관계입니다. 수면이 긴 선수가 원래 체력이 좋거나 컨디션 관리를 잘해서 두 값이 함께 좋아진 것일 수 있습니다. 인과를 확인하려면 같은 선수에게 수면 시간만 바꾸고 나머지 조건(훈련, 식사, 시간대)을 같게 한 실험을 하고, 표본의 수를 늘려 반복해야 합니다. 5경기나 몇 명의 자료로는 결론이 흔들리므로 한계를 함께 말합니다.","kw":[{"l":"상관 ≠ 인과","a":["상관 ≠ 인과","상관","인과"]},{"l":"제3의 요인","a":["제3의 요인","제3의","요인"]},{"l":"조건 통제 실험","a":["조건 통제 실험","조건","통제","실험"]},{"l":"표본 수","a":["표본 수","표본"]}]},{"id":"kj_J9","cat":"자소서","grade":"중3","q":"공을 45° 각도로 초속 10 m/s로 찼을 때 공이 날아가는 수평 거리를 구하고, 각도에 따라 거리가 어떻게 달라지는지 말해 보세요. (공기 저항 무시, g = 10 m/s²)","a":"수평 도달 거리는 R = v²sin2θ / g이므로 θ = 45°이면 sin90° = 1이라 R = 100 / 10 = 10 m입니다. 공기 저항이 없을 때 45°에서 거리가 최대이고, 같은 속력에서 θ와 90° − θ는 도달 거리가 같습니다(30°와 60°). 각도가 작으면 낮고 빠르게 날아가고 클수록 높이 오르지만 멀리 가지 못합니다. 실제 경기에서는 공기 저항과 회전(마그누스 효과)이 있어서 최적 각도가 45°보다 작을 수 있습니다.","kw":[{"l":"R = v²sin2θ/g = 10 m","a":["v²sin2θ","10"]},{"l":"45° 최대","a":["45° 최대","45°","최대"]},{"l":"30°=60°","a":["30°=60°","30°","60°"]},{"l":"실제는 공기 저항·회전","a":["실제는","공기","저항"]}]},{"id":"kj_J10","cat":"자소서","grade":"중3","q":"지금까지 한 활동 중 가장 기억에 남는 활동은 무엇이고, 그 이유는 무엇인가요? 그 활동에서 본인이 한 일을 구체적으로 말해 보세요.","a":"(「본인이 실제로 한 활동」으로 바꿔 말하세요.) 마그누스 효과 실험을 말할 수 있습니다. 예상과 달리 궤적이 뚜렷하지 않아 원인을 하나씩 따져 던지는 방식을 바꿔 보았고, 결과보다 문제를 나누어 해결하는 과정이 기억에 남습니다. 말할 때는 활동 → 본인이 한 일 → 어려움과 해결 → 배운 점 순서로 하고, 팀 활동이면 \"저는 ~를 맡았습니다\"라고 본인 역할을 분명히 합니다.","kw":[{"l":"활동 → 내가 한 일 → 어려움·해결 → 배운 점","a":["어려움","활동","내가"]}]},{"id":"kj_D1","cat":"독서·인성","grade":"중3","q":"스포츠과학에 관심을 갖게 된 계기를 말해 보세요. 그 계기 이전에는 어떤 생각을 했고, 이후 무엇을 해 보았나요?","a":"(「본인이 실제로 겪은 일」로 바꿔 말하세요.) 축구선수로 활동하다 부상을 겪으며 \"부상을 줄이고 운동수행능력을 높이는 요인은 무엇일까?\"라는 질문을 갖게 되었습니다. 그전에는 운동을 경험과 감으로만 한다고 생각했는데, 수면과 몸 상태 같은 요인을 수치로 볼 수 있다는 것을 알고 관심이 생겼습니다. 이후 수면과 운동수행을 다룬 자료를 찾아 읽고, 마그누스 효과 실험과 선거 방식 탐구로 스포츠와 사회 현상을 수학과 과학으로 분석해 보았습니다.","kw":[{"l":"부상 경험 → 질문 → 수치로 분석 → 실험·탐구","a":["수치로","부상","경험"]}]},{"id":"kj_D2","cat":"독서·인성","grade":"중3","q":"본인의 장점과 단점을 각각 한 가지씩 말하고, 단점을 고치려고 어떤 노력을 했는지 말해 보세요.","a":"(「본인의 솔직한 생각」으로 바꿔 말하세요.) 장점은 팀 활동에서 상대의 말을 끝까지 듣고 갈등이 생기면 입장을 먼저 정리해 보자고 말하는 것입니다. 단점은 (예: 한 가지에 집중하면 일정 관리가 느슨해지는 점)이고, 이를 고치려고 해야 할 일을 목록으로 적고 날짜를 정해 확인하는 방법을 쓰고 있습니다. 단점을 말할 때는 반드시 고치려는 행동까지 함께 말합니다.","kw":[{"l":"장점 + 예","a":["장점 + 예","장점"]},{"l":"단점 + 개선 행동","a":["단점","개선","행동"]}]},{"id":"kj_D3","cat":"독서·인성","grade":"중3","q":"팀 활동에서 문제나 갈등이 생겼을 때 어떻게 해결했나요? 그 과정에서 본인의 역할은 무엇이었나요?","a":"(「본인이 실제로 한 것」으로 바꿔 말하세요.) 축구부에서 갈등이 생겼을 때 서로 입장을 말하게 하고 공통 목표(경기 승리)를 다시 확인하며 풀어 가는 모습을 보았고, 저는 주장이 아니었지만 의견을 모으는 일을 도왔습니다. 이후 조별과제에서 한 명씩 의견을 묻는 방식을 직접 써 보았습니다. 리더가 아니어도 끝까지 듣고, 입장을 정리하고, 맡은 일을 해내는 것으로 팀에 기여할 수 있다고 생각합니다.","kw":[{"l":"입장 듣기 → 공통 목표 → 내 역할","a":["입장","듣기","공통"]}]},{"id":"kj_D4","cat":"독서·인성","grade":"중3","q":"죄수의 딜레마를 설명하고, 내시 균형이 무엇인지 말해 보세요. 이 책의 내용이 본인의 선거 탐구와 어떻게 이어지나요?","a":"두 용의자가 따로 심문받을 때, 둘 다 침묵하면 각각 가벼운 형(예: 1년), 한 명만 배신하면 배신한 사람은 풀려나고 침묵한 사람은 무거운 형(예: 10년), 둘 다 배신하면 각각 중간 형(예: 5년)을 받는다고 하겠습니다. 상대가 침묵하든 배신하든 나는 배신하는 편이 형이 더 가벼우므로 둘 다 배신하게 되는데, 둘 다 침묵하는 것이 모두에게 더 좋은 결과입니다. 내시 균형은 상대의 선택이 정해져 있을 때 누구도 혼자 선택을 바꿔서 이득을 볼 수 없는 상태이고, 이 예에서는 (배신, 배신)이 내시 균형입니다. 선거에서도 유권자가 자기 선호를 솔직하게 적지 않고 당선 가능성을 계산해 전략적으로 투표하면 결과가 달라질 수 있어 이 책의 내용과 이어집니다. 책의 세부 내용은 읽은 범위에서만 말합니다.","kw":[{"l":"(배신, 배신) = 내시 균형","a":["배신","내시"]},{"l":"모두에게 최선과 다름","a":["모두에게","최선과","다름"]},{"l":"전략적 투표","a":["전략적 투표","전략적","투표"]}]},{"id":"kj_D5","cat":"독서·인성","grade":"중3","q":"「세이노의 가르침」에서 가장 기억에 남는 내용 하나와 그 책을 읽고 달라진 행동을 말해 보세요. 동의하지 않는 부분이 있었나요?","a":"(「본인이 읽은 내용」으로만 바꿔 말하세요. 읽지 않은 부분은 말하지 않습니다.) 말하는 순서는 기억에 남는 내용 하나 → 그것을 내 생활에 적용한 행동 → 결과입니다. 동의하지 않는 부분을 물으면 책의 주장을 그대로 따르기보다 제 상황에 맞는지 따져 본 부분(예: 시간 배분이나 공부 방식)을 한 가지 말하고 이유를 드는 것이 좋습니다. 단순히 좋았다는 말보다 구체적인 장면과 행동 변화를 말합니다.","kw":[{"l":"내용 하나 → 적용한 행동 → 결과","a":["적용한","내용","하나"]},{"l":"동의하지 않는 부분과 이유","a":["동의하지","부분과","않는"]}]},{"id":"kj_D6","cat":"독서·인성","grade":"중3","q":"「하늘과 바람과 별과 인간」은 어떤 책이고, 그 책이 본인의 과학·수학 탐구나 진로에 준 영향이 있다면 무엇인가요?","a":"(「본인이 읽은 내용」으로만 바꿔 말하세요.) 책의 주제를 한 문장으로 요약하고, 가장 기억에 남는 장면 하나를 말한 뒤, 그것이 스포츠 현상을 자연의 원리로 이해하려는 제 관심과 어떻게 이어졌는지 말합니다. 책의 구체적인 내용은 제가 읽은 범위 안에서만 말씀드리고, 확실하지 않은 부분은 \"그 부분은 정확히 기억하지 못합니다\"라고 말합니다.","kw":[{"l":"주제 한 문장","a":["주제 한 문장","주제","문장"]},{"l":"인상 깊은 장면","a":["인상 깊은 장면","인상","깊은","장면"]},{"l":"내 탐구와 연결","a":["내 탐구와 연결","탐구와","연결"]},{"l":"모르면 모른다고","a":["모르면 모른다고","모른다고","모르면"]}]},{"id":"kj_D7","cat":"독서·인성","grade":"중3","q":"스포츠에서 인공지능과 데이터 분석을 쓰는 것의 장점과 단점을 말하고, 선수의 기록을 분석할 때 지켜야 할 점을 말해 보세요.","a":"장점은 경험과 감에 의존하던 훈련과 전술을 수치로 확인해서 부상 위험을 줄이고 성적을 높일 수 있다는 것입니다. 단점은 심리나 팀워크는 수치로 나타내기 어렵고, 선수를 숫자로만 평가할 위험이 있다는 점입니다. 선수의 몸 상태와 수면 같은 기록은 개인정보라 본인 동의를 받고 안전하게 보관해야 하며, 분석 결과는 선수를 돕는 데 써야 합니다.","kw":[{"l":"장점: 객관적 수치, 부상 예방","a":["객관적","장점","수치"]},{"l":"단점: 심리·팀워크, 숫자 평가","a":["팀워크","단점","심리"]},{"l":"개인정보·동의","a":["개인정보·동의","개인정보","동의"]}]},{"id":"kj_D8","cat":"독서·인성","grade":"중3","q":"가장 크게 실패한 경험과 거기서 배운 점은 무엇인가요?","a":"(「본인이 실제로 겪은 실패」로 바꿔 말하세요.) 마그누스 실험에서 수조 속 탁구공의 궤적이 예상과 다르게 뚜렷하지 않았던 일을 말할 수 있습니다. 결과가 안 나온 이유를 부력과 물의 저항, 던지는 세기의 불균일함으로 나누어 생각했고 던지는 세기는 고무줄 발사 장치로 해결했습니다. 실패했을 때 원인을 나누어 하나씩 바꿔 보는 것이 중요하다는 것을 배웠습니다.","kw":[{"l":"원인 나누기 → 하나씩 바꿔 보기 → 배운 점","a":["나누기","하나씩","원인"]}]},{"id":"kj_D9","cat":"독서·인성","grade":"중3","q":"과학고에서는 공부량이 많아서 운동을 계속하기 어려울 텐데, 운동과 공부를 어떻게 병행할 계획인가요?","a":"(「본인의 실제 계획」으로 바꿔 말하세요.) 운동은 부상과 수면에 대한 제 탐구의 출발점이었고 몸 상태가 공부 집중력에도 영향을 준다고 생각해서 완전히 놓고 싶지 않습니다. 매일 긴 시간은 어렵지만 시간을 정해 짧게라도 규칙적으로 하고, 수면 시간을 줄이지 않는 것을 우선하겠습니다. 시험 기간에는 운동 시간을 줄이되 완전히 끊지는 않겠습니다.","kw":[{"l":"규칙적으로 짧게","a":["규칙적으로 짧게","규칙적으로","짧게"]},{"l":"수면 우선","a":["수면 우선","수면","우선"]},{"l":"시험 기간 조정","a":["시험 기간 조정","시험","기간","조정"]}]},{"id":"kj_D10","cat":"독서·인성","grade":"중3","q":"세종과학고에 입학한 뒤 하고 싶은 활동과 가장 어려울 것 같은 점, 그리고 그에 대한 대처를 말해 보세요.","a":"(「본인의 계획」으로 바꿔 말하세요. 학교 프로그램은 확인된 것만 말합니다.) 입학하면 수학과 과학을 깊이 공부하고 스포츠 현상을 분석하는 탐구를 이어가고 싶습니다. 어려운 점은 학습량 증가로 이해하지 못한 개념이 쌓이는 것인데, 모르는 부분을 그날 질문하고 친구와 서로 설명하며 공부하겠습니다. 운동은 수면을 줄이지 않는 범위에서 짧게라도 규칙적으로 계속하겠습니다.","kw":[{"l":"하고 싶은 활동","a":["하고 싶은 활동","하고","싶은","활동"]},{"l":"어려움","a":["어려움"]},{"l":"구체적 대처","a":["구체적 대처","구체적","대처"]}]},{"id":"kj_M1","cat":"수학","grade":"중3","q":"(1) 방정식과 항등식의 차이를 설명하세요. (2) 이차방정식을 푸는 방법을 모두 말하세요. (3) 이차식이 인수분해가 되지 않는 경우는 언제인가요?","a":"(1) 방정식은 x가 특정한 값일 때만 성립하는 등식이고(예: x + 2 = 5는 x = 3일 때만), 항등식은 x에 어떤 값을 넣어도 항상 성립하는 등식입니다(예: (x + 1)² = x² + 2x + 1). (2) 인수분해, 제곱근(x² = k 꼴, (x − p)² = q 꼴), 완전제곱식으로 바꾸기, 근의 공식으로 풉니다. (3) 정수 계수 이차식 ax² + bx + c는 판별식 D = b² − 4ac가 완전제곱수일 때 정수(유리수) 계수로 인수분해됩니다. D가 완전제곱수가 아니면 인수분해되지 않습니다(예: x² − 2x − 1은 D = 8, x² + x + 1은 D = −3). 근이 분수여도 인수분해될 수 있으므로(2x² − x − 1 = (2x + 1)(x − 1)), \"루트가 있을 때\"가 기준입니다.","kw":[{"l":"방정식=특정한 값","a":["방정식","특정한"]},{"l":"항등식=항상 성립","a":["항등식","항상","성립"]},{"l":"인수분해 / 제곱근 / 완전제곱식 / 근의 공식","a":["완전제곱식","인수분해","제곱근"]},{"l":"D가 완전제곱수 → 인수분해 가능","a":["완전제곱수","인수분해","D가"]}]},{"id":"kj_M2","cat":"수학","grade":"중3","q":"두 이차함수 y = f(x), y = g(x)의 그래프가 만나는 점에 대해 답하세요. (1) 두 그래프의 교점의 x좌표가 방정식 f(x) − g(x) = 0의 해인 이유를 설명하세요. (2) f(x) = ax² + bx + c, g(x) = px² + qx + r일 때 f(x) − g(x) = 0을 이차방정식의 일반형으로 나타내세요. (3) 두 그래프가 서로 다른 두 점에서 만날 조건을 말하세요.","a":"(1) 교점은 두 그래프 위에 동시에 있는 점이므로, 그 점의 x좌표에서 f(x)의 값과 g(x)의 값이 같습니다. 즉 f(x) = g(x)이고 이항하면 f(x) − g(x) = 0입니다. 거꾸로 이 방정식의 해 x에서는 두 함수의 값이 같아서 그 점에서 그래프가 만납니다. (2) (a − p)x² + (b − q)x + (c − r) = 0입니다. (3) 이차방정식이 되려면 a ≠ p여야 하고, 서로 다른 두 실근을 가지려면 판별식 D = (b − q)² − 4(a − p)(c − r) > 0이어야 합니다. D = 0이면 한 점에서 접하고, D \u003c 0이면 만나지 않습니다. 예를 들어 f = x² − 2x + 3, g = −x² + 4x − 1이면 f − g = 2x² − 6x + 4 = 2(x − 1)(x − 2)이므로 x = 1, 2에서 만나고 교점은 (1, 2), (2, 3)입니다.","kw":[{"l":"교점에서 f(x)=g(x)","a":["교점에서"]},{"l":"f−g=0","a":["f−g=0","f−g"]},{"l":"(a−p)x²+(b−q)x+(c−r)=0","a":["a−p","b−q","c−r"]},{"l":"D>0 이면 두 점","a":["이면"]}]},{"id":"kj_M3","cat":"수학","grade":"중3","q":"(1) 좌표평면의 네 사분면을 설명하고 각 사분면에서 점의 x좌표, y좌표의 부호를 말하세요. (2) 점 (a, b)에서 ab \u003c 0이고 a − b > 0이면 이 점은 어느 사분면에 있나요? (3) 일차함수 y = ax + b에서 a \u003c 0, b > 0이면 그래프가 지나는 사분면은 어디인가요?","a":"(1) 제1사분면은 (+, +), 제2사분면은 (−, +), 제3사분면은 (−, −), 제4사분면은 (+, −)입니다. 번호는 x축의 양의 방향에서 시작해서 시계 반대 방향으로 붙입니다. 축 위의 점은 어느 사분면에도 속하지 않습니다. (2) ab \u003c 0이므로 a와 b의 부호가 다르고, a − b > 0이므로 a > b입니다. 따라서 a > 0, b \u003c 0이고 점 (a, b)는 제4사분면입니다. (3) 기울기가 음수이므로 오른쪽 아래로 향하는 직선이고 y절편 b가 양수이므로 y축의 양의 부분을 지납니다. x \u003c 0에서는 y > b > 0이라 제2사분면, 0 \u003c x \u003c −b/a에서는 y > 0이라 제1사분면, x > −b/a에서는 y \u003c 0이라 제4사분면을 지납니다. 따라서 제1, 2, 4사분면이고 제3사분면은 지나지 않습니다.","kw":[{"l":"1(+,+) 2(−,+) 3(−,−) 4(+,−)","a":["1(+,+) 2(−,+) 3(−,−) 4(+,−)"]},{"l":"ab\u003c0이면 부호가 다름","a":["0이면","부호가","ab"]},{"l":"a\u003c0,b>0 → 1,2,4사분면","a":["4사분면"]}]},{"id":"kj_M4","cat":"수학","grade":"중3","q":"이차방정식 x² − 5x + 6 = 0에 대해 답하세요. (1) 인수분해로 해를 구하세요. (2) 판별식의 값을 구하고 그 의미를 설명하세요. (3) 두 근의 합과 곱을 계수로 나타내세요.","a":"(1) (x − 2)(x − 3) = 0이므로 x = 2 또는 x = 3입니다. (2) D = b² − 4ac = 25 − 24 = 1이고 D > 0이면 서로 다른 두 실근, D = 0이면 중근, D \u003c 0이면 실근이 없다는 뜻입니다. D = 1은 완전제곱수라서 근이 정수(유리수)로 나오고 인수분해가 됩니다. (3) ax² + bx + c = 0의 두 근의 합은 −b/a, 곱은 c/a입니다. 여기서 합 5 = −(−5)/1, 곱 6 = 6/1이고 2 + 3 = 5, 2 × 3 = 6으로 맞습니다. 근의 공식 x = (−b ± √D) / 2a에서 두 근을 더하면 −b/a가 됩니다.","kw":[{"l":"(x−2)(x−3)","a":["x−2","x−3"]},{"l":"D=1>0 두 실근","a":["실근"]},{"l":"합 −b/a=5","a":["합 −b/a=5","−b"]},{"l":"곱 c/a=6","a":["곱 c/a=6"]}]},{"id":"kj_M5","cat":"수학","grade":"중3","q":"공을 위로 던졌을 때 t초 후의 높이가 h = −5t² + 10t (미터)입니다. (1) 최고 높이와 그때의 시각을 구하세요. (2) 공이 땅에 떨어지는 시각을 구하세요. (3) 이차함수의 그래프에서 꼭짓점, 축, 그리고 x절편이 각각 무엇을 뜻하는지 설명하세요.","a":"(1) h = −5(t² − 2t) = −5(t − 1)² + 5로 고치면 꼭짓점이 (1, 5)입니다. t = 1초에 최고 높이 5 m입니다. (2) 높이가 0이면 −5t(t − 2) = 0이므로 t = 0 또는 t = 2입니다. t = 0은 던진 순간이므로 떨어지는 것은 2초 후입니다. (3) 꼭짓점은 최고점(또는 최저점)이고 위로 올라가다 내려오기 시작하는 지점입니다. 축 t = 1은 그래프가 좌우 대칭이 되는 직선이라 올라가는 데 걸린 시간과 내려오는 데 걸린 시간이 같습니다. x절편은 높이가 0이 되는 시각, 즉 방정식의 해입니다. x²의 계수가 음수이므로 위로 볼록한 그래프입니다.","kw":[{"l":"꼭짓점 (1, 5)","a":["꼭짓점"]},{"l":"최고 5 m","a":["최고 5 m","최고"]},{"l":"착지 2초","a":["착지 2초","착지","2초"]},{"l":"축 t=1 대칭","a":["축 t=1 대칭","대칭"]},{"l":"x절편=방정식의 해","a":["방정식의","x절편"]}]},{"id":"kj_M6","cat":"수학","grade":"중3","q":"이차함수 y = x² − 4x + 3에 대해 답하세요. (1) y = a(x − p)² + q 꼴로 고치고 꼭짓점과 축을 구하세요. (2) x절편과 y절편을 구하세요. (3) a의 부호와 |a|의 크기는 그래프의 모양에 어떤 영향을 주나요? (4) y = x²의 그래프를 어떻게 이동하면 이 그래프가 되나요?","a":"(1) y = (x − 2)² − 1이므로 꼭짓점은 (2, −1), 축은 직선 x = 2입니다. (2) y = 0이면 (x − 1)(x − 3) = 0이므로 x절편은 1과 3이고, x = 0이면 y = 3이므로 y절편은 3입니다. (3) a > 0이면 아래로 볼록(꼭짓점이 최솟값), a \u003c 0이면 위로 볼록(꼭짓점이 최댓값)이고, |a|가 클수록 그래프의 폭이 좁아집니다. (4) y = x²을 x축 방향으로 2, y축 방향으로 −1만큼 평행이동한 것입니다.","kw":[{"l":"완전제곱식 (x−2)²−1","a":["완전제곱식","x−2","²−1"]},{"l":"꼭짓점 (2,−1)","a":["꼭짓점","−1"]},{"l":"x절편 1, 3","a":["x절편 1, 3","x절편"]},{"l":"y절편 3","a":["y절편 3","y절편"]},{"l":"a>0 아래로 볼록","a":["아래로","볼록"]},{"l":"평행이동","a":["평행이동"]}]},{"id":"kj_M7","cat":"수학","grade":"중3","q":"(1) 72와 60을 각각 소인수분해하세요. (2) 최대공약수와 최소공배수를 구하세요. (3) 두 수의 곱과 최대공약수, 최소공배수 사이의 관계를 말하세요. (4) 72의 약수는 모두 몇 개인가요?","a":"(1) 72 = 2³ × 3², 60 = 2² × 3 × 5입니다. (2) 최대공약수는 공통인 소인수를 작은 지수로 곱한 2² × 3 = 12이고, 최소공배수는 모든 소인수를 큰 지수로 곱한 2³ × 3² × 5 = 360입니다. (3) 두 수의 곱 72 × 60 = 4320은 최대공약수와 최소공배수의 곱 12 × 360 = 4320과 같습니다. (4) 소인수분해에서 각 지수에 1을 더해 곱하면 되므로 (3 + 1)(2 + 1) = 12개입니다.","kw":[{"l":"72=2³×3²","a":["72=2³×3²","2³×3²","72"]},{"l":"60=2²×3×5","a":["2²×3×5","60"]},{"l":"최대공약수 12, 최소공배수 360","a":["최대공약수","최소공배수","360"]},{"l":"곱 = gcd×lcm","a":["gcd×lcm"]},{"l":"약수 개수 (지수+1)의 곱","a":["약수","개수","지수"]}]},{"id":"kj_M8","cat":"수학","grade":"중3","q":"연립방정식 x + y = 7, 2x − y = 2를 푸는 방법을 두 가지 말하고 해를 구하세요. 또 연립방정식의 해가 무수히 많거나 없는 경우는 언제인가요?","a":"가감법은 두 식을 더해 y를 없애면 3x = 9이므로 x = 3이고, 이를 첫째 식에 넣으면 y = 4입니다. 대입법은 첫째 식에서 y = 7 − x를 둘째 식에 넣어 2x − (7 − x) = 2, 3x = 9, x = 3을 얻는 방법입니다. 해는 (3, 4)이고 두 직선의 교점입니다. x + y = 3, 2x + 2y = 6처럼 한 식이 다른 식의 상수배이면 두 직선이 일치해서 해가 무수히 많고(부정), x + y = 3, x + y = 5처럼 기울기는 같고 절편이 다르면 평행해서 해가 없습니다(불능).","kw":[{"l":"가감법·대입법","a":["가감법·대입법","가감법","대입법"]},{"l":"(3, 4)","a":["(3, 4)"]},{"l":"해 = 두 직선의 교점","a":["직선의","교점"]},{"l":"일치: 무수히 많음","a":["무수히","일치","많음"]},{"l":"평행: 없음","a":["평행: 없음","평행"]}]},{"id":"kj_M9","cat":"수학","grade":"중3","q":"두 점 (1, 2), (3, 8)을 지나는 직선에 대해 답하세요. (1) 기울기와 일차함수의 식을 구하세요. (2) x절편과 y절편을 구하세요. (3) 기울기가 같은 두 직선의 관계와 기울기의 곱이 −1인 두 직선의 관계를 말하세요.","a":"(1) 기울기는 (8 − 2) ÷ (3 − 1) = 3이고, y = 3x + b에 (1, 2)를 넣으면 b = −1이므로 y = 3x − 1입니다. (2) y = 0이면 x = 1/3이 x절편이고, x = 0이면 y = −1이 y절편입니다. (3) 기울기가 같고 절편이 다르면 서로 평행하고, 기울기의 곱이 −1이면 서로 수직입니다(예: y = 3x − 1과 y = −x/3 + 2).","kw":[{"l":"기울기 = y의 증가량 ÷ x의 증가량 = 3","a":["기울기","증가량"]},{"l":"y=3x−1","a":["y=3x−1","3x−1"]},{"l":"평행: 기울기 같음","a":["기울기","평행","같음"]},{"l":"수직: 곱이 −1","a":["수직","곱이","−1"]}]},{"id":"kj_M10","cat":"수학","grade":"중3","q":"피타고라스 정리에 대해 답하세요. (1) 정리의 내용을 말하세요. (2) 한 변이 a+b인 큰 정사각형의 넓이로 정리를 설명하세요. (3) 변이 5, 12, 13인 삼각형은 직각삼각형인가요? (4) 한 변이 4인 정사각형의 대각선의 길이를 구하세요.","a":"(1) 직각삼각형에서 빗변의 길이를 c, 나머지 두 변을 a, b라 하면 a² + b² = c²입니다. (2) 한 변이 a + b인 정사각형 안에 합동인 직각삼각형 4개를 놓으면 가운데에 한 변이 c인 정사각형이 생깁니다. 전체 넓이는 (a + b)² = a² + 2ab + b²이고, 직각삼각형 4개의 넓이 4 × (1/2)ab = 2ab와 가운데 정사각형 c²의 합과 같으므로 a² + 2ab + b² = 2ab + c²에서 a² + b² = c²입니다. (3) 5² + 12² = 25 + 144 = 169 = 13²이므로 가장 긴 변 13이 빗변인 직각삼각형입니다(피타고라스 정리의 역). (4) 대각선은 직각이등변삼각형의 빗변이므로 √(4² + 4²) = 4√2입니다.","kw":[{"l":"a²+b²=c²","a":["a²+b²=c²","a²","b²","c²"]},{"l":"(a+b)² = 4×(1/2)ab + c²","a":["4×","ab","c²"]},{"l":"5-12-13 직각삼각형","a":["5-12-13","직각삼각형"]},{"l":"정사각형 대각선 = 한 변×√2","a":["정사각형","변×√2","대각선"]}]},{"id":"kj_M11","cat":"수학","grade":"중3","q":"삼각형의 합동 조건과 닮음 조건을 각각 말하고, 닮음비가 2 : 3인 두 도형의 넓이의 비와 부피의 비를 구하세요.","a":"합동 조건은 세 변의 길이가 각각 같을 때(SSS), 두 변의 길이와 그 끼인각의 크기가 각각 같을 때(SAS), 한 변의 길이와 그 양 끝각의 크기가 각각 같을 때(ASA)입니다. 닮음 조건은 세 변의 길이의 비가 같을 때(SSS), 두 변의 길이의 비가 같고 그 끼인각의 크기가 같을 때(SAS), 두 각의 크기가 각각 같을 때(AA)입니다. 닮음비가 m : n이면 넓이의 비는 m² : n², 부피의 비는 m³ : n³이므로 2 : 3이면 넓이의 비는 4 : 9, 부피의 비는 8 : 27입니다. 합동은 닮음비가 1 : 1인 특별한 닮음입니다.","kw":[{"l":"합동: SSS, SAS, ASA","a":["SSS","SAS","ASA"]},{"l":"닮음: SSS 비, SAS 비, AA","a":["SSS","SAS","닮음"]},{"l":"넓이비 4:9","a":["넓이비 4:9","넓이비"]},{"l":"부피비 8:27","a":["부피비 8:27","부피비","27"]}]},{"id":"kj_M12","cat":"수학","grade":"중3","q":"원에 대해 답하세요. (1) 한 호에 대한 원주각과 중심각의 크기 사이의 관계를 말하세요. (2) 지름에 대한 원주각의 크기는 얼마이며 그 이유는 무엇인가요? (3) 원에 내접하는 사각형의 성질을 말하세요. (4) 원의 접선과 반지름의 관계, 한 점에서 그은 두 접선의 길이의 관계를 말하세요.","a":"(1) 원주각의 크기는 같은 호에 대한 중심각의 크기의 절반입니다. 같은 호에 대한 원주각은 모두 같습니다. (2) 지름은 중심각이 180°인 호이므로 원주각은 90°입니다. (3) 마주 보는 두 각의 크기의 합이 180°이고, 한 외각의 크기는 그와 이웃하지 않는 내각의 크기와 같습니다. 거꾸로 마주 보는 각의 합이 180°인 사각형은 원에 내접합니다. (4) 접선은 접점에서 반지름과 수직입니다. 원 밖의 한 점에서 그은 두 접선의 길이는 서로 같습니다. 예를 들어 중심각이 100°이면 원주각은 50°입니다.","kw":[{"l":"원주각 = 중심각 ÷ 2","a":["원주각","중심각"]},{"l":"지름의 원주각 90°","a":["지름의","원주각","90°"]},{"l":"내접사각형 대각의 합 180°","a":["내접사각형","180°","대각의"]},{"l":"접선 ⊥ 반지름","a":["접선 ⊥ 반지름","반지름","접선"]},{"l":"두 접선 길이 같음","a":["접선","길이","같음"]}]},{"id":"kj_M13","cat":"수학","grade":"중3","q":"제곱근과 무리수에 대해 답하세요. (1) 유리수와 무리수의 차이를 설명하세요. (2) √2가 무리수임을 설명하세요. (3) 1/√2와 1/(√3 − 1)의 분모를 유리화하세요.","a":"(1) 유리수는 분수 p/q(p, q는 정수, q ≠ 0)로 나타낼 수 있는 수이고, 무리수는 그렇게 나타낼 수 없는 수입니다. 소수로 나타내면 유리수는 유한소수나 순환소수, 무리수는 순환하지 않는 무한소수입니다. (2) √2 = p/q (p, q는 서로소인 자연수)라고 가정하면 p² = 2q²이므로 p² 이 짝수이고 p도 짝수입니다. p = 2k라 하면 4k² = 2q²에서 q² = 2k²이므로 q도 짝수가 되어 p, q가 서로소라는 가정에 모순입니다. 따라서 √2는 유리수가 아닙니다. (3) 1/√2 = √2/2이고, 1/(√3 − 1) = (√3 + 1)/((√3 − 1)(√3 + 1)) = (√3 + 1)/2입니다.","kw":[{"l":"유리수 = p/q","a":["유리수"]},{"l":"무리수 = 순환하지 않는 무한소수","a":["순환하지","무한소수","무리수"]},{"l":"귀류법: p, q 모두 짝수 → 모순","a":["귀류법","모두","짝수"]},{"l":"분모 유리화","a":["분모 유리화","유리화","분모"]}]},{"id":"kj_M14","cat":"수학","grade":"중3","q":"확률에 대해 답하세요. (1) 주사위 두 개를 던질 때 눈의 합이 7일 확률을 구하세요. (2) 주사위 두 개를 던질 때 적어도 하나가 6일 확률을 구하세요. (3) 확률의 덧셈법칙과 곱셈법칙은 각각 언제 쓰나요?","a":"(1) 전체 경우의 수는 6 × 6 = 36이고, 합이 7인 경우는 (1,6), (2,5), (3,4), (4,3), (5,2), (6,1)의 6가지이므로 6/36 = 1/6입니다. (2) 적어도 하나가 6일 확률은 1에서 둘 다 6이 아닐 확률을 뺍니다. 1 − (5/6)² = 1 − 25/36 = 11/36입니다. (3) 사건 A, B가 동시에 일어나지 않을 때 'A 또는 B'의 확률은 두 확률을 더합니다(덧셈법칙). 두 사건이 서로 영향을 주지 않고 모두 일어날 확률은 곱합니다(곱셈법칙). 어떤 사건이 일어나지 않을 확률은 1에서 그 사건의 확률을 뺍니다.","kw":[{"l":"합 7: 6/36=1/6","a":["36"]},{"l":"적어도 하나: 1−(5/6)²=11/36","a":["적어도","하나","1−"]},{"l":"또는 → 더하기","a":["또는 → 더하기","더하기","또는"]},{"l":"그리고(독립) → 곱하기","a":["곱하기","독립"]}]},{"id":"kj_M15","cat":"수학","grade":"중3","q":"자료 1, 2, 2, 3, 12의 평균, 중앙값, 최빈값을 구하고, 이 자료를 대표하는 값으로 무엇이 적당한지 이유와 함께 말하세요.","a":"평균은 (1 + 2 + 2 + 3 + 12) ÷ 5 = 4, 중앙값은 크기 순으로 가운데인 2, 최빈값은 가장 많이 나온 2입니다. 12 같은 극단적인 값이 있으면 평균이 크게 올라가서 4가 되는데, 자료 대부분은 3 이하이므로 평균은 대표하기에 적절하지 않습니다. 이런 경우에는 극단값의 영향을 덜 받는 중앙값 2가 더 적당합니다. 평균은 모든 값을 반영하지만 극단값에 민감하고, 중앙값은 극단값에 강하며, 최빈값은 범주형 자료(선호도 조사)에서 유용합니다.","kw":[{"l":"평균 4","a":["평균 4","평균"]},{"l":"중앙값 2","a":["중앙값 2","중앙값"]},{"l":"최빈값 2","a":["최빈값 2","최빈값"]},{"l":"극단값에 평균은 민감","a":["극단값에","평균은","민감"]},{"l":"중앙값 적당","a":["중앙값 적당","중앙값","적당"]}]},{"id":"kj_M16","cat":"수학","grade":"중3","q":"루트2가 자연수가 아닌 이유를 증명하시오.","a":"1의 제곱은 1이고 2의 제곱은 4인데 2는 1과 4 사이에 있으므로, 루트2는 1보다 크고 2보다 작은 값입니다. 그런데 자연수는 1, 2, 3, …과 같이 딱 떨어지는 값인데 1과 2 사이에는 자연수가 존재하지 않으므로 루트2는 자연수가 될 수 없습니다.","kw":[{"l":"1²=1, 2²=4 사이에 2가 있음","a":["1²","2²","사이"]},{"l":"1과 2 사이에는 자연수가 없음","a":["자연수가 없","사이에 없"]}]},{"id":"kj_M17","cat":"수학","grade":"중1","q":"두 자연수의 최대공약수와 최소공배수를 곱하면 두 자연수의 곱과 같아지는 까닭을 설명하시오.","a":"두 자연수 A, B를 각각 최대공약수 G와 서로소인 두 수 a, b를 이용해 A=Ga, B=Gb로 나타낼 수 있는데, 이때 최소공배수는 Gab가 되므로, 최대공약수와 최소공배수의 곱은 G×Gab=Ga×Gb=A×B가 되어 두 자연수의 곱과 같아집니다.","kw":[{"l":"A=Ga, B=Gb로 나타냄(G는 최대공약수)","a":["최대공약수","Ga","Gb"]},{"l":"최대공약수×최소공배수=A×B","a":["A×B","곱"]}]},{"id":"kj_M18","cat":"수학","grade":"중3","q":"이차방정식의 근의 공식에서 판별식 b제곱-4ac가 음수이면 실근이 없는 까닭을 실수의 제곱의 성질과 관련지어 설명하시오.","a":"실수는 제곱하면 항상 0 이상의 값이 되므로 어떤 실수를 제곱해도 음수가 될 수 없는데, 판별식이 음수이면 근의 공식에 들어가는 근호 안의 값이 음수가 되어 그 제곱근에 해당하는 실수가 존재하지 않으므로 실근이 없습니다.","kw":[{"l":"실수의 제곱은 항상 0 이상","a":["제곱","0 이상"]},{"l":"근호 안이 음수면 실수인 제곱근이 없음","a":["근호 안","음수"]}]},{"id":"kj_M19","cat":"수학","grade":"중2","q":"연립방정식을 풀 때 가감법과 대입법으로 각각 풀어도 항상 같은 해를 얻는 까닭을 설명하시오.","a":"가감법과 대입법은 모두 등식의 성질을 이용해 두 방정식을 만족하는 x, y의 값을 찾아가는 서로 다른 계산 경로일 뿐이며, 어느 방법으로 풀어도 원래의 두 일차방정식을 동시에 만족하는 값을 구하는 것이 목표이므로 최종적으로 같은 해에 도달하게 됩니다.","kw":[{"l":"둘 다 등식의 성질을 이용한 서로 다른 계산 경로","a":["등식의 성질","경로"]},{"l":"같은 두 방정식을 만족하는 해를 구함","a":["같은 해"]}]},{"id":"kj_M20","cat":"수학","grade":"중3","q":"(a+b)의 제곱과 a의 제곱+b의 제곱이 일반적으로 같지 않은 까닭을 전개 과정을 통해 설명하시오.","a":"(a+b)의 제곱을 실제로 전개하면 a의 제곱+2ab+b의 제곱이 되는데, 여기에는 a의 제곱+b의 제곱에는 없는 2ab라는 항이 추가로 생기므로, a와 b가 모두 0이 아닌 이상 두 식은 일반적으로 같지 않습니다.","kw":[{"l":"(a+b)²=a²+2ab+b²","a":["2ab"]},{"l":"2ab라는 항이 추가로 생김","a":["추가","2ab"]}]},{"id":"kj_M21","cat":"수학","grade":"중3","q":"인수분해가 다항식의 곱셈(전개)과 서로 역의 관계에 있다는 것을 예를 들어 설명하시오.","a":"예를 들어 x제곱+5x+6을 인수분해하면 (x+2)(x+3)이 되는데, 반대로 (x+2)(x+3)을 전개하면 다시 x제곱+5x+6이 되므로, 인수분해와 전개는 하나의 다항식을 곱의 꼴로 바꾸는 것과 곱의 꼴을 하나의 다항식으로 바꾸는 것으로 서로 정반대의 과정입니다.","kw":[{"l":"인수분해와 전개는 서로 정반대의 과정","a":["정반대","역"]},{"l":"예시로 서로 되돌아감을 보임","a":["x+2","x+3"]}]},{"id":"kj_M22","cat":"수학","grade":"중2","q":"일차함수 y=ax+b의 그래프에서 a의 값이 그래프의 기울기와 같다는 것을 x의 증가량과 y의 증가량의 비율로 확인하는 과정을 설명하시오.","a":"x의 값이 x1에서 x2로 변할 때 y의 값은 각각 a×x1+b와 a×x2+b가 되므로, y의 증가량은 a×(x2-x1)이 되고, 이를 x의 증가량인 (x2-x1)으로 나누면 항상 a라는 값을 얻게 되어 기울기가 a임을 확인할 수 있습니다.","kw":[{"l":"y의 증가량이 a×(x의 증가량)이 됨","a":["a×","증가량"]},{"l":"나누면 항상 a가 됨","a":["항상 a"]}]},{"id":"kj_M23","cat":"수학","grade":"중3","q":"이차함수의 그래프가 좌우 대칭인 곡선이 되는 까닭을 식을 이용해 설명하시오.","a":"이차함수 y=ax제곱에서 x 대신 -x를 대입해도 (-x)의 제곱은 x의 제곱과 같으므로 y의 값이 똑같이 나오는데, 이는 축(y축)을 기준으로 좌우 대칭인 위치에 있는 두 x값이 항상 같은 y값을 가진다는 것을 의미하므로 그래프가 좌우 대칭이 됩니다.","kw":[{"l":"(-x)²=x²이므로 y값이 같음","a":["(-x)²","같음"]},{"l":"축을 기준으로 좌우 대칭","a":["좌우 대칭"]}]},{"id":"kj_M24","cat":"수학","grade":"중2","q":"일차함수의 그래프와 일차방정식의 그래프가 사실상 같은 것으로 다루어지는 까닭을 설명하시오.","a":"미지수가 2개인 일차방정식 ax+by+c=0을 y에 대해 정리하면 일차함수 y=-(a/b)x-(c/b)의 꼴이 되므로, 두 식은 표현 방식만 다를 뿐 나타내는 x와 y 사이의 관계는 완전히 같아서 그래프도 정확히 일치합니다.","kw":[{"l":"y에 대해 정리하면 일차함수 꼴이 됨","a":["y에 대해 정리"]},{"l":"같은 관계를 나타내 그래프가 일치","a":["그래프가 일치"]}]},{"id":"kj_M25","cat":"수학","grade":"중1","q":"반비례 관계 y=a/x(a≠0)에서 x의 값이 2배, 3배가 될 때 y의 값이 어떻게 변하는지 식을 이용해 설명하시오.","a":"y=a/x에서 x가 2배가 되면 y=a/(2x)이므로 원래 y의 값의 1/2배가 되고, x가 3배가 되면 y는 원래 값의 1/3배가 됩니다. 이처럼 반비례 관계에서는 x가 커지는 배수만큼 y는 그 역수배로 작아집니다.","kw":[{"l":"x가 2배면 y는 1/2배","a":["1/2"]},{"l":"x가 커지는 배수의 역수배로 y가 작아짐","a":["역수배"]}]},{"id":"kj_M26","cat":"수학","grade":"중2","q":"피타고라스 정리를 정사각형의 넓이를 이용해 증명하시오.","a":"직각을 낀 두 변이 a, b이고 빗변이 c인 직각삼각형 4개를 이용해, 한 변의 길이가 a+b인 큰 정사각형 안에 한 변의 길이가 c인 정사각형이 놓이도록 배치합니다. 큰 정사각형의 넓이는 (a+b)의 제곱이면서 동시에 네 직각삼각형의 넓이의 합(2ab)과 가운데 작은 정사각형의 넓이(c의 제곱)의 합과도 같으므로, (a+b)의 제곱=2ab+c의 제곱이 되고, 좌변을 전개해 정리하면 a의 제곱+b의 제곱=c의 제곱을 얻습니다.","kw":[{"l":"큰 정사각형의 넓이를 두 가지 방식으로 계산","a":["큰 정사각형","넓이"]},{"l":"(a+b)²=2ab+c²을 정리해 a²+b²=c² 도출","a":["2ab","c²"]}]},{"id":"kj_M27","cat":"수학","grade":"중2","q":"평행사변형의 두 대각선이 서로 다른 것을 이등분한다는 성질을 삼각형의 합동을 이용해 증명하시오.","a":"평행사변형 ABCD에서 두 대각선의 교점을 O라고 하면, 삼각형 OAB와 삼각형 OCD에서 AB와 CD의 길이가 같고, AB와 CD가 평행하므로 엇각인 각 OAB와 각 OCD, 각 OBA와 각 ODC의 크기가 각각 같습니다. 따라서 ASA 합동에 의해 두 삼각형은 합동이므로 대응변인 OA와 OC, OB와 OD의 길이가 각각 같아져 두 대각선은 서로를 이등분합니다.","kw":[{"l":"삼각형 OAB와 OCD가 ASA 합동","a":["ASA","합동"]},{"l":"대응변 OA=OC, OB=OD","a":["OA","OC"]}]},{"id":"kj_M28","cat":"수학","grade":"중2","q":"삼각형의 두 변의 중점을 연결한 선분이 나머지 한 변과 평행하고 길이가 그 절반이 된다는 성질(중점연결정리)을 닮음을 이용해 증명하시오.","a":"삼각형 ABC에서 AB, AC의 중점을 각각 M, N이라고 하면, 삼각형 AMN과 삼각형 ABC에서 AM:AB=AN:AC=1:2이고 각 A는 공통이므로 SAS 닮음입니다. 닮음비가 1:2이므로 대응변인 MN과 BC의 길이의 비도 1:2가 되어 MN의 길이는 BC의 절반이고, 대응각이 같으므로 MN과 BC는 평행합니다.","kw":[{"l":"삼각형 AMN과 ABC가 SAS 닮음(닮음비 1:2)","a":["SAS 닮음","1:2"]},{"l":"MN=BC의 절반, MN∥BC","a":["절반","평행"]}]},{"id":"kj_M29","cat":"수학","grade":"중3","q":"한 호에 대한 원주각의 크기가 그 호에 대한 중심각의 크기의 절반이 되는 까닭을, 원의 중심이 원주각의 내부에 있는 경우를 예로 들어 증명하시오.","a":"원 위의 점 P와 원의 중심 O, 호의 양 끝 점 A, B에 대해 선분 PO를 연장하여 지름을 그으면 삼각형 OPA와 삼각형 OPB는 각각 이등변삼각형이 되므로, 이등변삼각형의 두 밑각이 같다는 성질과 삼각형의 외각은 이웃하지 않는 두 내각의 합과 같다는 성질을 이용하면, 중심각 AOB의 크기가 원주각 APB의 크기의 2배가 됨을 보일 수 있습니다.","kw":[{"l":"PO를 연장한 지름을 이용해 이등변삼각형을 만듦","a":["이등변삼각형","지름"]},{"l":"외각의 성질로 중심각이 원주각의 2배임을 보임","a":["외각","2배"]}]},{"id":"kj_M30","cat":"수학","grade":"중2","q":"닮은 두 입체도형의 부피의 비가 닮음비의 세제곱이 되는 까닭을, 닮음비가 넓이의 비에 미치는 영향과 관련지어 설명하시오.","a":"닮음비가 m:n인 두 입체도형은 대응하는 모든 길이의 비가 m:n이므로, 밑면의 넓이와 같은 이차원적인 양은 닮음비의 제곱인 m²:n²의 비를 가집니다. 부피는 이 넓이에 다시 높이(길이)를 곱한 양이므로, 넓이의 비(m²:n²)에 다시 길이의 비(m:n)를 곱하여 부피의 비는 m³:n³이 됩니다.","kw":[{"l":"넓이는 닮음비의 제곱","a":["제곱","넓이"]},{"l":"부피는 넓이×높이라 닮음비의 세제곱","a":["세제곱","부피"]}]},{"id":"kj_M31","cat":"수학","grade":"중2","q":"동전 한 개를 던지는 시행을 여러 번 반복할 때, 앞면이 나오는 횟수의 비율이 점점 1/2에 가까워진다고 알려져 있습니다. 이것이 확률의 정의와 어떤 관련이 있는지 설명하시오.","a":"확률은 같은 시행을 여러 번 반복할 때 어떤 사건이 일어나는 상대도수가 가까워지는 일정한 값으로 정의되므로, 동전 던지기를 반복할수록 앞면이 나오는 비율이 1/2에 가까워지는 현상은 동전의 앞면이 나올 확률이 1/2이라는 것을 실제 실험을 통해 보여 주는 예라고 할 수 있습니다.","kw":[{"l":"반복 시행에서 상대도수가 가까워지는 값이 확률","a":["상대도수","가까워"]},{"l":"앞면이 나올 확률이 1/2임을 보여 줌","a":["1/2"]}]},{"id":"kj_M32","cat":"수학","grade":"중3","q":"어떤 자료에 매우 크거나 매우 작은 극단적인 값(이상치)이 하나 포함되어 있을 때, 평균과 중앙값 중 어느 대푯값이 영향을 덜 받는지 설명하시오.","a":"평균은 모든 변량의 값을 더해서 구하므로 극단적으로 크거나 작은 값 하나가 있으면 전체 평균이 크게 영향을 받을 수 있지만, 중앙값은 자료를 크기순으로 나열했을 때 가운데 있는 값만을 이용하므로 극단적인 값의 크기 자체보다는 순서에만 영향을 받아 상대적으로 영향을 덜 받습니다.","kw":[{"l":"평균은 극단값에 크게 영향받음","a":["평균","영향"]},{"l":"중앙값은 순서만 이용해 영향을 덜 받음","a":["중앙값","영향을 덜"]}]},{"id":"kj_M33","cat":"수학","grade":"중2","q":"여사건의 확률(어떤 사건이 일어나지 않을 확률)을 이용해 확률을 구하는 것이 유용한 경우는 어떤 상황인지, \"적어도\"라는 표현과 관련지어 설명하시오.","a":"\"적어도 하나는 ~일 확률\"을 직접 구하려면 하나인 경우, 둘인 경우 등 여러 경우를 따로 더해야 해서 복잡해지는 경우가 많은데, 반대로 그 사건이 하나도 일어나지 않는 여사건의 확률은 한 가지 경우만 계산하면 되므로 훨씬 간단할 때가 많아, 전체 확률 1에서 여사건의 확률을 빼는 방법이 유용합니다.","kw":[{"l":"\"적어도\"의 확률은 직접 구하면 복잡함","a":["적어도","복잡"]},{"l":"여사건은 한 가지 경우만 계산하면 되어 간단","a":["여사건","간단"]}]},{"id":"kj_M34","cat":"수학","grade":"중3","q":"키와 몸무게처럼 서로 관련이 있어 보이는 두 변량 사이의 관계를, 원인과 결과로 단정하지 않고 \"상관관계\"라는 표현을 쓰는 까닭을 설명하시오.","a":"상관관계는 두 변량이 함께 증가하거나 감소하는 경향이 있다는 것을 보여줄 뿐, 한 변량이 다른 변량의 직접적인 원인이라는 것까지 증명하지는 못합니다. 두 변량 모두에 영향을 주는 다른 숨은 요인이 있을 수도 있으므로, 산점도에서 경향성이 보이더라도 이를 곧바로 인과 관계로 단정하지 않고 상관관계라고 표현합니다.","kw":[{"l":"경향성이 있다고 원인·결과까지 증명하지 못함","a":["원인","결과"]},{"l":"다른 숨은 요인이 있을 수 있음","a":["숨은 요인"]}]},{"id":"kj_M35","cat":"수학","grade":"중3","q":"분모가 루트를 포함한 무리수일 때, 분모와 분자에 같은 무리수를 곱해 분모를 유리수로 만들 수 있는 원리를 설명하시오.","a":"루트a와 루트a를 곱하면 근호가 사라져 a라는 유리수가 되는 성질을 이용하는 것으로, 분모가 루트a 꼴일 때 분모와 분자에 똑같이 루트a를 곱하면 분모는 a라는 유리수로 바뀌면서도 분수 전체의 값은 1을 곱한 것과 같으므로 변하지 않습니다.","kw":[{"l":"루트a×루트a=a(유리수)","a":["루트a×루트a","유리수"]},{"l":"분모·분자에 같은 수를 곱해 값이 변하지 않음","a":["값이 변하지 않","1을 곱"]}]},{"id":"kj_M36","cat":"수학","grade":"중2","q":"연립방정식을 이루는 두 일차방정식이 x, y의 계수는 각각 같지만 상수항이 다를 때 해가 없는 까닭을, 두 직선의 관계로 증명하시오.","a":"x, y의 계수가 각각 같은 두 일차방정식은 두 직선의 기울기가 서로 같다는 것을 의미하는데, 상수항까지 다르므로 두 직선은 서로 평행하면서 일치하지는 않는 서로 다른 직선이 됩니다. 평행한 두 직선은 아무리 연장해도 만나는 점이 없으므로, 두 방정식을 동시에 만족하는 x, y의 값이 존재하지 않아 해가 없습니다.","kw":[{"l":"계수가 같아 기울기가 같음(평행)","a":["기울기","평행"]},{"l":"상수항이 달라 일치하지 않아 만나지 않음","a":["일치하지 않","만나지 않"]}]},{"id":"kj_M37","cat":"수학","grade":"중3","q":"이차방정식 x제곱+bx+c=0을 완전제곱식을 이용해 푸는 과정을, x제곱+6x+2=0을 예로 들어 설명하시오.","a":"x제곱+6x+2=0에서 상수항을 우변으로 이항하면 x제곱+6x=-2가 되고, 양변에 x의 계수의 절반의 제곱인 9를 더하면 좌변이 완전제곱식이 되어 (x+3)의 제곱=7이 됩니다. 양변에 제곱근을 취하면 x+3=±루트7이므로 x=-3±루트7이라는 해를 얻습니다.","kw":[{"l":"x의 계수 절반의 제곱을 양변에 더해 완전제곱식을 만듦","a":["완전제곱식","절반의 제곱"]},{"l":"제곱근을 취해 x=-3±루트7","a":["제곱근","±루트7"]}]},{"id":"kj_M38","cat":"수학","grade":"중2","q":"두 수의 합이 20이고 차가 4일 때, 연립방정식을 세워 이 두 수를 구하는 과정을 설명하시오.","a":"두 수를 x, y라 하면 합이 20이므로 x+y=20, 차가 4이므로 x-y=4라는 연립방정식을 세울 수 있습니다. 두 식을 변끼리 더하면 2x=24이므로 x=12이고, 이를 x+y=20에 대입하면 y=8이 되어 두 수는 12와 8입니다.","kw":[{"l":"x+y=20, x-y=4로 연립방정식을 세움","a":["x+y=20","x-y=4"]},{"l":"더해서 x=12, y=8을 구함","a":["12","8"]}]},{"id":"kj_M39","cat":"수학","grade":"중1","q":"두 일차부등식 x>2와 x\u003c5를 동시에 만족하는 x의 범위를 구하는 과정과, 이를 수직선으로 나타내는 방법을 설명하시오.","a":"x>2와 x\u003c5를 모두 만족해야 하므로 두 부등식의 공통 범위를 구하면 2\u003cx\u003c5가 되며, 이를 수직선에 나타낼 때는 2와 5를 나타내는 점을 등호가 없으므로 빈 원으로 표시하고 그 사이 구간에 선을 그어 나타냅니다.","kw":[{"l":"두 부등식의 공통 범위(교집합)","a":["공통 범위","2\u003cx\u003c5"]},{"l":"2와 5를 빈 원으로 표시","a":["빈 원"]}]},{"id":"kj_M40","cat":"수학","grade":"중3","q":"곱셈 공식 (a-b)의 제곱을 (a+b)의 제곱 공식으로부터 유도하는 과정을 설명하시오.","a":"(a-b)는 a+(-b)로 볼 수 있으므로, (a+b)의 제곱 공식인 a제곱+2ab+b제곱에서 b 대신 -b를 대입하면 a제곱+2a(-b)+(-b)의 제곱이 되고, 이를 정리하면 a제곱-2ab+b제곱이 되어 (a-b)의 제곱 공식을 얻을 수 있습니다.","kw":[{"l":"a-b를 a+(-b)로 보고 b 대신 -b를 대입","a":["-b","대입"]},{"l":"a²-2ab+b²을 얻음","a":["a²-2ab+b²","-2ab"]}]},{"id":"kj_M41","cat":"수학","grade":"중3","q":"이차함수 y=ax제곱+bx+c의 그래프가 x축과 만나지 않을 수 있는 경우를, a의 부호와 그래프의 위치 관계로 설명하시오.","a":"a가 양수여서 아래로 볼록한 그래프인데 그래프 전체가 x축보다 위쪽에 있거나, a가 음수여서 위로 볼록한 그래프인데 그래프 전체가 x축보다 아래쪽에 있으면, 그래프가 x축과 만나는 점이 전혀 없게 되므로 이차방정식 ax제곱+bx+c=0은 실근을 갖지 않게 됩니다.","kw":[{"l":"아래로 볼록하면서 전체가 x축 위에 있음","a":["아래로 볼록","위"]},{"l":"위로 볼록하면서 전체가 x축 아래에 있음","a":["위로 볼록","아래"]}]},{"id":"kj_M42","cat":"수학","grade":"중2","q":"서로 다른 두 점이 주어지면 그 두 점을 지나는 일차함수의 식이 오직 하나로 정해지는 까닭을 설명하시오.","a":"일차함수의 그래프는 직선인데, 서로 다른 두 점을 지나는 직선은 기하학적으로 오직 하나만 그을 수 있습니다. 두 점의 좌표를 이용하면 기울기를 하나로 정할 수 있고, 그 기울기와 한 점의 좌표를 이용하면 y절편도 하나로 정해지므로, 결국 일차함수의 식 y=ax+b에서 a와 b가 각각 하나의 값으로 정해집니다.","kw":[{"l":"두 점을 지나는 직선은 하나뿐","a":["직선은 하나","두 점"]},{"l":"기울기와 y절편이 각각 하나로 정해짐","a":["기울기","y절편"]}]},{"id":"kj_M43","cat":"수학","grade":"중1","q":"평행한 두 직선이 한 직선과 만날 때 동위각의 크기가 같다는 성질을 이용해, 엇각의 크기도 같다는 것을 증명하시오.","a":"평행선이 한 직선과 만날 때 동위각의 크기는 서로 같은데, 엇각의 위치에 있는 두 각 중 하나는 어떤 각의 맞꼭지각이면서 동시에 다른 한 엇각과는 동위각 관계에 있습니다. 맞꼭지각의 크기는 항상 같고 동위각의 크기도 평행선에서 항상 같으므로, 이 두 성질을 연결하면 엇각의 크기도 서로 같다는 것을 알 수 있습니다.","kw":[{"l":"맞꼭지각과 동위각 관계를 함께 이용","a":["맞꼭지각","동위각"]},{"l":"엇각의 크기가 같음을 보임","a":["엇각","같"]}]},{"id":"kj_M44","cat":"수학","grade":"중1","q":"삼각형의 한 외각의 크기가 그와 이웃하지 않는 두 내각의 크기의 합과 같다는 성질을 증명하시오.","a":"삼각형의 세 내각의 크기의 합은 180°이고, 한 내각과 그에 대응하는 외각의 크기의 합도 180°(평각)이므로, 외각의 크기는 180°에서 그 내각을 뺀 값과 같습니다. 그런데 세 내각의 합이 180°이므로 180°에서 한 내각을 뺀 값은 나머지 두 내각의 합과 같으므로, 결국 외각의 크기는 이웃하지 않는 두 내각의 크기의 합과 같습니다.","kw":[{"l":"세 내각의 합(180°)과 평각(180°)을 이용","a":["180°","평각"]},{"l":"외각=나머지 두 내각의 합","a":["외각","두 내각의 합"]}]},{"id":"kj_M45","cat":"수학","grade":"중2","q":"마름모의 두 대각선이 서로 수직으로 만난다는 성질을 이등변삼각형의 성질을 이용해 증명하시오.","a":"마름모 ABCD에서 두 대각선의 교점을 O라고 하면 마름모는 평행사변형이므로 OB=OD이고, 마름모의 네 변의 길이가 모두 같으므로 삼각형 ABD는 AB=AD인 이등변삼각형입니다. 이등변삼각형에서 꼭지각의 이등분선(대각선 AC)은 밑변(BD)을 수직이등분하므로, 두 대각선 AC와 BD는 서로 수직으로 만납니다.","kw":[{"l":"삼각형 ABD가 이등변삼각형(AB=AD)","a":["이등변삼각형","AB=AD"]},{"l":"꼭지각의 이등분선이 밑변을 수직이등분","a":["수직이등분"]}]},{"id":"kj_M46","cat":"수학","grade":"중3","q":"한 원에서 크기가 같은 두 중심각에 대한 호의 길이는 서로 같다는 성질을 증명하시오.","a":"한 원에서 중심각의 크기와 호의 길이는 정비례 관계에 있으므로, 중심각의 크기가 같으면 그에 대응하는 호의 길이의 비율도 같아 두 호의 길이는 서로 같아집니다. 이는 두 부채꼴을 원의 중심을 기준으로 회전시켰을 때 중심각이 같으므로 완전히 겹쳐진다는 사실로도 확인할 수 있습니다.","kw":[{"l":"중심각과 호의 길이가 정비례","a":["정비례"]},{"l":"회전시키면 완전히 겹쳐짐","a":["겹쳐","회전"]}]},{"id":"kj_M47","cat":"수학","grade":"중3","q":"부채꼴의 호의 길이와 넓이를 구하는 공식이 중심각의 크기에 정비례하는 까닭을 원 전체와 비교하여 설명하시오.","a":"부채꼴은 원을 중심각의 크기만큼 잘라낸 도형으로 볼 수 있는데, 원 전체의 중심각은 360°이므로 부채꼴의 중심각이 원 전체 중심각(360°)에서 차지하는 비율만큼 원의 둘레(호의 길이)와 원의 넓이도 함께 차지하게 됩니다. 따라서 부채꼴의 호의 길이와 넓이는 각각 원의 둘레와 넓이에 (중심각/360°)라는 비율을 곱한 값이 되어, 중심각의 크기에 정비례합니다.","kw":[{"l":"중심각이 360°에서 차지하는 비율만큼 잘라낸 것","a":["360°","비율"]},{"l":"원의 둘레·넓이에 그 비율을 곱함","a":["둘레","넓이","비율을 곱"]}]},{"id":"kj_M48","cat":"수학","grade":"중3","q":"30°, 45°, 60°의 삼각비 값이 특수한 직각삼각형에서 어떻게 얻어지는지, 45°인 경우를 예로 들어 설명하시오.","a":"두 밑각이 모두 45°인 직각이등변삼각형은 직각을 낀 두 변의 길이가 서로 같은데, 이 길이를 1이라 하면 피타고라스 정리에 의해 빗변의 길이는 루트2가 됩니다. 이때 sin45°는 빗변에 대한 높이의 비이므로 1/루트2, 즉 루트2/2가 되고, 같은 방식으로 cos45°도 루트2/2, tan45°는 1/1=1이 됩니다.","kw":[{"l":"직각이등변삼각형(변 1, 1, 빗변 루트2)","a":["직각이등변삼각형","루트2"]},{"l":"sin45°=cos45°=루트2/2","a":["루트2/2"]}]},{"id":"kj_M49","cat":"수학","grade":"중2","q":"닮은 두 삼각형에서 대응변의 길이의 비가 모두 같으면 대응각의 크기도 모두 같아지는 까닭을 SSS 닮음과 관련지어 설명하시오.","a":"세 쌍의 대응변의 길이의 비가 모두 같으면 SSS 닮음 조건에 의해 두 삼각형은 닮은 도형이 되는데, 닮음의 정의에 따르면 한 도형을 일정한 비율로 확대·축소한 것이 다른 도형과 합동이 되어야 하므로, 합동인 도형에서 대응각의 크기가 같다는 성질이 그대로 이어져 닮은 두 삼각형의 대응각의 크기도 모두 같아집니다.","kw":[{"l":"SSS 닮음 조건을 만족","a":["SSS","닮음"]},{"l":"합동에서 대응각이 같다는 성질이 이어짐","a":["합동","대응각"]}]},{"id":"kj_M50","cat":"수학","grade":"중3","q":"5개 변량 x1~x5의 평균이 6, 분산이 4일 때 각 변량을 2배 한 뒤 3을 더한 새 변량의 평균, 분산, 표준편차를 구하시오.","a":"새 변량 y=2x+3의 평균은 2×6+3=15입니다. 편차는 (2x+3)−15=2(x−6)이므로 편차의 제곱은 4배가 되어 분산은 4×4=16이고 표준편차는 4입니다. 더한 값 3은 평균만 옮기고 흩어진 정도에는 영향이 없습니다.","kw":[{"l":"평균 15","a":["15"]},{"l":"분산 16 (2²배)","a":["16","4배","2²"]},{"l":"표준편차 4, 더하기는 분산에 영향 없음","a":["표준편차","4"]}],"level":"advanced"},{"id":"kj_M51","cat":"수학","grade":"중3","q":"40명인 반의 수학 평균이 70점이고 남학생 24명의 평균이 65점일 때 여학생 16명의 평균을 구하시오.","a":"전체 점수의 합은 70×40=2800점이고 남학생의 점수 합은 65×24=1560점입니다. 여학생의 점수 합은 2800−1560=1240점이므로 평균은 1240÷16=77.5점입니다.","kw":[{"l":"전체 합 2800, 남학생 합 1560","a":["2800","1560"]},{"l":"여학생 평균 77.5","a":["77.5"]}],"level":"advanced"},{"id":"kj_M52","cat":"수학","grade":"중2","q":"동전 4개를 동시에 던질 때 앞면이 정확히 2개일 확률과 앞면이 뒷면보다 많을 확률을 구하시오.","a":"전체 경우의 수는 2⁴=16가지입니다. 앞면이 정확히 2개인 경우는 4개 중 2개를 고르는 6가지이므로 확률은 6/16=3/8입니다. 앞면이 3개인 경우 4가지와 4개인 경우 1가지를 더한 5가지이므로 앞면이 뒷면보다 많을 확률은 5/16입니다.","kw":[{"l":"전체 16","a":["16"]},{"l":"정확히 2개 6/16=3/8","a":["3/8","6가지"]},{"l":"앞면이 더 많음 5/16","a":["5/16"]}],"level":"advanced"},{"id":"kj_M53","cat":"수학","grade":"중3","q":"이차함수 y=x²−4x+1의 정의역이 −1≤x≤4일 때 최댓값과 최솟값을 구하시오. 정의역이 3≤x≤6으로 바뀌면 어떻게 됩니까?","a":"y=(x−2)²−3이고 꼭짓점 x=2가 정의역에 들어 있으므로 최솟값은 −3입니다. 최댓값은 꼭짓점에서 먼 쪽 끝인 x=−1에서 y=6(x=4에서는 y=1)입니다. 정의역이 3≤x≤6이면 꼭짓점이 범위 밖이고 그래프가 증가하므로 최솟값은 x=3에서 −2, 최댓값은 x=6에서 13입니다.","kw":[{"l":"꼭짓점 (2,−3)이 범위 안 → 최솟값 −3","a":["−3"]},{"l":"꼭짓점에서 먼 끝에서 최댓값 6","a":["6","x=−1"]},{"l":"범위 밖이면 끝점: 최소 −2, 최대 13","a":["−2","13","끝점"]}],"level":"advanced"},{"id":"kj_M54","cat":"수학","grade":"중3","q":"길이 40m의 울타리로 벽을 한 면으로 이용하여 직사각형 모양의 닭장을 만들려고 합니다. 벽 쪽에는 울타리를 치지 않을 때 닭장의 넓이가 최대가 되는 가로, 세로의 길이를 구하시오.","a":"벽에 수직한 변의 길이를 x라 하면 벽에 평행한 변은 40−2x이고 넓이는 x(40−2x)=−2x²+40x=−2(x−10)²+200입니다. 따라서 x=10일 때 넓이가 최대 200m²이고 이때 벽에 평행한 변은 20m입니다.","kw":[{"l":"변의 길이 x와 40−2x","a":["40−2x"]},{"l":"−2(x−10)²+200 꼴 완성","a":["(x−10)²","200"]},{"l":"10m, 20m","a":["10","20"]}],"level":"advanced"},{"id":"kj_M55","cat":"수학","grade":"중2","q":"남학생 5명, 여학생 4명 중에서 4명의 대표를 뽑을 때 여학생이 적어도 1명 포함되는 경우의 수와, 특정한 두 학생 A, B가 함께 뽑히거나 둘 다 뽑히지 않는 경우의 수를 구하시오.","a":"전체 9C4=126가지에서 남학생만 4명 뽑는 5C4=5가지를 빼면 121가지입니다. A, B가 모두 뽑히면 나머지 7명 중 2명을 뽑는 7C2=21가지, 둘 다 뽑히지 않으면 7명 중 4명을 뽑는 7C4=35가지이므로 합의 법칙으로 56가지입니다.","kw":[{"l":"여사건: 126−5=121","a":["121","여사건"]},{"l":"둘 다 뽑힘 21, 둘 다 안 뽑힘 35","a":["21","35"]},{"l":"56","a":["56"]}],"level":"advanced"},{"id":"kj_M56","cat":"수학","grade":"중2","q":"빨간 공 3개와 파란 공 2개가 들어 있는 주머니에서 동시에 2개를 꺼낼 때 나오는 빨간 공의 개수의 기댓값을 구하시오.","a":"전체 경우는 5C2=10가지입니다. 빨간 공이 0개일 확률은 1/10, 1개일 확률은 3×2/10=6/10, 2개일 확률은 3/10입니다. 기댓값은 0×(1/10)+1×(6/10)+2×(3/10)=12/10=6/5=1.2개입니다.","kw":[{"l":"확률 1/10, 6/10, 3/10","a":["1/10","6/10","3/10"]},{"l":"기댓값 0·1/10+1·6/10+2·3/10","a":["기댓값"]},{"l":"6/5=1.2","a":["6/5","1.2"]}],"level":"advanced"},{"id":"kj_S1","cat":"과학","grade":"중3","q":"중학교 과학에서 배운 힘을 아는 대로 모두 말하고, 각각을 설명하세요.","a":"중력은 지구가 물체를 끌어당기는 힘으로 크기가 무게이고 단위는 N입니다. 탄성력은 변형된 물체가 원래 모양으로 돌아가려는 힘으로 변형시킨 힘과 반대 방향이며 용수철에서는 늘어난 길이에 비례합니다. 마찰력은 접촉면에서 운동을 방해하는 힘으로 운동하려는 방향과 반대이고 면이 거칠수록, 수직으로 누르는 힘이 클수록 커지며 접촉 넓이와는 관계가 없습니다. 수직항력은 면이 물체를 수직으로 떠받치는 힘이고, 장력은 줄이 당기는 힘입니다. 부력은 물이나 공기가 물체를 위로 미는 힘으로 크기는 밀어낸 유체의 무게입니다. 전기력은 같은 전하끼리 밀고 다른 전하끼리 당기는 힘, 자기력은 같은 극끼리 밀고 다른 극끼리 당기는 힘입니다. 이 밖에 작용·반작용(크기가 같고 방향이 반대이며 서로 다른 물체에 작용)과 힘의 평형(한 물체에 작용하는 두 힘이 크기가 같고 방향이 반대라 합력이 0)이 있습니다. 중력·전기력·자기력은 떨어져서 작용하고 나머지는 접촉해서 작용합니다. 관성은 힘이 아니라 물체의 성질이고, 압력도 힘이 아닙니다.","kw":[{"l":"중력·탄성력·마찰력·수직항력·장력·부력·전기력·자기력","a":["수직항력","탄성력","마찰력"]},{"l":"작용·반작용","a":["작용·반작용","반작용","작용"]},{"l":"힘의 평형","a":["힘의 평형","힘의","평형"]},{"l":"관성은 힘이 아님","a":["관성은","힘이","아님"]}]},{"id":"kj_S2","cat":"과학","grade":"중3","q":"(1) 질량과 무게의 차이를 설명하세요. (2) 지구에서 질량이 60 kg인 사람이 달에 가면 질량과 무게는 어떻게 되나요? (3) 용수철저울과 양팔저울은 달에서 각각 어떤 값을 가리키나요? (4) 100 g짜리 추를 매달면 용수철이 2 cm 늘어날 때, 250 g을 매달면 얼마나 늘어나나요?","a":"(1) 질량은 물체가 가진 물질의 양으로 어디서나 같고 단위는 kg입니다. 무게는 물체에 작용하는 중력의 크기로 장소에 따라 달라지고 단위는 N입니다. (2) 질량은 60 kg으로 그대로입니다. 지구에서 무게는 60 × 9.8 = 588 N이고, 달의 중력은 지구의 약 1/6이므로 약 98 N이 됩니다. (3) 용수철저울은 중력(무게)을 재므로 달에서 값이 약 1/6로 줄어듭니다. 양팔저울은 물체와 분동에 같은 중력이 작용해서 비교하므로 달에서도 같은 질량을 가리킵니다. (4) 용수철이 늘어난 길이는 매단 물체의 무게에 비례(훅의 법칙)하므로 250 g이면 2 × 2.5 = 5 cm입니다. 용수철의 탄성 한계를 넘지 않는 범위에서만 성립합니다.","kw":[{"l":"질량: 일정, kg","a":["질량","일정","kg"]},{"l":"무게: 중력, N","a":["무게","중력"]},{"l":"달 1/6","a":["달 1/6"]},{"l":"용수철저울 변함, 양팔저울 변하지 않음","a":["용수철저울","양팔저울","변하지"]},{"l":"늘어난 길이 ∝ 무게","a":["늘어난","길이","무게"]}]},{"id":"kj_S3","cat":"과학","grade":"중3","q":"금속 토막을 용수철저울에 매달았더니 공기 중에서 2.7 N이었고, 물에 완전히 잠기게 했더니 1.7 N이었습니다. (1) 이 금속에 작용하는 부력은 얼마인가요? (2) 금속의 부피, 질량, 밀도를 구하세요. (3) 더 깊이 넣으면 저울 눈금이 어떻게 되나요? (4) 부력의 방향과 크기가 정해지는 원리를 말하세요. (g = 10 m/s², 물의 밀도 1000 kg/m³)","a":"(1) 부력은 공기 중 무게에서 물속 무게를 뺀 값이므로 2.7 − 1.7 = 1.0 N입니다. (2) 부력은 밀어낸 물의 무게이므로 1.0 N = 1000 × V × 10에서 V = 1.0 × 10⁻⁴ m³ = 100 cm³입니다. 질량은 무게 2.7 N ÷ 10 = 0.27 kg = 270 g이고 밀도는 270 g ÷ 100 cm³ = 2.7 g/cm³입니다(알루미늄과 비슷합니다). (3) 완전히 잠긴 뒤에는 밀어낸 물의 부피가 일정하므로 부력이 그대로이고 눈금은 1.7 N으로 변하지 않습니다. 부력은 물체가 잠긴 부피에 따라 정해지고 깊이와는 관계가 없습니다. (4) 부력은 위쪽으로 작용하고 크기는 물체가 밀어낸 유체의 무게와 같습니다(아르키메데스의 원리). 물속에서는 아래쪽 면이 받는 압력이 위쪽 면보다 커서 위로 향하는 힘이 생깁니다.","kw":[{"l":"부력 = W − W′ = 1.0 N","a":["부력","W′"]},{"l":"V = F/ρg = 100 cm³","a":["100","cm³","ρg"]},{"l":"밀도 2.7 g/cm³","a":["cm³","밀도"]},{"l":"깊이와 무관","a":["깊이와 무관","깊이와","무관"]}]},{"id":"kj_S4","cat":"과학","grade":"중3","q":"물체의 운동을 나타낸 속력-시간 그래프에서 0~4초 동안 속력이 0에서 8 m/s로 일정하게 증가하고, 4~8초에는 8 m/s로 일정합니다. (1) 0~4초의 가속도를 구하세요. (2) 0~8초 동안 이동한 거리를 구하세요. (3) 그래프에서 이동 거리를 어떻게 구하는지 설명하세요.","a":"(1) 가속도는 속력의 변화량을 시간으로 나눈 것이므로 (8 − 0) ÷ 4 = 2 m/s²입니다. (2) 0~4초는 삼각형 모양이라 넓이가 (1/2) × 4 × 8 = 16 m이고 4~8초는 직사각형이라 4 × 8 = 32 m입니다. 합하면 48 m입니다. (3) 속력-시간 그래프에서 그래프와 시간 축이 둘러싼 넓이가 이동 거리입니다. 속력 × 시간이 거리이기 때문입니다. 그래프의 기울기는 가속도를 뜻하고, 기울기가 0인 수평선 구간은 등속 운동입니다.","kw":[{"l":"가속도 = Δv/Δt = 2 m/s²","a":["가속도","Δv","Δt"]},{"l":"거리 = 그래프 아래 넓이 16 + 32 = 48 m","a":["그래프","거리","아래"]},{"l":"기울기 0 = 등속","a":["기울기","등속"]}]},{"id":"kj_S5","cat":"과학","grade":"중3","q":"일과 에너지에 대해 답하세요. (1) 과학에서 말하는 일을 정의하세요. (2) 위치 에너지와 운동 에너지의 식을 쓰세요. (3) 질량 2 kg의 물체를 높이 5 m에서 떨어뜨릴 때 처음 위치 에너지와 땅에 닿기 직전의 속력을 구하세요. (마찰 무시, g = 10 m/s²)","a":"(1) 일은 물체에 힘을 가해 힘의 방향으로 이동시킨 것으로 W = F × s이고 단위는 J(줄)입니다. 힘을 주었어도 움직이지 않으면 일이 0이고, 물체를 들고 수평으로 걸을 때도 힘의 방향(위쪽)으로 이동하지 않았으므로 일을 하지 않은 것입니다. (2) 위치 에너지는 mgh, 운동 에너지는 (1/2)mv²입니다. (3) 위치 에너지는 2 × 10 × 5 = 100 J입니다. 마찰이 없으면 역학적 에너지가 보존되어 위치 에너지가 모두 운동 에너지가 되므로 (1/2) × 2 × v² = 100에서 v = 10 m/s입니다.","kw":[{"l":"W=Fs (J)","a":["W=Fs (J)","Fs"]},{"l":"위치 mgh","a":["위치 mgh","mgh","위치"]},{"l":"운동 ½mv²","a":["운동 ½mv²","½mv²","운동"]},{"l":"역학적 에너지 보존","a":["역학적","에너지","보존"]},{"l":"100 J → 10 m/s","a":["100","10"]}]},{"id":"kj_S6","cat":"과학","grade":"중3","q":"밀도에 대해 답하세요. (1) 밀도의 정의와 단위를 말하세요. (2) 질량이 54 g이고 부피가 20 cm³인 금속의 밀도를 구하세요. (3) 물체가 물에 뜨는 조건은 무엇인가요? (4) 대부분의 물질에서 온도가 올라가면 밀도는 어떻게 되나요?","a":"(1) 밀도는 단위 부피당 질량으로 밀도 = 질량 ÷ 부피이고 단위는 g/cm³ 또는 kg/m³입니다. 물질의 종류에 따라 정해지는 고유한 성질이어서 물질을 구별하는 데 쓰입니다. (2) 54 ÷ 20 = 2.7 g/cm³입니다(알루미늄과 비슷합니다). (3) 물체의 밀도가 물(1 g/cm³)보다 작으면 뜨고 크면 가라앉습니다. (4) 온도가 올라가면 질량은 같고 부피가 늘어나서 밀도는 작아집니다. 물은 4℃에서 밀도가 가장 커서 얼음이 물 위에 뜹니다.","kw":[{"l":"밀도 = 질량/부피","a":["밀도","질량","부피"]},{"l":"54/20 = 2.7 g/cm³","a":["cm³","54","20"]},{"l":"물보다
