들어 올릴 수 있습니다.","kw":[{"l":"힘의 크기가 절반으로 줄어듦","a":["절반","줄어"]}]}},{"main":{"id":"kj_FU_S20","cat":"과학","grade":"중1","q":"물을 가득 채운 컵의 입구를 마분지 조각으로 막고 조심스럽게 거꾸로 뒤집으면, 마분지가 떨어지지 않고 물이 쏟아지지 않습니다. 이런 현상이 나타나는 까닭을 설명하시오.","a":"마분지의 아래쪽(바깥쪽)에서 대기가 마분지를 떠받치는 힘인 대기압이 작용하는데, 이 대기압의 크기가 컵 속 물의 무게보다 크기 때문에 마분지가 떨어지지 않습니다.","kw":[{"l":"대기압","a":["대기압"]},{"l":"물의 무게보다 큼","a":["무게보다","더 큼"]}]},"follow":{"id":"kj_FU_S20F","cat":"과학","grade":"중1","q":"만약 이 실험을 대기가 없는 우주 공간에서 한다면 마분지는 어떻게 될까요?","a":"우주 공간에는 대기가 없어 대기압이 작용하지 않으므로, 마분지를 떠받치는 힘이 사라져 물이 쏟아지고 마분지도 함께 떨어질 것입니다.","kw":[{"l":"대기압이 없음","a":["대기압이 없","대기가 없"]},{"l":"물이 쏟아짐","a":["쏟아"]}]}},{"main":{"id":"kj_FU_S21","cat":"과학","grade":"중1","q":"줄다리기에서 양쪽 팀이 똑같은 힘으로 당기면 줄이 움직이지 않습니다. 이렇게 두 힘이 겉으로 아무 효과가 나타나지 않도록 균형을 이루는 상태를 무엇이라고 하며, 그 조건은 무엇인가요?","a":"힘의 평형이라고 합니다. 두 힘의 크기가 같고, 방향이 반대이며, 같은 작용선(일직선) 위에 있을 때 힘의 평형이 이루어집니다.","kw":[{"l":"힘의 평형","a":["평형"]},{"l":"크기가 같고 방향이 반대","a":["크기가 같","방향이 반대"]}]},"follow":{"id":"kj_FU_S21F","cat":"과학","grade":"중1","q":"만약 한쪽 팀이 아주 약간이라도 더 큰 힘으로 당기기 시작하면 줄과 힘의 평형은 어떻게 될까요?","a":"두 힘의 크기가 더 이상 같지 않으므로 힘의 평형이 깨지고, 더 큰 힘을 준 쪽으로 줄이 서서히 끌려가게 됩니다.","kw":[{"l":"평형이 깨짐","a":["깨"]},{"l":"큰 힘 쪽으로 끌려감","a":["끌려","이동"]}]}},{"main":{"id":"kj_FU_S22","cat":"과학","grade":"중2","q":"막대자석 위에 종이를 놓고 철가루를 뿌리면 자석의 극 주위로 특정한 무늬가 나타납니다. 이 무늬를 통해 자석 주위의 자기장에 대해 알 수 있는 것은 무엇인가요?","a":"철가루가 만드는 무늬(자기력선)를 통해 자기장의 방향과 세기를 알 수 있습니다. 무늬가 촘촘할수록 자기장이 세고, 자석의 극에 가까울수록 무늬가 촘촘합니다.","kw":[{"l":"자기장의 방향","a":["방향"]},{"l":"무늬가 촘촘할수록 자기장이 셈","a":["촘촘","세"]}]},"follow":{"id":"kj_FU_S22F","cat":"과학","grade":"중2","q":"막대자석을 반으로 자르면 어떻게 될까요?","a":"자석을 반으로 잘라도 한쪽은 N극만, 다른 쪽은 S극만 남는 것이 아니라, 잘린 두 조각 모두 각각 N극과 S극을 가진 새로운 자석이 됩니다.","kw":[{"l":"각각 N극과 S극을 가진 자석이 됨","a":["N극","S극"]}]}},{"main":{"id":"kj_FU_S23","cat":"과학","grade":"중1","q":"상자에 작은 구멍을 뚫고 반대쪽 면에 기름종이(스크린)를 붙인 바늘구멍 사진기로 촛불을 비추면, 스크린에 상하좌우가 바뀐 촛불의 모습이 나타납니다. 이런 상이 생기는 까닭을 설명하시오.","a":"빛은 곧게 나아가는 직진 성질이 있어서, 촛불의 윗부분에서 나온 빛은 구멍을 지나 스크린의 아랫부분에, 아랫부분에서 나온 빛은 스크린의 윗부분에 도달하기 때문에 상하좌우가 뒤바뀐 상이 생깁니다.","kw":[{"l":"빛의 직진","a":["직진"]},{"l":"상하좌우가 바뀜","a":["상하","좌우","바뀐"]}]},"follow":{"id":"kj_FU_S23F","cat":"과학","grade":"중1","q":"바늘구멍을 원래보다 훨씬 크게 뚫으면 스크린에 나타나는 상은 어떻게 달라질까요?","a":"구멍이 커지면 여러 방향에서 온 빛이 한꺼번에 겹쳐서 통과하기 때문에, 상이 또렷하지 않고 흐릿하게 겹쳐 보입니다.","kw":[{"l":"상이 흐릿해짐","a":["흐릿","겹쳐"]}]}},{"main":{"id":"kj_FU_S24","cat":"과학","grade":"중1","q":"보온병에 뜨거운 물을 담아 두면 시간이 지나도 온도가 잘 떨어지지 않습니다. 보온병이 열의 이동을 막아 온도를 유지하는 구조를 설명하시오.","a":"보온병은 안쪽과 바깥쪽 벽 사이를 진공(또는 이중벽 구조)으로 만들어 전도와 대류에 의한 열 이동을 막고, 안쪽 벽을 은빛으로 처리해 복사에 의한 열도 반사시켜 잘 빠져나가지 않도록 합니다.","kw":[{"l":"전도와 대류를 막음","a":["전도","대류"]},{"l":"복사(열 반사)","a":["복사","반사"]}]},"follow":{"id":"kj_FU_S24F","cat":"과학","grade":"중1","q":"보온병 뚜껑을 자주 열었다 닫았다 하면 보온 효과가 떨어지는 까닭은 무엇인가요?","a":"뚜껑을 열 때마다 보온병 속의 따뜻한 공기가 밖으로 빠져나가고 찬 공기가 들어오는 대류가 일어나 열에너지를 잃기 때문에 보온 효과가 떨어집니다.","kw":[{"l":"대류로 열을 잃음","a":["대류"]},{"l":"따뜻한 공기가 빠져나감","a":["빠져나"]}]}},{"main":{"id":"kj_FU_S25","cat":"과학","grade":"중1","q":"그네의 줄 길이가 같으면 몸무게가 다른 두 사람이 타도 한 번 왕복하는 데 걸리는 시간(주기)이 거의 비슷합니다. 그네와 같은 진자의 주기에 가장 큰 영향을 주는 요인은 무엇인가요?","a":"진자의 주기는 줄(진자)의 길이에 의해 결정되며, 매달린 물체의 무게와는 거의 관계가 없습니다. 줄이 길수록 주기가 길어집니다.","kw":[{"l":"줄의 길이","a":["길이"]},{"l":"무게와 관계없음","a":["무게","관계없"]}]},"follow":{"id":"kj_FU_S25F","cat":"과학","grade":"중1","q":"그네 줄의 길이를 원래보다 길게 늘리면 한 번 왕복하는 데 걸리는 시간은 어떻게 달라질까요?","a":"줄의 길이가 길어지면 주기도 길어지므로, 한 번 왕복하는 데 걸리는 시간이 더 늘어납니다.","kw":[{"l":"주기가 길어짐","a":["길어"]}]}},{"main":{"id":"kj_FU_S26","cat":"과학","grade":"중2","q":"동굴이나 넓은 산속에서 소리를 지르면 잠시 후 같은 소리가 다시 들려오는 메아리 현상이 나타납니다. 메아리가 생기는 까닭을 소리의 성질과 관련지어 설명하시오.","a":"소리도 빛처럼 물체에 부딪히면 반사되는 성질이 있습니다. 소리가 멀리 있는 벽이나 산에 부딪혀 반사되어 돌아오는 데 시간이 걸리기 때문에, 원래 소리를 들은 후 잠시 뒤에 반사된 소리가 다시 들리는 메아리가 생깁니다.","kw":[{"l":"소리의 반사","a":["반사"]},{"l":"되돌아오는 데 시간이 걸림","a":["시간"]}]},"follow":{"id":"kj_FU_S26F","cat":"과학","grade":"중2","q":"박쥐는 어두운 동굴 속에서도 장애물에 부딪히지 않고 날아다닐 수 있습니다. 박쥐는 어떤 원리로 주변의 장애물을 파악하나요?","a":"박쥐는 사람이 들을 수 없는 높은 진동수의 초음파를 내보내고, 그 소리가 장애물에 부딪혀 반사되어 돌아오는 것을 듣고 장애물까지의 거리와 위치를 파악합니다.","kw":[{"l":"초음파","a":["초음파"]},{"l":"반사되어 돌아오는 소리","a":["반사"]}]}},{"main":{"id":"kj_FU_S27","cat":"과학","grade":"중3","q":"바닷가에서 파도를 보면 물결이 계속 해안으로 밀려오지만, 물 위에 뜬 튜브는 앞으로 나아가지 않고 제자리에서 위아래로 오르내리기만 합니다. 이런 모습으로 알 수 있는 파동의 특징은 무엇인가요?","a":"파도(파동)가 진행할 때 파동을 전달하는 물(매질) 자체는 함께 이동하지 않고 제자리에서 진동만 하며, 에너지만 진행 방향으로 전달된다는 것을 알 수 있습니다.","kw":[{"l":"매질은 이동하지 않고 제자리에서 진동","a":["제자리","이동하지 않"]},{"l":"에너지가 전달됨","a":["에너지"]}]},"follow":{"id":"kj_FU_S27F","cat":"과학","grade":"중3","q":"파도는 태풍이 부는 먼바다에서 세게 칠 때가 많습니다. 파도(물결)를 일으키는 주요 원인은 무엇인가요?","a":"파도는 주로 바람이 수면을 스치며 마찰을 일으켜 생기며, 이 밖에도 지진이나 달과 태양의 인력(밀물과 썰물)도 물결을 일으키는 원인이 됩니다.","kw":[{"l":"바람","a":["바람"]}]}},{"main":{"id":"kj_FU_S28","cat":"과학","grade":"중2","q":"생선회를 먹을 때 레몬즙을 뿌려 먹으면 비린내가 줄어들고, 벌에 쏘였을 때는 암모니아수를 발라 통증을 줄이기도 합니다. 이 두 가지 방법에 공통으로 숨어 있는 원리는 무엇일까요?","a":"생선 비린내를 내는 물질이나 벌독처럼 성질이 강한 물질을, 그와 반대되는 성질을 가진 물질(레몬즙, 암모니아수)로 서로 성질을 약하게 만들어 상쇄시키는 원리가 숨어 있습니다.","kw":[{"l":"서로 반대되는 성질을 상쇄","a":["반대","상쇄","약하게"]},{"l":"중화","a":["중화"]}]},"follow":{"id":"kj_FU_S28F","cat":"과학","grade":"중2","q":"속이 쓰릴 때 먹는 제산제도 이와 비슷한 원리로 설명할 수 있습니다. 위산이 지나치게 많이 분비되어 속이 쓰릴 때, 제산제가 증상을 줄여 주는 원리를 설명하시오.","a":"제산제는 위산과 성질이 반대인 물질로, 위산의 성질을 약하게 만들어 위벽을 자극하는 정도를 줄여 주기 때문에 속쓰림 증상이 줄어듭니다.","kw":[{"l":"위산과 반대되는 성질","a":["반대"]},{"l":"위산의 성질을 약하게 함","a":["약하게","줄"]}]}},{"main":{"id":"kj_FU_S29","cat":"과학","grade":"중2","q":"못을 식초에 며칠 담가 두면 기포가 보글보글 올라오면서 못 표면이 변합니다. 반면 같은 식초에 은수저를 담가 두면 별다른 변화가 없습니다. 이런 차이가 나타나는 까닭은 무엇일까요?","a":"철은 산성 물질과 활발하게 반응하여 기체를 발생시키며 성질이 변하지만, 은은 철보다 다른 물질과 반응하는 정도가 훨씬 약해서 식초와 잘 반응하지 않기 때문에 별다른 변화가 없습니다.","kw":[{"l":"금속마다 반응하는 정도가 다름","a":["반응"]},{"l":"기체 발생","a":["기체"]}]},"follow":{"id":"kj_FU_S29F","cat":"과학","grade":"중2","q":"오래된 구리로 만든 지붕이나 동상이 시간이 지나면서 초록색으로 변하는 것을 본 적이 있을 것입니다. 이런 색 변화가 나타나는 까닭은 무엇인가요?","a":"구리가 공기 중의 산소, 수분 등과 오랜 시간 서서히 반응하여 표면에 초록색을 띠는 새로운 물질(녹)이 만들어지기 때문입니다.","kw":[{"l":"공기 중 물질과 반응","a":["반응"]},{"l":"녹(새로운 물질)이 생김","a":["녹","새로운 물질"]}]}},{"main":{"id":"kj_FU_S30","cat":"과학","grade":"중2","q":"촛불이 타다가 촛불에 유리컵을 씌우면 잠시 후 불이 꺼집니다. 이렇게 물질이 타기(연소하기) 위해서는 탈 물질, 산소, 발화점 이상의 온도라는 세 가지 조건이 모두 필요한데, 유리컵을 씌웠을 때는 이 중 무엇이 사라져서 불이 꺼지는 것인가요?","a":"유리컵으로 덮으면 컵 안의 산소가 연소에 다 쓰이고 새로운 산소가 공급되지 않아, 연소에 필요한 세 가지 조건 중 산소가 사라지기 때문에 촛불이 꺼집니다.","kw":[{"l":"산소 부족(공급 차단)","a":["산소"]},{"l":"연소의 조건","a":["조건"]}]},"follow":{"id":"kj_FU_S30F","cat":"과학","grade":"중2","q":"기름에 불이 붙었을 때는 물을 부으면 오히려 위험하고, 젖은 담요를 덮어 꺼야 합니다. 젖은 담요로 불을 끄는 것은 연소의 세 가지 조건 중 무엇을 없애는 방법인가요?","a":"젖은 담요로 불을 덮으면 불꽃과 공기(산소)의 접촉을 차단하여 산소 공급을 막기 때문에 불이 꺼집니다.","kw":[{"l":"산소 차단","a":["산소"]},{"l":"공기와의 접촉을 막음","a":["차단","막"]}]}},{"main":{"id":"kj_FU_S31","cat":"과학","grade":"중2","q":"과산화수소수(오래된 상처 소독약)에 감자 조각이나 이산화 망가니즈를 넣으면 기포가 활발하게 발생합니다. 이때 발생하는 기체가 무엇인지 확인할 수 있는 간단한 방법은 무엇인가요?","a":"꺼져가는 향불을 기체 가까이 가져갔을 때 향불이 다시 살아나 밝게 타오르면, 그 기체는 다른 물질이 타는 것을 돕는 산소라는 것을 확인할 수 있습니다.","kw":[{"l":"꺼져가는 향불이 다시 타오름","a":["향불","다시 타"]},{"l":"산소 확인","a":["산소"]}]},"follow":{"id":"kj_FU_S31F","cat":"과학","grade":"중2","q":"이 반응에서 이산화 망가니즈는 반응이 끝난 뒤에도 양이 줄어들지 않고 그대로 남아 있습니다. 이렇게 자신은 변하지 않으면서 다른 물질의 반응 속도를 빠르게 해 주는 물질을 무엇이라고 하나요?","a":"촉매라고 합니다. 촉매는 반응 전후에 자신의 양이나 성질이 변하지 않으면서 반응 속도를 조절하는 역할을 합니다.","kw":[{"l":"촉매","a":["촉매"]}]}},{"main":{"id":"kj_FU_S32","cat":"과학","grade":"중1","q":"물 100g에 설탕 25g을 녹인 설탕물의 진하기를 숫자로 나타내려고 합니다. 이렇게 용액의 진하기를 나타내는 퍼센트 농도는 어떻게 구하나요?","a":"퍼센트 농도는 용액 전체의 양에 대한 용질의 양의 비율을 백분율로 나타낸 것으로, (용질의 양 ÷ 용액 전체의 양) × 100으로 구합니다.","kw":[{"l":"용질/용액×100","a":["용질","용액"]},{"l":"백분율","a":["백분율","퍼센트"]}]},"follow":{"id":"kj_FU_S32F","cat":"과학","grade":"중1","q":"농도가 다른 두 설탕물을 하나로 섞으면, 섞은 후 설탕물의 농도는 어떻게 구할 수 있나요?","a":"섞기 전 각 설탕물에 들어 있던 설탕의 양을 모두 더하고, 섞은 후 설탕물 전체의 양으로 나누어 다시 백분율로 나타내면 섞은 설탕물의 농도를 구할 수 있습니다.","kw":[{"l":"전체 용질의 양을 더함","a":["더"]},{"l":"전체 용액의 양으로 나눔","a":["나누"]}]}},{"main":{"id":"kj_FU_S33","cat":"과학","grade":"중1","q":"지진이 발생하면 뉴스에서 \"규모 5.0의 지진\"과 같은 표현과 함께 지역별로 \"진도 4\" 같은 표현을 함께 씁니다. 규모와 진도는 각각 무엇을 나타내는 개념인가요?","a":"규모는 지진이 발생할 때 방출된 에너지의 크기를 나타내는 값으로 지진마다 하나의 값만 가지지만, 진도는 어떤 지역에서 사람이 느끼거나 건물이 흔들린 정도를 나타내는 값으로 진앙에서의 거리에 따라 지역마다 다르게 나타납니다.","kw":[{"l":"규모는 에너지 크기(하나의 값)","a":["에너지"]},{"l":"진도는 흔들린 정도(지역마다 다름)","a":["흔들린","지역"]}]},"follow":{"id":"kj_FU_S33F","cat":"과학","grade":"중1","q":"그렇다면 같은 지진이라도 진앙에서 가까운 지역과 먼 지역의 진도는 어떻게 다를까요?","a":"같은 지진이라도 규모는 하나로 같지만, 진앙에서 가까운 지역일수록 흔들림이 더 세게 느껴져 진도가 크게 나타나고, 진앙에서 멀어질수록 진동이 약해져 진도가 작게 나타납니다.","kw":[{"l":"가까울수록 진도가 큼","a":["가까울수록","크"]},{"l":"멀수록 진도가 작음","a":["멀","작"]}]}},{"main":{"id":"kj_FU_S34","cat":"과학","grade":"중2","q":"태양계는 거대한 성운이 중력에 의해 서서히 수축하면서 만들어졌다고 알려져 있습니다. 이 과정에서 태양은 어떻게 만들어졌나요?","a":"성운이 중력에 의해 수축하면서 중심부에 물질이 모여들어 온도와 밀도가 매우 높아지고, 그 중심부에서 수소 핵융합 반응이 시작되면서 스스로 빛을 내는 태양이 만들어졌습니다.","kw":[{"l":"중심부에 물질이 모임","a":["중심"]},{"l":"온도와 밀도가 높아짐","a":["온도","밀도"]}]},"follow":{"id":"kj_FU_S34F","cat":"과학","grade":"중2","q":"태양에서 가까운 곳에는 지구형 행성이, 먼 곳에는 목성형 행성이 만들어진 것으로 알려져 있습니다. 이렇게 위치에 따라 서로 다른 종류의 행성이 만들어진 것과 관련하여, 태양에 가까운 지역과 먼 지역의 환경 차이는 무엇이었을까요?","a":"태양에 가까운 지역은 온도가 높아 가벼운 기체 성분은 날아가고 무거운 암석 성분만 뭉쳐 작고 단단한 지구형 행성이 만들어졌고, 태양에서 먼 지역은 온도가 낮아 기체와 얼음 성분까지 함께 뭉쳐 크고 가벼운 목성형 행성이 만들어졌습니다.","kw":[{"l":"가까운 곳은 온도가 높음","a":["온도가 높"]},{"l":"먼 곳은 기체·얼음까지 뭉침","a":["기체","얼음"]}]}},{"main":{"id":"kj_FU_S35","cat":"과학","grade":"중2","q":"비가 그친 뒤 하늘에 무지개가 나타나는 것을 볼 수 있습니다. 무지개가 생기는 원리를 빛의 성질과 관련지어 설명하시오.","a":"공기 중에 떠 있는 물방울이 작은 렌즈와 같은 역할을 하여, 물방울 속을 통과하는 햇빛이 굴절되고 여러 색의 빛으로 나뉘어 흩어지면서(분산) 무지개가 나타납니다.","kw":[{"l":"물방울에 의한 굴절","a":["굴절"]},{"l":"빛의 분산(여러 색으로 나뉨)","a":["분산","나뉘"]}]},"follow":{"id":"kj_FU_S35F","cat":"과학","grade":"중2","q":"무지개를 보려면 태양을 등지고(뒤로 하고) 서야 잘 보입니다. 그 까닭은 무엇인가요?","a":"무지개는 태양 빛이 물방울 속에서 굴절되고 반사된 뒤 다시 관찰자 쪽으로 돌아오는 빛으로 만들어지기 때문에, 태양을 등지고 서야 그 반사되어 돌아오는 빛과 눈이 마주쳐 무지개를 볼 수 있습니다.","kw":[{"l":"반사되어 돌아오는 빛","a":["반사"]},{"l":"태양을 등지고 봄","a":["등지"]}]}},{"main":{"id":"kj_FU_S36","cat":"과학","grade":"중1","q":"버스가 갑자기 출발하면 서 있던 사람은 뒤로 쏠리고, 갑자기 멈추면 앞으로 쏠립니다. 이런 현상이 나타나는 까닭을 설명하시오.","a":"물체는 원래의 운동 상태를 계속 유지하려는 관성을 가지고 있어서, 버스가 갑자기 움직이면 사람의 몸은 정지 상태를 유지하려 해 뒤로 쏠리고, 버스가 갑자기 멈추면 몸은 움직이던 상태를 유지하려 해 앞으로 쏠립니다.","kw":[{"l":"관성","a":["관성"]},{"l":"원래 운동 상태를 유지하려 함","a":["유지"]}]},"follow":{"id":"kj_FU_S36F","cat":"과학","grade":"중1","q":"자동차에 안전벨트와 에어백을 설치하는 것도 이 성질과 관련이 있습니다. 이것들이 충돌 사고에서 탑승자를 보호하는 원리를 설명하시오.","a":"충돌 시에도 탑승자의 몸은 관성으로 계속 앞으로 나아가려 하는데, 안전벨트와 에어백이 몸을 붙잡고 충격이 전달되는 시간을 늘려 서서히 흡수해 주기 때문에, 몸이 갑자기 딱딱한 곳에 부딪히는 것을 막아 줍니다.","kw":[{"l":"관성으로 계속 나아가려 함","a":["관성"]},{"l":"충격을 서서히 흡수","a":["흡수","서서히"]}]}},{"main":{"id":"kj_FU_S37","cat":"과학","grade":"중2","q":"추운 겨울 밖에 있다가 따뜻한 실내에 들어오면 안경알에 뿌옇게 김이 서립니다. 이런 현상이 나타나는 까닭을 설명하시오.","a":"차가운 안경알 표면에 실내의 따뜻하고 습한 공기가 닿으면, 공기 중의 수증기가 급격히 냉각되어 작은 물방울로 응결되기 때문에 뿌옇게 김이 서립니다.","kw":[{"l":"수증기가 응결(액화)","a":["응결","액화"]},{"l":"차가운 표면에 닿음","a":["차가운"]}]},"follow":{"id":"kj_FU_S37F","cat":"과학","grade":"중2","q":"겨울철 자동차 안에서 히터를 켜서 유리창에 서린 김을 없애기도 합니다. 히터 바람이 김을 없애 주는 까닭은 무엇인가요?","a":"따뜻한 히터 바람이 유리창의 표면 온도를 높여 주면, 공기 중 수증기가 다시 응결하지 못하고 기체 상태로 유지되기 때문에 김이 사라집니다.","kw":[{"l":"유리창 표면 온도를 높임","a":["온도를 높"]},{"l":"응결을 막음","a":["응결"]}]}},{"main":{"id":"kj_FU_S38","cat":"과학","grade":"중1","q":"공사장에서는 안전모를 쓰고, 택배 상자에는 뽁뽁이(에어캡)를 넣어 물건을 보호합니다. 이런 물건들이 충격으로부터 머리나 내용물을 보호하는 공통적인 원리를 설명하시오.","a":"충격이 전달되는 시간을 늘려 충격이 한 순간에 집중되지 않고 서서히 전달되게 함으로써, 순간적으로 받는 힘의 크기를 줄여 주기 때문에 머리나 내용물을 보호할 수 있습니다.","kw":[{"l":"충격이 전달되는 시간을 늘림","a":["시간"]},{"l":"순간적인 힘을 줄임","a":["힘을 줄"]}]},"follow":{"id":"kj_FU_S38F","cat":"과학","grade":"중1","q":"야구에서 공을 받을 때 손을 공이 오는 방향으로 뻗지 않고 뒤로 빼면서 받으면 손이 덜 아픈 까닭도 같은 원리로 설명할 수 있나요?","a":"네, 손을 뒤로 빼면서 받으면 공이 손에 닿아 멈추기까지 걸리는 시간이 늘어나 충격이 서서히 전달되므로, 순간적으로 받는 힘이 줄어들어 손이 덜 아프게 됩니다.","kw":[{"l":"받는 시간을 늘림","a":["시간"]},{"l":"힘이 줄어듦","a":["줄어"]}]}},{"main":{"id":"kj_FU_S39","cat":"과학","grade":"중1","q":"탄산음료의 뚜껑을 열면 \"치익\" 소리와 함께 거품이 솟아오릅니다. 이런 현상이 나타나는 까닭을 기체의 성질과 관련지어 설명하시오.","a":"병 속은 압력이 높게 유지되어 이산화 탄소 기체가 많이 녹아 있는데, 뚜껑을 열어 압력이 낮아지면 기체가 녹아 있을 수 있는 양이 줄어들어, 녹아 있던 이산화 탄소가 기포가 되어 빠르게 빠져나오기 때문에 거품이 솟아오릅니다.","kw":[{"l":"압력이 낮아짐","a":["압력"]},{"l":"녹아 있던 기체가 빠져나옴","a":["빠져나"]}]},"follow":{"id":"kj_FU_S39F","cat":"과학","grade":"중1","q":"냉장고에서 차갑게 식힌 탄산음료와 실온에 둔 미지근한 탄산음료 중, 뚜껑을 열었을 때 거품이 더 심하게 나는 쪽은 어느 것일까요?","a":"기체는 온도가 높을수록 액체에 녹아 있기 어려워지므로, 실온의 미지근한 탄산음료 쪽이 이산화 탄소가 더 쉽게 빠져나와 거품이 더 심하게 납니다.","kw":[{"l":"온도가 높을수록 기체가 덜 녹음","a":["온도"]},{"l":"미지근한 쪽이 더 심함","a":["미지근"]}]}},{"main":{"id":"kj_FU_S40","cat":"과학","grade":"중1","q":"뜨거운 기름에 물이 조금이라도 떨어지면 기름이 사방으로 튀어 매우 위험합니다. 이런 현상이 나타나는 까닭을 물과 기름의 특성 차이와 관련지어 설명하시오.","a":"물은 기름보다 끓는점이 훨씬 낮아 뜨거운 기름 속에서 순간적으로 기체(수증기)로 변하면서 부피가 급격히 커지는데, 이때 주변의 기름을 밀어내며 사방으로 튀게 됩니다.","kw":[{"l":"물이 급격히 기체로 변함","a":["기체","끓"]},{"l":"부피가 급격히 커짐","a":["부피"]}]},"follow":{"id":"kj_FU_S40F","cat":"과학","grade":"중1","q":"물과 기름을 함께 그릇에 담아 두면 서로 섞이지 않고 두 층으로 나뉩니다. 이런 성질을 이용하는 예로 무엇이 있을까요?","a":"바다에 기름 유출 사고가 났을 때 물 위에 뜬 기름만 걷어 내는 방제 작업이나, 샐러드 드레싱을 흔들어 섞었다가 시간이 지나면 다시 층이 분리되는 것 등이 있습니다.","kw":[{"l":"기름 유출 방제","a":["방제","기름 유출"]},{"l":"층이 분리됨","a":["분리","층"]}]}},{"main":{"id":"kj_FU_S41","cat":"과학","grade":"중2","q":"보름달은 주로 해가 지는 저녁 무렵에 동쪽 하늘에서 떠오릅니다. 보름달이 해가 질 때쯤 뜨는 까닭은 무엇일까요?","a":"보름달은 태양-지구-달의 순서로 놓여 지구를 사이에 두고 태양과 반대쪽에 위치하기 때문에, 태양이 서쪽으로 질 때 반대쪽인 동쪽에서 달이 떠오르게 됩니다.","kw":[{"l":"태양과 반대쪽에 위치","a":["반대쪽","반대"]},{"l":"지구를 사이에 둠","a":["지구"]}]},"follow":{"id":"kj_FU_S41F","cat":"과학","grade":"중2","q":"그렇다면 초승달은 하루 중 언제, 어느 방향 하늘에서 잠깐 볼 수 있고, 그 까닭은 무엇인가요?","a":"초승달은 태양에서 가까운 위치에 있어 해가 진 직후 서쪽 하늘에서 잠깐 보이다가 금방 져 버립니다. 태양과 가까이 있어 낮 동안에는 밝은 햇빛에 가려 보이지 않기 때문입니다.","kw":[{"l":"해 진 직후 서쪽 하늘","a":["서쪽","해 진 직후"]},{"l":"태양과 가까운 위치","a":["가까"]}]}},{"main":{"id":"kj_FU_S42","cat":"과학","grade":"중2","q":"달을 매일 같은 시각에 관찰하면 위치가 조금씩 동쪽으로 옮겨 간 것처럼 보이고, 달이 뜨는 시각도 매일 약 50분씩 늦어집니다. 그 까닭은 무엇인가요?","a":"달은 지구 주위를 서에서 동으로 공전하고 있어서, 지구가 하루 자전하는 동안 달도 자신의 공전 궤도를 따라 조금씩 이동하기 때문에, 같은 위치에서 달을 다시 보려면 지구가 조금 더 자전해야 하고, 그만큼 달이 뜨는 시각도 매일 조금씩 늦어집니다.","kw":[{"l":"달의 공전","a":["공전"]},{"l":"뜨는 시각이 매일 늦어짐","a":["늦어"]}]},"follow":{"id":"kj_FU_S42F","cat":"과학","grade":"중2","q":"이 현상 때문에 음력 날짜와 달의 모양(위상)은 서로 관련이 깊습니다. 음력 15일 무렵에는 주로 어떤 모양의 달을 볼 수 있나요?","a":"음력 15일 무렵에는 달이 지구를 사이에 두고 태양과 반대쪽에 있게 되어, 달의 전체 면이 햇빛을 받아 둥근 보름달의 모습을 볼 수 있습니다.","kw":[{"l":"보름달","a":["보름달"]}]}},{"main":{"id":"kj_FU_S43","cat":"과학","grade":"중3","q":"폐동맥은 이름에 \"동맥\"이 들어가지만, 이 혈관 속을 흐르는 피는 동맥혈일까요, 정맥혈일까요? 그 까닭과 함께 설명하시오.","a":"폐동맥에는 정맥혈이 흐릅니다. 동맥과 정맥은 심장에서 나가는 혈관인지 심장으로 들어오는 혈관인지(방향)에 따라 구분하는 이름이고, 동맥혈과 정맥혈은 혈액 속 산소의 양에 따라 구분하는 이름이라 서로 다른 기준입니다. 폐동맥은 심장에서 나가는 혈관이라 \"동맥\"이지만, 아직 폐에서 산소를 공급받기 전이라 이산화 탄소를 많이 포함한 정맥혈이 흐릅니다.","kw":[{"l":"폐동맥엔 정맥혈이 흐름","a":["정맥혈"]},{"l":"동맥/정맥은 방향 기준, 동맥혈/정맥혈은 산소량 기준","a":["방향","산소"]}]},"follow":{"id":"kj_FU_S43F","cat":"과학","grade":"중3","q":"그렇다면 폐정맥에는 어떤 혈액이 흐르는지, 같은 방식으로 설명하시오.","a":"폐정맥에는 동맥혈이 흐릅니다. 폐정맥은 심장으로 들어오는 혈관이라 \"정맥\"이지만, 폐에서 산소를 공급받은 직후이므로 산소가 풍부한 동맥혈이 흐릅니다.","kw":[{"l":"폐정맥엔 동맥혈이 흐름","a":["동맥혈"]}]}},{"main":{"id":"kj_FU_S44","cat":"과학","grade":"중1","q":"식물을 투명한 유리병에 넣고 빛은 충분히 비춰 주지만 병 속의 이산화 탄소를 모두 제거한 상태로 두면 광합성이 일어날까요? 그 까닭과 함께 설명하시오.","a":"광합성이 일어나지 않습니다. 광합성은 빛에너지뿐 아니라 원료가 되는 이산화 탄소와 물이 반드시 함께 필요한 반응이기 때문에, 이산화 탄소가 없으면 빛이 충분해도 포도당을 만들 수 없습니다.","kw":[{"l":"이산화 탄소가 원료로 반드시 필요","a":["이산화 탄소"]},{"l":"광합성이 일어나지 않음","a":["일어나지 않"]}]},"follow":{"id":"kj_FU_S44F","cat":"과학","grade":"중1","q":"실제로 온실에서 작물을 재배할 때는 일부러 이산화 탄소를 인공적으로 공급해 주는 경우가 있습니다. 이렇게 하는 까닭은 무엇인가요?","a":"이산화 탄소는 광합성의 원료이므로, 온실 안의 이산화 탄소 농도를 높여 주면 광합성량이 늘어나 식물이 더 잘 자라고 수확량도 늘어나기 때문입니다.","kw":[{"l":"광합성량이 늘어남","a":["광합성량"]},{"l":"수확량 증가","a":["수확량","잘 자람"]}]}},{"main":{"id":"kj_FU_S45","cat":"과학","grade":"중2","q":"운동을 하지 않고 가만히 잠을 잘 때도 우리 몸속 세포들은 산소를 소비할까요? 그 까닭과 함께 설명하시오.","a":"네, 소비합니다. 세포 호흡은 살아있는 모든 세포에서 생명 활동에 필요한 에너지를 얻기 위해 끊임없이 일어나는 과정이므로, 잠을 자거나 가만히 있을 때도 세포들은 계속 산소를 이용해 호흡하며 에너지를 만들어 냅니다.","kw":[{"l":"세포 호흡은 항상 일어남","a":["항상","끊임없이"]},{"l":"에너지를 만듦","a":["에너지"]}]},"follow":{"id":"kj_FU_S45F","cat":"과학","grade":"중2","q":"그렇다면 격렬한 운동을 할 때는 왜 숨이 더 가빠지고 심장이 더 빨리 뛸까요?","a":"운동을 하면 근육 세포가 더 많은 에너지를 필요로 해 세포 호흡이 활발해지고, 이때 더 많은 산소가 필요해지므로, 산소를 빠르게 공급하기 위해 호흡과 심장 박동이 빨라집니다.","kw":[{"l":"세포 호흡이 활발해짐","a":["활발"]},{"l":"산소 공급을 늘림","a":["산소"]}]}},{"main":{"id":"kj_FU_S46","cat":"과학","grade":"중3","q":"교감 신경은 심장 박동을 빠르게 하고, 부교감 신경은 느리게 합니다. 이렇게 서로 반대 작용을 하는 두 신경이 함께 우리 몸에 분포하는 것이 어떤 점에서 유리한가요?","a":"상황에 따라 몸의 기능을 정교하게 조절할 수 있어 유리합니다. 위급한 상황에서는 교감 신경이 우세해져 몸이 신속하게 대응하도록 하고, 평상시에는 부교감 신경이 우세해져 몸이 안정과 휴식을 취하도록 하여, 상황에 맞게 몸 상태를 조절할 수 있습니다.","kw":[{"l":"상황에 따라 몸 상태를 조절","a":["상황"]},{"l":"서로 반대 작용으로 균형","a":["반대"]}]},"follow":{"id":"kj_FU_S46F","cat":"과학","grade":"중3","q":"달리기 시합 직전에는 심장이 빨리 뛰고 소화 운동은 느려집니다. 이때 우세하게 작용하는 신경은 무엇이며, 소화 운동이 느려지는 것이 어떤 점에서 도움이 될까요?","a":"교감 신경이 우세하게 작용합니다. 위급하거나 긴장되는 상황에서는 소화보다 근육에 에너지를 집중하는 것이 더 중요하므로, 소화 운동을 늦춰 대신 심장 박동을 빠르게 하여 근육에 더 많은 혈액과 산소를 공급합니다.","kw":[{"l":"교감 신경","a":["교감"]},{"l":"근육에 에너지를 집중","a":["근육","에너지를 집중"]}]}},{"main":{"id":"kj_FU_S47","cat":"과학","grade":"중3","q":"부모의 혈액형이 각각 A형과 B형인데, 자녀의 혈액형이 O형으로 나오는 경우가 있습니다. 이런 일이 어떻게 가능한지 유전자형의 관점에서 설명하시오.","a":"A형인 부모가 유전자형 AO를, B형인 부모가 유전자형 BO를 가지고 있다면, 두 부모 모두 자녀에게 O 유전자를 물려줄 수 있어, 자녀가 O 유전자만 두 개(OO) 물려받으면 O형이 될 수 있습니다.","kw":[{"l":"부모가 AO, BO 유전자형을 가짐","a":["AO","BO"]},{"l":"O 유전자를 물려받음","a":["O 유전자"]}]},"follow":{"id":"kj_FU_S47F","cat":"과학","grade":"중3","q":"그렇다면 부모가 각각 A형(AO)과 B형(BO)일 때, 자녀에게서 나올 수 있는 혈액형에는 어떤 것들이 있을까요?","a":"자녀는 부모에게서 A, B, O 유전자를 다양하게 조합해 물려받을 수 있어, AB형, A형, B형, O형이 모두 나올 수 있습니다.","kw":[{"l":"A형 B형 O형 AB형 모두 가능","a":["AB형"]}]}},{"main":{"id":"kj_FU_S48","cat":"과학","grade":"중3","q":"건강한 사람의 오줌에는 사구체에서 여과된 포도당이 전혀 들어있지 않습니다. 포도당은 분명 사구체에서 여과되었는데도 오줌으로 나오지 않는 까닭은 무엇인가요?","a":"사구체에서 여과된 포도당은 세뇨관을 지나는 동안 몸에 필요한 영양소이므로 모세 혈관으로 100% 재흡수되기 때문에, 정상적인 상태에서는 오줌 속에 포도당이 남아있지 않습니다.","kw":[{"l":"세뇨관에서 재흡수됨","a":["재흡수"]},{"l":"전부(100%) 재흡수됨","a":["전부","100"]}]},"follow":{"id":"kj_FU_S48F","cat":"과학","grade":"중3","q":"그런데 당뇨병 환자의 오줌에서는 포도당이 검출되기도 합니다. 그 까닭은 무엇일까요?","a":"당뇨병 환자는 혈당량이 너무 높아 여과되는 포도당의 양이 세뇨관이 재흡수할 수 있는 한계를 넘어서기 때문에, 미처 재흡수되지 못한 포도당이 오줌으로 배출됩니다.","kw":[{"l":"재흡수할 수 있는 양을 넘음","a":["한계","넘"]},{"l":"혈당량이 너무 높음","a":["혈당량"]}]}},{"main":{"id":"kj_FU_S49","cat":"과학","grade":"중3","q":"다리의 정맥에는 군데군데 판막이라는 구조가 있어 혈액이 거꾸로 흐르지 않게 막아 줍니다. 그런데 동맥에는 이런 판막이 거의 없습니다. 그 까닭은 무엇일까요?","a":"동맥은 심장이 강하게 뿜어내는 힘(혈압)으로 혈액이 힘차게 흐르기 때문에 거꾸로 흐를 걱정이 적지만, 정맥은 심장에서 멀어질수록 혈압이 크게 낮아져 혈액이 거꾸로 흐르기 쉬우므로, 이를 막기 위해 판막이 발달했습니다.","kw":[{"l":"정맥은 혈압이 낮음","a":["혈압"]},{"l":"혈액의 역류를 막음","a":["역류"]}]},"follow":{"id":"kj_FU_S49F","cat":"과학","grade":"중3","q":"오래 서서 일하는 사람들이 다리가 붓거나 정맥이 튀어나오는 하지 정맥류가 잘 생기는 까닭을 판막과 관련지어 설명하시오.","a":"오래 서 있으면 다리 정맥에 중력에 의해 혈액이 오래 고이게 되어 판막에 무리가 가고, 판막이 손상되면 혈액이 아래로 역류해 정맥이 늘어나고 튀어나오는 하지 정맥류가 생기기 쉽습니다.","kw":[{"l":"혈액이 오래 고임","a":["고임","고이"]},{"l":"판막이 손상됨","a":["판막"]}]}},{"main":{"id":"kj_FU_S50","cat":"과학","grade":"중2","q":"지구에서 촛불을 켜면 불꽃이 위로 길쭉하게 솟아오르는 모양이 됩니다. 그런데 우주정거장처럼 무중력에 가까운 환경에서 촛불을 켜면 불꽃이 위로 솟지 않고 동그란 공 모양으로 약하게 타오릅니다. 지구에서 불꽃이 위쪽으로 길게 솟아오르는 까닭은 무엇인가요?","a":"촛불 주변의 뜨거워진 공기는 밀도가 작아져 위로 올라가고 차가운 공기가 아래에서 채워지는 대류가 일어나는데, 이 대류 때문에 불꽃이 위쪽으로 길게 늘어난 모양이 됩니다.","kw":[{"l":"대류","a":["대류"]},{"l":"뜨거운 공기가 위로 올라감","a":["위로","올라"]}]},"follow":{"id":"kj_FU_S50F","cat":"과학","grade":"중2","q":"무중력 환경에서는 대류가 잘 일어나지 않아 촛불이 둥근 모양이 되는데, 이런 환경에서 촛불은 지구에서보다 더 오래 탈까요, 더 빨리 꺼질까요? 그 까닭과 함께 설명하시오.","a":"무중력 환경에서는 대류가 일어나지 않아 새로운 산소가 불꽃 주변으로 잘 공급되지 못하기 때문에, 촛불은 지구에서보다 훨씬 빨리 산소가 부족해져서 더 빨리 꺼지게 됩니다.","kw":[{"l":"대류가 일어나지 않음","a":["대류가 일어나지","대류가 없"]},{"l":"산소 공급이 잘 안 됨","a":["산소"]}]}},{"main":{"id":"kj_FU_S51","cat":"과학","grade":"중2","q":"우주정거장에서 물을 공중에 살짝 띄우면 지구에서와 달리 동그란 구슬 모양으로 둥둥 떠 있습니다. 이런 모양이 되는 까닭은 무엇인가요?","a":"지구에서는 중력 때문에 물이 아래로 처지지만, 무중력 상태에서는 중력의 영향이 거의 없어 물의 표면적을 최소로 만들려는 표면 장력만 작용하기 때문에, 표면적이 가장 작은 모양인 구형이 됩니다.","kw":[{"l":"표면 장력","a":["표면 장력"]},{"l":"중력의 영향이 거의 없음","a":["중력"]}]},"follow":{"id":"kj_FU_S51F","cat":"과학","grade":"중2","q":"지구에서도 나뭇잎 위의 작은 이슬방울은 둥글게 맺힙니다. 하지만 빗방울처럼 물방울이 아주 커지면 완전한 구형을 유지하기 어려워집니다. 그 까닭은 무엇일까요?","a":"물방울이 커질수록 물의 양(무게)이 늘어나 중력이 표면 장력보다 상대적으로 크게 작용하게 되므로, 아래로 처지는 힘을 받아 완전한 구형을 유지하기 어렵고 아래쪽이 눌린 찌그러진 모양이 되기 쉽습니다.","kw":[{"l":"물방울이 클수록 중력의 영향이 커짐","a":["중력"]},{"l":"찌그러진 모양이 됨","a":["찌그러"]}]}},{"main":{"id":"kj_FU_S52","cat":"과학","grade":"중3","q":"어떤 행성에 착륙한 우주 탐사 로봇이 스톱워치와 줄자만을 이용해서 그 행성의 중력의 세기를 대략적으로 알아보려고 합니다. 어떤 실험을 설계할 수 있을지 방법을 설명하시오.","a":"일정한 높이에서 물체를 가만히 떨어뜨리면서 바닥에 닿을 때까지 걸리는 시간을 스톱워치로 재고, 떨어뜨린 높이를 줄자로 측정합니다. 여러 번 반복해서 얻은 높이와 걸린 시간의 관계를 살펴보면, 그 행성에서 물체가 얼마나 빠르게 떨어지는지(중력의 세기)를 짐작할 수 있습니다.","kw":[{"l":"자유 낙하시켜 시간을 측정","a":["시간","스톱워치"]},{"l":"떨어뜨린 높이를 측정","a":["높이"]}]},"follow":{"id":"kj_FU_S52F","cat":"과학","grade":"중3","q":"만약 이 실험을 중력이 지구보다 훨씬 약한 행성에서 한다면, 같은 높이에서 물체를 떨어뜨렸을 때 바닥에 닿기까지 걸리는 시간은 지구에서보다 더 길까요, 짧을까요? 그 까닭과 함께 설명하시오.","a":"중력이 약할수록 물체를 끌어당기는 힘이 작아 떨어지는 속력이 천천히 증가하므로, 같은 높이에서 떨어뜨려도 바닥에 닿기까지 걸리는 시간은 지구에서보다 더 길어집니다.","kw":[{"l":"중력이 약할수록 천천히 떨어짐","a":["천천히","느리"]},{"l":"시간이 더 길어짐","a":["길어"]}]}},{"main":{"id":"kj_FU_S53","cat":"과학","grade":"중2","q":"우주 비행사가 우주복 없이 진공인 우주 공간에 그대로 노출되면 매우 위험합니다. 특히 몸속의 물이 순식간에 끓어오르듯 기화될 수 있다고 하는데, 체온이 높지 않은데도 이런 일이 일어날 수 있는 까닭은 무엇인가요?","a":"액체의 끓는점은 주변 압력이 낮을수록 낮아지는데, 진공 상태인 우주 공간은 압력이 거의 0에 가까워서 몸의 온도가 높지 않아도 몸속의 물이 매우 낮은 온도에서 끓어(기화되어) 버릴 수 있기 때문입니다.","kw":[{"l":"압력이 낮을수록 끓는점이 낮아짐","a":["압력","끓는점"]},{"l":"진공(압력이 거의 없음)","a":["진공"]}]},"follow":{"id":"kj_FU_S53F","cat":"과학","grade":"중2","q":"반대로 압력밥솥은 밥을 지을 때 뚜껑을 꽉 닫아 내부 압력을 높입니다. 압력밥솥으로 밥을 지으면 일반 냄비보다 밥이 더 빨리 되는 까닭은 무엇인가요?","a":"압력이 높아지면 물의 끓는점이 100℃보다 더 높이 올라가서, 물이 더 높은 온도에서 끓게 되고, 그만큼 더 높은 온도에서 밥을 지을 수 있어 밥이 더 빨리 익습니다.","kw":[{"l":"압력이 높아지면 끓는점이 높아짐","a":["끓는점이 높"]},{"l":"더 높은 온도에서 조리","a":["높은 온도"]}]}},{"main":{"id":"kj_FU_S54","cat":"과학","grade":"중2","q":"달은 지구 주위를 공전하면서 스스로도 자전을 하는데, 우리는 지구에서 항상 달의 같은 면만 보게 됩니다. 달의 뒷면은 지구에서 전혀 볼 수 없는 까닭은 무엇인가요?","a":"달의 자전 주기와 지구를 도는 공전 주기가 정확히 같기 때문입니다. 달이 자전하는 속도와 지구 주위를 공전하는 속도가 일치하여, 지구를 향하는 달의 면이 항상 같은 쪽을 향하게 되므로 우리는 늘 달의 같은 면만 보게 됩니다.","kw":[{"l":"자전 주기와 공전 주기가 같음","a":["자전 주기","공전 주기"]},{"l":"같은 면이 지구를 향함","a":["같은 면"]}]},"follow":{"id":"kj_FU_S54F","cat":"과학","grade":"중2","q":"그렇다면 달 표면(지구를 향한 면)에 서 있는 우주인이 달의 하루 동안 지구를 관찰한다면, 지구는 하늘에서 움직이는 것처럼 보일까요, 거의 같은 자리에 멈춰 있는 것처럼 보일까요?","a":"달의 자전과 공전 주기가 같아 달에서 보는 지구의 위치가 거의 변하지 않기 때문에, 지구는 하늘의 거의 같은 자리에 멈춰 있는 것처럼 보입니다.","kw":[{"l":"거의 같은 자리에 멈춰 있음","a":["멈춰","제자리"]}]}},{"main":{"id":"kj_FU_S55","cat":"과학","grade":"중1","q":"종이에 작은 구멍을 뚫고 눈으로 그 구멍을 통해 보름달을 보면, 구멍이 달을 딱 가릴 만큼 작게 보입니다. 눈과 구멍 사이의 거리, 구멍의 지름, 그리고 지구에서 달까지의 거리를 알고 있다면, 이를 이용해 달의 실제 지름을 어떻게 구할 수 있을까요?","a":"구멍의 지름과 눈-구멍 사이 거리의 비율이, 달의 지름과 지구-달 사이 거리의 비율과 같다는 비례식(구멍의 지름 : 눈-구멍 거리 = 달의 지름 : 지구-달 거리)을 세우면, 달의 실제 지름을 구할 수 있습니다.","kw":[{"l":"비례식을 이용","a":["비례식","비율"]},{"l":"구멍의 지름과 거리의 관계","a":["구멍"]}]},"follow":{"id":"kj_FU_S55F","cat":"과학","grade":"중1","q":"이와 비슷하게, 개기 일식 때 달이 태양을 딱 맞게 가리는 것을 보면 태양과 달의 크기·거리에 대해 어떤 사실을 짐작할 수 있을까요?","a":"달이 태양을 딱 맞게 가릴 수 있다는 것은 지구에서 보았을 때 태양과 달의 겉보기 크기가 거의 같다는 것을 의미하며, 이를 통해 실제 크기가 훨씬 큰 태양이 달보다 지구에서 훨씬 멀리 떨어져 있다는 것을 짐작할 수 있습니다.","kw":[{"l":"겉보기 크기가 같음","a":["겉보기"]},{"l":"태양이 훨씬 멀리 있음","a":["멀리"]}]}},{"main":{"id":"kj_FU_S56","cat":"과학","grade":"중2","q":"달은 매달 지구 주위를 한 바퀴씩 공전하는데, 일식이나 월식은 매달 일어나지 않고 가끔씩만 일어납니다. 그 까닭은 무엇인가요?","a":"달이 지구를 도는 공전 궤도면이 지구가 태양을 도는 공전 궤도면(황도면)과 정확히 일치하지 않고 약간 기울어져 있기 때문에, 태양-지구-달이 완전히 일직선이 되는 경우는 흔치 않아 일식과 월식이 매달 일어나지는 않습니다.","kw":[{"l":"달의 공전 궤도면이 기울어져 있음","a":["기울어"]},{"l":"일직선이 되기 어려움","a":["일직선"]}]},"follow":{"id":"kj_FU_S56F","cat":"과학","grade":"중2","q":"그렇다면 일식과 월식이 일어날 가능성이 있는 때는 각각 음력으로 대략 언제쯤일까요?","a":"일식은 태양-달-지구가 일직선이 되어야 하므로 달이 보이지 않는 삭(음력 초하루) 무렵에, 월식은 태양-지구-달이 일직선이 되어야 하므로 보름달이 뜨는 음력 보름 무렵에 일어날 가능성이 있습니다.","kw":[{"l":"일식은 삭(음력 초하루) 무렵","a":["삭","초하루"]},{"l":"월식은 보름 무렵","a":["보름"]}]}},{"main":{"id":"kj_FU_S57","cat":"과학","grade":"중3","q":"우리 몸은 체온이 올라가면 땀을 흘리고, 체온이 내려가면 몸을 떨어 체온을 일정하게 유지하려고 합니다. 이렇게 체온을 비롯한 몸속 환경을 일정하게 유지하도록 조절하는 중추는 뇌의 어느 부분에 있나요?","a":"대뇌와 중간뇌 사이에 있는 간뇌(특히 시상하부)가 체온 조절을 비롯해 몸속 환경을 일정하게 유지하는 항상성 조절의 중추 역할을 합니다.","kw":[{"l":"간뇌(시상하부)","a":["간뇌","시상하부"]},{"l":"항상성 조절","a":["항상성"]}]},"follow":{"id":"kj_FU_S57F","cat":"과학","grade":"중3","q":"뜨거운 물체를 만졌을 때 손을 빠르게 떼는 것과 같은 반사 행동의 중추는 대뇌가 아니라 척수입니다. 이런 반사가 대뇌를 거치지 않고 척수에서 바로 일어나는 것이 우리 몸에 어떤 점에서 유리한가요?","a":"대뇌까지 신호가 전달되어 판단하는 과정을 거치지 않고 척수에서 바로 명령을 내리기 때문에 반응 시간이 훨씬 짧아져, 위험한 자극으로부터 몸을 더 빠르게 보호할 수 있습니다.","kw":[{"l":"반응 시간이 짧음","a":["반응 시간","빠르"]},{"l":"몸을 빠르게 보호","a":["보호"]}]}},{"main":{"id":"kj_FU_S58","cat":"과학","grade":"중3","q":"위급하거나 긴장되는 상황에서 우리 몸은 심장 박동이 빨라지고 순간적으로 힘이 세지는 것을 느끼기도 합니다. 이런 반응이 나타나도록 부신에서 분비되어 교감 신경과 함께 작용하는 호르몬은 무엇인가요?","a":"아드레날린입니다. 아드레날린은 위급한 상황에서 부신에서 분비되어 심장 박동과 호흡을 빠르게 하고 근육에 혈액을 더 많이 공급하는 등, 몸이 긴급 상황에 신속하게 대응할 수 있도록 돕습니다.","kw":[{"l":"아드레날린","a":["아드레날린"]},{"l":"부신에서 분비","a":["부신"]}]},"follow":{"id":"kj_FU_S58F","cat":"과학","grade":"중3","q":"아드레날린이 지나치게 많이, 또는 불필요한 상황에서 자주 분비된다면 우리 몸에는 어떤 문제가 나타날 수 있을까요?","a":"심장이 계속 빠르게 뛰고 혈압이 높은 상태가 지속되어 몸에 부담을 줄 수 있고, 지나친 긴장 상태가 계속되어 쉽게 피로해지거나 불안감이 커지는 등의 문제가 나타날 수 있습니다.","kw":[{"l":"심장·혈압에 부담","a":["심장","혈압"]},{"l":"쉽게 피로해지거나 불안해짐","a":["피로","불안"]}]}},{"main":{"id":"kj_FU_S59","cat":"과학","grade":"중3","q":"땀을 많이 흘려 몸속 수분이 부족해지면 오줌의 양이 줄어들고 색이 진해집니다. 이렇게 몸속 수분량에 따라 오줌량을 조절하는 데 관여하는 호르몬은 무엇이며, 어디에서 분비되나요?","a":"항이뇨 호르몬(ADH)이며, 뇌하수체에서 분비됩니다. 몸속 수분이 부족해지면 항이뇨 호르몬의 분비가 늘어나 콩팥의 세뇨관에서 물의 재흡수를 촉진시켜, 오줌으로 빠져나가는 수분량을 줄여 몸속 수분을 보존합니다.","kw":[{"l":"항이뇨 호르몬(ADH)","a":["항이뇨"]},{"l":"뇌하수체에서 분비","a":["뇌하수체"]},{"l":"물의 재흡수를 촉진","a":["재흡수"]}]},"follow":{"id":"kj_FU_S59F","cat":"과학","grade":"중3","q":"반대로 물을 아주 많이 마셨을 때는 항이뇨 호르몬의 분비량과 오줌의 양이 각각 어떻게 변할까요?","a":"몸속에 물이 충분하므로 항이뇨 호르몬의 분비가 줄어들어 세뇨관에서 물의 재흡수가 줄어들고, 그만큼 오줌으로 빠져나가는 물의 양이 늘어나 오줌의 양이 많아지고 색도 옅어집니다.","kw":[{"l":"항이뇨 호르몬 분비가 줄어듦","a":["줄어"]},{"l":"오줌량이 늘어남","a":["오줌량이 늘","많아"]}]}},{"main":{"id":"kj_FU_S60","cat":"과학","grade":"중3","q":"방 안의 불을 껐다 켜면 순간적으로 어두워집니다. 스위치를 끄기 직전까지 전구에서 나오고 있던 빛은 갑자기 사라지는 걸까요, 아니면 어딘가로 계속 나아가는 걸까요? 빛의 성질과 관련지어 설명하시오.","a":"빛은 갑자기 사라지지 않고 초속 약 30만 km라는 매우 빠른 속도로 계속 나아갑니다. 방 안에서는 빛이 벽이나 물체에 부딪혀 흡수되기까지 아주 짧은 시간(수십억 분의 1초)밖에 걸리지 않기 때문에, 우리 눈에는 스위치를 끄자마자 즉시 어두워지는 것처럼 느껴지는 것뿐입니다.","kw":[{"l":"빛은 사라지지 않고 계속 나아감","a":["사라지지","계속"]},{"l":"물체에 부딪혀 흡수됨","a":["흡수"]},{"l":"매우 빠른 속도","a":["속도","빠른"]}]},"follow":{"id":"kj_FU_S60F","cat":"과학","grade":"중3","q":"그렇다면 밤하늘에는 수많은 별이 있는데도 왜 하늘 전체가 밝지 않고 어둡게 보일까요? 별빛이 우주 공간에서 어떻게 되는지와 관련지어 설명하시오.","a":"우주 공간에는 빛을 흡수할 물체가 거의 없어서, 별빛은 무언가에 부딪히지 않는 한 계속 뻗어 나가기만 합니다. 하지만 우주가 생겨난 지는 약 138억 년으로 한정된 시간밖에 지나지 않았기 때문에, 아주 멀리 있는 별에서 나온 빛 중에는 아직 지구까지 도달하지 못한 것도 많습니다. 그래서 하늘의 모든 방향에서 별빛이 우리 눈에 도달하는 것은 아니므로 밤하늘이 어둡게 보입니다.","kw":[{"l":"별빛은 계속 나아감","a":["계속","나아"]},{"l":"우주의 나이가 한정되어 있음","a":["138억","한정"]},{"l":"아직 도달하지 못한 빛이 있음","a":["도달하지 못"]}]}},{"main":{"id":"kj_FU_S61","cat":"과학","grade":"중3","q":"자석을 코일 근처에서 빠르게 움직이면, 코일이 전지에 연결되어 있지 않은데도 순간적으로 전류가 흐릅니다. 이렇게 자석의 움직임으로 코일에 전류가 만들어지는 현상을 무엇이라고 하며, 전류가 흐르려면 어떤 조건이 필요한가요?","a":"이런 현상을 전자기 유도라고 하고, 이때 흐르는 전류를 유도 전류라고 합니다. 코일을 통과하는 자기장이 변할 때(자석이 움직이거나 자석과 코일 사이의 거리가 달라질 때) 유도 전류가 흐르며, 자석이 멈춰 있으면 자기장이 변하지 않아 전류가 흐르지 않습니다.","kw":[{"l":"전자기 유도","a":["전자기 유도"]},{"l":"유도 전류","a":["유도 전류"]},{"l":"자기장이 변할 때","a":["자기장이 변"]}]},"follow":{"id":"kj_FU_S61F","cat":"과학","grade":"중3","q":"지하철 교통카드를 개찰구에 가까이 대기만 해도 인식이 되고, 스마트폰도 선 없이 충전판 위에 올려두면 충전이 됩니다. 카드나 스마트폰에는 전지를 직접 연결한 전선이 없는데도 이렇게 작동할 수 있는 것도 전자기 유도와 관련이 있습니다. 두 기기에 공통으로 들어 있는 부품은 무엇이며 어떤 역할을 하나요?","a":"교통카드와 무선 충전판, 그리고 그것을 받는 스마트폰 속에는 모두 작은 코일이 들어 있습니다. 한쪽 코일에 전류가 흐르면 자기장이 만들어지고, 이 변화하는 자기장이 다른 쪽 코일에 유도 전류를 발생시키기 때문에, 전선으로 직접 연결하지 않고도 정보를 전달하거나 전기를 충전할 수 있습니다.","kw":[{"l":"코일","a":["코일"]},{"l":"유도 전류","a":["유도 전류"]},{"l":"전선 없이 전달(무선)","a":["전선","무선"]}]}},{"main":{"id":"kj_FU_S62","cat":"과학","grade":"중1","q":"생물체는 모두 세포로 이루어져 있습니다. 동물 세포와 식물 세포에 공통으로 있는 세포막과 핵은 각각 어떤 역할을 하나요?","a":"세포막은 세포를 둘러싸 세포의 형태를 유지하고 물질이 세포 안팎으로 드나드는 것을 조절하는 역할을 하며, 핵은 세포의 생명 활동을 조절하는 유전 정보를 담고 있어 세포의 중심 역할을 합니다.","kw":[{"l":"세포막-물질 출입 조절","a":["세포막"]},{"l":"핵-유전 정보","a":["핵","유전 정보"]}]},"follow":{"id":"kj_FU_S62F","cat":"과학","grade":"중1","q":"동물 세포에는 없고 식물 세포에만 있는 구조로 세포벽과 엽록체가 있습니다. 이 두 구조는 각각 어떤 역할을 하나요?","a":"세포벽은 세포막 바깥을 둘러싸 세포를 튼튼하게 지지하고 보호하는 역할을 하고, 엽록체는 빛에너지를 이용해 광합성을 하여 양분을 만드는 역할을 합니다.","kw":[{"l":"세포벽-지지와 보호","a":["세포벽"]},{"l":"엽록체-광합성","a":["엽록체","광합성"]}]}},{"main":{"id":"kj_FU_S63","cat":"과학","grade":"중2","q":"뿌리에서 흡수한 물은 줄기를 거쳐 잎까지 이동하고, 잎에서 광합성으로 만든 양분은 줄기를 거쳐 뿌리나 열매로 이동합니다. 물이 이동하는 통로와 양분이 이동하는 통로는 각각 무엇이라고 하나요?","a":"물이 이동하는 통로는 물관이라 하고, 광합성으로 만든 양분이 이동하는 통로는 체관이라고 합니다.","kw":[{"l":"물관(물의 이동)","a":["물관"]},{"l":"체관(양분의 이동)","a":["체관"]}]},"follow":{"id":"kj_FU_S63F","cat":"과학","grade":"중2","q":"빨간 색소를 탄 물에 백합이나 셀러리 줄기를 꽂아 두면 시간이 지나 잎이나 꽃잎까지 붉게 물듭니다. 이 실험으로 알 수 있는 사실은 무엇인가요?","a":"뿌리로 흡수된 물(색소가 섞인 물)이 줄기의 물관을 통해 위로 이동해 잎과 꽃까지 도달한다는 것을 눈으로 직접 확인할 수 있습니다.","kw":[{"l":"물관을 통해 물이 이동","a":["물관"]},{"l":"뿌리에서 잎(꽃)까지 이동","a":["이동"]}]}},{"main":{"id":"kj_FU_S64","cat":"과학","grade":"중3","q":"선풍기는 전기 에너지를 이용해 날개를 돌려 시원한 바람(운동 에너지)을 만들어 냅니다. 그런데 선풍기를 오래 켜 두면 몸체가 조금씩 따뜻해지는 것을 느낄 수 있습니다. 이 현상은 에너지가 어떻게 되는 것을 보여주나요?","a":"선풍기에 공급된 전기 에너지의 일부는 날개를 돌리는 운동 에너지로 전환되지만, 나머지 일부는 모터의 마찰 등에 의해 열에너지로 전환되어 몸체가 따뜻해지는 것입니다. 이렇게 에너지는 새로 생기거나 사라지지 않고 다른 형태로 전환될 뿐이며, 전환 전후 에너지의 총량은 일정하게 보존됩니다.","kw":[{"l":"에너지 보존","a":["보존"]},{"l":"다른 형태로 전환됨(열에너지 등)","a":["전환","열에너지"]}]},"follow":{"id":"kj_FU_S64F","cat":"과학","grade":"중3","q":"이처럼 에너지가 형태를 바꿀 때마다 일부가 열에너지로 빠져나가 손실되는 것처럼 보이는데도, 왜 과학자들은 \"에너지가 보존된다\"고 말할까요?","a":"열에너지로 빠져나간 에너지도 사라진 것이 아니라 주변 공기나 물체를 데우는 데 사용되어 다른 곳으로 전달된 것일 뿐이므로, 원래 쓰려던 형태(운동 에너지 등)로서의 효율은 줄어들어도, 전체로 보면 에너지의 총량은 변하지 않고 그대로 보존되기 때문입니다.","kw":[{"l":"열에너지도 사라진 게 아니라 전달됨","a":["전달"]},{"l":"전체 에너지 총량은 불변","a":["총량"]}]}},{"main":{"id":"kj_FU_S65","cat":"과학","grade":"중3","q":"로켓은 아무것도 없는 진공의 우주 공간에서도 앞으로 나아갈 수 있습니다. 주변에 밀어낼 공기도 없는데 로켓이 앞으로 나아갈 수 있는 까닭은 무엇인가요?","a":"로켓은 연료를 태워 만든 가스를 뒤쪽으로 강하게 분출하는데, 이때 가스가 로켓을 미는 힘과 로켓이 가스를 미는 힘이 서로 반대 방향으로 작용하는 작용·반작용의 원리로 나아갑니다. 이 원리는 주변에 공기가 없어도 성립하기 때문에 진공인 우주에서도 로켓이 나아갈 수 있습니다.","kw":[{"l":"작용·반작용","a":["작용","반작용"]},{"l":"가스를 뒤로 분출","a":["분출","가스"]}]},"follow":{"id":"kj_FU_S65F","cat":"과학","grade":"중3","q":"풍선에서 바람이 빠지면서 반대 방향으로 날아가는 것도 같은 원리로 설명할 수 있나요?","a":"네, 같은 원리입니다. 풍선 속 공기가 한쪽으로 빠르게 빠져나가면서 풍선을 반대 방향으로 미는 반작용이 일어나기 때문에 풍선이 날아갑니다.","kw":[{"l":"같은 원리(작용·반작용)","a":["작용","반작용","같은 원리"]}]}},{"main":{"id":"kj_FU_S66","cat":"과학","grade":"중3","q":"인공위성은 지구의 중력에 끊임없이 끌리고 있는데도 왜 지표면에 떨어지지 않고 계속 지구 주위를 도는 걸까요?","a":"인공위성은 지구 중력에 의해 계속 지구 쪽으로 끌려가고 있지만, 동시에 매우 빠른 속도로 옆으로 움직이고 있습니다. 떨어지는 동안 지구 표면도 둥글게 휘어져 멀어지기 때문에, 계속 떨어지면서도 지표면에 닿지 않고 일정한 높이를 유지하며 지구 주위를 돌게 됩니다.","kw":[{"l":"중력에 끌리면서 동시에 빠르게 옆으로 이동","a":["옆으로","속도"]},{"l":"지구 표면이 둥글게 휘어짐","a":["휘어"]}]},"follow":{"id":"kj_FU_S66F","cat":"과학","grade":"중3","q":"만약 인공위성의 속력이 갑자기 느려진다면 어떻게 될까요?","a":"옆으로 움직이는 속력이 느려지면 중력에 끌려가는 정도를 따라잡지 못해 점점 지구 쪽으로 가까워지다가, 결국 대기권으로 떨어지게 됩니다.","kw":[{"l":"점점 지구에 가까워짐","a":["가까워"]},{"l":"대기권으로 떨어짐","a":["떨어"]}]}},{"main":{"id":"kj_FU_S67","cat":"과학","grade":"중2","q":"흔들지 않았는데도 봉지를 뜯으면 저절로 따뜻해지는 손난로가 있습니다. 이 손난로 안에서는 어떤 반응이 일어나고 있는 걸까요?","a":"손난로 안에는 철가루가 들어 있는데, 봉지를 뜯어 공기 중의 산소와 닿으면 철가루가 산소와 반응하여 산화되면서 열을 내는 발열 반응이 일어나기 때문에 저절로 따뜻해집니다.","kw":[{"l":"철가루와 산소의 반응(산화)","a":["철가루","산소","산화"]},{"l":"발열 반응","a":["발열"]}]},"follow":{"id":"kj_FU_S67F","cat":"과학","grade":"중2","q":"한번 다 식은 손난로는 다시 흔들거나 주물러도 왜 따뜻해지지 않을까요?","a":"철가루가 이미 산소와 반응해 다른 물질(산화철)로 완전히 바뀌어 버려서, 더 이상 반응할 철가루가 남아 있지 않기 때문에 다시 열이 나지 않습니다.","kw":[{"l":"철가루가 이미 다른 물질로 바뀜","a":["이미","바뀌"]},{"l":"남은 철가루가 없음","a":["없"]}]}},{"main":{"id":"kj_FU_S68","cat":"과학","grade":"중2","q":"나침반 바늘은 어디에 있든 항상 북쪽을 가리킵니다. 그 까닭은 무엇인가요?","a":"지구 자체가 하나의 거대한 자석과 같은 성질을 가지고 있어서 지구 전체에 자기장이 형성되어 있는데, 나침반 바늘도 작은 자석이기 때문에 이 지구 자기장의 영향을 받아 N극이 북쪽 방향을 가리키게 됩니다.","kw":[{"l":"지구 자체가 거대한 자석","a":["지구","자석"]},{"l":"지구 자기장의 영향","a":["자기장"]}]},"follow":{"id":"kj_FU_S68F","cat":"과학","grade":"중2","q":"나침반을 강한 자석 가까이에 두면 어떻게 될까요?","a":"나침반 바늘이 지구 자기장보다 훨씬 가까이 있는 자석의 영향을 더 강하게 받아서, 북쪽이 아니라 그 자석이 있는 쪽을 가리키도록 방향이 흐트러집니다.","kw":[{"l":"가까운 자석의 영향을 더 크게 받음","a":["자석 쪽","흐트러"]}]}}]},"이건희":{"Q":[{"id":"lk_A1","cat":"자소서","grade":"중3","q":"자석을 가열하면 자성이 변하는지 알아본 실험을 간단히 설명해 보세요.","a":"중학교에서 열이 물질의 성질에 영향을 줄 수 있다는 것을 배우고, 온도가 달라지면 자석의 성질도 변할지 궁금해서 실험했습니다. 처음에는 가열한 자석에 붙는 클립 개수를 비교했는데 차이를 구별하기 어려워서, 전자기 유도를 이용하기로 했습니다. 코일은 고정하고 자석이 코일 옆을 빠르게 지나가게 하면 코일에 유도전류가 생기는데, 이 전류의 최댓값을 전류계로 읽어 비교했습니다. 드라이기로 자석을 40℃, 60℃, 80℃로 가열해서 각각 측정했고, 온도가 높을수록 유도전류가 작아지는 경향을 확인해서 자성이 약해진다고 해석했습니다. (온도별 전류 값과 가열 시간은 「본인이 측정한 값」으로 말하세요.)","kw":[{"l":"열→자석 성질","a":["열→자석 성질","자석","성질"]},{"l":"클립은 비교 어려움","a":["클립은","어려움","비교"]},{"l":"코일+자석→유도전류","a":["유도전류","코일","자석"]},{"l":"40/60/80℃","a":["80℃","40","60"]},{"l":"전류 최댓값","a":["전류 최댓값","최댓값","전류"]},{"l":"온도↑ 전류↓","a":["온도↑ 전류↓","온도↑","전류↓"]}]},{"id":"lk_A2","cat":"자소서","grade":"중3","q":"처음에 클립을 붙여 비교했는데, 자성의 변화를 비교하기 어려웠던 이유는 무엇인가요?","a":"클립 개수는 1개, 2개처럼 끊어서만 셀 수 있기 때문에 자성이 조금 약해져도 개수가 그대로일 수 있어서 작은 변화를 구별하기 어렵습니다. 또 클립이 붙는 모양이나 자석과 닿는 위치에 따라 붙는 개수가 달라질 수 있어서, 자성의 세기 때문인지 붙은 모양 때문인지 구분하기도 어렵습니다. 그래서 값을 연속적으로 읽을 수 있는 전류 측정으로 바꿨습니다.","kw":[{"l":"개수는 끊어진 값","a":["개수는","끊어진"]},{"l":"작은 변화 구별 못함","a":["작은","변화","구별"]},{"l":"붙는 위치·모양 영향","a":["붙는","위치","모양"]},{"l":"연속적인 값(전류)","a":["연속적인","전류"]}]},{"id":"lk_A3","cat":"자소서","grade":"중3","q":"전자기 유도를 구체적으로 설명하고, 유도기전력이 무엇인지도 말해 보세요.","a":"코일을 지나는 자기장의 세기나 방향, 또는 코일을 통과하는 자기장의 양이 변하면 코일에 전류를 흐르게 하려는 전압이 생기는데, 이것이 유도기전력이고 이때 흐르는 전류가 유도전류입니다. 자석을 코일에 가까이 하거나 멀리 할 때만 전류가 흐르고, 자석이 가만히 있으면 흐르지 않습니다. 변화가 빠를수록, 자석이 강할수록, 코일을 많이 감을수록 유도기전력이 큽니다. 이 실험에서는 자석이 약해지면 같은 속도로 지나가도 코일을 통과하는 자기장의 변화가 작아져서 유도전류도 작아진다고 생각했습니다.","kw":[{"l":"자기장 변화 → 유도기전력 → 유도전류","a":["유도기전력","유도전류","자기장"]},{"l":"변화가 있을 때만","a":["변화가","있을","때만"]},{"l":"빠를수록·강할수록·감은 수 많을수록 큼","a":["빠를수록","강할수록","많을수록"]}]},{"id":"lk_A4","cat":"자소서","grade":"중3","q":"이 실험에서 실험군과 대조군은 무엇인가요?","a":"가열한 자석이 실험군이고, 가열하지 않은 실온의 자석이 대조군입니다. 같은 자석으로 가열 전과 가열 후를 비교하거나, 온도를 40, 60, 80℃로 바꿔 가며 비교했습니다. 바꾼 조건은 자석의 온도 하나뿐이고 나머지는 같게 하려고 했습니다. (실온 상태에서 측정한 값을 기준값으로 두었는지는 「본인이 한 대로」 말하세요. 두지 않았다면 \"기준이 되는 실온 측정이 있었으면 더 좋았다\"고 한계로 말하세요.)","kw":[{"l":"실험군=가열한 자석","a":["실험군","가열한","자석"]},{"l":"대조군=실온 자석","a":["대조군","실온","자석"]},{"l":"바꾼 것=온도 하나","a":["바꾼","온도","하나"]}]},{"id":"lk_A5","cat":"자소서","grade":"중3","q":"이 실험에서 같게 유지한 점과 변화시킨 점은 무엇인가요? 자석이 코일을 지나가는 속도는 어떻게 일정하게 유지했나요?","a":"변화시킨 것은 자석의 온도이고, 같게 유지한 것은 같은 자석과 같은 코일, 자석이 코일을 지나가는 속도와 위치, 전류계입니다. 속도는 「(본인이 쓴 방법: 예를 들어 같은 높이에서 놓아 경사면이나 진자로 지나가게 하기, 같은 길이의 끈에 매달아 같은 각도에서 놓기 등)」으로 같게 하려고 했습니다. 손으로 지나가게 하면 속도가 매번 달라져서 전류 값이 흔들리기 때문에, 같은 방법으로 반복하고 여러 번 측정해서 평균을 보려고 했습니다.","kw":[{"l":"바꾼 것=온도","a":["바꾼 것=온도","바꾼","온도"]},{"l":"같게=자석·코일·속도·위치","a":["같게","자석","코일"]},{"l":"속도 통제 방법(본인)","a":["속도","통제","방법"]},{"l":"반복 후 평균","a":["반복 후 평균","반복","평균"]}]},{"id":"lk_A6","cat":"자소서","grade":"중3","q":"유도전류가 줄어든 것을 \"온도가 높을수록 자성이 약해졌다\"고 해석한 근거는 무엇인가요? 다른 원인은 없었나요?","a":"코일, 속도, 위치를 같게 했을 때 달라진 것은 자석의 온도뿐이었는데 온도가 오를수록 전류가 작아졌기 때문에 자석이 만드는 자기장이 약해졌다고 해석했습니다. 다만 다른 원인도 생각할 수 있습니다. 첫째, 드라이기 열이 코일 가까이 가서 코일 도선의 저항이 커지면 같은 기전력에도 전류가 줄 수 있습니다. 둘째, 자석이 지나가는 속도가 우연히 달라졌을 수 있습니다. 그래서 속도를 같게 하려고 했고 여러 번 반복했지만, 이런 가능성을 완전히 없앴다고는 말할 수 없습니다. 이 실험은 \"자성이 약해졌을 가능성이 크다\"는 경향을 보인 것이고, 정확한 측정은 아닙니다.","kw":[{"l":"다른 조건 같음 → 온도만 변화","a":["온도만","다른","조건"]},{"l":"다른 원인: 코일 저항, 속도","a":["다른","원인","코일"]},{"l":"한계 인정","a":["한계 인정","한계","인정"]},{"l":"경향이지 정확한 값은 아님","a":["경향이지","정확한","값은"]}]},{"id":"lk_A7","cat":"자소서","grade":"중3","q":"같은 온도로 실험을 반복한 횟수와 그 대푯값은 무엇인가요? 같은 실험을 다시 한다면 바꾸고 싶은 점은 무엇인가요?","a":"(본인이 한 횟수로 말하세요.) 같은 온도에서 「(횟수)」번 측정했고, 대푯값으로는 「(평균 또는 중앙값 또는 최댓값 제외한 평균)」을 썼습니다. 값이 한 번씩 튀는 경우가 있어서 평균은 튀는 값의 영향을 받고, 중앙값은 영향을 덜 받습니다. 다시 한다면 첫째 자석이 지나가는 속도를 장치로 같게 하고, 둘째 온도 범위를 더 넓고 촘촘하게 하고, 셋째 온도 측정과 전류 측정 사이의 시간을 줄이고, 넷째 가열하지 않은 자석을 기준으로 함께 측정하겠습니다.","kw":[{"l":"횟수(본인)","a":["횟수(본인)","횟수","본인"]},{"l":"평균 vs 중앙값","a":["중앙값","평균","vs"]},{"l":"개선: 속도 장치, 온도 범위, 측정 시간, 대조군","a":["대조군","개선","속도"]}]},{"id":"lk_A8","cat":"자소서","grade":"중3","q":"이 실험에서 사용한 이론은 무엇이고, 실험을 통해 깨달은 점은 무엇인가요? 실험 방법에서 전자기 유도가 적용된 부분은 어디인가요?","a":"사용한 이론은 자석의 온도에 따른 자성의 변화에 관한 것과 전자기 유도, 그리고 전류를 측정하는 회로의 원리입니다. 전자기 유도는 자석의 세기를 직접 재기 어려워서, 자석이 코일 옆을 지나갈 때 생기는 유도전류의 크기를 자성의 세기를 나타내는 값으로 바꿔 쓴 부분에 적용되었습니다. 이 실험에서 하나의 현상을 연구할 때에도 여러 이론을 함께 쓸 수 있다는 것과, 무엇을 측정하고 비교할지 스스로 찾아가는 과정이 결론만큼 중요하다는 것을 깨달았습니다.","kw":[{"l":"열과 자성","a":["열과 자성","열과","자성"]},{"l":"전자기 유도","a":["전자기 유도","전자기","유도"]},{"l":"전류 측정","a":["전류 측정","전류","측정"]},{"l":"여러 이론을 함께","a":["이론을","여러","함께"]},{"l":"무엇을 측정할지 찾는 과정","a":["측정할지","무엇을","찾는"]}]},{"id":"lk_B1","cat":"자소서","grade":"중3","q":"가열하면 자성이 약해지는 현상이 일어나는 입자 수준의 근본적인 원인은 무엇인가요?","a":"자석 안에서는 원자 하나하나가 작은 자석처럼 행동하고, 이웃한 것들이 같은 방향으로 정렬되어 있어서 전체가 하나의 자석이 됩니다. 온도가 오르면 원자들의 열운동이 커져서 이 정렬이 흐트러지고, 그러면 서로 상쇄되는 부분이 늘어 바깥으로 나오는 자기장이 약해집니다. 제가 가열한 80℃까지의 범위에서는 이 정렬이 조금 흐트러지는 정도이고, 완전히 사라지는 것은 퀴리 온도라는 훨씬 높은 온도에서 일어납니다. (읽은 정도까지만 말하고, 더 깊은 질문에는 \"제가 확인한 범위는 여기까지입니다\"라고 말하세요.)","kw":[{"l":"원자 자석","a":["원자 자석","원자","자석"]},{"l":"정렬","a":["정렬"]},{"l":"열운동이 정렬을 흐트러뜨림","a":["흐트러뜨림","열운동이","정렬을"]},{"l":"퀴리 온도에서 자성 소실","a":["온도에서","퀴리","자성"]}]},{"id":"lk_B2","cat":"자소서","grade":"중3","q":"이 결과가 실제로 쓰이는 예와, 열이 물질의 성질에 영향을 주는 다른 예를 말해 보세요.","a":"온도에 따라 자성이 달라지는 성질은 일부 전기밥솥의 온도 감지 장치처럼, 일정 온도가 되면 자석이 자성을 잃어 스위치가 작동하게 하는 데 쓰이는 것으로 알고 있습니다. 열이 물질의 성질에 영향을 주는 예로는 금속이 가열되면 팽창하는 것, 두 금속을 붙인 바이메탈이 온도에 따라 휘는 것, 물이 온도에 따라 얼음·물·수증기로 상태가 바뀌는 것이 있습니다. (밥솥의 예는 정확한 구조를 확인해서 말하세요.)","kw":[{"l":"퀴리 온도 이용 스위치(밥솥)","a":["스위치","퀴리","온도"]},{"l":"열팽창","a":["열팽창"]},{"l":"바이메탈","a":["바이메탈"]},{"l":"상태 변화","a":["상태 변화","상태","변화"]}]},{"id":"lk_C1","cat":"자소서","grade":"중3","q":"패러데이 법칙의 식은 무엇이고, 이 실험에서 유도전류의 최댓값이 무엇에 비례하는지 식으로 설명해 보세요.","a":"제가 아는 범위에서 말씀드리겠습니다. 유도기전력의 크기는 코일을 지나는 자기선속의 시간 변화율에 코일의 감은 수를 곱한 값입니다. 즉 ε = N × (자기선속의 변화량 ÷ 걸린 시간)이고, 전류는 옴의 법칙으로 I = ε ÷ R입니다. 자석이 약해지면 자기선속의 변화량이 줄고, 자석이 빨리 지나가면 걸린 시간이 줄어서 기전력이 커집니다. 그래서 이 실험에서 속도를 같게 하는 것이 중요했습니다. 저항 R도 온도에 따라 변할 수 있어서 코일 온도도 같아야 합니다.","kw":[{"l":"ε=N·ΔΦ/Δt","a":["ΔΦ","Δt"]},{"l":"I=ε/R","a":["I=ε/R"]},{"l":"속도, 자석 세기, 감은 수, 저항","a":["속도","자석","세기"]}],"level":"advanced"},{"id":"lk_C2","cat":"자소서","grade":"중3","q":"네오디뮴 자석의 온도 계수나 퀴리 온도 같은 값은 알고 있나요? 80℃에서 실제로 자성이 얼마나 줄어드나요?","a":"정확한 값은 자석 종류와 등급마다 달라서 제가 확인한 것은 아닙니다. 네오디뮴 자석은 퀴리 온도가 300℃ 넘게 높지만, 쓸 수 있는 온도의 한계는 그보다 훨씬 낮아서 보통 80℃ 안팎부터 주의하는 것으로 알고 있습니다. 온도가 1℃ 오를 때 자기장이 아주 조금씩 줄어드는 성질이 있다고 들었습니다. 그래서 제가 본 경향이 이론과 방향은 맞지만, 정확한 비율은 사용한 자석의 자료를 확인해야 한다고 생각합니다.","kw":[{"l":"종류마다 다름","a":["종류마다 다름","종류마다","다름"]},{"l":"퀴리 온도 ≫ 실험 온도","a":["퀴리","온도","실험"]},{"l":"방향은 맞음","a":["방향은 맞음","방향은","맞음"]},{"l":"비율은 확인 필요","a":["비율은","확인","필요"]}],"level":"advanced"},{"id":"lk_A9","cat":"자소서","grade":"중3","q":"이 탐구를 계획하게 된 계기는 무엇인가요? 근의 공식을 작도했다는 것은 무슨 뜻인가요?","a":"이차방정식과 근의 공식을 배우면서, 공식으로 구한 무리수 근을 소수로 근삿값만 적는 것이 아쉬워서 자와 컴퍼스만으로 수직선 위에 정확한 위치로 나타낼 수 있을지 궁금했습니다. 근의 공식에 들어 있는 덧셈, 뺄셈, 곱셈, 나눗셈, 제곱, 제곱근을 각각 선분의 길이로 만들 수 있으면 근의 공식을 그대로 도형으로 옮길 수 있다고 생각했습니다. 그래서 각 계산을 작도하는 방법을 하나씩 찾았고, 그것을 이어서 근의 길이를 작도했습니다.","kw":[{"l":"근삿값이 아니라 정확한 위치","a":["근삿값이","아니라","정확한"]},{"l":"자+컴퍼스","a":["자+컴퍼스","컴퍼스"]},{"l":"합 차 곱 나눗셈 제곱 제곱근을 각각 작도","a":["제곱근을","나눗셈","제곱"]},{"l":"이어 붙임","a":["이어 붙임","이어","붙임"]}]},{"id":"lk_A10","cat":"자소서","grade":"중3","q":"두 선분의 길이의 합과 차를 작도하는 방법을 말해 보세요.","a":"합은 한 직선 위에 길이 a인 선분을 잡고, 컴퍼스로 길이 b를 재서 같은 직선에서 a의 끝점에서 이어서 옮기면 전체 길이가 a+b입니다. 차는 같은 직선 위에서 같은 시작점에서 a와 b를 같은 방향으로 옮겨서 두 끝점 사이의 길이를 구하면 a−b입니다. 컴퍼스로 길이를 옮기는 작도만으로 됩니다.","kw":[{"l":"컴퍼스로 길이 옮기기","a":["컴퍼스로","옮기기","길이"]},{"l":"합=이어 붙이기","a":["합=이어 붙이기","붙이기","이어"]},{"l":"차=같은 시작점에서 두 끝점 사이","a":["시작점에서","같은","끝점"]}]},{"id":"lk_A11","cat":"자소서","grade":"중3","q":"두 선분의 곱과 나눗셈을 작도하는 방법을 말해 보세요. 두 방법의 차이는 무엇이고, 여기서 닮음비는 어떻게 쓰였나요? 단위 1은 어떻게 쓰였나요?","a":"곱은 한 점 O에서 두 반직선을 긋고, 한 반직선 위에 길이 1인 점 U와 길이 a인 점 A를, 다른 반직선 위에 길이 b인 점 B를 잡습니다. U와 B를 이은 직선에 평행하게 A를 지나는 직선을 그어 다른 반직선과 만나는 점을 C라 하면, 삼각형 OUB와 OAC가 닮음이어서 OU:OA = OB:OC, 즉 1:a = b:OC이므로 OC = ab입니다. 나눗셈은 같은 그림에서 점 배치만 바꿉니다. 한 반직선 위에 길이 b인 점 B와 길이 a인 점 A를, 다른 반직선 위에 길이 1인 점 U를 잡고, B와 U를 이은 직선에 평행하게 A를 지나는 직선을 그으면 OB:OA = OU:OC, 즉 b:a = 1:OC이므로 OC = a÷b입니다. 곱은 1을 한 줄에 a와 함께, 나눗셈은 1을 b와 반대쪽 줄에 놓는다는 차이가 있고, 두 경우 모두 단위 길이 1을 기준 선분으로 두어야 닮음비를 세울 수 있습니다. 제곱은 곱에서 a와 b를 같게 하면 됩니다.","kw":[{"l":"평행선 → 닮음","a":["평행선 → 닮음","평행선","닮음"]},{"l":"곱: 1:a=b:x","a":["곱: 1:a=b:x"]},{"l":"나눗셈: b:a=1:x","a":["나눗셈"]},{"l":"단위 1이 기준","a":["단위 1이 기준","단위","1이","기준"]},{"l":"제곱=곱에서 a=b","a":["곱에서","제곱"]}]},{"id":"lk_A12","cat":"자소서","grade":"중3","q":"제곱근을 닮음으로만 나타내려 했을 때는 어떻게 시도했고 왜 어려웠나요? 그 뒤 사영정리를 이용해 제곱근을 어떻게 작도했나요?","a":"곱과 나눗셈은 닮음비로 되었지만, √a를 닮음비로 나타내려면 x:1 = a:x처럼 같은 x가 두 번 들어가는 식을 세워야 하는데, 평행선을 이용한 방법으로는 x 위치를 정할 수 없어서 어려웠습니다. 그래서 원의 성질과 사영정리를 떠올렸습니다. 한 직선 위에 길이 a인 선분 AB와 이어서 길이 1인 선분 BC를 잡고, AC를 지름으로 하는 원을 그립니다. B를 지나 AC에 수직인 직선이 원과 만나는 점을 D라 하면, 각 ADC는 지름에 대한 원주각이어서 직각입니다. 직각삼각형 ADC에서 D에서 빗변 AC에 내린 수선이 BD이므로 사영정리에 의해 BD² = AB × BC = a × 1 = a이고, 따라서 BD = √a입니다.","kw":[{"l":"x:1=a:x 모양","a":["모양"]},{"l":"지름 AC의 원","a":["지름 AC의 원","AC의","지름"]},{"l":"수선 BD","a":["수선 BD","수선","BD"]},{"l":"원주각 90°","a":["원주각 90°","원주각","90°"]},{"l":"BD²=AB·BC=a","a":["BD²","AB","BC"]},{"l":"BD=√a","a":["BD=√a","BD","√a"]}]},{"id":"lk_A13","cat":"자소서","grade":"중3","q":"작도한 근이 양수인지 음수인지는 어떻게 확인했나요? 근의 공식에서 √ 안의 식 b²−4ac는 어떻게 적용했나요?","a":"작도에서 길이는 항상 양수이므로, 수직선 위에서 오른쪽 방향을 양수, 왼쪽 방향을 음수로 정해 두고 −b를 b의 반대 방향으로 잡아서 부호를 구분했습니다. −b에서 제곱근 선분을 오른쪽과 왼쪽으로 한 번씩 옮기면 두 근의 위치가 됩니다. 제곱근 안의 b²−4ac는 b²과 4ac를 각각 작도하고 차를 구해서 만들었는데, 이 값이 0보다 작으면 큰 쪽에서 작은 쪽을 뺄 수 없어서 작도가 되지 않고, 이는 실근이 없다는 뜻과 일치합니다.","kw":[{"l":"방향으로 부호 구분","a":["방향으로","부호","구분"]},{"l":"−b±√","a":["−b±√"]},{"l":"b²−4ac\u003c0이면 작도 불가 = 실근 없음","a":["b²−4ac","0이면","작도"]}]},{"id":"lk_A14","cat":"자소서","grade":"중3","q":"암기만으로 어려웠던 공식과 그것을 활용한 경험, 그리고 답을 구하는 데서 그치지 않고 이유를 탐색해 본 경험을 말해 보세요.","a":"(본인의 경험으로 말하세요.) 사영정리는 공식으로만 외우고 있었을 때는 어느 변이 어느 선분의 곱이 되는지 자주 헷갈렸습니다. 이번에 제곱근 작도에 직접 쓰려고 하면서 닮은 삼각형을 그려 대응변을 세워 보니, 공식이 아니라 닮음에서 나온 결과라는 것을 이해했고 헷갈리지 않게 되었습니다. 이후에는 공식을 외우기 전에 왜 그렇게 되는지 그림으로 한 번 확인하는 습관이 생겼습니다.","kw":[{"l":"외운 공식 헷갈림 → 닮음으로 이해","a":["닮음으로","헷갈림","외운"]},{"l":"활용해 보니 이해","a":["활용해","보니","이해"]},{"l":"이유 확인 습관","a":["이유 확인 습관","이유","확인","습관"]}]},{"id":"lk_B3","cat":"자소서","grade":"중3","q":"이차방정식의 계수에 무리수가 들어 있어도 근을 작도할 수 있나요?","a":"계수가 작도 가능한 길이이면 가능합니다. 합, 차, 곱, 나눗셈, 제곱근을 모두 작도할 수 있기 때문에, 계수가 이런 계산들로 만들어지는 수(예를 들어 √2, 1+√3 같은 수)이면 근의 공식에 들어 있는 모든 계산을 같은 방법으로 할 수 있습니다. 반대로 계수가 작도할 수 없는 수(예를 들어 부피가 2배인 정육면체의 한 변 ∛2)라면 그 길이 자체를 작도할 수 없어서 불가능합니다.","kw":[{"l":"계수가 작도 가능하면 가능","a":["가능하면","계수가","작도"]},{"l":"사칙연산과 제곱근 닫혀 있음","a":["사칙연산과","제곱근","닫혀"]},{"l":"∛2는 작도 불가","a":["∛2는","작도","불가"]}]},{"id":"lk_B4","cat":"자소서","grade":"중3","q":"수학의 한 분야가 다른 분야와 밀접히 연결된 다른 예와, 이 탐구가 물리학과 연관될 수 있는 점을 말해 보세요.","a":"좌표평면은 대수와 기하를 연결한 대표적인 예이고, 식으로 풀던 연립방정식을 두 직선의 교점이라는 도형으로 볼 수 있습니다. 삼각비는 직각삼각형의 길이와 각도, 원과 주기 운동까지 이어집니다. 제 탐구가 물리와 연관되는 점은 닮음을 이용한 길이 비 계산이 렌즈의 상을 작도하거나 빛의 경로를 그림으로 풀 때 그대로 쓰인다는 것입니다. 또 물리량을 식으로 계산한 결과를 그림이나 그래프의 길이로 확인하는 사고방식이 비슷합니다.","kw":[{"l":"좌표평면","a":["좌표평면"]},{"l":"삼각비와 원","a":["삼각비와 원","삼각비와"]},{"l":"렌즈 작도의 닮음","a":["작도의","렌즈","닮음"]},{"l":"식 ↔ 그림","a":["식 ↔ 그림","그림"]}]},{"id":"lk_C3","cat":"자소서","grade":"중3","q":"자와 컴퍼스로 작도할 수 없는 문제에는 어떤 것이 있나요? 이 탐구의 방법은 왜 그 한계가 있나요?","a":"제가 알기로 고대 그리스의 3대 작도 문제인 임의의 각의 삼등분, 정육면체의 부피를 2배로 하는 문제(∛2), 원과 넓이가 같은 정사각형(π)은 자와 컴퍼스만으로는 불가능하다고 증명되어 있습니다. 자와 컴퍼스로 만들 수 있는 길이는 사칙연산과 제곱근을 반복해서 얻는 수에 한정되기 때문입니다. 제 탐구는 바로 이 사칙연산과 제곱근만으로 이루어진 근의 공식을 작도한 것이어서 이차방정식까지는 되지만, 삼차방정식의 일반적인 근은 작도할 수 없다는 것도 이 때문이라고 이해하고 있습니다. (증명은 제가 직접 해 본 것이 아니라 알려진 결과입니다.)","kw":[{"l":"3대 작도 불능 문제","a":["3대","작도","불능"]},{"l":"사칙+제곱근만 가능","a":["제곱근만","사칙","가능"]},{"l":"이차까지, 삼차는 일반적으로 불가","a":["일반적으로","이차까지","삼차는"]},{"l":"알려진 결과임을 밝힘","a":["결과임을","알려진","밝힘"]}],"level":"advanced"},{"id":"lk_C4","cat":"자소서","grade":"중3","q":"이차방정식의 근을 작도하는 다른 방법은 없나요? 이 탐구와 비교해 보세요.","a":"제가 아는 범위에서는 원과 직선을 이용해 근을 작도하는 방법이 있다고 들었지만 직접 해 본 것은 아닙니다. 그림 속 원이 좌표축과 만나는 점의 위치가 근이 되도록 원을 정하는 방식으로 알고 있습니다. 제가 한 방법은 근의 공식의 각 계산을 하나씩 작도해서 이어 붙인 것이라 단계는 길지만 계산 과정이 그대로 보인다는 장점이 있습니다. 확인하지 못한 내용은 더 공부해서 비교해 보고 싶습니다.","kw":[{"l":"원 이용 방법 있음(직접은 안 해 봄)","a":["직접은","이용","방법"]},{"l":"내 방법은 단계 길지만 공식이 그대로 보임","a":["방법은","길지만","공식이"]}],"level":"advanced"},{"id":"lk_A15","cat":"자소서","grade":"중3","q":"친구가 설명을 이해하지 못한다는 것을 어떻게 알아차렸나요? 그때 설명 방식을 구체적으로 어떻게 바꾸었나요?","a":"제가 조사한 내용을 설명하는 동안 친구가 질문을 하지 않고 표정이 굳거나 \"응, 응\" 하고만 대답해서, 정말 이해한 것이 아니라 따라오지 못하고 있다고 느꼈습니다. (본인이 알아차린 신호로 바꾸어 말하세요.) 그래서 용어를 중학교 수준의 개념으로 바꾸고, 진자를 그림으로 그려서 길이가 길어지면 한 번 왕복하는 데 걸리는 시간이 길어지는 모습을 보여 주었습니다. 그네를 예로 들어 줄이 길수록 천천히 움직인다고도 설명했습니다.","kw":[{"l":"표정·반응으로 알아차림","a":["반응으로","알아차림","표정"]},{"l":"중학교 개념으로","a":["중학교 개념으로","개념으로","중학교"]},{"l":"그림","a":["그림"]},{"l":"그네 예시","a":["그네 예시","그네","예시"]}]},{"id":"lk_A16","cat":"자소서","grade":"중3","q":"설명 방식을 계속 바꿔도 친구가 이해하지 못했다면 어떻게 했을까요? 정확한 정보 전달과 상대방의 이해 중 무엇이 더 중요하다고 생각하나요?","a":"한 번 더 방식을 바꾸어 보되, 그래도 안 되면 친구가 직접 해 보게 했을 것입니다. 진자를 직접 움직여 보고 시간을 재 보면 말로 듣는 것보다 이해가 빠를 수 있기 때문입니다. 그래도 어려워하면 지금 전부를 이해하지 않아도 실험을 진행하는 데 필요한 부분부터 이해하게 하고, 나머지는 실험하면서 함께 확인했을 것입니다. 저는 정확한 정보와 상대방의 이해 중 하나만 고르기보다는, 정확한 내용을 상대가 이해할 수 있는 방식으로 전달하는 것이라고 생각합니다. 상대가 이해하지 못하면 정확한 정보도 전달되지 않은 것이기 때문입니다.","kw":[{"l":"직접 해 보게 함","a":["직접","보게"]},{"l":"핵심부터","a":["핵심부터"]},{"l":"정확함+이해 둘 다","a":["정확함","이해"]},{"l":"이해 못 하면 전달된 것이 아님","a":["전달된","이해","것이"]}]},{"id":"lk_A17","cat":"자소서","grade":"중3","q":"진자와 진자의 길이 사이의 관계를 알아보는 실험은 어떻게 했고, 그 결과는 무엇이었나요?","a":"(본인이 한 실험으로 말하세요.) 같은 추를 줄에 매달아 줄의 길이만 바꿔 가며 진자가 한 번 왕복하는 데 걸리는 시간(주기)을 쟀습니다. 진자의 주기는 줄의 길이가 길수록 길어지고, 이론적으로는 주기가 길이의 제곱근에 비례하므로 길이를 4배로 하면 주기는 2배가 됩니다. 추의 질량은 주기에 영향을 주지 않고, 진폭이 작을 때 이 관계가 성립합니다. 한 번 왕복하는 시간은 짧아서 오차가 생기므로 여러 번 왕복한 시간을 재서 나누는 방법을 썼습니다. (실제 측정값은 「본인이 잰 값」으로 말하세요.)","kw":[{"l":"길이만 변화","a":["길이만 변화","길이만","변화"]},{"l":"주기=길이의 제곱근에 비례","a":["제곱근에","길이의","주기"]},{"l":"질량 무관","a":["질량 무관","질량","무관"]},{"l":"진폭 작게","a":["진폭 작게","진폭","작게"]},{"l":"여러 번 왕복해서 측정","a":["왕복해서","여러","측정"]}]},{"id":"lk_A18","cat":"자소서","grade":"중3","q":"내가 맡은 것만 하는 것은 진정한 협력이 아니라고 생각한 이유는 무엇인가요? 이 경험에서 깨달은 점은 무엇인가요?","a":"제가 맡은 조사와 정리를 정확하게 했더라도 친구가 이해하지 못한 채 실험이 진행되면, 결국 함께 문제를 해결한 것이 아니라 제가 일을 한 것에 불과하다고 느꼈기 때문입니다. 협력은 자기 역할을 다하는 것에서 끝나지 않고, 상대가 어디까지 이해했는지 살피면서 설명하고 소통하는 방식을 상황에 맞게 바꿔 가며 함께 문제를 해결하는 과정이라는 것을 깨달았습니다.","kw":[{"l":"내 역할만으로는 부족","a":["역할만으로는","부족"]},{"l":"상대의 이해 정도를 살핌","a":["상대의","정도를","이해"]},{"l":"방식을 조정","a":["방식을 조정","방식을","조정"]},{"l":"함께 해결","a":["함께 해결","함께","해결"]}]},{"id":"lk_B5","cat":"자소서","grade":"중3","q":"서로 다른 의견이 나왔을 때 조율한 경험, 서로의 강점이 합쳐져 시너지가 난 경험이 있나요? 팀원으로서 내가 잘하는 것은 무엇인가요?","a":"(본인의 경험으로 말하세요. 아래는 구성 예입니다.) 실험에서 줄의 길이를 몇 단계로 할지에 대해 서로 의견이 달랐을 때, 각자 이유를 말하고 둘 다 해 보기로 했습니다. 제가 이론과 정리를 맡고 친구가 측정을 꼼꼼히 맡으면서 둘의 장점이 합쳐졌습니다. 저는 팀에서 자료를 조사하고 정리해서 방향을 잡는 일을 잘하고, 이번 경험으로 상대의 이해를 살피는 것도 더 신경 쓰게 되었습니다.","kw":[{"l":"이유를 듣고 둘 다 해 봄","a":["이유를","듣고"]},{"l":"강점 분담","a":["강점 분담","강점","분담"]},{"l":"정리와 방향","a":["정리와 방향","정리와","방향"]},{"l":"이해 살피기","a":["이해 살피기","살피기","이해"]}]},{"id":"lk_C5","cat":"자소서","grade":"중3","q":"소통이 상대방에 대한 이해에서 출발한다는 말을 실제 과학 연구 상황에 적용하면 어떤 의미인가요?","a":"연구는 혼자 하는 것이 아니라 다른 사람이 이해하고 검증할 수 있어야 의미가 있다고 생각합니다. 같은 결과도 듣는 사람이 알고 있는 수준에 맞게 전달하지 않으면 틀린 곳이 있어도 못 찾거나, 오해가 생길 수 있습니다. 공동 연구에서는 서로의 전문 분야가 달라서, 자기 분야의 용어를 상대의 말로 번역해 주는 능력이 협력의 질을 정한다고 생각합니다. 경험이 많지 않아서 제 생각이지만, 진자 설명 경험에서 이런 점을 느꼈습니다.","kw":[{"l":"다른 사람이 이해·검증 가능해야","a":["가능해야","사람이","다른"]},{"l":"수준에 맞게 번역","a":["수준에","맞게","번역"]},{"l":"공동 연구에서 중요","a":["연구에서","공동","중요"]}],"level":"advanced"},{"id":"lk_A19","cat":"자소서","grade":"중3","q":"입자물리학자를 꿈꾸게 된 계기는 무엇인가요? 가장 인상 깊었던 사고실험은 무엇인가요?","a":"중학교 때 양자역학과 상대성이론에 관한 책을 읽으면서, 눈에 보이지 않는 작은 입자와 빛의 움직임을 수학으로 설명해 낸다는 점에 큰 흥미를 느꼈습니다. 길이 수축과 시간 팽창 같은 효과를 사고실험으로 따라가 보면서, 예상과 다른 결과가 나와도 끝까지 따져 보는 과정이 재미있었고, 실제로 실험하기 어려운 것을 생각으로 상상해 보는 힘도 길렀습니다. 그중 가장 인상 깊었던 것은 빛시계 사고실험입니다. 위아래로 거울이 있고 빛이 왕복하는 시계가 움직이면, 움직이는 시계 안에서 빛이 지나야 하는 길이 비스듬해져서 길어지는데 빛의 속도는 같으므로 시간이 더 걸린다는 결과가 나옵니다. (본인이 읽은 책과 사고실험으로 바꾸어 말하세요.)","kw":[{"l":"양자역학·상대성이론 책","a":["상대성이론","양자역학"]},{"l":"수학으로 설명","a":["수학으로 설명","수학으로","설명"]},{"l":"사고실험","a":["사고실험"]},{"l":"빛시계","a":["빛시계"]},{"l":"끝까지 따져 봄","a":["끝까지 따져 봄","끝까지","따져"]}]},{"id":"lk_A20","cat":"자소서","grade":"중3","q":"특수상대성이론의 기본 가설은 무엇이고, 로런츠 변환은 갈릴레이 변환과 비교했을 때 어떤 의미가 있나요?","a":"기본 가설은 두 가지입니다. 첫째, 모든 관성좌표계에서 물리 법칙이 같다는 상대성 원리입니다. 둘째, 진공에서 빛의 속력은 관측자나 광원의 운동과 관계없이 항상 같다는 광속 불변의 원리입니다. 갈릴레이 변환은 속도를 단순히 더하고 빼기 때문에 빛의 속력도 관측자에 따라 달라지게 되는데, 이것은 두 번째 가설과 충돌합니다. 로런츠 변환은 x' = γ(x − vt), t' = γ(t − vx/c²)의 식으로, 시간과 공간을 함께 변환하여 광속이 모든 관성계에서 같게 유지됩니다. 속도 v가 빛의 속력보다 훨씬 작으면 γ가 1에 가까워져서 갈릴레이 변환과 거의 같아지기 때문에, 갈릴레이 변환은 로런츠 변환의 낮은 속도에서의 근삿값입니다.","kw":[{"l":"상대성 원리 + 광속 불변","a":["상대성","원리","광속"]},{"l":"갈릴레이: 단순 합","a":["갈릴레이","단순"]},{"l":"로런츠: 시간·공간 함께 변환","a":["로런츠","시간","공간"]},{"l":"v≪c이면 갈릴레이","a":["v≪c이면","갈릴레이"]}]},{"id":"lk_A21","cat":"자소서","grade":"중3","q":"마이컬슨 간섭계는 어떤 장치이고, 왜 직접 구성해서 간섭무늬의 원리를 확인해 보고 싶나요?","a":"마이컬슨 간섭계는 한 빛줄기를 반투명 거울로 둘로 나누어 서로 수직인 두 방향으로 보냈다가, 각각 거울에 반사되어 돌아온 빛을 다시 합쳐서 간섭무늬를 보는 장치입니다. 두 빛이 간 거리의 차가 파장의 정수배이면 서로 강화되어 밝고, 반정수배이면 상쇄되어 어둡습니다. 한쪽 거울을 파장 정도로 조금만 움직여도 무늬가 눈에 띄게 바뀌기 때문에 아주 작은 길이의 변화를 잴 수 있습니다. 제가 이것을 직접 구성해 보고 싶은 이유는 특수상대성이론을 공부하면서 빛의 속도에 대해 흥미가 생겼고, 이 장치가 빛의 성질을 확인하는 대표적인 실험이어서 그 원리를 직접 확인하고 싶기 때문입니다. (간섭계로 빛의 속도 값을 직접 재는 것이 아니라, 빛의 파동 성질과 속도 차이 여부를 확인하는 것임을 구분해서 말하세요.)","kw":[{"l":"빛을 둘로 나눔","a":["빛을 둘로 나눔","빛을","둘로","나눔"]},{"l":"수직 두 경로","a":["수직 두 경로","수직","경로"]},{"l":"다시 합침","a":["다시 합침","다시","합침"]},{"l":"경로차 = 정수배 파장 → 밝음","a":["경로차","정수배","파장"]},{"l":"작은 길이 변화 측정","a":["작은","길이","변화"]}]},{"id":"lk_A22","cat":"자소서","grade":"중3","q":"한성과학고에 입학하면 어떤 공부와 활동을 하고 싶나요? 입자물리학은 실험이 어려운데 어떻게 실현할 건가요?","a":"입학하면 심화 물리와 AP 물리를 공부해서 물리 개념을 수학으로 이해하는 힘을 키우고, R&E 활동에서는 기본 입자와 관련된 주제를 탐구하고 싶습니다. 입자물리학은 가속기 같은 거대한 장비가 필요해서 학교에서 직접 하기는 어렵지만, 공개된 입자 충돌 데이터를 분석하거나 안개상자로 우주에서 오는 입자의 궤적을 관찰하거나, 컴퓨터 시뮬레이션으로 입자의 운동을 계산하는 식으로 할 수 있다고 생각합니다. 그리고 특수상대성이론과 로런츠 변환을 더 공부하고 마이컬슨 간섭계를 만들어 간섭무늬의 원리를 확인하고 싶습니다. (학교의 교육과정과 R&E 운영 방식은 학생이 직접 조사한 내용으로 말하세요.)","kw":[{"l":"심화 물리·AP 물리","a":["심화","물리","AP"]},{"l":"R&E 기본 입자","a":["R&E","기본","입자"]},{"l":"가속기는 불가 → 공개 데이터, 안개상자, 시뮬레이션","a":["시뮬레이션","가속기는","안개상자"]},{"l":"간섭계 제작","a":["간섭계 제작","간섭계","제작"]}]},{"id":"lk_B6","cat":"자소서","grade":"중3","q":"기본 입자와 표준모형을 설명해 보세요. 그리고 입자물리학자에게 가장 중요한 덕목은 무엇인가요?","a":"표준모형은 물질을 이루는 기본 입자와 그 사이의 힘을 설명하는 이론입니다. 물질 입자로 쿼크 6종과 렙톤(전자, 뮤온, 타우와 각각의 중성미자) 6종이 있고, 힘을 전달하는 입자로 광자, 글루온, W와 Z 보손이 있으며, 입자에 질량을 주는 힉스 입자가 있습니다. 중력은 표준모형에 들어 있지 않다고 알고 있습니다. 가장 중요한 덕목은 끝까지 의심하고 확인하는 태도라고 생각합니다. 실험 결과가 예상과 달라도 이를 버리지 않고 이유를 따져 보는 것이 새로운 발견으로 이어지기 때문입니다.","kw":[{"l":"쿼크 6","a":["쿼크 6","쿼크"]},{"l":"렙톤 6","a":["렙톤 6","렙톤"]},{"l":"힘 전달 입자","a":["힘 전달 입자","전달","입자"]},{"l":"힉스","a":["힉스"]},{"l":"중력은 제외","a":["중력은 제외","중력은","제외"]},{"l":"덕목=의심하고 확인","a":["의심하고","덕목","확인"]}]},{"id":"lk_B7","cat":"자소서","grade":"중3","q":"상대성이론에서 알고 있는 역설이 있나요?","a":"쌍둥이 역설이 있습니다. 한 사람이 빠른 우주선을 타고 갔다가 돌아오면, 지구에 남은 쌍둥이에 비해 덜 늙는다는 것입니다. 얼핏 보면 서로 상대가 움직인 것이니 대칭이어서 모순처럼 보이지만, 우주선을 탄 사람은 방향을 바꾸는 가속을 겪어서 한 관성계에 계속 머문 것이 아니므로 대칭이 깨집니다. 그래서 모순이 아니라고 알고 있습니다.","kw":[{"l":"쌍둥이 역설","a":["쌍둥이 역설","쌍둥이","역설"]},{"l":"겉보기에는 대칭","a":["겉보기에는 대칭","겉보기에는","대칭"]},{"l":"가속 때문에 대칭이 깨짐","a":["때문에","대칭이","가속"]},{"l":"모순 아님","a":["모순 아님","모순","아님"]}]},{"id":"lk_C6","cat":"자소서","grade":"중3","q":"수명이 짧은 뮤온이 지표에 닿을 수 있는 이유는 무엇인가요?","a":"뮤온은 정지해 있을 때 평균 수명이 약 2.2마이크로초라서, 빛에 가까운 속도로 가도 이동 거리가 수백 미터 정도입니다. 그런데 대기 위쪽에서 만들어진 뮤온이 지표에서도 많이 관측됩니다. 지상에서 보면 빠르게 움직이는 뮤온의 시간이 느리게 가기(시간 팽창) 때문에 더 오래 살아서 더 멀리 가고, 뮤온 입장에서 보면 대기의 두께가 줄어들어서(길이 수축) 짧은 시간에 지나올 수 있습니다. 두 설명은 같은 사건을 서로 다른 관성계에서 본 것입니다. 숫자는 제가 직접 계산해 확인한 것이 아니라 알려진 설명을 정리한 것입니다.","kw":[{"l":"수명 약 2.2μs","a":["2μs","수명"]},{"l":"지상에서 보면 시간 팽창","a":["지상에서","보면","시간"]},{"l":"뮤온에서 보면 길이 수축","a":["뮤온에서","보면","길이"]},{"l":"같은 사건의 두 관점","a":["사건의","같은","관점"]}],"level":"advanced"},{"id":"lk_C7","cat":"자소서","grade":"중3","q":"가속기로 하는 입자 충돌 실험에서 새로운 입자는 어떻게 만들어지고 발견되나요?","a":"제가 이해한 범위에서 말씀드리겠습니다. 입자를 빛에 가까운 속도로 가속해서 충돌시키면 운동에너지가 E=mc²에 따라 새로운 입자의 질량으로 바뀔 수 있어서 무거운 입자도 만들어집니다. 새로 만들어진 입자는 수명이 매우 짧아서 직접 보이지 않고, 붕괴해서 생긴 입자들의 궤적과 에너지를 측정해서 어떤 입자였는지 역추적합니다. 자세한 검출 방식은 제가 공부한 범위를 넘어서 이 정도로 말씀드리겠습니다.","kw":[{"l":"가속 → 충돌 → E=mc²로 새 입자","a":["mc²로","가속","충돌"]},{"l":"수명 짧음","a":["수명 짧음","수명","짧음"]},{"l":"붕괴 생성물로 역추적","a":["생성물로","역추적","붕괴"]}],"level":"advanced"},{"id":"lk_A23","cat":"자소서","grade":"중3","q":"독서활동에 물리·수학 책이 많은데, 그중 가장 인상 깊은 책 한 권을 말하고 이유를 설명해 보세요. 진로와 어떻게 연결되나요?","a":"(본인이 실제로 고른 책으로 말해야 합니다. 아래는 형식의 예입니다.) 저는 「(책 제목)」이 가장 인상 깊었습니다. 이 책에서 「(책에서 읽은 내용 한 가지)」를 알게 되었고, 이 내용이 제가 하고 싶은 입자물리학과 「(연결되는 이유)」 이어진다고 생각했습니다. 이 책을 읽은 뒤 「(실제로 달라진 점이나 한 활동: 예를 들어 사고실험을 해 보았다, 식을 따라가 보았다)」을 했습니다.","kw":[{"l":"(본인이 고른 책)","a":["본인이","고른"]},{"l":"책에서 얻은 내용 한 가지","a":["책에서","얻은","내용"]},{"l":"진로와 연결","a":["진로와 연결","진로와","연결"]},{"l":"읽은 뒤 한 활동","a":["읽은","활동"]}]},{"id":"lk_A24","cat":"자소서","grade":"중3","q":"독서기록에 책이 20권이나 있는데 모두 직접 읽은 것인가요? 물리 책이 많은데 어떤 순서로 읽었나요?","a":"(사실대로 말해야 합니다.) 1학년과 2학년 동안 읽은 책들이고, 물리와 수학 책이 중심이지만 소설과 인문 책도 있습니다. 물리 책은 「(본인이 읽은 순서)」로 읽었습니다. 예를 들어 처음에는 상대성이론과 양자역학을 소개하는 쉬운 책으로 시작해서, 점점 식이 나오는 책으로 넘어갔다고 말할 수 있습니다. 그중 끝까지 이해하지 못한 책도 있었고, 이해한 책은 「(이해한 책)」입니다. 책마다 이해한 정도가 다르다는 것을 사실대로 말하세요.","kw":[{"l":"사실대로","a":["사실대로"]},{"l":"쉬운 책 → 식이 나오는 책","a":["나오는","쉬운","식이"]},{"l":"이해한 책과 어려웠던 책 구분","a":["어려웠던","이해한","책과"]}]},{"id":"lk_A25","cat":"자소서","grade":"중3","q":"맥스웰 방정식에 대해 아는 것을 말해 보세요. 자소서에 쓴 전자기 유도 실험과 어떻게 연결되나요?","a":"제가 읽은 범위에서 말씀드리겠습니다. 맥스웰 방정식은 전기와 자기 현상을 네 개의 식으로 정리한 것으로 알고 있습니다. 전하가 전기장을 만든다는 것, 자기장에는 홀극이 없다는 것(N극과 S극은 항상 쌍), 변하는 자기장이 전기장을 만든다는 것(패러데이의 전자기 유도), 전류와 변하는 전기장이 자기장을 만든다는 것입니다. 제 실험에서 자석이 코일 옆을 지나가면서 자기장이 변할 때 코일에 전류가 생긴 것은 이 중 세 번째, 변하는 자기장이 전기장을 만든다는 법칙으로 설명됩니다. 수식의 미분 표현까지는 아직 이해하지 못했습니다.","kw":[{"l":"전기장·자기장 네 식","a":["전기장","자기장"]},{"l":"자기 홀극 없음","a":["자기 홀극 없음","자기","홀극"]},{"l":"변하는 자기장→전기장 = 전자기 유도","a":["변하는","자기장","전기장"]},{"l":"수식은 개요만","a":["수식은 개요만","수식은","개요만"]}]},{"id":"lk_B8","cat":"자소서","grade":"중3","q":"E=mc²는 무엇을 뜻하나요? 상대성이론 책에서 알게 된 것은 무엇인가요?","a":"E=mc²는 질량 m과 에너지 E가 서로 바뀔 수 있고, 아주 작은 질량도 c²이라는 아주 큰 수가 곱해져서 엄청난 에너지에 해당한다는 뜻으로 알고 있습니다. 핵반응에서 질량이 조금 줄어드는 만큼의 에너지가 나오고, 입자 충돌에서는 에너지로 새로운 입자가 만들어질 수 있습니다. 제가 읽은 책 「E=mc²」, 「상대성이론은 처음이지?」에서는 「(책에서 읽은 내용)」을 알게 되었습니다. (책에서 읽은 내용은 본인이 읽은 것으로 바꾸어 말하세요.)","kw":[{"l":"질량↔에너지","a":["질량↔에너지"]},{"l":"c²이 곱해짐","a":["c²이 곱해짐","c²이","곱해짐"]},{"l":"핵반응, 입자 생성","a":["핵반응","입자","생성"]},{"l":"책에서 읽은 내용(본인)","a":["책에서","읽은","내용"]}]},{"id":"lk_B9","cat":"자소서","grade":"중3","q":"김상욱 교수의 책을 읽었는데(양자 공부, 하늘과 바람과 별과 인간) 양자역학에서 가장 흥미로웠던 내용은 무엇이었나요?","a":"(본인이 읽은 내용으로 말하세요.) 양자역학에서 입자가 위치와 운동량을 동시에 정확히 알 수 없다는 불확정성이 가장 흥미로웠습니다. 일상의 직관과 다르지만 실험으로 확인된 것이라는 점이 인상 깊었습니다. 제가 이해한 수준에서는 여기까지이고, 수식은 아직 따라가지 못했습니다. 이 책들을 읽고 「(달라진 점)」이 생겼습니다.","kw":[{"l":"읽은 내용(본인)","a":["읽은","내용","본인"]},{"l":"불확정성(예)","a":["불확정성(예)","불확정성"]},{"l":"직관과 다르지만 실험으로 확인","a":["다르지만","실험으로","직관과"]},{"l":"이해 범위 밝히기","a":["밝히기","이해","범위"]}]},{"id":"lk_B10","cat":"자소서","grade":"중3","q":"수학 책(수학 사전, 매스프레소, 가장 쉬운 수학 함수, 중학수학·함수 만점공부법)을 읽고 수학 공부에 어떻게 활용했나요? 근의 작도 탐구와 연결되는 책이 있나요?","a":"(본인의 경험으로 말하세요.) 수학 책들은 교과서에서 외우기만 했던 공식과 개념을 이유와 함께 정리해 보는 데 도움이 되었습니다. 특히 「(책 제목)」에서 「(알게 된 내용)」을 보고 공식을 외우기 전에 왜 그런지 먼저 확인하는 습관이 생겼습니다. 근의 작도 탐구에서 사영정리를 닮음으로 다시 이해한 것도 이런 습관과 이어집니다.","kw":[{"l":"외우기 → 이유 확인","a":["외우기","이유","확인"]},{"l":"책에서 알게 된 내용(본인)","a":["책에서","알게","내용"]},{"l":"작도 탐구와 연결","a":["탐구와","작도","연결"]}]},{"id":"lk_B11","cat":"자소서","grade":"중3","q":"소설과 인문 책(모모, 동물농장, 우리들의 일그러진 영웅, 달러구트 꿈 백화점, 삼국지)에서 인상 깊었던 점은 무엇인가요? 자소서의 협력·소통 경험과 연결해서 말해 보세요.","a":"(본인이 읽은 내용으로 말하세요.) 예를 들어 「모모」는 남의 이야기를 끝까지 들어 주는 능력으로 사람들의 문제를 풀어 주는 이야기로 알고 있고, 이것은 제가 진자 실험에서 친구의 이해 정도를 살피며 설명을 바꾼 경험과 이어집니다. 「동물농장」과 「우리들의 일그러진 영웅」은 권력과 순응에 관한 이야기여서, 팀에서 한 사람의 말에만 따르지 않고 각자 의견을 말하는 것이 중요하다고 생각하게 했습니다. (줄거리를 실제로 읽은 만큼만 말하세요.)","kw":[{"l":"듣는 능력","a":["듣는 능력","듣는","능력"]},{"l":"소통 경험과 연결","a":["경험과","소통","연결"]},{"l":"권력과 순응","a":["권력과 순응","권력과","순응"]},{"l":"읽은 만큼만","a":["읽은 만큼만","만큼만","읽은"]}]},{"id":"lk_B12","cat":"자소서","grade":"중3","q":"화학 책(이런 화학이라면 포기하지 않을 텐데)과 환경 책(지구는 괜찮아, 우리가 문제지)은 왜 읽었고, 물리 진로와 관계가 있나요?","a":"(본인의 이유로 말하세요.) 물리 외에 화학과 환경도 함께 알아야 자연 현상을 넓게 이해할 수 있다고 생각해서 읽었습니다. 화학 책에서는 「(알게 된 내용)」, 환경 책에서는 「(알게 된 내용)」을 알게 되었습니다. 입자물리학도 물질이 무엇으로 이루어져 있는지를 묻는다는 점에서 원자와 분자를 다루는 화학과 이어진다고 생각합니다.","kw":[{"l":"넓게 이해","a":["넓게 이해","넓게","이해"]},{"l":"알게 된 내용(본인)","a":["알게","내용","본인"]},{"l":"물질의 구성으로 연결","a":["구성으로","물질의","연결"]}]},{"id":"lk_C8","cat":"자소서","grade":"중3","q":"물리의 정석: 고전역학 편(서스킨드)과 파인만의 물리학 강의 1에서 기억나는 내용을 말해 보세요. 어느 정도까지 읽었나요?","a":"(읽은 만큼만 말하세요.) 두 책 모두 대학 수준이어서 끝까지 이해했다고 말씀드리기는 어렵습니다. 읽은 부분에서 기억나는 것은 「(예: 힘과 운동, 보존 법칙을 한 가지 원리에서 정리해 가는 설명 방식)」입니다. 책의 정확한 내용을 확인하지 못했다면 아는 척하지 말고, \"읽은 범위는 ○○까지이고 그 부분에서 ○○가 인상 깊었다\"고 말하세요.","kw":[{"l":"읽은 범위 밝히기","a":["밝히기","읽은","범위"]},{"l":"기억나는 내용 한 가지","a":["기억나는","내용","가지"]},{"l":"아는 척하지 않기","a":["척하지","아는","않기"]}],"level":"advanced"},{"id":"lk_J1","cat":"자소서","grade":"중3","q":"실험을 어떻게 했는지 설명해 주세요. (1) 어떤 장치를 썼고 (2) 무엇을 일정하게 했고 (3) 무엇을 측정했나요? (4) 그 재료와 기구는 어떻게 구했나요?","a":"(1) 코일, 전류계, 막대자석, 가열 도구를 썼습니다. 자석이 코일 옆을 지나갈 때 코일에 유도 전류가 생기고 전류계 바늘이 움직입니다. (2) 코일의 감은 수, 자석이 지나가는 속도와 거리, 자석의 종류를 같게 하고 자석의 온도만 바꿉니다. (3) 전류계 바늘이 움직이는 최댓값을 측정하고 여러 번 반복해 평균을 냈습니다. (4) (「본인이 구한 방법」으로 바꿔 말하세요.) 학교 과학실의 코일과 전류계를 사용했고, 자석은 직접 구입하거나 과학실에서 빌렸습니다. 기구를 구한 방법을 정직하게 말하면 됩니다.","kw":[{"l":"유도 전류","a":["유도 전류","유도","전류"]},{"l":"같게: 코일·속도·거리","a":["같게","코일","속도"]},{"l":"바꾸기: 온도","a":["바꾸기: 온도","바꾸기","온도"]},{"l":"반복 측정","a":["반복 측정","반복","측정"]}]},{"id":"lk_J2","cat":"자소서","grade":"중3","q":"자석을 가열하는 실험에서 위험한 점은 무엇이고 어떤 안전 조치를 했나요? (락스·혈액 실험에서 안전성을 물은 것과 같은 유형입니다.)","a":"(「본인이 실제로 한 것」으로 바꿔 말하세요.) 가열한 자석과 도구는 화상 위험이 있어서 내열 장갑과 집게를 쓰고 보안경을 착용했습니다. 가열 도구 주변의 가연물을 치우고 환기를 했으며, 식을 때까지 맨손으로 만지지 않았습니다. 뜨거워진 자석이 전선의 피복을 녹일 수 있어서 코일 가까이에서 가열하지 않았습니다. 일부 자석은 높은 온도에서 자성이 약해지거나 깨질 수 있어 자석 종류의 사용 가능 온도를 먼저 확인해야 합니다. 실험 전에 선생님께 계획을 설명하고 허락받았습니다.","kw":[{"l":"화상: 장갑·집게","a":["화상","장갑","집게"]},{"l":"보안경","a":["보안경"]},{"l":"가연물 제거·환기","a":["가연물","제거","환기"]},{"l":"사용 온도 확인","a":["사용 온도 확인","사용","온도","확인"]},{"l":"선생님 허락","a":["선생님 허락","선생님","허락"]}]},{"id":"lk_J3","cat":"자소서","grade":"중3","q":"전류계 바늘의 최댓값을 읽을 때 생기는 오차는 무엇이고 어떻게 줄였나요? 실험 결과가 예상과 달랐다면 그 이유를 어떻게 설명하겠습니까?","a":"바늘은 순간적으로 올라갔다 내려와서 눈으로 최댓값을 읽기 어렵고, 읽는 사람의 반응 시간과 바늘의 관성이 오차를 만듭니다. 같은 사람이 같은 방법으로 반복해 평균을 내거나 스마트폰 슬로모션으로 촬영해 프레임을 하나씩 확인하면 줄일 수 있습니다. 결과가 예상과 달랐다면 가열 중 자석이 식은 정도, 자석이 지나가는 속도 차이, 자석 종류의 성질을 원인 후보로 나누어 하나씩 확인하겠습니다. 한 번의 결과로 결론을 내리지 않고 한계를 함께 말합니다.","kw":[{"l":"관성·반응 시간","a":["관성·반응 시간","관성","반응","시간"]},{"l":"반복·평균","a":["반복·평균","반복","평균"]},{"l":"슬로모션","a":["슬로모션"]},{"l":"원인 후보 나누기","a":["나누기","원인","후보"]}]},{"id":"lk_J4","cat":"자소서","grade":"중3","q":"자석을 가열하면 자석의 세기가 어떻게 되는지 원리를 설명하고, 퀴리 온도가 무엇인지 말해 보세요.","a":"자석의 세기는 물질 속의 원자 자석들이 한 방향으로 가지런히 정렬되어 있기 때문에 생깁니다. 온도가 올라가면 원자의 열운동이 활발해져 정렬이 흐트러지고 자석의 세기가 약해집니다. 퀴리 온도 이상에서는 정렬이 완전히 깨져 자성을 잃습니다. 퀴리 온도는 물질마다 달라서 철은 약 770℃, 페라이트 자석은 약 400~450℃, 네오디뮴 자석은 그보다 낮은 300℃ 안팎으로 알려져 있으며, 실제 자석은 퀴리 온도에 이르기 전에 사용 한계 온도를 넘으면 자성이 일부 영구히 줄어들 수 있습니다. 제 실험의 온도 범위에서 어떤 일이 일어났는지는 「본인이 확인한 범위」에서만 말합니다.","kw":[{"l":"원자 자석 정렬","a":["원자 자석 정렬","원자","자석","정렬"]},{"l":"열운동 → 정렬 흐트러짐","a":["흐트러짐","열운동","정렬"]},{"l":"퀴리 온도 = 자성 소실","a":["퀴리","온도","자성"]},{"l":"물질마다 다름","a":["물질마다 다름","물질마다","다름"]}]},{"id":"lk_J5","cat":"자소서","grade":"중3","q":"전자기 유도가 무엇인지 설명하고, 유도 전류의 세기를 크게 하는 방법을 말해 보세요. 자석의 극을 반대로 하면 전류의 방향은 어떻게 되나요?","a":"코일 근처에서 자석을 움직여 코일을 지나는 자기장이 변하면 코일에 전류가 흐르는데 이를 전자기 유도라 하고 흐르는 전류가 유도 전류입니다. 자석을 빠르게 움직일수록, 센 자석을 쓸수록, 코일의 감은 수가 많을수록 유도 전류가 커집니다. 자석이 멈추면 자기장의 변화가 없어 전류가 흐르지 않고, 자석이 코일에 가까워질 때와 멀어질 때 전류의 방향이 반대입니다. 극을 반대로 하면 전류의 방향도 반대가 됩니다. 이 전류는 코일을 지나는 자기장의 변화를 방해하는 방향으로 흐르며(렌츠 법칙) 발전기와 변압기에 쓰입니다.","kw":[{"l":"자기장 변화 → 유도 전류","a":["자기장","변화","유도"]},{"l":"빠르게/세게/감은 수↑ → 커짐","a":["빠르게","세게","감은"]},{"l":"극 반대 → 방향 반대","a":["반대","방향"]},{"l":"정지 → 0","a":["정지 → 0","정지"]}]},{"id":"lk_J6","cat":"자소서","grade":"중3","q":"이차방정식의 근을 자와 컴퍼스로 작도한 탐구를 설명하세요. (1) 무엇을 어떻게 작도했나요? (2) 왜 이것이 근이 되나요? (3) 이 탐구에서 가장 어려웠던 점과 배운 점은 무엇인가요?","a":"(1)(2) (「본인이 사용한 방법」으로 바꿔 말하세요.) 예를 들어 x² − 5x + 6 = 0의 근은 점 (0, 1)과 (5, 6)을 지름의 양 끝으로 하는 원이 x축과 만나는 점으로 작도할 수 있습니다. 이 원의 중심은 (2.5, 3.5), 반지름의 제곱은 12.5이고, y = 0에서 (x − 2.5)² = 0.25이므로 x = 2, 3입니다. 일반적으로 근과 계수의 관계(합 −b/a, 곱 c/a)를 도형으로 옮긴 것입니다. (3) 계산한 숫자 근을 길이로 나타내는 일이 어려웠고, 대수와 기하가 서로 연결되어 있음을 배웠습니다.","kw":[{"l":"근 = 길이","a":["근 = 길이","길이"]},{"l":"합과 곱","a":["합과 곱","합과"]},{"l":"대수와 기하 연결","a":["대수와","기하","연결"]},{"l":"계산 vs 작도","a":["계산 vs 작도","계산","vs","작도"]}]},{"id":"lk_J7","cat":"자소서","grade":"중3","q":"길이가 1과 a인 두 선분으로 √a의 길이를 자와 컴퍼스로 작도하는 방법을 설명하고, 왜 그 길이가 되는지 말해 보세요.","a":"한 직선 위에 길이 1과 a인 선분을 이어 붙여 전체 길이가 1 + a인 선분 AC를 만들고, AC를 지름으로 하는 반원을 그립니다. 두 선분의 연결점 B에서 AC에 수직인 직선을 그어 반원과 만나는 점을 D라 하면 BD = √a입니다. 지름에 대한 원주각은 90°이므로 삼각형 ADC는 직각삼각형이고 B는 빗변 위의 수선의 발입니다. 직각삼각형 ABD와 DBC는 닮음이므로 AB : BD = BD : BC, 즉 1 : BD = BD : a에서 BD² = a입니다. 이것이 높이 공식(사영정리) BD² = AB × BC입니다.","kw":[{"l":"반원 지름 1+a","a":["반원","지름"]},{"l":"수선 BD","a":["수선 BD","수선","BD"]},{"l":"△ABD ∽ △DBC","a":["△ABD","△DBC"]},{"l":"BD²=1×a","a":["BD²=1×a","BD²","1×a"]}]},{"id":"lk_J8","cat":"자소서","grade":"중3","q":"황금비 (1+√5)/2를 자와 컴퍼스로 작도하는 방법을 말하고, 이 값이 이차방정식과 어떤 관계인지 설명해 보세요.","a":"선분 AB의 길이를 1로 하고 B에서 수직으로 길이 1/2인 선분 BC를 세웁니다. 직각삼각형 ABC에서 AC = √(1 + 1/4) = √5/2입니다. 점 C를 중심으로 반지름 1/2(= BC)인 컴퍼스로 선분 AC의 연장선 위에 점 E를 잡으면 AE = √5/2 + 1/2 = (1 + √5)/2입니다. 이 값은 x² − x − 1 = 0의 양의 근입니다. 근의 공식으로 x = (1 ± √5)/2이고 양수는 (1 + √5)/2 ≈ 1.618입니다. 피보나치 수열에서 이웃한 두 항의 비가 이 값에 수렴합니다.","kw":[{"l":"AB=1, BC=1/2","a":["AB","BC"]},{"l":"AC=√5/2","a":["AC=√5/2","AC","√5"]},{"l":"AE=(1+√5)/2 ≈ 1.618","a":["618","AE","√5"]},{"l":"x²−x−1=0","a":["x²−x−1=0","x²−x−1"]},{"l":"피보나치의 비 수렴","a":["피보나치의","수렴"]}]},{"id":"lk_J9","cat":"자소서","grade":"중3","q":"진자 실험에서 친구와 의견이 달랐던 적이 있나요? 그때 어떻게 설명하고 설득했으며, 무엇을 배웠나요?","a":"(「본인이 겪은 일」로 바꿔 말하세요.) 의견이 달랐을 때 누가 맞는지 따지기보다 실험으로 확인할 수 있는 부분을 찾았습니다. 진자의 주기는 줄의 길이에 관계하고 추의 질량과는 관계가 없다는 점을 길이를 바꿔 가며 직접 재서 보였습니다. 약 25 cm 길이의 진자 주기가 약 1초임을 확인하는 식입니다. 제 설명이 틀렸다면 바로 인정하고 고쳤고, 소통은 내 생각을 전달하는 것이 아니라 상대가 이해했는지 확인하는 것이라고 배웠습니다.","kw":[{"l":"주기는 길이로 결정","a":["주기는","길이로","결정"]},{"l":"질량과 무관","a":["질량과 무관","질량과","무관"]},{"l":"실험으로 확인","a":["실험으로 확인","실험으로","확인"]},{"l":"이해했는지 확인","a":["이해했는지 확인","이해했는지","확인"]}]},{"id":"lk_J10","cat":"자소서","grade":"중3","q":"진자의 주기는 무엇에 의해 정해지나요? 길이 25 cm인 진자의 주기를 구하고, 길이를 4배로 하면 주기가 어떻게 되는지 말해 보세요. (g = 9.8 m/s²)","a":"진자의 주기(진폭이 작을 때)는 T = 2π√(L/g)이고 추의 질량과 진폭에는 거의 영향을 받지 않으며 줄의 길이와 중력 가속도로 정해집니다. L = 0.25 m이면 T = 2π√(0.25/9.8) ≈ 2π × 0.16 ≈ 1.0초입니다. 길이를 4배로 하면 주기는 √4 = 2배가 되어 약 2초입니다. 진폭이 큰 경우에는 이 식이 정확하지 않습니다. 주기는 진자가 한 번 왕복하는 데 걸리는 시간이고, 가장 낮은 점에서 속력이 가장 빠르며 이때 위치 에너지가 운동 에너지로 바뀝니다.","kw":[{"l":"T=2π√(L/g)","a":["2π√"]},{"l":"질량과 무관","a":["질량과 무관","질량과","무관"]},{"l":"25 cm ≈ 1 s","a":["25","cm"]},{"l":"길이 4배 → 주기 2배","a":["길이","4배","주기"]}]},{"id":"lk_J11","cat":"자소서","grade":"중3","q":"원자는 무엇으로 이루어져 있고, 양성자와 중성자는 더 작은 입자로 나뉘나요? 자연의 네 가지 기본 힘을 말해 보세요.","a":"원자는 원자핵과 전자로 이루어져 있고 원자핵은 양성자와 중성자로 이루어져 있습니다. 양성자와 중성자는 쿼크로 이루어져 있다고 알고 있습니다. 양성자는 업 쿼크 2개와 다운 쿼크 1개(uud)로 전하가 2/3 + 2/3 − 1/3 = +1이고, 중성자는 업 쿼크 1개와 다운 쿼크 2개(udd)로 전하가 2/3 − 1/3 − 1/3 = 0입니다. 전자는 더 쪼개지지 않는 입자(렙톤)로 알려져 있습니다. 기본 힘은 중력, 전자기력, 강한 핵력, 약한 핵력 네 가지입니다. 제가 읽은 범위에서 말씀드리고 확실하지 않은 부분은 모른다고 하겠습니다.","kw":[{"l":"원자 → 핵+전자 → 양성자·중성자 → 쿼크","a":["양성자","중성자","원자"]},{"l":"uud=+1, udd=0","a":["uud","udd"]},{"l":"네 가지 힘","a":["네 가지 힘","가지"]}]},{"id":"lk_J12","cat":"자소서","grade":"중3","q":"특수상대성이론의 두 가정을 말하고, 광시계로 움직이는 시계가 느리게 간다는 것을 설명하세요. 속력이 0.6c일 때 시간은 몇 배 느려지나요?","a":"두 가정은 첫째 모든 관성계에서 물리 법칙이 같다는 것, 둘째 진공에서 빛의 속력은 관찰자나 광원의 운동과 관계없이 항상 같다는 것입니다. 거울 두 개 사이를 빛이 오가는 시계를 생각하면, 시계가 정지해 있을 때 빛은 위아래로 곧게 가지만 시계가 옆으로 움직이면 밖에서 보는 사람에게는 빛이 대각선으로 가서 더 긴 거리를 갑니다. 빛의 속력은 같으므로 더 긴 거리를 가는 데 시간이 더 걸려서 움직이는 시계가 느리게 갑니다. 시간 지연 계수는 γ = 1/√(1 − v²/c²)이고 v = 0.6c이면 √(1 − 0.36) = 0.8이므로 γ = 1.25배입니다. v = 0.8c이면 γ = 5/3입니다.","kw":[{"l":"빛의 속력 불변","a":["빛의 속력 불변","빛의","속력","불변"]},{"l":"대각선 경로 → 더 긴 시간","a":["대각선","경로","시간"]},{"l":"γ=1/√(1−v²/c²)","a":["1−v²","c²"]},{"l":"0.6c → 1.25","a":["6c","25"]}]},{"id":"lk_J13","cat":"자소서","grade":"중3","q":"마이컬슨 간섭계의 원리를 설명하고, 거울을 0.3 mm 움직였을 때 간섭무늬가 1000개 지나갔다면 빛의 파장은 얼마인가요? 이 실험은 무엇을 확인하려는 것이었나요?","a":"광원에서 나온 빛을 반투명 거울로 둘로 나누어 서로 수직인 두 경로로 보낸 뒤 거울에 반사시켜 다시 합치면 두 빛의 경로 차이에 따라 보강 간섭과 상쇄 간섭이 일어나 간섭무늬가 생깁니다. 한쪽 거울을 d만큼 움직이면 경로 차이가 2d만큼 변하고 경로 차이가 파장 하나만큼 변할 때마다 무늬가 하나씩 지나가므로 N = 2d/λ입니다. λ = 2d/N = 2 × 0.3 mm / 1000 = 0.6 μm = 600 nm입니다. 마이컬슨과 몰리의 실험은 빛을 전달한다고 생각했던 에테르에 대한 지구의 운동을 검출하려는 것이었으나 빛의 속력 차이를 찾지 못했고, 이는 빛의 속력이 일정하다는 상대성이론의 바탕이 되었습니다.","kw":[{"l":"경로 차 → 간섭무늬","a":["간섭무늬","경로"]},{"l":"N=2d/λ","a":["N=2d/λ","2d"]},{"l":"λ=600 nm","a":["λ=600 nm","600","nm"]},{"l":"에테르 검출 실패 → 광속 불변","a":["에테르","검출","실패"]}]},{"id":"lk_D1","cat":"독서·인성","grade":"중3","q":"이 실험(자석의 온도에 따른 성질 변화)을 하게 된 계기를 말해 보세요. 어떤 점이 궁금했나요?","a":"(「본인이 실제로 떠올린 일」로 바꿔 말하세요.) 중학교에서 자기와 열을 배우고, 자석이 뜨거워지면 성질이 변하는지 궁금했습니다. 자석의 세기는 자석 근처에서 코일에 생기는 유도 전류로 비교할 수 있다고 생각해서, 가열 전후의 자석으로 유도 전류를 비교하는 실험을 계획했습니다. 입자물리학자라는 꿈과 연결하면, 물질의 성질을 작은 입자 수준에서 이해하고 싶다는 호기심에서 시작했습니다.","kw":[{"l":"자기+열 수업 → 질문 → 유도 전류로 비교","a":["전류로","자기","수업"]}]},{"id":"lk_D2","cat":"독서·인성","grade":"중3","q":"입자물리학자가 되고 싶은 이유는 무엇이고, 지금 중학생으로서 어떤 준비를 하고 있나요?","a":"(「본인의 솔직한 생각」으로 바꿔 말하세요.) 물질이 어떤 작은 입자로 이루어져 있고 그 입자들이 어떻게 상호작용하는지가 궁금해서 입자물리학자를 꿈꾸게 되었습니다. 제가 아는 범위에서는 입자물리학은 가속기 같은 큰 시설과 국제 공동 연구로 이루어지고, 대학과 대학원에서 물리와 수학을 깊이 공부하는 길이 일반적이라고 알고 있습니다. 지금은 중학교 물리를 정확히 이해하고, 상대성이론과 양자역학 책을 읽은 만큼 말로 설명하는 연습을 하고 있습니다.","kw":[{"l":"물질과 상호작용에 대한 호기심","a":["상호작용에","물질과","호기심"]},{"l":"물리·수학","a":["물리·수학","물리","수학"]},{"l":"읽은 만큼만 설명","a":["만큼만","읽은","설명"]}]},{"id":"lk_D3","cat":"독서·인성","grade":"중3","q":"읽은 책 한 권의 줄거리를 말하고, 가장 기억에 남는 부분과 그 책이 본인의 활동에 준 영향을 말해 보세요.","a":"(「본인이 읽은 책」으로 바꿔 말하세요. 책 제목이 확실하지 않은 것은 말하지 않습니다.) 줄거리는 한두 문장으로 요약하고, 기억에 남는 장면 하나를 고른 뒤, 그 내용이 자석 실험이나 작도 탐구의 어떤 질문과 이어졌는지 말합니다. 책에서 읽지 않은 내용은 말하지 않고 \"제가 읽은 범위에서는 ~입니다\"라고 한계를 밝힙니다.","kw":[{"l":"줄거리 한두 문장","a":["줄거리","한두","문장"]},{"l":"기억에 남는 장면","a":["기억에","남는","장면"]},{"l":"내 탐구와 연결","a":["내 탐구와 연결","탐구와","연결"]},{"l":"읽은 범위만","a":["읽은 범위만","범위만","읽은"]}]},{"id":"lk_D4","cat":"독서·인성","grade":"중3","q":"읽은 책 중 다른 한 권에서 얻은 지식을 본인의 탐구에 적용해 본 적이 있나요? 책의 내용과 실험 결과가 달랐다면 어떻게 생각하나요?","a":"(「본인이 읽은 책」으로 바꿔 말하세요. 책 제목이 확실하지 않으면 말하지 않습니다.) 책에서 읽은 개념(예: 퀴리 온도나 전자기 유도)을 실험의 질문으로 바꿔 보았다고 말할 수 있습니다. 책의 내용과 실험 결과가 다르면 책이 틀렸다고 하기보다 책이 전제한 조건(자석의 종류, 온도 범위)과 제 실험 조건이 같은지, 제 측정에 오차가 없었는지를 먼저 확인합니다. 한 번의 결과로 결론을 내리지 않고 반복해서 확인하겠다고 말합니다.","kw":[{"l":"책의 개념 → 실험 질문","a":["책의","개념","실험"]},{"l":"조건 비교","a":["조건 비교","조건","비교"]},{"l":"오차 점검","a":["오차 점검","오차","점검"]},{"l":"반복 확인","a":["반복 확인","반복","확인"]}]},{"id":"lk_D5","cat":"독서·인성","grade":"중3","q":"본인의 장점과 단점, 그리고 지금까지 한 활동 중 가장 기억에 남는 활동을 말해 보세요.","a":"(「본인의 솔직한 생각」으로 바꿔 말하세요.) 장점은 하나의 현상을 여러 이론으로 설명하려 하고 측정 방법의 한계를 스스로 점검하는 것입니다. 단점은 (예: 완벽하게 하려다 시간이 오래 걸리는 점)이고, 시간을 정해 두고 한 번에 한 단계씩 끝내는 방법으로 고치고 있습니다. 가장 기억에 남는 활동은 자석 실험처럼 활동 → 내가 한 일 → 어려움과 해결 → 배운 점 순서로 말합니다.","kw":[{"l":"장점+예","a":["장점+예","장점"]},{"l":"단점+개선","a":["단점+개선","단점","개선"]},{"l":"활동 4단계","a":["활동 4단계","4단계","활동"]}]},{"id":"lk_D6","cat":"독서·인성","grade":"중3","q":"1분 동안 자기소개와 지원 동기를 말해 보세요.","a":"(「본인의 말」로 키워드를 보고 연습하세요.) 저는 입자물리학자를 꿈꾸는 이건희입니다. 중학교에서 자기와 열을 배우고 온도에 따라 자석의 성질이 변하는지 궁금해서, 전자기 유도를 공부해 가열 전후 자석의 유도 전류를 비교하는 실험을 했습니다. 이 과정에서 하나의 현상을 여러 이론으로 설명하고 측정 방법의 한계를 스스로 점검하는 법을 배웠습니다. 수학에서는 이차방정식의 근을 자와 컴퍼스로 작도하며 계산과 도형이 연결된다는 것을 알았습니다. 한성과학고에서 물리와 수학을 깊이 공부하고 싶습니다.","kw":[{"l":"꿈 → 자석 실험 → 작도 → 배운 점 → 입학 후","a":["자석","실험","작도"]}]},{"id":"lk_D7","cat":"독서·인성","grade":"중3","q":"한성과학고에 입학한 뒤 가장 어려울 것 같은 점은 무엇이고 어떻게 대처할 건가요? 하고 싶은 활동도 함께 말해 보세요.","a":"(「본인의 솔직한 생각」으로 바꿔 말하세요. 학교 프로그램은 확인된 것만 말합니다.) 학습량과 난이도가 크게 늘어서 이해하지 못한 개념이 쌓일 수 있다는 점이 가장 어려울 것 같습니다. 이해되지 않는 부분은 바로 질문하고 직접 확인하며, 친구들과 서로 설명하며 공부하겠습니다. 입학하면 물리와 수학을 더 깊이 공부하고 실험을 설계하고 오차를 분석하는 탐구를 이어가고 싶습니다.","kw":[{"l":"어려움 → 구체적 대처","a":["어려움","구체적","대처"]},{"l":"하고 싶은 활동","a":["하고 싶은 활동","하고","싶은","활동"]},{"l":"확인된 프로그램만","a":["프로그램만","확인된"]}]},{"id":"lk_M1","cat":"수학","grade":"중3","q":"두 이차함수 y = f(x), y = g(x)의 그래프가 만나는 점에 대해 답하세요. (1) 두 그래프의 교점의 x좌표가 방정식 f(x) − g(x) = 0의 해인 이유를 설명하세요. (2) f(x) = ax² + bx + c, g(x) = px² + qx + r일 때 f(x) − g(x) = 0을 이차방정식의 일반형으로 나타내세요. (3) 두 그래프가 서로 다른 두 점에서 만날 조건을 말하세요.","a":"(1) 교점은 두 그래프 위에 동시에 있는 점이므로, 그 점의 x좌표에서 f(x)의 값과 g(x)의 값이 같습니다. 즉 f(x) = g(x)이고 이항하면 f(x) − g(x) = 0입니다. 거꾸로 이 방정식의 해 x에서는 두 함수의 값이 같아서 그 점에서 그래프가 만납니다. (2) (a − p)x² + (b − q)x + (c − r) = 0입니다. (3) 이차방정식이 되려면 a ≠ p여야 하고, 서로 다른 두 실근을 가지려면 판별식 D = (b − q)² − 4(a − p)(c − r) > 0이어야 합니다. D = 0이면 한 점에서 접하고, D \u003c 0이면 만나지 않습니다. 예를 들어 f = x² − 2x + 3, g = −x² + 4x − 1이면 f − g = 2x² − 6x + 4 = 2(x − 1)(x − 2)이므로 x = 1, 2에서 만나고 교점은 (1, 2), (2, 3)입니다.","kw":[{"l":"교점에서 f(x)=g(x)","a":["교점에서"]},{"l":"f−g=0","a":["f−g=0","f−g"]},{"l":"(a−p)x²+(b−q)x+(c−r)=0","a":["a−p","b−q","c−r"]},{"l":"D>0 이면 두 점","a":["이면"]}]},{"id":"lk_M2","cat":"수학","grade":"중3","q":"좌표평면에서 원점을 O, 점 A(a, 0), 점 B(0, b) (a, b > 0)라 하고, 선분 AB를 빗변으로 하는 직각이등변삼각형 ABC를 O와 반대쪽에 그립니다. (1) 사각형 OBCA가 원에 내접함을 보이세요. (2) 이 원의 중심과 반지름을 a, b로 나타내세요. (3) 점 C의 좌표를 구하세요.","a":"(1) ∠AOB = 90°이고 ∠ACB = 90°이므로 두 각의 합이 180°입니다. 마주 보는 각의 합이 180°인 사각형은 원에 내접하므로 OBCA는 원에 내접합니다. 또는 O와 C가 모두 선분 AB를 지름으로 하는 원 위에 있다고 말해도 됩니다(지름에 대한 원주각은 90°). (2) AB가 지름이므로 중심은 AB의 중점 (a/2, b/2)이고, 반지름은 AB/2 = √(a² + b²)/2입니다. (3) 중심 M(a/2, b/2)에서 C까지의 거리는 반지름과 같고 MC는 AB에 수직입니다. AB의 방향 벡터가 (−a, b)이므로 수직 방향은 (b, a)이고, 길이를 √(a² + b²)/2로 맞추면 (b/2, a/2)입니다. 따라서 C = ((a + b)/2, (a + b)/2)입니다. 이 점은 직선 y = x 위에 있고 O와 반대쪽입니다.","kw":[{"l":"∠AOB+∠ACB=180°","a":["∠AOB","∠ACB","180°"]},{"l":"AB가 지름(지름의 원주각 90°)","a":["AB가","지름의","원주각"]},{"l":"중심 (a/2, b/2)","a":["중심"]},{"l":"반지름 √(a²+b²)/2","a":["반지름","a²","b²"]},{"l":"C((a+b)/2, (a+b)/2)","a":["C((a+b)/2, (a+b)/2)"]}]},{"id":"lk_M3","cat":"수학","grade":"중3","q":"(1) 방정식과 항등식의 차이를 설명하세요. (2) 이차방정식을 푸는 방법을 모두 말하세요. (3) 이차식이 인수분해가 되지 않는 경우는 언제인가요?","a":"(1) 방정식은 x가 특정한 값일 때만 성립하는 등식이고(예: x + 2 = 5는 x = 3일 때만), 항등식은 x에 어떤 값을 넣어도 항상 성립하는 등식입니다(예: (x + 1)² = x² + 2x + 1). (2) 인수분해, 제곱근(x² = k 꼴, (x − p)² = q 꼴), 완전제곱식으로 바꾸기, 근의 공식으로 풉니다. (3) 정수 계수 이차식 ax² + bx + c는 판별식 D = b² − 4ac가 완전제곱수일 때 정수(유리수) 계수로 인수분해됩니다. D가 완전제곱수가 아니면 인수분해되지 않습니다(예: x² − 2x − 1은 D = 8, x² + x + 1은 D = −3). 근이 분수여도 인수분해될 수 있으므로(2x² − x − 1 = (2x + 1)(x − 1)), \"루트가 있을 때\"가 기준입니다.","kw":[{"l":"방정식=특정한 값","a":["방정식","특정한"]},{"l":"항등식=항상 성립","a":["항등식","항상","성립"]},{"l":"인수분해 / 제곱근 / 완전제곱식 / 근의 공식","a":["완전제곱식","인수분해","제곱근"]},{"l":"D가 완전제곱수 → 인수분해 가능","a":["완전제곱수","인수분해","D가"]}]},{"id":"lk_M4","cat":"수학","grade":"중3","q":"이차방정식 x² − 5x + 6 = 0에 대해 답하세요. (1) 인수분해로 해를 구하세요. (2) 판별식의 값을 구하고 그 의미를 설명하세요. (3) 두 근의 합과 곱을 계수로 나타내세요.","a":"(1) (x − 2)(x − 3) = 0이므로 x = 2 또는 x = 3입니다. (2) D = b² − 4ac = 25 − 24 = 1이고 D > 0이면 서로 다른 두 실근, D = 0이면 중근, D \u003c 0이면 실근이 없다는 뜻입니다. D = 1은 완전제곱수라서 근이 정수(유리수)로 나오고 인수분해가 됩니다. (3) ax² + bx + c = 0의 두 근의 합은 −b/a, 곱은 c/a입니다. 여기서 합 5 = −(−5)/1, 곱 6 = 6/1이고 2 + 3 = 5, 2 × 3 = 6으로 맞습니다. 근의 공식 x = (−b ± √D) / 2a에서 두 근을 더하면 −b/a가 됩니다.","kw":[{"l":"(x−2)(x−3)","a":["x−2","x−3"]},{"l":"D=1>0 두 실근","a":["실근"]},{"l":"합 −b/a=5","a":["합 −b/a=5","−b"]},{"l":"곱 c/a=6","a":["곱 c/a=6"]}]},{"id":"lk_M5","cat":"수학","grade":"중3","q":"(1) 좌표평면의 네 사분면을 설명하고 각 사분면에서 점의 x좌표, y좌표의 부호를 말하세요. (2) 점 (a, b)에서 ab \u003c 0이고 a − b > 0이면 이 점은 어느 사분면에 있나요? (3) 일차함수 y = ax + b에서 a \u003c 0, b > 0이면 그래프가 지나는 사분면은 어디인가요?","a":"(1) 제1사분면은 (+, +), 제2사분면은 (−, +), 제3사분면은 (−, −), 제4사분면은 (+, −)입니다. 번호는 x축의 양의 방향에서 시작해서 시계 반대 방향으로 붙입니다. 축 위의 점은 어느 사분면에도 속하지 않습니다. (2) ab \u003c 0이므로 a와 b의 부호가 다르고, a − b > 0이므로 a > b입니다. 따라서 a > 0, b \u003c 0이고 점 (a, b)는 제4사분면입니다. (3) 기울기가 음수이므로 오른쪽 아래로 향하는 직선이고 y절편 b가 양수이므로 y축의 양의 부분을 지납니다. x \u003c 0에서는 y > b > 0이라 제2사분면, 0 \u003c x \u003c −b/a에서는 y > 0이라 제1사분면, x > −b/a에서는 y \u003c 0이라 제4사분면을 지납니다. 따라서 제1, 2, 4사분면이고 제3사분면은 지나지 않습니다.","kw":[{"l":"1(+,+) 2(−,+) 3(−,−) 4(+,−)","a":["1(+,+) 2(−,+) 3(−,−) 4(+,−)"]},{"l":"ab\u003c0이면 부호가 다름","a":["0이면","부호가","ab"]},{"l":"a\u003c0,b>0 → 1,2,4사분면","a":["4사분면"]}]},{"id":"lk_M6","cat":"수학","grade":"중3","q":"이차함수 y = x² − 4x + 3에 대해 답하세요. (1) y = a(x − p)² + q 꼴로 고치고 꼭짓점과 축을 구하세요. (2) x절편과 y절편을 구하세요. (3) a의 부호와 |a|의 크기는 그래프의 모양에 어떤 영향을 주나요? (4) y = x²의 그래프를 어떻게 이동하면 이 그래프가 되나요?","a":"(1) y = (x − 2)² − 1이므로 꼭짓점은 (2, −1), 축은 직선 x = 2입니다. (2) y = 0이면 (x − 1)(x − 3) = 0이므로 x절편은 1과 3이고, x = 0이면 y = 3이므로 y절편은 3입니다. (3) a > 0이면 아래로 볼록(꼭짓점이 최솟값), a \u003c 0이면 위로 볼록(꼭짓점이 최댓값)이고, |a|가 클수록 그래프의 폭이 좁아집니다. (4) y = x²을 x축 방향으로 2, y축 방향으로 −1만큼 평행이동한 것입니다.","kw":[{"l":"완전제곱식 (x−2)²−1","a":["완전제곱식","x−2","²−1"]},{"l":"꼭짓점 (2,−1)","a":["꼭짓점","−1"]},{"l":"x절편 1, 3","a":["x절편 1, 3","x절편"]},{"l":"y절편 3","a":["y절편 3","y절편"]},{"l":"a>0 아래로 볼록","a":["아래로","볼록"]},{"l":"평행이동","a":["평행이동"]}]},{"id":"lk_M7","cat":"수학","grade":"중3","q":"곱셈공식과 인수분해에 대해 답하세요. (1) (a + b)², (a − b)², (a + b)(a − b)를 전개하세요. (2) 이 공식으로 99²와 101 × 99를 계산하세요. (3) x² + 6x + 9와 x² − 16을 인수분해하세요.","a":"(1) (a + b)² = a² + 2ab + b², (a − b)² = a² − 2ab + b², (a + b)(a − b) = a² − b²입니다. (2) 99² = (100 − 1)² = 10000 − 200 + 1 = 9801이고, 101 × 99 = (100 + 1)(100 − 1) = 10000 − 1 = 9999입니다. (3) x² + 6x + 9 = (x + 3)², x² − 16 = (x + 4)(x − 4)입니다. 인수분해는 전개의 반대 과정입니다.","kw":[{"l":"(a±b)² = a² ± 2ab + b²","a":["a±b","2ab","a²"]},{"l":"합차공식 a²−b²","a":["a²−b²","합차공식"]},{"l":"99²=9801","a":["99²=9801","9801","99²"]},{"l":"101×99=9999","a":["101×99","9999"]}]},{"id":"lk_M8","cat":"수학","grade":"중3","q":"(1) 72와 60을 각각 소인수분해하세요. (2) 최대공약수와 최소공배수를 구하세요. (3) 두 수의 곱과 최대공약수, 최소공배수 사이의 관계를 말하세요. (4) 72의 약수는 모두 몇 개인가요?","a":"(1) 72 = 2³ × 3², 60 = 2² × 3 × 5입니다. (2) 최대공약수는 공통인 소인수를 작은 지수로 곱한 2² × 3 = 12이고, 최소공배수는 모든 소인수를 큰 지수로 곱한 2³ × 3² × 5 = 360입니다. (3) 두 수의 곱 72 × 60 = 4320은 최대공약수와 최소공배수의 곱 12 × 360 = 4320과 같습니다. (4) 소인수분해에서 각 지수에 1을 더해 곱하면 되므로 (3 + 1)(2 + 1) = 12개입니다.","kw":[{"l":"72=2³×3²","a":["72=2³×3²","2³×3²","72"]},{"l":"60=2²×3×5","a":["2²×3×5","60"]},{"l":"최대공약수 12, 최소공배수 360","a":["최대공약수","최소공배수","360"]},{"l":"곱 = gcd×lcm","a":["gcd×lcm"]},{"l":"약수 개수 (지수+1)의 곱","a":["약수","개수","지수"]}]},{"id":"lk_M9","cat":"수학","grade":"중3","q":"연립방정식 x + y = 7, 2x − y = 2를 푸는 방법을 두 가지 말하고 해를 구하세요. 또 연립방정식의 해가 무수히 많거나 없는 경우는 언제인가요?","a":"가감법은 두 식을 더해 y를 없애면 3x = 9이므로 x = 3이고, 이를 첫째 식에 넣으면 y = 4입니다. 대입법은 첫째 식에서 y = 7 − x를 둘째 식에 넣어 2x − (7 − x) = 2, 3x = 9, x = 3을 얻는 방법입니다. 해는 (3, 4)이고 두 직선의 교점입니다. x + y = 3, 2x + 2y = 6처럼 한 식이 다른 식의 상수배이면 두 직선이 일치해서 해가 무수히 많고(부정), x + y = 3, x + y = 5처럼 기울기는 같고 절편이 다르면 평행해서 해가 없습니다(불능).","kw":[{"l":"가감법·대입법","a":["가감법·대입법","가감법","대입법"]},{"l":"(3, 4)","a":["(3, 4)"]},{"l":"해 = 두 직선의 교점","a":["직선의","교점"]},{"l":"일치: 무수히 많음","a":["무수히","일치","많음"]},{"l":"평행: 없음","a":["평행: 없음","평행"]}]},{"id":"lk_M10","cat":"수학","grade":"중3","q":"두 점 (1, 2), (3, 8)을 지나는 직선에 대해 답하세요. (1) 기울기와 일차함수의 식을 구하세요. (2) x절편과 y절편을 구하세요. (3) 기울기가 같은 두 직선의 관계와 기울기의 곱이 −1인 두 직선의 관계를 말하세요.","a":"(1) 기울기는 (8 − 2) ÷ (3 − 1) = 3이고, y = 3x + b에 (1, 2)를 넣으면 b = −1이므로 y = 3x − 1입니다. (2) y = 0이면 x = 1/3이 x절편이고, x = 0이면 y = −1이 y절편입니다. (3) 기울기가 같고 절편이 다르면 서로 평행하고, 기울기의 곱이 −1이면 서로 수직입니다(예: y = 3x − 1과 y = −x/3 + 2).","kw":[{"l":"기울기 = y의 증가량 ÷ x의 증가량 = 3","a":["기울기","증가량"]},{"l":"y=3x−1","a":["y=3x−1","3x−1"]},{"l":"평행: 기울기 같음","a":["기울기","평행","같음"]},{"l":"수직: 곱이 −1","a":["수직","곱이","−1"]}]},{"id":"lk_M11","cat":"수학","grade":"중3","q":"피타고라스 정리에 대해 답하세요. (1) 정리의 내용을 말하세요. (2) 한 변이 a+b인 큰 정사각형의 넓이로 정리를 설명하세요. (3) 변이 5, 12, 13인 삼각형은 직각삼각형인가요? (4) 한 변이 4인 정사각형의 대각선의 길이를 구하세요.","a":"(1) 직각삼각형에서 빗변의 길이를 c, 나머지 두 변을 a, b라 하면 a² + b² = c²입니다. (2) 한 변이 a + b인 정사각형 안에 합동인 직각삼각형 4개를 놓으면 가운데에 한 변이 c인 정사각형이 생깁니다. 전체 넓이는 (a + b)² = a² + 2ab + b²이고, 직각삼각형 4개의 넓이 4 × (1/2)ab = 2ab와 가운데 정사각형 c²의 합과 같으므로 a² + 2ab + b² = 2ab + c²에서 a² + b² = c²입니다. (3) 5² + 12² = 25 + 144 = 169 = 13²이므로 가장 긴 변 13이 빗변인 직각삼각형입니다(피타고라스 정리의 역). (4) 대각선은 직각이등변삼각형의 빗변이므로 √(4² + 4²) = 4√2입니다.","kw":[{"l":"a²+b²=c²","a":["a²+b²=c²","a²","b²","c²"]},{"l":"(a+b)² = 4×(1/2)ab + c²","a":["4×","ab","c²"]},{"l":"5-12-13 직각삼각형","a":["5-12-13","직각삼각형"]},{"l":"정사각형 대각선 = 한 변×√2","a":["정사각형","변×√2","대각선"]}]},{"id":"lk_M12","cat":"수학","grade":"중3","q":"삼각형의 합동 조건과 닮음 조건을 각각 말하고, 닮음비가 2 : 3인 두 도형의 넓이의 비와 부피의 비를 구하세요.","a":"합동 조건은 세 변의 길이가 각각 같을 때(SSS), 두 변의 길이와 그 끼인각의 크기가 각각 같을 때(SAS), 한 변의 길이와 그 양 끝각의 크기가 각각 같을 때(ASA)입니다. 닮음 조건은 세 변의 길이의 비가 같을 때(SSS), 두 변의 길이의 비가 같고 그 끼인각의 크기가 같을 때(SAS), 두 각의 크기가 각각 같을 때(AA)입니다. 닮음비가 m : n이면 넓이의 비는 m² : n², 부피의 비는 m³ : n³이므로 2 : 3이면 넓이의 비는 4 : 9, 부피의 비는 8 : 27입니다. 합동은 닮음비가 1 : 1인 특별한 닮음입니다.","kw":[{"l":"합동: SSS, SAS, ASA","a":["SSS","SAS","ASA"]},{"l":"닮음: SSS 비, SAS 비, AA","a":["SSS","SAS","닮음"]},{"l":"넓이비 4:9","a":["넓이비 4:9","넓이비"]},{"l":"부피비 8:27","a":["부피비 8:27","부피비","27"]}]},{"id":"lk_M13","cat":"수학","grade":"중3","q":"원에 대해 답하세요. (1) 한 호에 대한 원주각과 중심각의 크기 사이의 관계를 말하세요. (2) 지름에 대한 원주각의 크기는 얼마이며 그 이유는 무엇인가요? (3) 원에 내접하는 사각형의 성질을 말하세요. (4) 원의 접선과 반지름의 관계, 한 점에서 그은 두 접선의 길이의 관계를 말하세요.","a":"(1) 원주각의 크기는 같은 호에 대한 중심각의 크기의 절반입니다. 같은 호에 대한 원주각은 모두 같습니다. (2) 지름은 중심각이 180°인 호이므로 원주각은 90°입니다. (3) 마주 보는 두 각의 크기의 합이 180°이고, 한 외각의 크기는 그와 이웃하지 않는 내각의 크기와 같습니다. 거꾸로 마주 보는 각의 합이 180°인 사각형은 원에 내접합니다. (4) 접선은 접점에서 반지름과 수직입니다. 원 밖의 한 점에서 그은 두 접선의 길이는 서로 같습니다. 예를 들어 중심각이 100°이면 원주각은 50°입니다.","kw":[{"l":"원주각 = 중심각 ÷ 2","a":["원주각","중심각"]},{"l":"지름의 원주각 90°","a":["지름의","원주각","90°"]},{"l":"내접사각형 대각의 합 180°","a":["내접사각형","180°","대각의"]},{"l":"접선 ⊥ 반지름","a":["접선 ⊥ 반지름","반지름","접선"]},{"l":"두 접선 길이 같음","a":["접선","길이","같음"]}]},{"id":"lk_M14","cat":"수학","grade":"중3","q":"제곱근과 무리수에 대해 답하세요. (1) 유리수와 무리수의 차이를 설명하세요. (2) √2가 무리수임을 설명하세요. (3) 1/√2와 1/(√3 − 1)의 분모를 유리화하세요.","a":"(1) 유리수는 분수 p/q(p, q는 정수, q ≠ 0)로 나타낼 수 있는 수이고, 무리수는 그렇게 나타낼 수 없는 수입니다. 소수로 나타내면 유리수는 유한소수나 순환소수, 무리수는 순환하지 않는 무한소수입니다. (2) √2 = p/q (p, q는 서로소인 자연수)라고 가정하면 p² = 2q²이므로 p² 이 짝수이고 p도 짝수입니다. p = 2k라 하면 4k² = 2q²에서 q² = 2k²이므로 q도 짝수가 되어 p, q가 서로소라는 가정에 모순입니다. 따라서 √2는 유리수가 아닙니다. (3) 1/√2 = √2/2이고, 1/(√3 − 1) = (√3 + 1)/((√3 − 1)(√3 + 1)) = (√3 + 1)/2입니다.","kw":[{"l":"유리수 = p/q","a":["유리수"]},{"l":"무리수 = 순환하지 않는 무한소수","a":["순환하지","무한소수","무리수"]},{"l":"귀류법: p, q 모두 짝수 → 모순","a":["귀류법","모두","짝수"]},{"l":"분모 유리화","a":["분모 유리화","유리화","분모"]}]},{"id":"lk_M15","cat":"수학","grade":"중3","q":"삼각비에 대해 답하세요. (1) 직각삼각형에서 sin, cos, tan의 정의를 말하세요. (2) 30°, 45°, 60°의 삼각비 값을 말하세요. (3) 건물에서 20 m 떨어진 곳에서 건물 꼭대기를 올려본각이 30°이고 눈높이가 1.5 m일 때 건물의 높이를 구하세요. (√3 ≈ 1.73)","a":"(1) 한 예각 A에 대해 sin A = 높이 ÷ 빗변, cos A = 밑변 ÷ 빗변, tan A = 높이 ÷ 밑변입니다. (2) 30°: sin = 1/2, cos = √3/2, tan = √3/3. 45°: sin = cos = √2/2, tan = 1. 60°: sin = √3/2, cos = 1/2, tan = √3. (3) 눈높이 위쪽 높이는 20 × tan 30° = 20 × √3/3 ≈ 11.5 m이고, 눈높이 1.5 m를 더하면 약 13.0 m입니다. (√3 ≈ 1.73을 쓰면 20 × 0.577 ≈ 11.5)","kw":[{"l":"sin=높이/빗변","a":["sin","높이","빗변"]},{"l":"cos=밑변/빗변","a":["cos","밑변","빗변"]},{"l":"tan=높이/밑변","a":["tan","높이","밑변"]},{"l":"30°: 1/2, √3/2, √3/3","a":["30°","√3"]},{"l":"높이 = 20tan30° + 1.5 ≈ 13 m","a":["20tan30°","높이","13"]}]},{"id":"lk_M16","cat":"수학","grade":"중3","q":"확률에 대해 답하세요. (1) 주사위 두 개를 던질 때 눈의 합이 7일 확률을 구하세요. (2) 주사위 두 개를 던질 때 적어도 하나가 6일 확률을 구하세요. (3) 확률의 덧셈법칙과 곱셈법칙은 각각 언제 쓰나요?","a":"(1) 전체 경우의 수는 6 × 6 = 36이고, 합이 7인 경우는 (1,6), (2,5), (3,4), (4,3), (5,2), (6,1)의 6가지이므로 6/36 = 1/6입니다. (2) 적어도 하나가 6일 확률은 1에서 둘 다 6이 아닐 확률을 뺍니다. 1 − (5/6)² = 1 − 25/36 = 11/36입니다. (3) 사건 A, B가 동시에 일어나지 않을 때 'A 또는 B'의 확률은 두 확률을 더합니다(덧셈법칙). 두 사건이 서로 영향을 주지 않고 모두 일어날 확률은 곱합니다(곱셈법칙). 어떤 사건이 일어나지 않을 확률은 1에서 그 사건의 확률을 뺍니다.","kw":[{"l":"합 7: 6/36=1/6","a":["36"]},{"l":"적어도 하나: 1−(5/6)²=11/36","a":["적어도","하나","1−"]},{"l":"또는 → 더하기","a":["또는 → 더하기","더하기","또는"]},{"l":"그리고(독립) → 곱하기","a":["곱하기","독립"]}]},{"id":"lk_M17","cat":"수학","grade":"중3","q":"루트2가 자연수가 아닌 이유를 증명하시오.","a":"1의 제곱은 1이고 2의 제곱은 4인데 2는 1과 4 사이에 있으므로, 루트2는 1보다 크고 2보다 작은 값입니다. 그런데 자연수는 1, 2, 3, …과 같이 딱 떨어지는 값인데 1과 2 사이에는 자연수가 존재하지 않으므로 루트2는 자연수가 될 수 없습니다.","kw":[{"l":"1²=1, 2²=4 사이에 2가 있음","a":["1²","2²","사이"]},{"l":"1과 2 사이에는 자연수가 없음","a":["자연수가 없","사이에 없"]}]},{"id":"lk_M18","cat":"수학","grade":"중1","q":"두 자연수의 최대공약수와 최소공배수를 곱하면 두 자연수의 곱과 같아지는 까닭을 설명하시오.","a":"두 자연수 A, B를 각각 최대공약수 G와 서로소인 두 수 a, b를 이용해 A=Ga, B=Gb로 나타낼 수 있는데, 이때 최소공배수는 Gab가 되므로, 최대공약수와 최소공배수의 곱은 G×Gab=Ga×Gb=A×B가 되어 두 자연수의 곱과 같아집니다.","kw":[{"l":"A=Ga, B=Gb로 나타냄(G는 최대공약수)","a":["최대공약수","Ga","Gb"]},{"l":"최대공약수×최소공배수=A×B","a":["A×B","곱"]}]},{"id":"lk_M19","cat":"수학","grade":"중3","q":"이차방정식의 근의 공식에서 판별식 b제곱-4ac가 음수이면 실근이 없는 까닭을 실수의 제곱의 성질과 관련지어 설명하시오.","a":"실수는 제곱하면 항상 0 이상의 값이 되므로 어떤 실수를 제곱해도 음수가 될 수 없는데, 판별식이 음수이면 근의 공식에 들어가는 근호 안의 값이 음수가 되어 그 제곱근에 해당하는 실수가 존재하지 않으므로 실근이 없습니다.","kw":[{"l":"실수의 제곱은 항상 0 이상","a":["제곱","0 이상"]},{"l":"근호 안이 음수면 실수인 제곱근이 없음","a":["근호 안","음수"]}]},{"id":"lk_M20","cat":"수학","grade":"중2","q":"연립방정식을 풀 때 가감법과 대입법으로 각각 풀어도 항상 같은 해를 얻는 까닭을 설명하시오.","a":"가감법과 대입법은 모두 등식의 성질을 이용해 두 방정식을 만족하는 x, y의 값을 찾아가는 서로 다른 계산 경로일 뿐이며, 어느 방법으로 풀어도 원래의 두 일차방정식을 동시에 만족하는 값을 구하는 것이 목표이므로 최종적으로 같은 해에 도달하게 됩니다.","kw":[{"l":"둘 다 등식의 성질을 이용한 서로 다른 계산 경로","a":["등식의 성질","경로"]},{"l":"같은 두 방정식을 만족하는 해를 구함","a":["같은 해"]}]},{"id":"lk_M21","cat":"수학","grade":"중3","q":"(a+b)의 제곱과 a의 제곱+b의 제곱이 일반적으로 같지 않은 까닭을 전개 과정을 통해 설명하시오.","a":"(a+b)의 제곱을 실제로 전개하면 a의 제곱+2ab+b의 제곱이 되는데, 여기에는 a의 제곱+b의 제곱에는 없는 2ab라는 항이 추가로 생기므로, a와 b가 모두 0이 아닌 이상 두 식은 일반적으로 같지 않습니다.","kw":[{"l":"(a+b)²=a²+2ab+b²","a":["2ab"]},{"l":"2ab라는 항이 추가로 생김","a":["추가","2ab"]}]},{"id":"lk_M22","cat":"수학","grade":"중3","q":"인수분해가 다항식의 곱셈(전개)과 서로 역의 관계에 있다는 것을 예를 들어 설명하시오.","a":"예를 들어 x제곱+5x+6을 인수분해하면 (x+2)(x+3)이 되는데, 반대로 (x+2)(x+3)을 전개하면 다시 x제곱+5x+6이 되므로, 인수분해와 전개는 하나의 다항식을 곱의 꼴로 바꾸는 것과 곱의 꼴을 하나의 다항식으로 바꾸는 것으로 서로 정반대의 과정입니다.","kw":[{"l":"인수분해와 전개는 서로 정반대의 과정","a":["정반대","역"]},{"l":"예시로 서로 되돌아감을
